# Run independently of infra/n8n-local. Backend never binds a public port.
services:
  studio-backend:
    build:
      context: ../..
      dockerfile: infra/ai-studio-backend/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    env_file: .env
    environment:
      INSUREIT_AI_STUDIO_BACKEND_ENABLED: ${INSUREIT_AI_STUDIO_BACKEND_ENABLED:-false}
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3001"
    networks: [studio-internal]
  studio-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [studio-backend]
    ports:
      - "127.0.0.1:8790:8080"
    volumes:
      - ./studio-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [studio-internal]
networks:
  studio-internal:
    driver: bridge
