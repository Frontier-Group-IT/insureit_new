# Dedicated, path-restricted Cloudflare Tunnel ingress. No website or n8n UI.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1024;
    if ($host != "studio.nishant.uk") { return 404; }

    location = /api/partner/ai-policy-studio/actions {
        if ($request_method != POST) { return 405; }
        proxy_pass http://studio-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host studio.nishant.uk;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_redirect off;
    }

    location / { return 404; }
}
