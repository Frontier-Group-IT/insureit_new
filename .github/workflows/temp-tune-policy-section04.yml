name: Temporary tune policy section04

on:
  push:
    paths:
      - scripts/temp_tune_policy_section04.py
      - .github/workflows/temp-tune-policy-section04.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Section 04 tuning
        run: python scripts/temp_tune_policy_section04.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'Calculated Amt. :' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'CalculatedField label="Retention"' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'justify-end gap-x-3' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'CalculatedField label="Indicative margin"' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Tune projected pay-in presentation"
            git pull --rebase origin main
            git push origin main
          fi
