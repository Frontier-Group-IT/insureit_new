name: Validate unified intermediary registers

on:
  push:
    branches:
      - feature/unified-register-header-mobile

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-register-header-mobile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/unify_intermediary_registers.py
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/intermediaries/structured-account-register.tsx apps/web-portal/app/intermediaries/intermediary-register.tsx
          git commit -m "Unify intermediary register headers and mobile columns"
          git push origin HEAD:feature/unified-register-header-mobile
