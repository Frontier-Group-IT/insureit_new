name: Verify R2 backup code (no production secrets)

on:
  pull_request:
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/insureit-supabase-storage-r2-backup.yml'
      - '.github/workflows/insureit-r2-restore-verify.yml'
      - '.github/workflows/verify-r2-backup-static.yml'
      - '.github/workflows/insureit-r2-backup-monitor.yml'
      - '.github/workflows/insureit-postgres-r2-manual.yml'
      - '.github/workflows/insureit-postgres-r2-restore-verify.yml'
      - '.github/workflows/insureit-postgres-r2-v2-manual.yml'
      - '.github/workflows/insureit-postgres-r2-v2-restore-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3==1.35.99 cryptography==44.0.2 pyyaml==6.0.2
      - run: python -m py_compile scripts/backup/supabase_storage_to_r2.py scripts/backup/verify_r2_restore.py scripts/backup/monitor_github_backup.py scripts/backup/monitor_postgres_backup.py scripts/backup/postgres_to_r2.py scripts/backup/verify_postgres_r2_restore.py scripts/backup/classify_pg_restore_error.py scripts/backup/audit_postgres_archive_coverage.py scripts/backup/verify_postgres_offline_row_counts.py scripts/backup/summarize_pg_restore_errors.py scripts/backup/diagnose_pg_restore_data.py scripts/backup/audit_postgres_copy_targets.py scripts/backup/postgres_v2_to_r2.py scripts/backup/verify_postgres_v2_r2.py scripts/backup/verify_postgres_v2_rows.py scripts/backup/audit_postgres_v2_toc.py scripts/backup/prepare_pg_dump_connection.py scripts/backup/allow_no_acl_restore_fallback.py
      - run: python -m unittest discover -s scripts/backup -p 'test_*.py' -v
      - name: Validate workflow safety guard
        run: |
          python - <<'PY'
          import pathlib, yaml
          p=pathlib.Path('.github/workflows/insureit-supabase-storage-r2-backup.yml')
          data=yaml.safe_load(p.read_text())
          triggers = data.get('on', data.get(True, {}))
          assert triggers['schedule'] == [{'cron': '30 13 * * *'}], 'Daily 19:00 IST cron required'
          assert 'workflow_dispatch' in triggers, 'Manual recovery trigger must remain'
          job=data['jobs']['backup']
          assert 'refs/heads/main' in job['if']
          assert 'schedule' in job['if'] and 'workflow_dispatch' in job['if']
          assert 'verify_r2_restore.py' in str(job['steps'][-1]), 'Post-backup restoration required'
          assert job['environment']=='insureit-production-backup'
          assert data['permissions']['contents']=='read'
          restore = yaml.safe_load(pathlib.Path('.github/workflows/insureit-r2-restore-verify.yml').read_text())
          assert 'schedule' not in str(restore.get('on', restore.get(True, {})))
          verify = restore['jobs']['verify']
          assert 'refs/heads/main' in verify['if']
          assert verify['environment'] == 'insureit-production-backup'
          assert 'SUPABASE_SERVICE_ROLE_KEY' not in str(verify)
          assert restore['permissions']['contents'] == 'read'
          monitor = yaml.safe_load(pathlib.Path('.github/workflows/insureit-r2-backup-monitor.yml').read_text())
          triggers = monitor.get('on', monitor.get(True, {}))
          assert {'17 17 * * *', '17 */2 * * *'} == {item['cron'] for item in triggers['schedule']}
          assert triggers['workflow_run']['types'] == ['completed']
          assert monitor['permissions']['actions'] == 'read'
          assert monitor['permissions']['issues'] == 'write'
          assert monitor['permissions']['contents'] == 'read'
          assert 'secrets.' not in str(monitor), 'No production secrets in alert workflow'
          assert monitor['jobs']['monitor']['if'] == "github.ref == 'refs/heads/main'"
          assert 'monitor_postgres_backup.py' in str(monitor['jobs']['monitor']['steps'])
          assert 'DATABASE_URL' not in str(monitor) and 'DB_BACKUP_ENCRYPTION_KEY' not in str(monitor)
          pg = yaml.safe_load(pathlib.Path('.github/workflows/insureit-postgres-r2-manual.yml').read_text())
          pg_triggers = pg.get('on', pg.get(True, {}))
          assert 'workflow_dispatch' in pg_triggers
          assert 'schedule' not in pg_triggers, 'PostgreSQL backup cannot schedule before restore test'
          job = pg['jobs']['postgres_backup']
          assert 'refs/heads/main' in job['if']
          assert job['environment'] == 'insureit-production-backup'
          assert pg['permissions']['contents'] == 'read'
          assert 'supabase db dump' in str(job['steps'])
          assert 'postgres_to_r2.py' in str(job['steps'])
          assert any(step.get('env', {}).get('R2_BUCKET') == 'insureit-production-backups' for step in job['steps'])
          restoration = yaml.safe_load(pathlib.Path('.github/workflows/insureit-postgres-r2-restore-verify.yml').read_text())
          r_triggers = restoration.get('on', restoration.get(True, {}))
          assert 'workflow_dispatch' in r_triggers and 'schedule' not in r_triggers
          restore_job = restoration['jobs']['restore_test']
          assert "refs/heads/main" in restore_job['if']
          assert restore_job['environment'] == 'insureit-production-backup'
          assert restoration['permissions']['contents'] == 'read'
          steps_text = str(restore_job['steps'])
          fixture = pathlib.Path('scripts/backup/fixtures/isolated_supabase_roles.sql').read_text()
          assert 'NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' in fixture
          assert 'NEVER apply to the managed INSUREIT database' in fixture
          assert 'isolated_supabase_roles.sql' in steps_text
          assert 'supabase/postgres:17.6.1.136' in steps_text
          assert 'pg_available_extensions' in steps_text
          assert 'isolated_supabase_extensions.sql' in steps_text
          assert 'isolated_supabase_auth_helpers.sql' in steps_text
          assert 'ISOLATED AUTH HELPERS INCOMPLETE' in steps_text
          assert 'summarize_pg_restore_errors.py' in steps_text
          assert 'restore-schema-diagnostics.log' in steps_text
          assert 'restore-data-diagnostics.log' in steps_text
          assert '--set ON_ERROR_STOP=0' in steps_text
          assert 'ISOLATED RESTORE INCOMPLETE' in steps_text
          assert 'required_extension_installation' in steps_text
          assert 'required_extension_availability' in steps_text
          assert '--network none' in steps_text
          assert 'audit_postgres_archive_coverage.py' in steps_text
          assert 'verify_postgres_offline_row_counts.py' in steps_text
          assert 'diagnose_pg_restore_data.py' in steps_text
          assert 'audit_postgres_copy_targets.py' in steps_text
          assert 'OFFLINE COPY TARGET AUDIT' in pathlib.Path('scripts/backup/audit_postgres_copy_targets.py').read_text()
          assert '--set VERBOSITY=verbose' in steps_text
          assert '--set SHOW_CONTEXT=never' in steps_text
          assert 'SET session_replication_role = replica' in steps_text
          assert '--single-transaction' in steps_text
          assert 'verify_postgres_r2_restore.py' in steps_text
          assert 'docker rm --force --volumes' in steps_text
          assert 'DATABASE_URL' not in steps_text and 'SUPABASE_SERVICE_ROLE_KEY' not in steps_text
          assert 'classify_pg_restore_error.py' in steps_text
          v2backup = yaml.safe_load(pathlib.Path('.github/workflows/insureit-postgres-r2-v2-manual.yml').read_text())
          v2restore = yaml.safe_load(pathlib.Path('.github/workflows/insureit-postgres-r2-v2-restore-verify.yml').read_text())
          for flow, jobname in ((v2backup,'postgres_v2_backup'),(v2restore,'restore_v2')):
              trig = flow.get('on', flow.get(True, {}))
              assert 'workflow_dispatch' in trig and 'schedule' not in trig
              assert flow['permissions']['contents'] == 'read'
              job_v2 = flow['jobs'][jobname]
              assert job_v2['environment'] == 'insureit-production-backup'
              assert 'refs/heads/main' in job_v2['if']
          backup_steps = str(v2backup['jobs']['postgres_v2_backup']['steps'])
          restore_steps = str(v2restore['jobs']['restore_v2']['steps'])
          assert 'pg_dump --no-password -Fc' in backup_steps and 'postgres_v2_to_r2.py' in backup_steps
          assert 'prepare_pg_dump_connection.py' in backup_steps
          assert '--env-file' in backup_steps and 'PGPASSFILE=' in backup_steps
          assert '--env DATABASE_URL' not in backup_steps
          assert '--dbname="$DATABASE_URL"' not in backup_steps
          assert 'insureit-pg-v2-connection' in backup_steps
          assert 'rm -rf "$RUNNER_TEMP/insureit-pg-v2-connection"' in backup_steps
          assert 'postgresql/v2' in pathlib.Path('scripts/backup/postgres_v2_to_r2.py').read_text()
          assert '--network none' in restore_steps and 'createdb -T template0' in restore_steps
          assert '--single-transaction --exit-on-error' in restore_steps
          assert 'allow_no_acl_restore_fallback.py' in restore_steps
          assert '--no-owner --no-acl' in restore_steps
          assert 'V2 SCHEMA_DATA_ONLY_CHECK PASSED' in restore_steps
          assert 'V2 FULL RECOVERY NOT CERTIFIED' in restore_steps
          assert 'V2 ISOLATED RECOVERY CHECK PASSED' in restore_steps
          assert '--verbose --single-transaction --exit-on-error' in restore_steps
          assert 'V2 OFFLINE ADMIN PRECHECK PASSED' in restore_steps
          assert '--username=supabase_admin' in restore_steps
          assert '--host=127.0.0.1' in restore_steps
          assert '--network none' in restore_steps
          assert 'PGPASSWORD=ephemeral-v2-recovery-only' in restore_steps
          assert 'supabase_admin' in pathlib.Path('scripts/backup/verify_postgres_v2_rows.py').read_text()
          assert 'ephemeral-v2-recovery-only' in pathlib.Path('scripts/backup/verify_postgres_v2_rows.py').read_text()
          assert 'v2-restore-no-acl.log' in restore_steps
          assert 'verify_postgres_v2_rows.py' in restore_steps
          assert 'audit_postgres_v2_toc.py' in restore_steps and 'audit_postgres_v2_toc.py' in backup_steps
          assert 'docker rm -f -v insureit-v2-restore-check' in restore_steps
          assert 'DATABASE_URL' not in restore_steps and 'SUPABASE_SERVICE_ROLE_KEY' not in restore_steps
          assert 's3.delete_object' not in pathlib.Path('scripts/backup/postgres_v2_to_r2.py').read_text()
          print('Manual V2 consistent database recovery workflow guards verified')
          print('Manual offline database recovery rehearsal guards verified')
          PY

  offline_fixture_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test Supabase Postgres 17 role fixture without backup or network
        run: |
          set -euo pipefail
          trap 'docker rm -f -v insureit-fixture-smoke >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/fixture-smoke.log"' EXIT
          docker run --detach --name insureit-fixture-smoke --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/backup/fixtures/isolated_supabase_auth_role_login.sql,target=/docker-entrypoint-initdb.d/init-scripts/99-roles.sql,readonly" \
            --env POSTGRES_PASSWORD=ephemeral-smoke-test-only \
            --env POSTGRES_DB=postgres \
            supabase/postgres:17.6.1.136 >/dev/null
          ready=0
          for i in $(seq 1 60); do
            if docker exec insureit-fixture-smoke pg_isready -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "OFFLINE FIXTURE SMOKE FAILED: container not ready"
            exit 1
          fi
          docker cp scripts/backup/fixtures/isolated_supabase_roles.sql insureit-fixture-smoke:/tmp/offline-fixture-roles.sql
          if ! docker exec -u postgres insureit-fixture-smoke \
            psql -X --set ON_ERROR_STOP=1 --dbname postgres --file /tmp/offline-fixture-roles.sql \
            > "$RUNNER_TEMP/fixture-smoke.log" 2>&1; then
            python scripts/backup/classify_pg_restore_error.py fixture "$RUNNER_TEMP/fixture-smoke.log"
            echo "OFFLINE FIXTURE SMOKE FAILED; no SQL logged"
            exit 1
          fi
          docker cp scripts/backup/fixtures/isolated_supabase_extensions.sql insureit-fixture-smoke:/tmp/offline-extensions.sql
          if ! docker exec -u postgres insureit-fixture-smoke \
            psql -X --set ON_ERROR_STOP=1 -d postgres -f /tmp/offline-extensions.sql \
            > "$RUNNER_TEMP/fixture-smoke.log" 2>&1; then
            python scripts/backup/classify_pg_restore_error.py extensions "$RUNNER_TEMP/fixture-smoke.log"
            echo "OFFLINE EXTENSION SMOKE FAILED; no SQL logged"
            exit 1
          fi
          installed="$(docker exec -u postgres insureit-fixture-smoke psql -X -A -t -d postgres -c \
            "select count(*) from pg_extension where extname in ('hypopg','index_advisor','pg_stat_statements','pg_trgm','pgcrypto','supabase_vault','uuid-ossp');")"
          if [ "$installed" != "7" ]; then
            echo "OFFLINE EXTENSION SMOKE FAILED: incomplete extension initialization"
            exit 1
          fi
          auth_state="$(docker exec -u postgres insureit-fixture-smoke psql -X -A -t -d postgres -c \
            "select (to_regprocedure('auth.uid()') is not null)::int,
                    (to_regprocedure('auth.jwt()') is not null)::int,
                    (to_regprocedure('auth.role()') is not null)::int,
                    (to_regprocedure('auth.email()') is not null)::int,
                    (has_schema_privilege(current_user,'auth','CREATE'))::int;" 2>/dev/null || true)"
          if ! [[ "$auth_state" =~ ^[01]\\|[01]\\|[01]\\|[01]\\|[01]$ ]]; then
            echo "OFFLINE AUTH STATE UNAVAILABLE"
            exit 1
          fi
          echo "OFFLINE AUTH INITIAL STATE: uid|jwt|role|email|schema_create=$auth_state"
          docker cp scripts/backup/fixtures/isolated_supabase_auth_helpers.sql insureit-fixture-smoke:/tmp/offline-auth-helpers.sql
          if ! docker exec -u postgres --env PGPASSWORD=ephemeral-smoke-test-only insureit-fixture-smoke \
            psql -h 127.0.0.1 -U supabase_auth_admin -X --set ON_ERROR_STOP=1 -d postgres \
              -f /tmp/offline-auth-helpers.sql \
            > "$RUNNER_TEMP/fixture-smoke.log" 2>&1; then
            python scripts/backup/classify_pg_restore_error.py auth_bootstrap "$RUNNER_TEMP/fixture-smoke.log"
            echo "OFFLINE AUTH ADMIN BOOTSTRAP FAILED; no SQL logged"
            exit 1
          fi
          helpers="$(docker exec -u postgres insureit-fixture-smoke psql -X -A -t -d postgres -c \
            "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='auth' and p.pronargs=0 and p.proname in ('uid','jwt','role','email');")"
          if [ "$helpers" != "4" ]; then
            echo "OFFLINE AUTH BOOTSTRAP INCOMPLETE: helper count $helpers/4"
            exit 1
          fi
          # Run synthetic schema DDL that actually references Auth helpers,
          # as archived RLS policies and application functions may do.
          if ! docker exec -u postgres insureit-fixture-smoke \
            psql -X --set ON_ERROR_STOP=1 -d postgres -c \
            "CREATE TABLE public.insureit_auth_smoke_only (id uuid PRIMARY KEY);
             ALTER TABLE public.insureit_auth_smoke_only ENABLE ROW LEVEL SECURITY;
             CREATE POLICY auth_smoke_read ON public.insureit_auth_smoke_only
               FOR SELECT USING (auth.uid() IS NOT NULL AND
                                 (auth.jwt() ->> 'role') = 'authenticated');" \
            > "$RUNNER_TEMP/fixture-smoke.log" 2>&1; then
            python scripts/backup/classify_pg_restore_error.py schema "$RUNNER_TEMP/fixture-smoke.log"
            echo "OFFLINE AUTH/RLS SCHEMA SMOKE FAILED"
            exit 1
          fi
          if ! docker exec -u postgres insureit-fixture-smoke \
            psql -X --set ON_ERROR_STOP=1 -A -t -d postgres -c \
            "SET request.jwt.claims = '{\"role\":\"authenticated\"}';
             SELECT (auth.jwt() ->> 'role')='authenticated';" \
            > "$RUNNER_TEMP/fixture-smoke.log" 2>&1; then
            echo "OFFLINE AUTH JWT BEHAVIOR CHECK FAILED"
            exit 1
          fi
          if ! grep -qx 't' "$RUNNER_TEMP/fixture-smoke.log"; then
            echo "OFFLINE AUTH JWT BEHAVIOR MISMATCH"
            exit 1
          fi
          echo "OFFLINE AUTH BOOTSTRAP PASSED: 4 helpers and synthetic RLS dependency compiled"
          # Reproduce an intentionally invalid COPY in this same offline image.
          # Assert that verbose psql reports the first SQLSTATE and never
          # expose the private database error text in GitHub logs.
          docker exec -u postgres insureit-fixture-smoke \
            psql -X --set ON_ERROR_STOP=1 -d postgres \
            -c "CREATE TABLE public.insureit_copy_diag_smoke (value uuid);" \
            > "$RUNNER_TEMP/fixture-smoke.log" 2>&1
          cat > "$RUNNER_TEMP/invalid-copy.sql" <<'COPY_SAMPLE_EOF'
          COPY public.insureit_copy_diag_smoke (value) FROM stdin;
          invalid-uuid-synthetic
          \.
          COPY_SAMPLE_EOF
          docker cp "$RUNNER_TEMP/invalid-copy.sql" insureit-fixture-smoke:/tmp/invalid-copy.sql
          if docker exec -u postgres insureit-fixture-smoke \
            psql -X --single-transaction --set ON_ERROR_STOP=1 \
              --set VERBOSITY=verbose --set SHOW_CONTEXT=never \
              -d postgres -f /tmp/invalid-copy.sql \
            > "$RUNNER_TEMP/fixture-smoke.log" 2>&1; then
            echo "OFFLINE SQLSTATE SMOKE FAILED: deliberately invalid COPY incorrectly succeeded"
            exit 1
          fi
          python scripts/backup/diagnose_pg_restore_data.py \
            "$RUNNER_TEMP/fixture-smoke.log" > "$RUNNER_TEMP/copy-diagnostic.txt"
          if ! grep -q 'sqlstate=22P02 category=invalid_text_representation' \
            "$RUNNER_TEMP/copy-diagnostic.txt"; then
            cat "$RUNNER_TEMP/copy-diagnostic.txt"
            echo "OFFLINE SQLSTATE SMOKE FAILED: expected category not detected"
            exit 1
          fi
          echo "OFFLINE SQLSTATE SMOKE PASSED: first COPY failure classified without SQL content"

          # Integration-test the offline pg_catalog compatibility query against
          # the real Supabase image, without access to production/R2 data.
          cat > "$RUNNER_TEMP/copy-targets.sql" <<'COPY_TARGET_EOF'
          COPY public.insureit_copy_diag_smoke (value) FROM stdin;
          \.
          COPY auth.example_nonexistent_smoke_only (id) FROM stdin;
          \.
          COPY_TARGET_EOF
          if python scripts/backup/audit_postgres_copy_targets.py \
              "$RUNNER_TEMP/copy-targets.sql" insureit-fixture-smoke \
              > "$RUNNER_TEMP/copy-target-audit.log" 2>&1; then
            echo "OFFLINE COPY COMPATIBILITY TEST FAILED: nonexistent Auth table was accepted"
            exit 1
          fi
          if ! grep -q 'targets=2 missing_tables=1 missing_column_sets=0' \
                "$RUNNER_TEMP/copy-target-audit.log"; then
            echo "OFFLINE COPY COMPATIBILITY TEST FAILED: expected missing-table summary unavailable"
            exit 1
          fi
          echo "OFFLINE COPY COMPATIBILITY SMOKE PASSED: existing table accepted and missing Auth table detected"
          # Safe structural signal only: current managed Supabase project
          # has these newer Auth/Storage features. Record Boolean target
          # compatibility, not customer data or full table definitions.
          managed_parity="$(docker exec -u postgres insureit-fixture-smoke psql \
            -X -A -t -d postgres -c \
            "select (to_regclass('auth.oauth_clients') is not null)::int,
                    (to_regclass('storage.buckets_vectors') is not null)::int,
                    (to_regclass('storage.vector_indexes') is not null)::int,
                    exists(select 1 from information_schema.columns
                           where table_schema='auth' and table_name='flow_state'
                             and column_name='oauth_client_state_id')::int;" 2>/dev/null || true)"
          if ! [[ "$managed_parity" =~ ^[01]\\|[01]\\|[01]\\|[01]$ ]]; then
            echo "OFFLINE MANAGED SCHEMA PARITY PROBE FAILED"
            exit 1
          fi
          echo "OFFLINE MANAGED SCHEMA PARITY (oauth_clients|buckets_vectors|vector_indexes|flow_state_new_column): $managed_parity"



  offline_v2_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic full managed schema, custom dump and strict restore with no network
        run: |
          set -euo pipefail
          trap 'docker rm -f -v insureit-v2-restore-check >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/v2-smoke.sql" "$RUNNER_TEMP/v2-smoke-data.sql" "$RUNNER_TEMP/v2-smoke-toc.txt" "$RUNNER_TEMP/v2-smoke.log"' EXIT
          docker run -d --name insureit-v2-restore-check --network none \
            --env POSTGRES_PASSWORD=ephemeral-v2-recovery-only \
            --env POSTGRES_DB=postgres \
            supabase/postgres:17.6.1.136 >/dev/null
          ready=0
          for i in $(seq 1 60); do
            if docker exec insureit-v2-restore-check pg_isready -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "V2 SYNTHETIC RESTORE FAILED: container startup"
            exit 1
          fi
          docker exec -u postgres insureit-v2-restore-check createdb -T template0 v2_synthetic
          cat > "$RUNNER_TEMP/v2-smoke.sql" <<'SYNTHETIC_SQL'
          CREATE SCHEMA auth;
          CREATE SCHEMA storage;
          CREATE SCHEMA supabase_migrations;
          CREATE TABLE auth.users (id uuid PRIMARY KEY, email text NOT NULL UNIQUE);
          CREATE TABLE storage.buckets (id text PRIMARY KEY);
          CREATE TABLE storage.objects (
            id uuid PRIMARY KEY,
            bucket_id text NOT NULL REFERENCES storage.buckets(id),
            owner_id uuid REFERENCES auth.users(id)
          );
          CREATE TABLE supabase_migrations.schema_migrations (version text PRIMARY KEY);
          CREATE TABLE public.motor_policies (
            id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            user_id uuid NOT NULL REFERENCES auth.users(id),
            premium numeric(12,2) NOT NULL CHECK (premium >= 0)
          );
          ALTER TABLE public.motor_policies ENABLE ROW LEVEL SECURITY;
          CREATE POLICY synthetic_read ON public.motor_policies FOR SELECT USING (true);
          INSERT INTO auth.users VALUES ('00000000-0000-0000-0000-000000000001','synthetic@example.invalid');
          INSERT INTO storage.buckets VALUES ('synthetic-bucket');
          INSERT INTO storage.objects VALUES ('00000000-0000-0000-0000-000000000002','synthetic-bucket','00000000-0000-0000-0000-000000000001');
          INSERT INTO supabase_migrations.schema_migrations VALUES ('20261108');
          INSERT INTO public.motor_policies(user_id,premium) VALUES ('00000000-0000-0000-0000-000000000001',100.00);
          SYNTHETIC_SQL
          docker cp "$RUNNER_TEMP/v2-smoke.sql" insureit-v2-restore-check:/tmp/v2-smoke.sql
          docker exec -u postgres insureit-v2-restore-check \
            psql -X -v ON_ERROR_STOP=1 -d v2_synthetic -f /tmp/v2-smoke.sql > "$RUNNER_TEMP/v2-smoke.log" 2>&1
          # Construct a synthetic function using an untrusted language.
          # The offline image's ordinary postgres role cannot restore it;
          # only the image's independently verified superuser can.
          docker exec -u postgres --env PGPASSWORD=ephemeral-v2-recovery-only \
            insureit-v2-restore-check \
            psql -h 127.0.0.1 -U supabase_admin -X -v ON_ERROR_STOP=1 \
              -d v2_synthetic -c \
              "CREATE FUNCTION public.insureit_synthetic_internal(cstring) RETURNS integer AS 'int4in' LANGUAGE internal;" \
            > "$RUNNER_TEMP/v2-smoke.log" 2>&1
          docker exec -u postgres insureit-v2-restore-check \
            pg_dump -Fc -f /tmp/synthetic.dump v2_synthetic > "$RUNNER_TEMP/v2-smoke.log" 2>&1
          docker exec -u postgres insureit-v2-restore-check \
            pg_restore --list /tmp/synthetic.dump > "$RUNNER_TEMP/v2-smoke-toc.txt" 2>/dev/null
          python scripts/backup/audit_postgres_v2_toc.py "$RUNNER_TEMP/v2-smoke-toc.txt"
          docker exec -u postgres insureit-v2-restore-check \
            createdb -T template0 insureit_unprivileged
          if docker exec -u postgres insureit-v2-restore-check \
            pg_restore --single-transaction --exit-on-error --no-owner \
              -d insureit_unprivileged /tmp/synthetic.dump \
              > "$RUNNER_TEMP/v2-smoke.log" 2>&1; then
            echo "V2 UNPRIVILEGED FUNCTION PROBE FAILED: unexpectedly restored untrusted language"
            exit 1
          fi
          if ! grep -Eqi 'permission denied|superuser' "$RUNNER_TEMP/v2-smoke.log"; then
            echo "V2 UNPRIVILEGED FUNCTION PROBE FAILED: unexpected error class"
            exit 1
          fi
          echo "V2 UNPRIVILEGED FUNCTION PROBE PASSED: strict import rejected untrusted function"
          docker exec -u postgres insureit-v2-restore-check createdb -T template0 insureit_verify
          docker exec -u postgres --env PGPASSWORD=ephemeral-v2-recovery-only \
            insureit-v2-restore-check \
            pg_restore --host=127.0.0.1 --username=supabase_admin \
              --single-transaction --exit-on-error --no-owner \
              -d insureit_verify /tmp/synthetic.dump > "$RUNNER_TEMP/v2-smoke.log" 2>&1
          privileged_function="$(docker exec -u postgres --env PGPASSWORD=ephemeral-v2-recovery-only \
            insureit-v2-restore-check \
            psql -h 127.0.0.1 -U supabase_admin -XAt -v ON_ERROR_STOP=1 \
              -d insureit_verify -c \
              "select (to_regprocedure('public.insureit_synthetic_internal(cstring)') is not null)::int;")"
          if [ "$privileged_function" != 1 ]; then
            echo "V2 PRIVILEGED FUNCTION RESTORE FAILED: synthetic function missing"
            exit 1
          fi
          echo "V2 PRIVILEGED FUNCTION RESTORE PASSED: all schema/data and restricted-language function"
          docker exec -u postgres insureit-v2-restore-check \
            pg_restore --data-only -f /tmp/v2-smoke-data.sql /tmp/synthetic.dump \
            > "$RUNNER_TEMP/v2-smoke.log" 2>&1
          docker cp insureit-v2-restore-check:/tmp/v2-smoke-data.sql "$RUNNER_TEMP/v2-smoke-data.sql"
          python scripts/backup/verify_postgres_v2_rows.py "$RUNNER_TEMP/v2-smoke-data.sql"
          policy="$(docker exec -u postgres insureit-v2-restore-check \
            psql -XAt -d insureit_verify -c \
            "select count(*) from pg_policies where schemaname='public' and tablename='motor_policies';")"
          if [ "$policy" != 1 ]; then
            echo "V2 SYNTHETIC RESTORE FAILED: RLS policy missing"
            exit 1
          fi
          # The limited-mode restore must still include every schema and
          # data destination. This fixture doesn't emulate a managed ACL
          # denial, so it is an option/parity smoke, not proof of root cause.
          docker exec -u postgres insureit-v2-restore-check \
            createdb -T template0 insureit_verify_no_acl
          docker exec -u postgres --env PGPASSWORD=ephemeral-v2-recovery-only \
            insureit-v2-restore-check \
            pg_restore --host=127.0.0.1 --username=supabase_admin \
              --single-transaction --exit-on-error --no-owner --no-acl \
              -d insureit_verify_no_acl /tmp/synthetic.dump > "$RUNNER_TEMP/v2-smoke.log" 2>&1
          no_acl_rows="$(docker exec -u postgres --env PGPASSWORD=ephemeral-v2-recovery-only \
            insureit-v2-restore-check \
            psql -h 127.0.0.1 -U supabase_admin -XAt \
              -d insureit_verify_no_acl -c 'select count(*) from public.motor_policies;')"
          if [ "$no_acl_rows" != 1 ]; then
            echo "V2 NO-ACL SYNTHETIC IMPORT FAILED: missing business data"
            exit 1
          fi
          echo "V2 SYNTHETIC NO-ACL IMPORT PASSED: business records still imported (ACL assurance excluded)"
          echo "V2 SYNTHETIC FULL RESTORE PASSED: clean template0 + managed schema + strict data + all COPY parity + RLS"

  offline_function_privilege_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read isolated PG17 role capability only; no credentials or business data
        run: |
          set -euo pipefail
          trap 'docker rm -f -v insureit-v2-privilege-probe >/dev/null 2>&1 || true' EXIT
          docker run -d --name insureit-v2-privilege-probe --network none \
            -e POSTGRES_PASSWORD=ephemeral-synthetic-only \
            -e POSTGRES_DB=postgres \
            supabase/postgres:17.6.1.136 >/dev/null
          ready=0
          for i in $(seq 1 60); do
            if docker exec insureit-v2-privilege-probe pg_isready -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          flags="$(docker exec -u postgres insureit-v2-privilege-probe \
            psql -XAt -v ON_ERROR_STOP=1 -d postgres -c \
            "select (select rolsuper::integer from pg_roles where rolname='postgres'),
                    (select rolsuper::integer from pg_roles where rolname='supabase_admin'),
                    pg_has_role('postgres','supabase_admin','SET')::integer;" 2>/dev/null)"
          if ! [[ "$flags" =~ ^[01]\\|[01]\\|[01]$ ]]; then
            echo "OFFLINE PG17 ROLE PROBE FAILED: unexpected role metadata"
            exit 1
          fi
          echo "OFFLINE PG17 ROLE FLAGS (postgres-superuser|admin-superuser|can-set-admin): $flags"
          if docker exec -u postgres insureit-v2-privilege-probe \
            psql -XAt -v ON_ERROR_STOP=1 -d postgres -c \
            "SET ROLE supabase_admin; SELECT rolsuper::integer FROM pg_roles WHERE rolname=current_user;" \
            > "$RUNNER_TEMP/v2-role-probe.log" 2>&1; then
            if grep -qx 1 "$RUNNER_TEMP/v2-role-probe.log"; then
              echo "OFFLINE PG17 PRIVILEGED ROLE SWITCH: supported"
            else
              echo "OFFLINE PG17 PRIVILEGED ROLE SWITCH: unsupported or not superuser"
            fi
          else
            echo "OFFLINE PG17 PRIVILEGED ROLE SWITCH: permission denied"
          fi
          # Authenticate the preinstalled isolated admin using only this
          # disposable container's synthetic test password; no live secrets.
          if docker exec -u postgres --env PGPASSWORD=ephemeral-synthetic-only \
            insureit-v2-privilege-probe \
            psql -h 127.0.0.1 -U supabase_admin -XAt -v ON_ERROR_STOP=1 -d postgres \
            -c "SELECT rolsuper::integer FROM pg_roles WHERE rolname=current_user;" \
            > "$RUNNER_TEMP/v2-role-probe.log" 2>&1; then
            if grep -qx 1 "$RUNNER_TEMP/v2-role-probe.log"; then
              echo "OFFLINE PG17 ADMIN AUTHENTICATION: supported"
            else
              echo "OFFLINE PG17 ADMIN AUTHENTICATION: unprivileged"
            fi
          else
            echo "OFFLINE PG17 ADMIN AUTHENTICATION: unavailable"
          fi
          rm -f "$RUNNER_TEMP/v2-role-probe.log"
