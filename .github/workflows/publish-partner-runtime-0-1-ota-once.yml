name: Publish Partner runtime 0.1.0 OTA once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-partner-runtime-0-1-ota-once.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "Refusing Partner runtime 0.1.0 OTA: checkout is not current origin/main." >&2
            exit 1
          }

      - name: Validate Partner project identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const customer = require('./apps/mobile-app/app.json');
          const expo = app.expo || {};
          if (!expo?.extra?.eas?.projectId || !expo?.updates?.url) throw new Error('Partner EAS/update linkage missing.');
          if (expo.extra.eas.projectId === customer?.expo?.extra?.eas?.projectId || expo.updates.url === customer?.expo?.updates?.url) throw new Error('Partner app cannot share Customer EAS/update identity.');
          if (expo?.runtimeVersion?.policy !== 'appVersion') throw new Error('Expected appVersion runtime policy.');
          console.log(`Source baseline ${expo.version}; publishing compatibility OTA for installed runtime 0.1.0`);
          NODE

      - name: Pin runtime to 0.1.0 for this publish only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = './apps/partner-app/app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.version = '0.1.0';
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          console.log('Temporary publish runtime:', app.expo.version);
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo token and Partner project
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish Partner runtime 0.1.0 OTA
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "INSUREIT Partner runtime 0.1.0 compatibility OTA from main ${GITHUB_SHA}" \
            --non-interactive \
            --json > partner-runtime-0-1-update.json
          cat partner-runtime-0-1-update.json

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## INSUREIT Partner runtime 0.1.0 compatibility OTA"
            echo
            echo "- Source code: current main"
            echo "- Channel: preview"
            echo "- Runtime forced only inside CI publish workspace: 0.1.0"
            echo "- Repository app.json remains unchanged on main"
          } >> "$GITHUB_STEP_SUMMARY"
