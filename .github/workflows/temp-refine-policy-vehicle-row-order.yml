name: Temporary refine policy vehicle row order

on:
  push:
    paths:
      - scripts/temp_refine_policy_vehicle_row_order.py
      - .github/workflows/temp-refine-policy-vehicle-row-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Section 02 refinement
        run: python scripts/temp_refine_policy_vehicle_row_order.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate refinement
        run: |
          git diff --check
          grep -q 'Registration No.' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'RcStatusIcon' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'Capacity (' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'CompactSourceMeta label="RC"' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'CompactSourceMeta label="Classification"' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'CompactSourceMeta label="Basis"' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Refine policy vehicle field layout and RC status"
            git pull --rebase origin main
            git push origin main
          fi
