name: Restore Life Health handoff

on:
  push:
    branches:
      - feature/life-health-document-actions-2026-10-01
    paths:
      - '.github/workflows/restore-life-health-handoff.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/life-health-document-actions-2026-10-01
          fetch-depth: 0
      - name: Restore complete handoff
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- docs/CURRENT_CHAT_HANDOFF.md
          rm .github/workflows/restore-life-health-handoff.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete project handoff"
          git push origin HEAD:feature/life-health-document-actions-2026-10-01
