name: Temporary align internal stages with external claim UI

on:
  push:
    branches:
      - ui/internal-stages-match-external
    paths:
      - .github/workflows/tmp-align-internal-stages-external.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/internal-stages-match-external
          fetch-depth: 0
      - name: Reuse external milestone UI for internal stages 4 through 9
        run: |
          python - <<'PY'
          from pathlib import Path

          external = Path('apps/mobile-app/app/customer/self-managed-milestone.tsx')
          text = external.read_text()
          text = text.replace('renderStage(key, values, set, milestones, claimId, customerId)', 'ExternalClaimMilestoneStageBody(key, values, set, milestones, claimId, customerId)')
          text = text.replace('function renderStage(key: ClaimMilestoneKey, values: Values, set: (field: FieldKey, value: string) => void, milestones: ClaimMilestone[], claimId: string, customerId: string)', 'export function ExternalClaimMilestoneStageBody(key: ClaimMilestoneKey, values: Values, set: (field: FieldKey, value: string) => void, milestones: ClaimMilestone[], claimId: string, customerId: string)')
          text = text.replace('subtitle={subtitleFor(key)}', 'subtitle={externalClaimMilestoneSubtitle(key)}')
          text = text.replace('function subtitleFor(key: ClaimMilestoneKey)', 'export function externalClaimMilestoneSubtitle(key: ClaimMilestoneKey)')
          external.write_text(text)

          internal = Path('apps/mobile-app/app/customer/internal-claim-stage.tsx')
          text = internal.read_text()
          text = text.replace("import { ClaimFormSection, ClaimIdentityCard, ExternalClaimStageHeader } from '@/components/external-claim-ui';", "import { ClaimActionBar, ClaimFormSection, ClaimIdentityCard, ExternalClaimStageHeader } from '@/components/external-claim-ui';")
          anchor = "import { palette } from '@/lib/theme';\n"
          shared_import = "import { ExternalClaimMilestoneStageBody, externalClaimMilestoneSubtitle } from './self-managed-milestone';\n"
          if shared_import not in text:
              text = text.replace(anchor, anchor + shared_import)

          start_marker = "  return (\n    <Screen title={definition.label} showTitleHeader={false}>\n      <ExternalClaimStageHeader"
          start = text.rfind(start_marker)
          end_marker = "\n}\n\nfunction InternalSpotIntimationIdentityCard"
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate internal generic stage block')

          replacement = r'''  const rawFormValue = (keys: string[]) => firstValue(mergedDetails, keys);
          const formValue = (keys: string[]) => {
            const value = rawFormValue(keys);
            if (value === null || value === undefined) return '';
            if (typeof value === 'boolean') return value ? 'true' : 'false';
            return String(value);
          };
          const yesNoValue = (keys: string[]) => {
            const value = rawFormValue(keys);
            if (value === null || value === undefined || value === '') return '';
            if (typeof value === 'boolean') return value ? 'yes' : 'no';
            const normalized = String(value).trim().toLowerCase();
            if (['yes', 'true', 'received', 'submitted', 'completed', 'done'].includes(normalized)) return 'yes';
            if (['no', 'false', 'not yet', 'pending'].includes(normalized)) return 'no';
            return normalized;
          };
          const cashlessValue = (() => {
            const value = rawFormValue(['cashless']);
            if (value === null || value === undefined || value === '') return '';
            if (typeof value === 'boolean') return value ? 'true' : 'false';
            const normalized = String(value).trim().toLowerCase();
            return ['yes', 'true', 'cashless'].includes(normalized) ? 'true' : ['no', 'false', 'reimbursement'].includes(normalized) ? 'false' : normalized;
          })();
          const externalValues = {
            approval_received_date: isoDateValue(rawFormValue(['approval_received_date', 'approved_at'])),
            cashless: cashlessValue,
            surveyor_name: formValue(['surveyor_name', 'name']),
            surveyor_phone: formValue(['surveyor_phone', 'surveyor_mobile', 'mobile']),
            surveyor_email: formValue(['surveyor_email', 'email']),
            repair_complete_date: isoDateValue(rawFormValue(['repair_complete_date', 'repair_completed_date'])),
            ri_required: yesNoValue(['ri_required', 'ri_status']),
            ri_requested_date: isoDateValue(rawFormValue(['ri_requested_date', 'reinspection_requested_date'])),
            ri_done_date: isoDateValue(rawFormValue(['ri_done_date', 'reinspection_done_date'])),
            bill_date: isoDateValue(rawFormValue(['bill_date', 'final_bill_date'])),
            bill_amount: formValue(['bill_amount', 'final_bill_amount']),
            assessment_received: yesNoValue(['assessment_received', 'assessment_status']),
            do_date: isoDateValue(rawFormValue(['do_date', 'delivery_order_date'])),
            do_amount: formValue(['do_amount', 'delivery_order_amount']),
            vehicle_received: yesNoValue(['vehicle_received', 'delivery_status', 'status']),
            vehicle_received_date: isoDateValue(rawFormValue(['vehicle_received_date', 'vehicle_delivery_date'])),
            depreciation_submitted: yesNoValue(['depreciation_submitted', 'depreciation_status']),
            satisfaction_submitted: yesNoValue(['satisfaction_submitted', 'satisfaction_status']),
            documents_submit_date: isoDateValue(rawFormValue(['documents_submit_date', 'documents_submitted_date'])),
            payment_received_date: isoDateValue(rawFormValue(['payment_received_date', 'settlement_date'])),
            payment_received_amount: formValue(['payment_received_amount', 'settlement_amount']),
          } as any;

          const stageSnapshot = (target: InternalJourneyStageKey) => {
            const snapshot: Record<string, unknown> = {};
            const statuses = STAGE_STATUSES[target];
            for (const row of [...stageDetails].reverse()) {
              if (statuses.has(row.stage)) Object.assign(snapshot, row.details ?? {});
            }
            return snapshot;
          };
          const billingSnapshot = stageSnapshot('billing');
          const deliveryOrderSnapshot = stageSnapshot('delivery_order');
          const externalMilestones = [
            { milestone_key: 'billing', milestone_status: 'completed', details: billingSnapshot },
            { milestone_key: 'delivery_order', milestone_status: 'completed', details: deliveryOrderSnapshot },
          ] as any;
          const primaryLabel = stageKey === 'payment_encashment'
            ? 'Complete Claim'
            : stageKey === 'vehicle_delivery' && externalValues.vehicle_received !== 'yes'
              ? 'Save Vehicle Status'
              : 'Save & Continue';

          return (
            <Screen title={definition.label} showTitleHeader={false}>
              <ExternalClaimStageHeader
                step={step}
                title={definition.label}
                subtitle={externalClaimMilestoneSubtitle(stageKey as any)}
                vehicleNo={vehicleNo}
                claimNo={claim.insurer_claim_no || claim.claim_no}
                onBack={() => router.back()}
              />

              <ClaimIdentityCard
                claimNo={claim.insurer_claim_no || claim.claim_no}
                insurerName={insurerName || 'Insurance company'}
                vehicleNo={vehicleNo || 'Vehicle'}
                policyNo={policyNo || undefined}
                vehicleMeta={vehicleMeta}
              />

              {message ? <Message type="error">{message}</Message> : null}

              <View pointerEvents="none">
                <ExternalClaimMilestoneStageBody
                  key={stageKey}
                  values={externalValues}
                  set={() => undefined}
                  milestones={externalMilestones}
                  claimId={claim.id}
                  customerId={claim.customer_id}
                />
              </View>

              <View pointerEvents="none">
                <ClaimActionBar
                  primaryDisabled={false}
                  primaryIcon={stageKey === 'payment_encashment' ? 'check' : 'arrow-right'}
                  primaryLabel={primaryLabel}
                  onAssistance={() => undefined}
                  onPrimary={() => undefined}
                />
              </View>
            </Screen>
          );'''

          # JSX passes are positional, not named. Fix the body invocation after insertion.
          replacement = replacement.replace("<ExternalClaimMilestoneStageBody\n                  key={stageKey}\n                  values={externalValues}\n                  set={() => undefined}\n                  milestones={externalMilestones}\n                  claimId={claim.id}\n                  customerId={claim.customer_id}\n                />", "{ExternalClaimMilestoneStageBody(stageKey as any, externalValues, () => undefined, externalMilestones, claim.id, claim.customer_id)}")
          text = text[:start] + replacement + text[end:]
          internal.write_text(text)
          PY
      - name: Commit aligned stages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/internal-claim-stage.tsx apps/mobile-app/app/customer/self-managed-milestone.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Match internal claim stages 4-9 to external UI"
          git push origin HEAD:ui/internal-stages-match-external
