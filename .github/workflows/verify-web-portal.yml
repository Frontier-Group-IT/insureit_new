name: Verify web portal

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-web-portal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
  NEXT_PUBLIC_PORTAL_URL: https://portal.insureit.in

jobs:
  verify:
    name: regressions, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-portal/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Access control V2 catalogue regression
        run: npm run access-control:v2-regression
      - name: Access control V2 scope and compatibility regression
        run: npm run access-control:v2-scope-regression
      - name: Access control V2 portal lifecycle regression
        run: npm run access-control:v2-lifecycle-regression
      - name: Employee portal governance regression
        run: npm run access-control:portal-governance-regression
      - name: Release blocker security regression
        run: npm run access-control:release-blockers-regression
      - name: Backoffice data-entry security regression
        run: npm run access-control:backoffice-data-entry-regression
      - name: Policy intake workflow regression
        run: npm run policy-intake:workflow-regression
      - name: Partner web core security regression
        run: npm run partner-web:core-regression
      - name: External renewal intake visibility regression
        run: node scripts/partner-external-renewal-intake-visibility-regression.mjs
      - name: Partner push-device registration security regression
        run: node scripts/partner-push-device-registration-regression.mjs
      - name: Partner push notification template regression
        run: node scripts/partner-push-template-regression.mjs
      - name: Vehicle and policy intake resume regression
        run: npm run vehicle-policy-intake:resume-regression
      - name: Canonical NEW vehicle prefix regression
        run: npm run vehicle-prefix:new-regression
      - name: Vehicle registration regression
        run: npm run vehicle-registration:regression
      - name: Register workflow prefetch regression
        run: npm run register-prefetch:regression
      - name: Commercial and reports prefetch regression
        run: npm run commercial-reports-prefetch:regression
      - name: Register performance observability regression
        run: npm run register-performance-observability:regression
      - name: Policy register payload regression
        run: npm run policy-register-payload:regression
      - name: Register customer relation payload regression
        run: npm run register-customer-relation-payload:regression
      - name: Remaining register prefetch regression
        run: npm run remaining-register-prefetch:regression
      - name: Backoffice register prefetch regression
        run: npm run backoffice-register-prefetch:regression
      - name: Server auth claims regression
        run: npm run server-auth-claims:regression
      - name: Claim spot multi-upload and intimation regression
        run: npm run claim-spot-multi-upload:regression
      - name: Auth phase observability regression
        run: npm run auth-phase-observability:regression
      - name: Dashboard performance regression
        run: npm run dashboard-performance:regression
      - name: Portal route enhancement performance regression
        run: npm run portal-route-enhancements:regression
      - name: Aadhaar mask observer performance regression
        run: npm run aadhaar-mask-performance:regression
      - name: Policy edit helper performance regression
        run: npm run policy-edit-helper-performance:regression
      - name: Reconciliation stylesheet performance regression
        run: npm run reconciliation-stylesheet-performance:regression
      - name: Policy reference data cache regression
        run: npm run policy-reference-cache:regression
      - name: Policy edit insurer cache regression
        run: npm run policy-edit-insurer-cache:regression
      - name: External policy insurer cache regression
        run: npm run external-policy-insurer-cache:regression
      - name: IFFCO structured regression
        run: npm run policy-ocr:iffco-structured-regression
      - name: IFFCO regression
        run: npm run policy-ocr:iffco-regression
      - name: Digit regression
        run: npm run policy-ocr:digit-regression
      - name: New India regression
        run: npm run policy-ocr:new-india-regression
      - name: Additional insurer OCR regression
        run: npm run policy-ocr:additional-regression
      - name: Approved OCR layout regression
        run: npm run policy-ocr:approved-layout-regression
      - name: Production rerun OCR refinement regression
        run: npm run policy-ocr:rerun-refinement-regression
      - name: Production benchmark OCR regression
        run: npm run policy-ocr:production-benchmark-regression
      - name: Production round 2 OCR regression
        run: npm run policy-ocr:production-round2-regression
      - name: Production round 3 precision regression
        run: npm run policy-ocr:production-round3-regression
      - name: Production round 4 UIIC regression
        run: npm run policy-ocr:production-round4-uiic-regression
      - name: Production round 5 UIIC precision regression
        run: npm run policy-ocr:production-round5-uiic-regression
      - name: Production round 6 UIIC residual regression
        run: npm run policy-ocr:production-round6-uiic-regression
      - name: Production round 7 UIIC precision guard regression
        run: npm run policy-ocr:production-round7-uiic-regression
      - name: Production round 8 fresh20 precision regression
        run: node --experimental-strip-types scripts/policy-ocr-production-round8-fresh20-regression.ts
      - name: Production round 9 fresh20 Digit recovery regression
        run: npm run policy-ocr:production-round9-fresh20-regression
      - name: Post-training replay safety regression
        run: npm run policy-ocr:post-training-replay-regression
      - name: Policy onboarding OCR import regression
        run: npm run policy-ocr:onboarding-import-regression
      - name: Premium OCR training workflow regression
        run: npm run policy-ocr:training-workflow-regression
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

      - name: Verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Web portal verification gate"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Access control: V2 catalogue, scope, legacy compatibility, portal lifecycle, employee portal governance, release-blocker, Backoffice data-entry, policy-intake workflow, Partner web core, external renewal intake visibility, Partner push-device registration and Partner push-template regressions"
            echo "- Vehicle regressions: canonical NEW prefix and standard/BH-series registration validation"
            echo "- Performance regressions: expensive register create/edit workflow links do not auto-prefetch"
            echo "- OCR regressions: IFFCO structured, IFFCO, Digit, New India, additional insurers, approved layouts, production rerun refinement, production benchmark siblings, production rounds 2, 3, 4 UIIC, 5 UIIC precision, 6 UIIC residual, 7 UIIC precision guard, 8 fresh20 precision and 9 fresh20 Digit recovery, post-training replay safety, onboarding Section 02/03 import, premium training workflow"
            echo "- Static checks: typecheck and lint"
            echo "- Build: Next.js production build"
            echo "- Build-only public env: non-secret CI placeholders; no production credentials used"
            echo
            echo "A green job is the repository evidence for these checks. No user-local terminal execution is required."
          } >> "$GITHUB_STEP_SUMMARY"