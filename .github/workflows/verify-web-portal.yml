name: Verify web portal

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-web-portal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
  NEXT_PUBLIC_PORTAL_URL: https://portal.insureit.in

jobs:
  verify:
    name: regressions, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-portal/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Activity Status field-change and privacy regression
        run: node --experimental-strip-types scripts/activity-change-details-regression.mjs
      - name: Daily Report Phase 1 read-only hierarchy and activity regression
        run: node scripts/daily-activity-report-phase1-regression.mjs
