name: Verify web portal

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-web-portal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
  NEXT_PUBLIC_PORTAL_URL: https://portal.insureit.in

jobs:
  verify:
    name: OCR regressions, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-portal/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: IFFCO structured regression
        run: npm run policy-ocr:iffco-structured-regression

      - name: IFFCO regression
        run: npm run policy-ocr:iffco-regression

      - name: Digit regression
        run: npm run policy-ocr:digit-regression

      - name: New India regression
        run: npm run policy-ocr:new-india-regression

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Web portal verification gate"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- OCR regressions: IFFCO structured, IFFCO, Digit, New India"
            echo "- Static checks: typecheck and lint"
            echo "- Build: Next.js production build"
            echo "- Build-only public env: non-secret CI placeholders; no production credentials used"
            echo
            echo "A green job is the repository evidence for these checks. No user-local terminal execution is required."
          } >> "$GITHUB_STEP_SUMMARY"
