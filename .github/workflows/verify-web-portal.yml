name: Verify web portal

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-web-portal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
  NEXT_PUBLIC_PORTAL_URL: https://portal.insureit.in

jobs:
  verify:
    name: regressions, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-portal/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Access control V2 catalogue regression
        run: npm run access-control:v2-regression
      - name: Access control V2 scope and compatibility regression
        run: npm run access-control:v2-scope-regression
      - name: Access control V2 portal lifecycle regression
        run: npm run access-control:v2-lifecycle-regression
      - name: Employee portal governance regression
        run: npm run access-control:portal-governance-regression
      - name: Release blocker security regression
        run: npm run access-control:release-blockers-regression
      - name: Backoffice data-entry security regression
        run: npm run access-control:backoffice-data-entry-regression
      - name: Canonical NEW vehicle prefix regression
        run: npm run vehicle-prefix:new-regression
      - name: IFFCO structured regression
        run: npm run policy-ocr:iffco-structured-regression
      - name: IFFCO regression
        run: npm run policy-ocr:iffco-regression
      - name: Digit regression
        run: npm run policy-ocr:digit-regression
      - name: New India regression
        run: npm run policy-ocr:new-india-regression
      - name: Additional insurer OCR regression
        run: npm run policy-ocr:additional-regression
      - name: Approved OCR layout regression
        run: npm run policy-ocr:approved-layout-regression
      - name: Production rerun OCR refinement regression
        run: npm run policy-ocr:rerun-refinement-regression
      - name: Production benchmark OCR regression
        run: npm run policy-ocr:production-benchmark-regression
      - name: Production round 2 OCR regression
        run: npm run policy-ocr:production-round2-regression
      - name: Production round 3 precision regression
        run: npm run policy-ocr:production-round3-regression
      - name: Post-training replay safety regression
        run: npm run policy-ocr:post-training-replay-regression
      - name: Policy onboarding OCR import regression
        run: npm run policy-ocr:onboarding-import-regression
      - name: Premium OCR training workflow regression
        run: npm run policy-ocr:training-workflow-regression
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

      - name: Verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Web portal verification gate"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Access control: V2 catalogue, scope, legacy compatibility, portal lifecycle, employee portal governance, release-blocker and Backoffice data-entry regressions"
            echo "- OCR regressions: IFFCO structured, IFFCO, Digit, New India, additional insurers, approved layouts, production rerun refinement, production benchmark siblings, production rounds 2 and 3, post-training replay safety, onboarding Section 02/03 import, premium training workflow"
            echo "- Static checks: typecheck and lint"
            echo "- Build: Next.js production build"
            echo "- Build-only public env: non-secret CI placeholders; no production credentials used"
            echo
            echo "A green job is the repository evidence for these checks. No user-local terminal execution is required."
          } >> "$GITHUB_STEP_SUMMARY"
