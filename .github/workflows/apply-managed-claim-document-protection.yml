name: Apply managed claim document protection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Protect verified managed claim documents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260903170000_protect_verified_managed_claim_documents.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply document protection migration
        run: supabase db query --linked --file supabase/migrations/20260903170000_protect_verified_managed_claim_documents.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260903170000

      - name: Verify managed-claim delete guards
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              exists (
                select 1
                from pg_policies
                where schemaname = 'public'
                  and tablename = 'claim_documents'
                  and policyname = 'claim documents customer delete own claim'
                  and qual like '%self_managed%'
                  and qual like '%verification_status%'
              ) as row_guard_ready,
              exists (
                select 1
                from pg_policies
                where schemaname = 'storage'
                  and tablename = 'objects'
                  and policyname = 'claim document objects customer delete own claim'
                  and qual like '%broker_managed%'
                  and qual like '%verification_status%'
              ) as storage_guard_ready
          ")
          echo "$result"
          echo "$result" | grep -Eq '"row_guard_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"storage_guard_ready"[[:space:]]*:[[:space:]]*true'
