name: Temporary refine policy section05

on:
  push:
    paths:
      - scripts/temp_refine_policy_section05.py
      - .github/workflows/temp-refine-policy-section05.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Section 05 refinement
        run: python scripts/temp_refine_policy_section05.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'SettlementField' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'Payout outcome' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'CalculatedSubline value={money.format(calculations.payoutOd)}' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'CalculatedSubline value={money.format(calculations.payoutTp)}' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'Add remarks' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'String(calculations.indicativeMargin)' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'Gross partner payout' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'payload.payout.retention,' apps/web-portal/app/policies/policy-edit-actions.ts
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx apps/web-portal/app/policies/policy-edit-actions.ts
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Refine intermediary payout and settlement section"
            git pull --rebase origin main
            git push origin main
          fi
