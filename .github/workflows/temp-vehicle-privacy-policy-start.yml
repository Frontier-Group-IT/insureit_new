name: Temp vehicle privacy and policy start
on:
  push:
    branches: [mobile/vehicle-privacy-policy-start]
    paths: ['.github/workflows/temp-vehicle-privacy-policy-start.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/vehicle-privacy-policy-start
          fetch-depth: 0
      - name: Patch files
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1))

          # Vehicle detail: mask chassis and engine numbers.
          path = 'apps/mobile-app/app/customer/vehicle-detail.tsx'
          replace(path,
              '<DetailCell icon="barcode" label="Chassis no." value={vehicle.chassis_no} />\n          <DetailCell icon="engine-outline" label="Engine no." value={vehicle.engine_no} />',
              '<DetailCell icon="barcode" label="Chassis no." value={maskSensitiveIdentifier(vehicle.chassis_no)} />\n          <DetailCell icon="engine-outline" label="Engine no." value={maskSensitiveIdentifier(vehicle.engine_no)} />')
          replace(path,
              'function selectVehiclePolicy(policies: VehiclePolicyDisplay[]) {',
              "function maskSensitiveIdentifier(value?: string | null) {\n  const normalized = String(value ?? '').trim();\n  if (!normalized) return null;\n  if (normalized.length <= 8) return `${normalized.slice(0, 2)}${'•'.repeat(Math.max(2, normalized.length - 4))}${normalized.slice(-2)}`;\n  return `${normalized.slice(0, 4)}${'•'.repeat(Math.max(4, normalized.length - 8))}${normalized.slice(-4)}`;\n}\n\nfunction selectVehiclePolicy(policies: VehiclePolicyDisplay[]) {")

          # Vehicle list: mask policy number on cards only.
          path = 'apps/mobile-app/app/customer/vehicles.tsx'
          replace(path, 'value={policy.policy_no}\n                      statusActive={active}', 'value={maskPolicyNumber(policy.policy_no)}\n                      statusActive={active}')
          marker = 'function daysUntil('
          p = Path(path); text = p.read_text()
          if marker not in text:
              marker = 'function policyForVehicle('
          if marker not in text:
              raise SystemExit('Could not locate helper insertion point in vehicles.tsx')
          helper = "function maskPolicyNumber(value?: string | null) {\n  const normalized = String(value ?? '').replace(/\\s+/g, '').trim();\n  if (!normalized) return '-';\n  if (normalized.length <= 8) return `${normalized.slice(0, 2)}${'•'.repeat(Math.max(2, normalized.length - 4))}${normalized.slice(-2)}`;\n  return `${normalized.slice(0, 4)}${'•'.repeat(Math.max(4, normalized.length - 8))}${normalized.slice(-4)}`;\n}\n\n"
          p.write_text(text.replace(marker, helper + marker, 1))

          # Mobile lookup contract: expose policy start date.
          path = 'apps/mobile-app/lib/customer-rc-lookup.ts'
          replace(path, '  policyNumber: string | null;\n  policyExpiryDate: string | null;', '  policyNumber: string | null;\n  policyStartDate: string | null;\n  policyExpiryDate: string | null;')

          # Add vehicle: use Authbridge start date, with a safe one-year fallback from expiry.
          path = 'apps/mobile-app/app/customer/add-vehicle.tsx'
          replace(path,
              '      if (details.policyNumber) setPolicyNo(details.policyNumber.replace(/\\s/g, \'\').toUpperCase());\n      if (details.policyExpiryDate) setPolicyEndDate(details.policyExpiryDate);',
              "      if (details.policyNumber) setPolicyNo(details.policyNumber.replace(/\\s/g, '').toUpperCase());\n      if (details.policyStartDate) setPolicyStartDate(details.policyStartDate);\n      else if (details.policyExpiryDate) setPolicyStartDate(defaultPolicyStartDate(details.policyExpiryDate));\n      if (details.policyExpiryDate) setPolicyEndDate(details.policyExpiryDate);")
          replace(path,
              '<View style={styles.column}><PremiumDateField label="Start date" value={policyStartDate}',
              '<View style={styles.column}><PremiumDateField label="Start date *" value={policyStartDate}')
          replace(path,
              'function defaultPolicyEndDate(startIso: string) { const start = parseDate(startIso); if (!start) return \'\'; const end = new Date(start.getFullYear() + 1, start.getMonth(), start.getDate()); end.setDate(end.getDate() - 1); return formatIsoDate(end); }',
              "function defaultPolicyStartDate(endIso: string) { const end = parseDate(endIso); if (!end) return ''; const start = new Date(end.getFullYear() - 1, end.getMonth(), end.getDate()); start.setDate(start.getDate() + 1); return formatIsoDate(start); }\nfunction defaultPolicyEndDate(startIso: string) { const start = parseDate(startIso); if (!start) return ''; const end = new Date(start.getFullYear() + 1, start.getMonth(), start.getDate()); end.setDate(end.getDate() - 1); return formatIsoDate(end); }")

          # Customer RC API: map actual Authbridge insurance-from date; fallback from expiry.
          path = 'apps/web-portal/app/api/customer/rc-lookup/route.ts'
          replace(path, 'const RC_MAPPER_VERSION = "2026-09-12-v3";', 'const RC_MAPPER_VERSION = "2026-09-16-v4";')
          replace(path, '  policyNumber: string | null;\n  policyExpiryDate: string | null;', '  policyNumber: string | null;\n  policyStartDate: string | null;\n  policyExpiryDate: string | null;')
          replace(path,
              '  const model = cleanText(\n    findObjectValue(vehicleDetails, ["Model / Makers Class", "Model/Makers Class", "Model Makers Class", "Model", "Makers Class"])\n      ?? findValue(values, ["modelmakersclass", "model", "modelname", "makermodel", "makermodelname", "vehiclename", "vehiclemodel", "vehiclemodelname", "modeldescription", "modeldesc", "variant", "variantname", "modelvariant", "modelvariantname"]),\n  );\n\n  return {',
              '  const model = cleanText(\n    findObjectValue(vehicleDetails, ["Model / Makers Class", "Model/Makers Class", "Model Makers Class", "Model", "Makers Class"])\n      ?? findValue(values, ["modelmakersclass", "model", "modelname", "makermodel", "makermodelname", "vehiclename", "vehiclemodel", "vehiclemodelname", "modeldescription", "modeldesc", "variant", "variantname", "modelvariant", "modelvariantname"]),\n  );\n  const policyExpiryDate = toIsoDate(\n    findObjectValue(insuranceDetails, ["Insurance To Date/Insurance Upto", "Insurance To Date", "Insurance Upto", "Policy Expiry Date"])\n      ?? findValue(values, ["insurancetodateinsuranceupto", "insurancetodate", "insuranceupto", "policyexpirydate", "insuranceexpirydate"]),\n  );\n  const policyStartDate = toIsoDate(\n    findObjectValue(insuranceDetails, ["Insurance From Date", "Insurance From", "Policy Start Date", "Policy From Date"])\n      ?? findValue(values, ["insurancefromdate", "insurancefrom", "policystartdate", "policyfromdate", "insurancepolicyfromdate"]),\n  ) ?? derivePolicyStartDate(policyExpiryDate);\n\n  return {')
          replace(path,
              '    policyExpiryDate: toIsoDate(\n      findObjectValue(insuranceDetails, ["Insurance To Date/Insurance Upto", "Insurance To Date", "Insurance Upto", "Policy Expiry Date"])\n        ?? findValue(values, ["insurancetodateinsuranceupto", "insurancetodate", "insuranceupto", "policyexpirydate", "insuranceexpirydate"]),\n    ),',
              '    policyStartDate,\n    policyExpiryDate,')
          replace(path,
              '    policyNumber: cleanPolicyNumber(toPrimitive(value.policyNumber)),\n    policyExpiryDate: toIsoDate(toPrimitive(value.policyExpiryDate)),',
              '    policyNumber: cleanPolicyNumber(toPrimitive(value.policyNumber)),\n    policyStartDate: toIsoDate(toPrimitive(value.policyStartDate)) ?? derivePolicyStartDate(toIsoDate(toPrimitive(value.policyExpiryDate))),\n    policyExpiryDate: toIsoDate(toPrimitive(value.policyExpiryDate)),')
          replace(path,
              'function mappedFieldCount(details: SafeVehicleDetails) {',
              "function derivePolicyStartDate(expiryIso: string | null) {\n  if (!expiryIso) return null;\n  const [year, month, day] = expiryIso.split('-').map(Number);\n  if (!year || !month || !day) return null;\n  const start = new Date(year - 1, month - 1, day);\n  start.setDate(start.getDate() + 1);\n  const yyyy = start.getFullYear();\n  const mm = String(start.getMonth() + 1).padStart(2, '0');\n  const dd = String(start.getDate()).padStart(2, '0');\n  return `${yyyy}-${mm}-${dd}`;\n}\n\nfunction mappedFieldCount(details: SafeVehicleDetails) {")

      - name: Verify focused changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'maskSensitiveIdentifier(vehicle.chassis_no)' apps/mobile-app/app/customer/vehicle-detail.tsx
          grep -q 'maskPolicyNumber(policy.policy_no)' apps/mobile-app/app/customer/vehicles.tsx
          grep -q 'policyStartDate' apps/mobile-app/lib/customer-rc-lookup.ts
          grep -q 'Start date \*' apps/mobile-app/app/customer/add-vehicle.tsx
          grep -q 'Insurance From Date' apps/web-portal/app/api/customer/rc-lookup/route.ts
          git diff --check
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile-app/app/customer/vehicle-detail.tsx apps/mobile-app/app/customer/vehicles.tsx apps/mobile-app/lib/customer-rc-lookup.ts apps/mobile-app/app/customer/add-vehicle.tsx apps/web-portal/app/api/customer/rc-lookup/route.ts
          git commit -m 'Protect vehicle identifiers and autofill policy start date'
          git push origin HEAD:mobile/vehicle-privacy-policy-start
