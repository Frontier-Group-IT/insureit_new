name: Compact customer and application UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply requested UI cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('apps/web-portal/app/dashboard/page.tsx')
          text = dashboard.read_text(encoding='utf-8')
          text = text.replace('  Sparkles,\n', '')
          text = re.sub(r'\n\s*<div className="mb-4 inline-flex.*?Live operations cockpit\s*</div>', '', text, count=1, flags=re.S)
          text = re.sub(r'\n\s*<p className="mt-3 max-w-2xl.*?Everything important is visible at a glance—customers, fleet exposure, claims, onboarding and the work that needs action now\.</p>', '', text, count=1, flags=re.S)
          dashboard.write_text(text, encoding='utf-8')

          customers = Path('apps/web-portal/app/customers/customer-workspace.tsx')
          text = customers.read_text(encoding='utf-8')
          pattern = re.compile(r'''        <div className="border-b border-\[#E2E8F0\] p-3 sm:p-4">\n          <div className="flex gap-2">.*?          </div>\n        </div>''', re.S)
          replacement = '''        <div className="border-b border-[#E2E8F0] p-2.5 sm:p-3">
          <div className="flex flex-wrap items-center gap-2">
            <input value={query} onChange={(event) => { setQuery(event.target.value); setPage(1); }} placeholder="Search customer, trade name, mobile or city" aria-label="Search customers" className="h-10 min-w-[220px] flex-1 rounded-xl border border-[#CBD5E1] px-3 text-[12px] lg:max-w-[420px]" />
            <button type="button" onClick={() => setFiltersOpen(true)} className="relative grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-[#CBD5E1] bg-white text-[#334155] md:hidden" aria-label="Open customer filters"><SlidersHorizontal className="h-4 w-4" />{activeFilterCount ? <span className="absolute -right-1 -top-1 grid h-5 min-w-5 place-items-center rounded-full bg-[#6759ff] px-1 text-[9px] font-bold text-white">{activeFilterCount}</span> : null}</button>
            <select value={status} onChange={(event) => { setStatus(event.target.value); setPage(1); }} className="hidden h-10 min-w-[135px] rounded-xl border border-[#CBD5E1] bg-white px-2.5 text-[11px] md:block"><option value="all">All statuses</option><option value="active">Active</option><option value="documents_pending">KYC incomplete</option></select>
            <select value={partner} onChange={(event) => { setPartner(event.target.value); setPage(1); }} className="hidden h-10 min-w-[165px] rounded-xl border border-[#CBD5E1] bg-white px-2.5 text-[11px] md:block"><option value="all">All partner types</option>{Object.entries(partnerLabels).map(([value, label]) => <option key={value} value={value}>{label}</option>)}</select>
            <Link href="/customers/applications" className="hidden h-10 items-center justify-center gap-2 rounded-xl border border-[#CBD5E1] bg-white px-3 text-[10.5px] font-semibold text-[#334155] md:inline-flex"><FileCheck2 className="h-4 w-4" />KYC Applications</Link>
            <button type="button" onClick={() => setPartnerModalOpen(true)} className="inline-flex h-10 shrink-0 items-center justify-center gap-1.5 rounded-xl bg-gradient-to-r from-[#6759ff] to-[#17bfc5] px-3 text-[11px] font-bold text-white shadow-[0_10px_24px_rgba(103,89,255,.24)]"><Plus className="h-4 w-4" /><span className="hidden sm:inline">Add Customer</span></button>
            <div className="ml-auto hidden items-center gap-2 lg:flex"><button type="button" disabled={!selectedRows.length} onClick={exportSelected} className="h-10 rounded-xl border border-[#CBD5E1] bg-white px-3 text-[10.5px] font-semibold text-[#334155] disabled:opacity-40">Export</button><details className="relative"><summary className="flex h-10 cursor-pointer list-none items-center rounded-xl border border-[#CBD5E1] bg-white px-3 text-[10.5px] font-semibold [&::-webkit-details-marker]:hidden">Columns</summary><div className="absolute right-0 top-11 z-30 w-52 rounded-xl border border-[#E2E8F0] bg-white p-1.5 shadow-xl">{(Object.keys(columnLabels) as ColumnKey[]).map((column) => <label key={column} className="flex min-h-10 cursor-pointer items-center gap-2 rounded-lg px-2 py-1.5 text-[11px] hover:bg-[#F8FAFC]"><input type="checkbox" checked={visibleColumns.includes(column)} onChange={() => setVisibleColumns((current) => current.includes(column) ? current.filter((item) => item !== column) : [...current, column])} className="h-4 w-4" />{columnLabels[column]}</label>)}</div></details></div>
          </div>
        </div>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Customer toolbar replacement count was {count}')
          customers.write_text(text, encoding='utf-8')

          application = Path('apps/web-portal/app/customers/applications/[id]/page.tsx')
          text = application.read_text(encoding='utf-8')
          pattern = re.compile(r'''    <section className="overflow-hidden rounded-2xl border border-\[#DCE5EF\] bg-white shadow-sm">\n      <div className="flex flex-wrap items-start justify-between.*?\n      <div className="grid gap-px bg-\[#E2E8F0\] sm:grid-cols-4">.*?</div>\n    </section>''', re.S)
          replacement = '''    <section className="overflow-hidden rounded-2xl border border-[#DCE5EF] bg-gradient-to-r from-[#071D49] via-[#0F2A55] to-[#163B70] px-4 py-3 text-white shadow-sm">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="min-w-0"><Link href="/customers/applications" className="text-[9px] font-semibold text-white/65">← Back to applications</Link><div className="mt-1 flex flex-wrap items-baseline gap-x-3 gap-y-1"><h1 className="truncate text-lg font-semibold">{title}</h1><p className="text-[9.5px] text-white/65">Ref {id.slice(0,8).toUpperCase()} · Updated {new Date(application.updated_at).toLocaleDateString("en-IN")}</p></div></div>
        <div className="flex flex-wrap items-center gap-2"><Pill>{partnerLabel(application.partner_type)}</Pill><Pill tone="gold">{application.status.replaceAll("_"," ")}</Pill><span className="rounded-full border border-white/20 bg-white/10 px-2.5 py-1 text-[9px] font-semibold text-white/85">{previews.length} documents</span><span className="rounded-full border border-white/20 bg-white/10 px-2.5 py-1 text-[9px] font-semibold text-white/85">{canReview?"Editable":"Read only"}</span></div>
      </div>
    </section>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Application header replacement count was {count}')
          application.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/compact-customer-application-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal
          git commit -m "Compact customer toolbar and application header"
          git push origin HEAD:main
