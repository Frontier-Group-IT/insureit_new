name: Publish self-managed stage navigation preview OTA

on:
  push:
    branches:
      - feat/self-managed-stage-navigation
    paths:
      - '.github/workflows/tmp-publish-self-managed-stage-navigation-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out feature branch source
        uses: actions/checkout@v4
        with:
          ref: feat/self-managed-stage-navigation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Expo preview OTA
        working-directory: apps/mobile-app
        run: npx eas-cli update --channel preview --environment preview --message "Self-managed claim stage navigation" --non-interactive

      - name: Remove temporary OTA workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha=$(gh api repos/${{ github.repository }}/contents/.github/workflows/tmp-publish-self-managed-stage-navigation-preview.yml?ref=feat/self-managed-stage-navigation --jq .sha)
          gh api --method DELETE repos/${{ github.repository }}/contents/.github/workflows/tmp-publish-self-managed-stage-navigation-preview.yml \
            -f message='Remove temporary self-managed stage navigation preview OTA workflow' \
            -f sha="$sha" \
            -f branch='feat/self-managed-stage-navigation'
