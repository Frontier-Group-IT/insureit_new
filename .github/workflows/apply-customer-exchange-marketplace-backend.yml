name: Apply Customer Exchange marketplace backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20261006183000_customer_exchange_marketplace_backend.sql'
      - 'supabase/migrations/20261006184500_customer_exchange_backend_hardening.sql'
      - '.github/workflows/apply-customer-exchange-marketplace-backend.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Exchange marketplace backend
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20261006183000_customer_exchange_marketplace_backend.sql
          test -f supabase/migrations/20261006184500_customer_exchange_backend_hardening.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Exchange migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20261006183000'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20261006183000_customer_exchange_marketplace_backend.sql
            supabase migration repair --linked --status applied 20261006183000
          fi

      - name: Ensure Exchange hardening migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20261006184500'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Hardening migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20261006184500_customer_exchange_backend_hardening.sql
            supabase migration repair --linked --status applied 20261006184500
          fi

      - name: Verify Exchange security and workflow contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regclass('public.exchange_listings') is not null as listings_ready,
              to_regclass('public.exchange_bids') is not null as bids_ready,
              to_regclass('public.exchange_favorites') is not null as favorites_ready,
              to_regclass('public.exchange_contact_requests') is not null as contact_ready,
              to_regclass('public.exchange_deals') is not null as deals_ready,
              to_regclass('public.exchange_events') is not null as events_ready,
              to_regprocedure('public.exchange_marketplace_feed(text,text,integer,integer)') is not null as feed_rpc_ready,
              to_regprocedure('public.exchange_upsert_listing_draft(uuid,uuid,uuid,text,text,bigint,numeric,numeric,numeric,integer,integer,text,text,jsonb,jsonb)') is not null as draft_rpc_ready,
              to_regprocedure('public.exchange_place_bid(uuid,uuid,numeric)') is not null as bid_rpc_ready,
              to_regprocedure('public.exchange_request_contact(uuid,uuid,text,text)') is not null as contact_rpc_ready,
              to_regprocedure('public.exchange_accept_leading_bid(uuid)') is not null as deal_rpc_ready,
              exists(select 1 from storage.buckets where id='exchange-media' and public=false) as private_media_bucket,
              (select relrowsecurity from pg_class where oid='public.exchange_listings'::regclass) as listings_rls,
              (select relrowsecurity from pg_class where oid='public.exchange_bids'::regclass) as bids_rls,
              not has_table_privilege('authenticated','public.exchange_listings','SELECT') as no_direct_listing_select,
              not has_table_privilege('authenticated','public.exchange_bids','SELECT') as no_direct_bid_select,
              exists(
                select 1
                from pg_indexes
                where schemaname='public'
                  and indexname='exchange_one_active_listing_per_vehicle_idx'
                  and indexdef ilike '%draft%'
              ) as single_draft_guard,
              position(
                'v_listing.seller_customer_id is distinct from p_customer_id'
                in pg_get_functiondef(
                  'public.exchange_upsert_listing_draft(uuid,uuid,uuid,text,text,bigint,numeric,numeric,numeric,integer,integer,text,text,jsonb,jsonb)'::regprocedure
                )
              ) > 0 as owner_scope_guard;
          ")
          echo "$result"
          for key in listings_ready bids_ready favorites_ready contact_ready deals_ready events_ready feed_rpc_ready draft_rpc_ready bid_rpc_ready contact_rpc_ready deal_rpc_ready private_media_bucket listings_rls bids_rls no_direct_listing_select no_direct_bid_select single_draft_guard owner_scope_guard; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true" || {
              echo "::error::Exchange verification failed for $key"
              exit 1
            }
          done
