name: Publish claim loading state preview OTA

on:
  push:
    branches:
      - fix/claim-document-delete-confirmation
    paths:
      - '.github/workflows/tmp-publish-claim-loading-state-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out feature branch source
        uses: actions/checkout@v4
        with:
          ref: fix/claim-document-delete-confirmation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Expo preview OTA
        working-directory: apps/mobile-app
        run: npx eas-cli update --channel preview --environment preview --message "Action-specific claim document loading states" --non-interactive

      - name: Remove temporary OTA workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha=$(gh api repos/${{ github.repository }}/contents/.github/workflows/tmp-publish-claim-loading-state-preview.yml?ref=fix/claim-document-delete-confirmation --jq .sha)
          gh api --method DELETE repos/${{ github.repository }}/contents/.github/workflows/tmp-publish-claim-loading-state-preview.yml \
            -f message='Remove temporary claim loading state preview OTA workflow' \
            -f sha="$sha" \
            -f branch='fix/claim-document-delete-confirmation'
