name: Finalize effective permission audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/finalize-effective-permission-audit.mjs"
      - ".github/workflows/finalize-effective-permission-audit.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finalize-effective-permission-audit.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal
          if git diff --cached --quiet; then
            echo "No final alignment changes required."
          else
            git commit -m "Finalize effective permission enforcement"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
