name: Publish Partner preview OTA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "Refusing Partner OTA: checkout is not current origin/main." >&2
            exit 1
          }

      - name: Validate Partner OTA linkage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const customer = require('./apps/mobile-app/app.json');
          const expo = app.expo || {};
          const projectId = expo?.extra?.eas?.projectId;
          const updateUrl = expo?.updates?.url;
          if (!projectId || !updateUrl) {
            console.error('Refusing Partner OTA: run EAS project linking/update configuration first.');
            process.exit(1);
          }
          if (projectId === customer?.expo?.extra?.eas?.projectId || updateUrl === customer?.expo?.updates?.url) {
            console.error('Refusing Partner OTA: Partner app cannot share Customer EAS/update identity.');
            process.exit(1);
          }
          const runtimePolicy = expo?.runtimeVersion?.policy;
          if (runtimePolicy !== 'appVersion') {
            console.error(`Refusing Partner OTA: expected appVersion runtime policy, found ${runtimePolicy ?? 'missing'}.`);
            process.exit(1);
          }
          console.log(`Partner runtime ${expo.version}; project ${projectId}`);
          NODE

      - name: Require Expo and Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Partner preview OTA
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "INSUREIT Partner preview from main ${GITHUB_SHA}" \
            --non-interactive \
            --json > partner-preview-update.json
          cat partner-preview-update.json

      - name: OTA summary
        if: always()
        shell: bash
        run: |
          {
            echo "## INSUREIT Partner preview OTA"
            echo
            echo "- Source: current \`main\` only"
            echo "- Channel: \`preview\`"
            echo "- Runtime policy: \`appVersion\`"
            echo "- Customer app project/update reuse: blocked"
          } >> "$GITHUB_STEP_SUMMARY"
