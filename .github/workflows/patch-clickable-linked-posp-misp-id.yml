name: Patch clickable linked POSP MISP ID

on:
  push:
    branches:
      - feature/clickable-linked-posp-misp-id-20260810

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clickable-linked-posp-misp-id-20260810
          fetch-depth: 0
      - name: Apply focused UI patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-portal/app/intermediaries/applications/[id]/page.tsx')
          text = path.read_text()

          old_stat = '        { icon: "link" as IconName, label: `${linkedType.toUpperCase()} ID`, value: linkedAccountId },'
          new_stat = '        { icon: "link" as IconName, label: `${linkedType.toUpperCase()} ID`, value: linkedAccountId, href: linked && linkedAccountId !== "Not Created" ? `/intermediaries/applications/${linked.id}` : undefined, showViewIcon: Boolean(linked && linkedAccountId !== "Not Created") },'
          if old_stat not in text:
              raise SystemExit('linked account stat target not found')
          text = text.replace(old_stat, new_stat, 1)

          old_header = 'function HeaderStat({ icon, label, value, href }: { icon: IconName; label: string; value: string; href?: string }) { return <div className="flex min-w-0 items-center gap-3 border-white/15 px-4 py-4 xl:border-r xl:last:border-r-0"><span className="grid h-9 w-9 shrink-0 place-items-center rounded-full border border-white/20 bg-white/10 text-white"><Icon name={icon} className="h-4 w-4" /></span><div className="min-w-0"><p className="text-[8px] font-semibold uppercase tracking-[.05em] text-white/60">{label}</p>{href ? <Link href={href} className="mt-1 block truncate text-[10.5px] font-semibold text-white underline-offset-2 transition hover:text-[#C7D2FE] hover:underline">{value}</Link> : <p className="mt-1 truncate text-[10.5px] font-semibold text-white">{value}</p>}</div></div>; }'
          new_header = '''function HeaderStat({ icon, label, value, href, showViewIcon = false }: { icon: IconName; label: string; value: string; href?: string; showViewIcon?: boolean }) {
            return <div className="flex min-w-0 items-center gap-3 border-white/15 px-4 py-4 xl:border-r xl:last:border-r-0"><span className="grid h-9 w-9 shrink-0 place-items-center rounded-full border border-white/20 bg-white/10 text-white"><Icon name={icon} className="h-4 w-4" /></span><div className="min-w-0"><p className="text-[8px] font-semibold uppercase tracking-[.05em] text-white/60">{label}</p>{href ? <Link href={href} className="mt-1 inline-flex max-w-full items-center gap-1.5 text-[10.5px] font-semibold text-white underline-offset-2 transition hover:text-[#C7D2FE] hover:underline"><span className="truncate">{value}</span>{showViewIcon ? <><EyeIcon /><span className="sr-only">View {label} application</span></> : null}</Link> : <p className="mt-1 truncate text-[10.5px] font-semibold text-white">{value}</p>}</div></div>;
          }'''
          if old_header not in text:
              raise SystemExit('HeaderStat target not found')
          text = text.replace(old_header, new_header, 1)

          path.write_text(text)
          PY
      - name: Commit app change and remove temporary workflow
        run: |
          git config user.name "antnish1"
          git config user.email "shahdolho@gmail.com"
          git rm .github/workflows/patch-clickable-linked-posp-misp-id.yml
          git add 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
          git commit -m "feat: link POSP MISP summary ID to application review"
          git push origin HEAD:feature/clickable-linked-posp-misp-id-20260810
