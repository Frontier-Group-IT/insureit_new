name: Apply Partner schemes migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260912121000_partner_schemes.sql'
      - '.github/workflows/apply-partner-schemes.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner schemes migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260912121000_partner_schemes.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Partner schemes migration
        run: supabase db query --linked --file supabase/migrations/20260912121000_partner_schemes.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260912121000

      - name: Verify Partner schemes schema and RPCs
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regclass('public.partner_schemes') is not null as schemes_table_ready,
              to_regclass('public.partner_scheme_assignments') is not null as assignments_table_ready,
              to_regprocedure('public.partner_web_schemes()') is not null as list_rpc_ready,
              to_regprocedure('public.partner_web_active_scheme()') is not null as active_rpc_ready,
              has_function_privilege('authenticated', 'public.partner_web_schemes()', 'EXECUTE') as list_authenticated_execute,
              has_function_privilege('authenticated', 'public.partner_web_active_scheme()', 'EXECUTE') as active_authenticated_execute
          ")
          echo "$result"
          echo "$result" | grep -Eq '"schemes_table_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"assignments_table_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"list_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"active_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"list_authenticated_execute"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"active_authenticated_execute"[[:space:]]*:[[:space:]]*true'
