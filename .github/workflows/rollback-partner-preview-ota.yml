name: Roll back Partner preview OTA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "Refusing Partner rollback: checkout is not current origin/main." >&2
            exit 1
          }

      - name: Validate Partner OTA linkage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const customer = require('./apps/mobile-app/app.json');
          const expo = app.expo || {};
          const projectId = expo?.extra?.eas?.projectId;
          const updateUrl = expo?.updates?.url;
          if (!projectId || !updateUrl) {
            console.error('Refusing Partner rollback: Partner EAS/update linkage is incomplete.');
            process.exit(1);
          }
          if (projectId === customer?.expo?.extra?.eas?.projectId || updateUrl === customer?.expo?.updates?.url) {
            console.error('Refusing Partner rollback: Partner app cannot share Customer EAS/update identity.');
            process.exit(1);
          }
          if (expo?.runtimeVersion?.policy !== 'appVersion' || expo?.version !== '0.1.0') {
            console.error('Refusing Partner rollback: expected frozen runtime/app version 0.1.0 with appVersion policy.');
            process.exit(1);
          }
          NODE

      - name: Require Partner Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN_PARTNER is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo token can access the linked Partner project
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Roll Partner preview back to embedded APK bundle
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update:roll-back-to-embedded \
            --channel preview \
            --runtime-version 0.1.0 \
            --platform all \
            --message "Emergency Partner preview rollback to embedded APK bundle" \
            --non-interactive \
            --json > partner-preview-rollback.json
          cat partner-preview-rollback.json

      - name: Rollback summary
        if: always()
        run: |
          {
            echo "## INSUREIT Partner preview rollback"
            echo
            echo '- Trigger: manual workflow dispatch only'
            echo '- Source: exact current main'
            echo '- Recovery target: embedded Partner APK bundle'
            echo '- Channel: preview'
            echo '- Runtime: 0.1.0'
            echo '- Customer app project/update reuse: blocked'
            echo '- Scope: Partner preview OTA only'
          } >> "$GITHUB_STEP_SUMMARY"
