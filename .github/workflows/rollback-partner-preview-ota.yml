name: Roll back Partner preview OTA

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rollback-partner-preview-ota.yml'

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo access
        working-directory: apps/partner-app
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Republish last known-good Partner preview update
        working-directory: apps/partner-app
        run: |
          set -euo pipefail
          npx eas-cli update:republish \
            --group f26dfd53-f135-4642-862e-63fc03b5ed21 \
            --message "Emergency Partner preview rollback to last known-good update" \
            --non-interactive \
            --json > partner-preview-rollback.json
          cat partner-preview-rollback.json

      - name: Rollback summary
        if: always()
        run: |
          {
            echo "## INSUREIT Partner preview rollback"
            echo
            echo '- Restored update group: f26dfd53-f135-4642-862e-63fc03b5ed21'
            echo '- Known-good source commit: e764653cb951e9c79ec6fb1cac0f378ee88d3dfc'
            echo '- Scope: Partner preview OTA only'
          } >> "$GITHUB_STEP_SUMMARY"
