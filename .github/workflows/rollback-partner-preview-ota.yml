name: Roll back Partner preview OTA

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rollback-partner-preview-ota.yml'

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo access
        working-directory: apps/partner-app
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Roll Partner preview back to embedded APK bundle
        working-directory: apps/partner-app
        run: |
          set -euo pipefail
          npx eas-cli update:roll-back-to-embedded \
            --channel preview \
            --runtime-version 0.1.0 \
            --platform all \
            --message "Emergency Partner preview rollback to embedded APK bundle" \
            --non-interactive \
            --json > partner-preview-rollback.json
          cat partner-preview-rollback.json

      - name: Rollback summary
        if: always()
        run: |
          {
            echo "## INSUREIT Partner preview rollback"
            echo
            echo '- Recovery target: embedded Partner APK bundle'
            echo '- Channel: preview'
            echo '- Runtime: 0.1.0'
            echo '- Scope: Partner preview OTA only'
          } >> "$GITHUB_STEP_SUMMARY"
