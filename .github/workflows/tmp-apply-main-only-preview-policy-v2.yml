name: Temporary apply main-only preview policy v2

on:
  push:
    branches:
      - chore/main-only-expo-preview-ota-v2
    paths:
      - '.github/workflows/tmp-apply-main-only-preview-policy-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out policy branch
        uses: actions/checkout@v4
        with:
          ref: chore/main-only-expo-preview-ota-v2
          fetch-depth: 0

      - name: Apply policy files
        run: python scripts/apply-main-only-preview-policy.py

      - name: Commit policy changes
        run: |
          git config user.name "antnish1"
          git config user.email "shahdolho@gmail.com"
          git add .github/workflows/publish-mobile-preview-ota.yml AGENTS.md docs/CURRENT_CHAT_HANDOFF.md
          git commit -m "Enforce main-only Expo preview OTA publishing"

      - name: Remove temporary helper files
        run: |
          git rm .github/workflows/tmp-apply-main-only-preview-policy-v2.yml scripts/apply-main-only-preview-policy.py
          git commit -m "chore: remove temporary Expo preview policy helpers"
          git push origin HEAD:chore/main-only-expo-preview-ota-v2
