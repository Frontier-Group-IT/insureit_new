name: Apply iCall training environment migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260914130000_icall_training_environment.sql'
      - '.github/workflows/apply-icall-training-environment.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply iCall training environment migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260914130000_icall_training_environment.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply iCall training environment migration
        run: supabase db query --linked --file supabase/migrations/20260914130000_icall_training_environment.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260914130000

      - name: Verify iCall training environment schema
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              exists (
                select 1
                from information_schema.columns
                where table_schema = 'public'
                  and table_name = 'intermediary_training_exam_assignments'
                  and column_name = 'icall_environment'
              ) as column_ready,
              exists (
                select 1
                from pg_constraint c
                join pg_class t on t.oid = c.conrelid
                join pg_namespace n on n.oid = t.relnamespace
                where n.nspname = 'public'
                  and t.relname = 'intermediary_training_exam_assignments'
                  and c.conname = 'intermediary_training_exam_assignments_icall_environment_check'
              ) as constraint_ready,
              not exists (
                select 1
                from public.intermediary_training_exam_assignments
                where icall_login_id is not null
                  and icall_environment is null
              ) as linked_rows_tagged
          ")
          echo "$result"
          echo "$result" | grep -Eq '"column_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"constraint_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"linked_rows_tagged"[[:space:]]*:[[:space:]]*true'
