name: Apply IIB postback fix

on:
  push:
    branches: [fix/iib-postback-result-and-header]
    paths:
      - ".github/workflows/apply-iib-postback-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iib-postback-result-and-header
      - name: Patch content script and manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/pan-verification-extension/content.js')
          text = path.read_text()
          old = '''    const runtime = await send({ type: "GET_RUNTIME" });
    const startAttempt = runtime?.currentJobId === job.id ? Number(runtime.currentAttempt || 0) + 1 : 1;
'''
          new = '''    const runtime = await send({ type: "GET_RUNTIME" });
    const resumedResult = recoverPostbackResult(job, pan, runtime);
    if (resumedResult === "matched") return finishJob(job, "matched", "Matching Record Found In DataBase", "");
    if (resumedResult === "not_found") return finishJob(job, "not_found", "No Data Found In POS System", "");
    const startAttempt = runtime?.currentJobId === job.id ? Number(runtime.currentAttempt || 0) + 1 : 1;
'''
          if old not in text:
              raise SystemExit('processJob anchor not found')
          text = text.replace(old, new, 1)
          anchor = '''  async function waitForFreshResult({ baseline, pan, submittedAt, timeoutMs }) {
'''
          helper = '''  function recoverPostbackResult(job, pan, runtime) {
    if (runtime?.currentJobId !== job.id || Number(runtime.currentAttempt || 0) < 1) return null;
    const currentPan = String(find(SELECTORS.panInput)?.value || "").replace(/\\s/g, "").toUpperCase();
    if (currentPan !== pan) return null;
    const current = resultSignature();
    if (current.matched) return "matched";
    if (current.notFound) return "not_found";
    return null;
  }

'''
          if anchor not in text:
              raise SystemExit('helper anchor not found')
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)

          manifest = Path('tools/pan-verification-extension/manifest.json')
          manifest_text = manifest.read_text().replace('"version": "1.2.0"', '"version": "1.2.1"', 1)
          manifest.write_text(manifest_text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pan-verification-extension/content.js tools/pan-verification-extension/manifest.json
          git commit -m "Recover IIB results after ASP.NET postback"
          git push
