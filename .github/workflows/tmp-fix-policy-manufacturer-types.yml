name: Temporary policy manufacturer TypeScript fix

on:
  push:
    branches:
      - agent/policy-onboarding-manufacturer-dropdown
    paths:
      - scripts/tmp-fix-policy-manufacturer-types.py
      - .github/workflows/tmp-fix-policy-manufacturer-types.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/policy-onboarding-manufacturer-dropdown
          fetch-depth: 0
      - name: Apply targeted TypeScript fix
        run: python scripts/tmp-fix-policy-manufacturer-types.py
      - name: Commit TypeScript fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/policies/new/page.tsx apps/web-portal/components/policy-unified-form.tsx
          git diff --cached --quiet && { echo "No patch changes produced"; exit 1; }
          git commit -m "Fix policy manufacturer dropdown types"
          git push origin HEAD:agent/policy-onboarding-manufacturer-dropdown
