name: Deploy Cloudflare production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy main to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Build Cloudflare production
        run: bash scripts/build-cloudflare-production.sh

      - name: Deploy Cloudflare production Worker
        run: bash scripts/deploy-cloudflare-production.sh

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Cloudflare production deployment"
            echo "- Source branch: `main`"
            echo "- Commit: `${{ github.sha }}`"
            echo "- Worker: `insureit-new`"
            echo "- Trigger: push to main (including merged PRs) or explicit manual production dispatch"
            echo "- Preview/PR deployment: disabled in this workflow"
            echo "- Runtime variables: preserved with `--keep-vars`"
            echo "- Vercel / portal.insureit.in: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
