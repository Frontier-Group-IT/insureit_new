name: Deploy Cloudflare production

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Build and deploy main to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Resolve production commit
        id: production
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.production.outputs.sha }}

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Build Cloudflare production
        run: ./scripts/build-cloudflare-production.sh

      - name: Deploy Cloudflare production Worker
        run: ./scripts/deploy-cloudflare-production.sh

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Cloudflare production deployment"
            echo "- Source branch: `main`"
            echo "- Commit: `${{ steps.production.outputs.sha }}`"
            echo "- Worker: `insureit-new`"
            echo "- Trigger: merged PR to main or explicit manual production dispatch"
            echo "- Preview/PR deployment: disabled in this workflow"
            echo "- Runtime variables: preserved with `--keep-vars`"
            echo "- Vercel / portal.insureit.in: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
