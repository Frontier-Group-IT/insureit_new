name: Apply Partner policy-cohort commission migration

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260909152500_partner_business_policy_cohort_commission.sql'
      - 'supabase/verification/20260909152500_partner_business_policy_cohort_commission_verify.sql'
      - '.github/workflows/apply-partner-policy-cohort-commission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '#1537')
    name: Apply Partner policy-cohort commission migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out exact release snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "::error::Refusing migration: checkout is not current origin/main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is missing."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD is missing."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF is missing."; exit 1; }
          test -f supabase/migrations/20260909152500_partner_business_policy_cohort_commission.sql
          test -f supabase/verification/20260909152500_partner_business_policy_cohort_commission_verify.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply only Partner policy-cohort commission migration
        run: supabase db query --linked --file supabase/migrations/20260909152500_partner_business_policy_cohort_commission.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260909152500

      - name: Verify contract and grants
        run: supabase db query --linked --file supabase/verification/20260909152500_partner_business_policy_cohort_commission_verify.sql

      - name: Enforce verification booleans
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            with fn as (
              select pg_get_functiondef(to_regprocedure('public.partner_app_business_range(date,date)')) as definition
            )
            select
              to_regprocedure('public.partner_app_business_range(date,date)') is not null as function_exists,
              has_function_privilege('authenticated', 'public.partner_app_business_range(date,date)', 'EXECUTE') as authenticated_can_execute,
              has_function_privilege('anon', 'public.partner_app_business_range(date,date)', 'EXECUTE') as anon_can_execute,
              position('range_policy_cohort' in definition) > 0 as shared_policy_cohort_present,
              position('join range_policy_cohort rpc on rpc.id=pip.policy_id' in definition) > 0 as payout_joins_policy_cohort,
              position('commission_earned' in definition) > 0 as commission_field_present
            from fn
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_exists"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"authenticated_can_execute"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"anon_can_execute"[[:space:]]*:[[:space:]]*false'
          echo "$result" | grep -Eq '"shared_policy_cohort_present"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"payout_joins_policy_cohort"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"commission_field_present"[[:space:]]*:[[:space:]]*true'

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Partner policy-cohort commission migration'
            echo
            echo '- Source: exact current `main`'
            echo '- Migration: `20260909152500_partner_business_policy_cohort_commission.sql` only'
            echo '- Commission invariant: payout rows joined by `policy_id` to the same sold-policy cohort'
            echo '- Native/mobile build: not involved'
          } >> "$GITHUB_STEP_SUMMARY"
