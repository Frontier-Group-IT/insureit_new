name: One-time PostCSS Sharp lock repair PR 2973

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'package.json'
      - '.github/workflows/assurance-postcss-sharp-lock-pr2973.yml'

permissions:
  contents: write

jobs:
  repair-lock:
    if: >-
      github.event.pull_request.number == 2973 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/stage2-postcss-sharp-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/stage2-postcss-sharp-20261008
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Recalculate npm lockfile and deduplicate
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm dedupe --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate all PostCSS and Sharp entries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pkg=require('./package-lock.json').packages;
          let post=0, sharp=0;
          for(const [path,meta] of Object.entries(pkg)) {
            if(/(^|\/)node_modules\/postcss$/.test(path)) {
              post++;
              if(meta.version!=='8.5.24') throw Error('Unpatched PostCSS '+path+' '+meta.version);
            }
            if(/(^|\/)node_modules\/sharp$/.test(path)) {
              sharp++;
              if(meta.version!=='0.35.5') throw Error('Unpatched Sharp '+path+' '+meta.version);
            }
          }
          if(post===0||sharp===0) throw Error('Missing target package resolution');
          console.log('PostCSS entries:',post,'Sharp entries:',sharp);
          NODE
          npm ci --no-audit --no-fund
          npm ls --all > /tmp/tree.txt
          cd apps/web-portal
          node scripts/postcss-sharp-patched-regression.mjs
      - name: Commit only exact generated lockfile on review branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'security: lock compatible PostCSS and Sharp versions' --only package-lock.json
          git push origin HEAD:refs/heads/security/stage2-postcss-sharp-20261008
