name: Apply RC helper text UI removal

on:
  push:
    branches:
      - agent/remove-unregistered-rc-helper-text
    paths:
      - '.github/workflows/tmp-remove-unregistered-rc-helper.yml'

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-unregistered-rc-helper-text
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove unregistered RC helper text only
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web-portal/components/policy-unified-form.tsx')
          s = p.read_text()
          old = '{vehicleRegistrationMode==="unregistered"?<p className="mt-1 text-[8.5px] font-semibold text-[#315B9A]">RC lookup will be available after permanent registration is issued.</p>:lookupError?<p className="mt-1 text-[8.5px] font-semibold text-red-600">{lookupError}</p>:null}'
          new = '{lookupError?<p className="mt-1 text-[8.5px] font-semibold text-red-600">{lookupError}</p>:null}'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one helper block, found {count}; refusing unrelated changes.')
          p.write_text(s.replace(old, new, 1))
      - name: Commit UI-only change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-remove-unregistered-rc-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx .github/workflows/tmp-remove-unregistered-rc-helper.yml
          git diff --cached --check
          git commit -m "Remove unregistered RC helper text"
          git push origin HEAD:agent/remove-unregistered-rc-helper-text
