name: Temporary move policy class to row one

on:
  push:
    paths:
      - scripts/temp_move_policy_class_to_row1.py
      - .github/workflows/temp-move-policy-class-to-row1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Section 02 class layout patch
        run: python scripts/temp_move_policy_class_to_row1.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -q '>Class <Required/>' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'vehicleMeta.description' apps/web-portal/components/policy-unified-form.tsx
          grep -q '<label className={labelClass}>RTO</label>' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'label="Class of vehicle"' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Move policy vehicle class back to identity row"
            git pull --rebase origin main
            git push origin main
          fi
