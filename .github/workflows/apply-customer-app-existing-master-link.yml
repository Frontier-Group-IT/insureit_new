name: Apply customer app existing master link

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260926130000_customer_app_existing_master_link.sql'
      - '.github/workflows/apply-customer-app-existing-master-link.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply customer app existing master link
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260926130000_customer_app_existing_master_link.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260926130000'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260926130000_customer_app_existing_master_link.sql
            supabase migration repair --linked --status applied 20260926130000
          fi

      - name: Verify customer app identity-link contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            with same_identity_duplicates as (
              select
                public.customer_login_mobile_key(phone) as phone_key,
                public.customer_login_name_key(coalesce(nullif(company_name,''), nullif(contact_name,''))) as name_key,
                count(*) as row_count
              from public.customers
              where public.customer_login_mobile_key(phone) is not null
                and public.customer_login_name_key(coalesce(nullif(company_name,''), nullif(contact_name,''))) is not null
              group by 1,2
              having count(*) > 1
            )
            select
              to_regprocedure('public.ensure_customer_signup_profile(text,text,text)') is not null as signup_rpc_ready,
              to_regprocedure('public.customer_login_mobile_key(text)') is not null as mobile_key_ready,
              to_regprocedure('public.customer_login_name_key(text)') is not null as name_key_ready,
              position('v_verified_phone' in pg_get_functiondef('public.ensure_customer_signup_profile(text,text,text)'::regprocedure)) > 0 as verified_phone_guard,
              position('Multiple customer records match this verified mobile and customer name' in pg_get_functiondef('public.ensure_customer_signup_profile(text,text,text)'::regprocedure)) > 0 as ambiguity_guard,
              position('link_customer_app_profile_to_existing_master' in pg_get_functiondef('public.ensure_customer_signup_profile(text,text,text)'::regprocedure)) > 0 as audit_guard,
              not exists (
                select 1
                from public.customers c
                join public.customer_memberships cm on cm.customer_id=c.id and cm.status='active'
                where c.profile_id is distinct from cm.profile_id
                  and c.creation_channel='direct_customer_onboarding'
                  and public.customer_login_mobile_key(c.phone)=public.customer_login_mobile_key(cm.invited_phone)
              ) as no_direct_profile_membership_split,
              not exists (
                select 1
                from public.customers signup
                join public.customers existing
                  on existing.id<>signup.id
                 and public.customer_login_mobile_key(existing.phone)=public.customer_login_mobile_key(signup.phone)
                 and public.customer_login_name_key(coalesce(nullif(existing.company_name,''),nullif(existing.contact_name,'')))=
                     public.customer_login_name_key(coalesce(nullif(signup.company_name,''),nullif(signup.contact_name,'')))
                where signup.creation_channel='direct_customer_onboarding'
                  and signup.profile_id is not null
                  and existing.profile_id is null
                  and existing.creation_channel is distinct from 'direct_customer_onboarding'
              ) as no_repairable_signup_duplicates;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"signup_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"mobile_key_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"name_key_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"verified_phone_guard"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"ambiguity_guard"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"audit_guard"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"no_direct_profile_membership_split"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"no_repairable_signup_duplicates"[[:space:]]*:[[:space:]]*true'
