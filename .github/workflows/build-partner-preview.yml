name: Build Partner preview APK

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type BUILD_PARTNER_0_2_0 after explicit user approval for this exact native build'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
    steps:
      - name: Require explicit Phase 6 build approval
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ inputs.approval }}" = "BUILD_PARTNER_0_2_0" ] || {
            echo "Refusing Partner native build: explicit BUILD_PARTNER_0_2_0 approval token was not supplied." >&2
            exit 1
          }

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "Refusing Partner preview build: checkout is not current origin/main." >&2
            exit 1
          }

      - name: Validate Partner 0.2.0 EAS linkage and native identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const app = require('./apps/partner-app/app.json');
          const customer = require('./apps/mobile-app/app.json');
          const expo = app.expo || {};
          const projectId = expo?.extra?.eas?.projectId;
          if (!projectId) throw new Error('Partner app is not linked to a dedicated EAS project.');
          if (projectId === customer?.expo?.extra?.eas?.projectId) throw new Error('Partner app cannot share the Customer EAS project ID.');
          if (expo.android?.package !== 'com.insureit.partner' || expo.ios?.bundleIdentifier !== 'com.insureit.partner') throw new Error('Unexpected Partner native package identity.');
          if (expo.android?.package === customer?.expo?.android?.package || expo.ios?.bundleIdentifier === customer?.expo?.ios?.bundleIdentifier) throw new Error('Partner native identity overlaps Customer app.');
          if (expo.version !== '0.2.0' || expo.android?.versionCode !== 2 || expo.ios?.buildNumber !== '2') throw new Error('Partner native build must use the reviewed 0.2.0 / versionCode 2 / buildNumber 2 baseline.');
          if (expo.runtimeVersion?.policy !== 'appVersion') throw new Error('Partner runtime policy must remain appVersion for this build.');
          if (!fs.existsSync('./apps/partner-app/assets/notification-icon.png')) throw new Error('Official Android notification icon asset is missing; native build remains blocked.');
          console.log(`Partner EAS project: ${projectId}`);
          NODE

      - name: Require Expo and Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Partner app
        run: |
          npm --workspace apps/partner-app run verify:phase6
          npm run typecheck:partner
          npm run lint:partner

      - name: Verify Expo token can access the linked Partner project
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Build internal Android APK
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli build --platform android --profile preview --non-interactive --json > partner-preview-build.json
          cat partner-preview-build.json

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## INSUREIT Partner 0.2.0 preview build"
            echo
            echo "- Source: current \`main\` only"
            echo "- Explicit approval token: required"
            echo "- Android package: \`com.insureit.partner\`"
            echo "- Version/runtime: \`0.2.0\` / appVersion"
            echo "- EAS profile: \`preview\`"
            echo "- Distribution: internal APK"
            echo "- Official notification icon: required before build"
            echo "- Customer app identity reuse: blocked"
          } >> "$GITHUB_STEP_SUMMARY"
