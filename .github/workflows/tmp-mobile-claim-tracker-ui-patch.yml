name: Temporary mobile claim tracker UI patch

on:
  push:
    branches:
      - ui/mobile-internal-claim-tracker-layout
    paths:
      - '.github/workflows/tmp-mobile-claim-tracker-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mobile-internal-claim-tracker-layout
          fetch-depth: 0
      - name: Apply UI-only claim tracker presentation changes
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/mobile-app/app/customer/claim-detail.tsx')
          text = path.read_text()
          replacements = {
              'if (loading) return <Screen title="Claim Detail"><LoadingState /></Screen>;': 'if (loading) return <Screen title="Claim Tracker"><LoadingState /></Screen>;',
              'if (!claim) return <Screen title="Claim Detail"><EmptyState title="Claim not found" body="Please choose another claim from your list." /></Screen>;': 'if (!claim) return <Screen title="Claim Tracker"><EmptyState title="Claim not found" body="Please choose another claim from your list." /></Screen>;',
              'const compactClaimIntimation = selfManaged;': 'const compactClaimIntimation = true;',
              '<Screen title="Claim Detail" showLogout showTitleHeader={false}>': '<Screen title="Claim Tracker" showLogout showTitleHeader={false}>',
              "<Text style={styles.pageEyebrow}>{selfManaged ? 'EXTERNAL CLAIM' : 'CLAIMS'}</Text>": '<Text style={styles.pageEyebrow}>CLAIMS</Text>',
              "<Text style={styles.pageTitle}>{selfManaged ? 'Claim Tracker' : 'Claim Detail'}</Text>": '<Text style={styles.pageTitle}>Claim Tracker</Text>',
              "          {!selfManaged ? <Text style={styles.pageSubtitle}>{internalProjection.customerMessage}</Text> : null}\n": '',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected source fragment: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-mobile-claim-tracker-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/claim-detail.tsx .github/workflows/tmp-mobile-claim-tracker-ui-patch.yml
          git commit -m "Unify mobile claim tracker presentation"
          git push origin HEAD:ui/mobile-internal-claim-tracker-layout
