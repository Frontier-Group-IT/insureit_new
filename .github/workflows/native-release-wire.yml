name: Native release wire

on:
  push:
    branches:
      - feat/customer-native-release-readiness
    paths:
      - '.github/workflows/native-release-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-native-release-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Synchronize dependency lockfile
        run: npm install --no-audit --no-fund
      - name: Wire native media changes
        run: node scripts/wire-native-release.mjs
      - name: Remove one-time wiring files
        run: rm scripts/wire-native-release.mjs .github/workflows/native-release-wire.yml
      - name: Commit wired release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/mobile-app/app/customer/self-managed-claim.tsx scripts/wire-native-release.mjs .github/workflows/native-release-wire.yml
          git commit -m "Wire incident voice notes and sync native dependencies"
          git push origin HEAD:feat/customer-native-release-readiness
