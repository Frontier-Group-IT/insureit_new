name: Temporary shared registration validation patch

on:
  push:
    branches:
      - fix/shared-policy-registration-validation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-policy-registration-validation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared vehicle registration validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shared = Path('apps/web-portal/lib/vehicle-registration.ts')
          shared.write_text('''const STANDARD_REGISTRATION_PATTERN = /^[A-Z]{2}[A-Z0-9]*[0-9]{2}$/;\nconst BH_REGISTRATION_PATTERN = /^\\d{2}BH\\d{4}[A-HJ-NP-Z]{1,2}$/;\n\nexport function normalizeVehicleRegistration(value: string) {\n  return value.toUpperCase().replace(/[^A-Z0-9]/g, "");\n}\n\nexport function isValidRegisteredVehicleNumber(value: string) {\n  const normalized = normalizeVehicleRegistration(value);\n  return STANDARD_REGISTRATION_PATTERN.test(normalized) || BH_REGISTRATION_PATTERN.test(normalized);\n}\n''')

          form_path = Path('apps/web-portal/components/policy-unified-form.tsx')
          form = form_path.read_text()
          import_anchor = 'import { buildPolicyOcrOnboardingUpdate } from "@/lib/policy-ocr-onboarding-apply";\n'
          shared_import = 'import { isValidRegisteredVehicleNumber, normalizeVehicleRegistration } from "@/lib/vehicle-registration";\n'
          if shared_import not in form:
              if import_anchor not in form:
                  raise SystemExit('Policy form import anchor not found')
              form = form.replace(import_anchor, import_anchor + shared_import, 1)
          old_helpers = 'function normalizeRegistrationInput(value:string){return value.toUpperCase().replace(/[^A-Z0-9]/g,"");}\nfunction isValidRegisteredVehicleNumber(value:string){const normalized=normalizeRegistrationInput(value);const standard=/^[A-Z]{2}[A-Z0-9]*[0-9]{2}$/.test(normalized);const bharatSeries=/^\\d{2}BH\\d{4}[A-HJ-NP-Z]{1,2}$/.test(normalized);return standard||bharatSeries;}\n'
          if old_helpers not in form:
              raise SystemExit('Expected local policy registration helpers not found')
          form = form.replace(old_helpers, '', 1)
          form = form.replace('normalizeRegistrationInput(', 'normalizeVehicleRegistration(')
          form_path.write_text(form)

          save_path = Path('apps/web-portal/components/policy-save-confirmation.tsx')
          save = save_path.read_text()
          save_import_anchor = 'import { uploadPolicyCopy } from "@/app/policies/policy-document-actions";\n'
          save_shared_import = 'import { isValidRegisteredVehicleNumber } from "@/lib/vehicle-registration";\n'
          if save_shared_import not in save:
              if save_import_anchor not in save:
                  raise SystemExit('Policy save import anchor not found')
              save = save.replace(save_import_anchor, save_import_anchor + save_shared_import, 1)
          old_pattern = 'const registrationPattern = /^[A-Z]{2}[A-Z0-9]*[0-9]{2}$/;\n'
          if old_pattern not in save:
              raise SystemExit('Expected duplicate policy save registration pattern not found')
          save = save.replace(old_pattern, '', 1)
          old_check = '!registrationPattern.test(registrationInput.value.trim().toUpperCase())'
          if old_check not in save:
              raise SystemExit('Expected duplicate policy save registration check not found')
          save = save.replace(old_check, '!isValidRegisteredVehicleNumber(registrationInput.value)', 1)
          save_path.write_text(save)

          regression_path = Path('apps/web-portal/scripts/vehicle-registration-validation-regression.mjs')
          regression_path.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n\nconst shared = readFileSync("lib/vehicle-registration.ts", "utf8");\nconst form = readFileSync("components/policy-unified-form.tsx", "utf8");\nconst confirmation = readFileSync("components/policy-save-confirmation.tsx", "utf8");\n\nassert.match(shared, /STANDARD_REGISTRATION_PATTERN/);\nassert.match(shared, /BH_REGISTRATION_PATTERN/);\nassert.match(shared, /\\^\\\\d\\{2\\}BH\\\\d\\{4\\}\\[A-HJ-NP-Z\\]\\{1,2\\}\\$\\//);\nassert.match(form, /from "@\\/lib\\/vehicle-registration"/);\nassert.match(confirmation, /from "@\\/lib\\/vehicle-registration"/);\nassert.match(confirmation, /isValidRegisteredVehicleNumber\\(registrationInput\\.value\\)/);\nassert.doesNotMatch(confirmation, /const registrationPattern =/);\n\nconst normalize = (value) => value.toUpperCase().replace(/[^A-Z0-9]/g, "");\nconst standard = /^[A-Z]{2}[A-Z0-9]*[0-9]{2}$/;\nconst bh = /^\\d{2}BH\\d{4}[A-HJ-NP-Z]{1,2}$/;\nconst valid = (value) => standard.test(normalize(value)) || bh.test(normalize(value));\n\nfor (const value of ["24BH3275H", "24BH3275AB", "24 BH 3275 H", "MP20AB1234"]) assert.equal(valid(value), true, value);\nfor (const value of ["24BH327H", "24BH3275I", "24BH3275O", "BH243275H", "1234"]) assert.equal(valid(value), false, value);\n\nconsole.log("Vehicle registration shared validation regression: passed.");\n''')

          package_path = Path('apps/web-portal/package.json')
          package_text = package_path.read_text()
          needle = '    "vehicle-prefix:new-regression": "node scripts/new-vehicle-prefix-regression.mjs",\n'
          addition = '    "vehicle-registration:validation-regression": "node scripts/vehicle-registration-validation-regression.mjs",\n'
          if addition not in package_text:
              if needle not in package_text:
                  raise SystemExit('package.json vehicle regression anchor not found')
              package_text = package_text.replace(needle, needle + addition, 1)
          package_path.write_text(package_text)

          workflow_path = Path('.github/workflows/verify-web-portal.yml')
          workflow = workflow_path.read_text()
          step_anchor = '      - name: Canonical NEW vehicle prefix regression\n        run: npm run vehicle-prefix:new-regression\n\n'
          new_step = '      - name: Shared vehicle registration validation regression\n        run: npm run vehicle-registration:validation-regression\n\n'
          if new_step not in workflow:
              if step_anchor not in workflow:
                  raise SystemExit('Verification workflow anchor not found')
              workflow = workflow.replace(step_anchor, step_anchor + new_step, 1)
          workflow_path.write_text(workflow)
          PY
      - name: Run focused registration regression
        working-directory: apps/web-portal
        run: npm run vehicle-registration:validation-regression
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-shared-registration-validation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/lib/vehicle-registration.ts apps/web-portal/components/policy-unified-form.tsx apps/web-portal/components/policy-save-confirmation.tsx apps/web-portal/scripts/vehicle-registration-validation-regression.mjs apps/web-portal/package.json .github/workflows/verify-web-portal.yml .github/workflows/tmp-shared-registration-validation-patch.yml
          git commit -m "Use shared vehicle registration validation"
          git push origin HEAD:fix/shared-policy-registration-validation
