name: Publish Partner 0.1.0 home hero compatibility OTA once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-partner-0-1-home-hero-compat-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
      COMPAT_SHA: 74039199991888777911deb30cf248e8f36cf8a8

    steps:
      - name: Check out last known good Partner 0.1.0 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPAT_SHA }}
          fetch-depth: 0

      - name: Verify exact compatibility source and runtime
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$COMPAT_SHA" ] || {
            echo "Refusing OTA: checkout is not the approved last-good Partner source." >&2
            exit 1
          }
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const expo = app.expo || {};
          if (expo.version !== '0.1.0') {
            console.error(`Refusing OTA: expected Partner runtime 0.1.0, found ${expo.version ?? 'missing'}.`);
            process.exit(1);
          }
          if (expo?.runtimeVersion?.policy !== 'appVersion') {
            console.error('Refusing OTA: expected appVersion runtime policy.');
            process.exit(1);
          }
          if (expo?.extra?.eas?.projectId !== '8ade82c1-4c96-4f09-b90b-802270fb406d') {
            console.error('Refusing OTA: unexpected Partner EAS project ID.');
            process.exit(1);
          }
          NODE

      - name: Apply hero-only reference alignment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/partner-app/app/(tabs)/index.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            ["hero: { height: 152, overflow: 'hidden', backgroundColor: '#054D9E', paddingTop: 9 }", "hero: { height: 204, overflow: 'hidden', backgroundColor: '#054D9E', paddingTop: 10 }"],
            ["heroTopRow: { zIndex: 2, flexDirection: 'row', alignItems: 'flex-start', justifyContent: 'space-between', paddingHorizontal: 14 }", "heroTopRow: { zIndex: 2, flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', paddingHorizontal: 18 }"],
            ["heroBrand: { flexDirection: 'row', alignItems: 'flex-start', gap: 7, maxWidth: '60%' }", "heroBrand: { flexDirection: 'row', alignItems: 'center', gap: 7, maxWidth: '64%' }"],
            ["heroLogo: { width: 33, height: 39, tintColor: '#FFFFFF' }", "heroLogo: { width: 46, height: 54 }"],
            ["heroBrandCopy: { paddingTop: 1 }", "heroBrandCopy: { paddingTop: 1 }"],
            ["heroIconButton: { width: 37, height: 37, borderRadius: 19, alignItems: 'center', justifyContent: 'center', backgroundColor: 'rgba(255,255,255,0.10)', borderWidth: StyleSheet.hairlineWidth, borderColor: 'rgba(255,255,255,0.26)' }", "heroIconButton: { width: 44, height: 44, borderRadius: 22, alignItems: 'center', justifyContent: 'center', backgroundColor: 'rgba(255,255,255,0.10)', borderWidth: StyleSheet.hairlineWidth, borderColor: 'rgba(255,255,255,0.34)' }"],
            ["heroAvatar: { width: 37, height: 37, borderRadius: 19, alignItems: 'center', justifyContent: 'center', backgroundColor: '#E9F1FF' }", "heroAvatar: { width: 44, height: 44, borderRadius: 22, alignItems: 'center', justifyContent: 'center', backgroundColor: '#E9F1FF' }"],
            ["heroGreeting: { zIndex: 2, position: 'absolute', left: 14, right: 92, bottom: 8 }", "heroGreeting: { zIndex: 2, position: 'absolute', left: 18, right: 92, bottom: 22 }"],
            ["heroGreetingText: { color: '#FFFFFF', fontSize: 15, lineHeight: 19, fontWeight: '500', letterSpacing: -0.05, textShadowColor: 'rgba(0,0,0,0.28)', textShadowOffset: { width: 0, height: 1 }, textShadowRadius: 3 }", "heroGreetingText: { color: '#FFFFFF', fontSize: 20, lineHeight: 25, fontWeight: '500', letterSpacing: -0.2, textShadowColor: 'rgba(0,0,0,0.24)', textShadowOffset: { width: 0, height: 1 }, textShadowRadius: 3 }"],
            ["body: { marginTop: -10, paddingHorizontal: 14 }", "body: { marginTop: -31, paddingHorizontal: 16 }"],
            ["searchShell: { minHeight: 48, flexDirection: 'row', alignItems: 'center', gap: 9, paddingHorizontal: 13, borderRadius: 16, backgroundColor: '#FFFFFF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#D8E4F2', shadowColor: '#173B6C', shadowOpacity: 0.08, shadowRadius: 14, shadowOffset: { width: 0, height: 5 }, elevation: 3 }", "searchShell: { minHeight: 64, flexDirection: 'row', alignItems: 'center', gap: 11, paddingHorizontal: 16, borderRadius: 18, backgroundColor: '#FFFFFF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#D8E4F2', shadowColor: '#173B6C', shadowOpacity: 0.08, shadowRadius: 14, shadowOffset: { width: 0, height: 5 }, elevation: 3 }"],
            ["searchInput: { flex: 1, minWidth: 0, paddingVertical: 11, color: partnerTheme.colors.ink, fontSize: 12, lineHeight: 17 }", "searchInput: { flex: 1, minWidth: 0, paddingVertical: 14, color: partnerTheme.colors.ink, fontSize: 14, lineHeight: 20 }"],
          ];
          for (const [before, after] of replacements) {
            if (!source.includes(before)) {
              console.error(`Refusing OTA: expected hero source fragment not found: ${before}`);
              process.exit(1);
            }
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
          grep -q "hero: { height: 204" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -q "body: { marginTop: -31" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -q "searchShell: { minHeight: 64" 'apps/partner-app/app/(tabs)/index.tsx'

      - name: Require Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN_PARTNER is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Partner app typecheck
        working-directory: apps/partner-app
        run: npx tsc --noEmit

      - name: Verify Expo token and project
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish Partner 0.1.0 hero OTA
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Partner 0.1.0 compact home hero from approved last-good source" \
            --non-interactive \
            --json > partner-0-1-home-hero-update.json
          cat partner-0-1-home-hero-update.json

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Partner 0.1.0 home hero compatibility OTA"
            echo
            echo "- Source baseline: $COMPAT_SHA"
            echo "- Channel: preview"
            echo "- Runtime: 0.1.0"
            echo "- Scope: home hero dimensions, greeting, actions and overlapping search only"
          } >> "$GITHUB_STEP_SUMMARY"
