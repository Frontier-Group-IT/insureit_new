name: Temporary refresh Policy Intake booking return
on:
  push:
    branches: [fix/policy-intake-book-return-queue-final]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/policy-intake-book-return-queue-final
      - name: Reapply queue redirect and regression guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          form = Path('apps/web-portal/components/policy-unified-form.tsx')
          text = form.read_text()
          old = 'if(sourceIntakeId){router.push(`/policy-intakes/${encodeURIComponent(sourceIntakeId)}?success=completed`);}else{'
          new = 'if(sourceIntakeId){router.push("/policy-intakes");}else{'
          if old not in text:
              raise SystemExit('Policy Intake completion redirect anchor not found')
          text = text.replace(old, new, 1)
          form.write_text(text)

          regression = Path('apps/web-portal/scripts/policy-intake-workflow-regression.mjs')
          text = regression.read_text()
          anchor = 'const commercialShell=read("components/policy-commercial-shell.tsx");assert(commercialShell.includes("PolicyIntakeOnboardingContextCard"),"Policy Onboarding must render the intake context for its footer action");\n'
          insert = anchor + '''const unifiedForm=read("components/policy-unified-form.tsx");\nassert(unifiedForm.includes('if(sourceIntakeId){router.push("/policy-intakes");}'),"Completed Policy Intake booking must return Operations to the Policy Intake Queue");\nassert(!unifiedForm.includes('router.push(`/policy-intakes/${encodeURIComponent(sourceIntakeId)}?success=completed`)'),"Completed Policy Intake booking must not return to the individual Intake Review page");\nassert(unifiedForm.includes('router.push(`/policy-intakes/${encodeURIComponent(sourceIntakeId)}`)'),"Save & Return to Intake must keep returning to the individual Intake Review page");\nassert(unifiedForm.includes('router.push(`/policies?success=policy_created&policy=${encodeURIComponent(result.policyCode)}&policy_id=${encodeURIComponent(result.policyId)}`)'),"Direct Policy Onboarding must keep returning to the Policy Register");\n'''
          if anchor not in text:
              raise SystemExit('Policy Intake regression anchor not found')
          text = text.replace(anchor, insert, 1)
          regression.write_text(text)
          PY
          cd apps/web-portal
          npm ci
          npm run policy-intake:workflow-regression
      - name: Commit refreshed fix
        shell: bash
        run: |
          rm .github/workflows/tmp-refresh-policy-intake-book-return-queue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx apps/web-portal/scripts/policy-intake-workflow-regression.mjs .github/workflows/tmp-refresh-policy-intake-book-return-queue.yml
          git commit -m "Return completed Policy Intake booking to queue"
          git push origin HEAD:fix/policy-intake-book-return-queue-final
