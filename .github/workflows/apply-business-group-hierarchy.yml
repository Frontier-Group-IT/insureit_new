name: Apply business Group hierarchy migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260914183000_business_group_partner_branch_hierarchy.sql'
      - 'supabase/migrations/20260914183100_business_group_hierarchy_rollback_rpc.sql'
      - 'supabase/migrations/20260914183200_business_group_partner_app_scope_compat.sql'
      - 'supabase/migrations/20260914183300_business_group_rpc_security.sql'
      - '.github/workflows/apply-business-group-hierarchy.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply business Group hierarchy migrations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          for file in \
            supabase/migrations/20260914183000_business_group_partner_branch_hierarchy.sql \
            supabase/migrations/20260914183100_business_group_hierarchy_rollback_rpc.sql \
            supabase/migrations/20260914183200_business_group_partner_app_scope_compat.sql \
            supabase/migrations/20260914183300_business_group_rpc_security.sql
          do
            test -f "$file"
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply hierarchy migrations in order
        shell: bash
        run: |
          set -euo pipefail

          apply_if_missing() {
            local version="$1"
            local file="$2"
            local present
            present=$(supabase db query --linked --output-format json "select exists (select 1 from supabase_migrations.schema_migrations where version = '$version') as applied;" | jq -r '.[0].applied')
            if [[ "$present" == "true" ]]; then
              echo "Migration $version already recorded; skipping."
              return 0
            fi

            echo "Applying migration $version from $file"
            supabase db query --linked --file "$file"
            supabase migration repair --linked --status applied "$version"
          }

          apply_if_missing 20260914183000 supabase/migrations/20260914183000_business_group_partner_branch_hierarchy.sql
          apply_if_missing 20260914183100 supabase/migrations/20260914183100_business_group_hierarchy_rollback_rpc.sql
          apply_if_missing 20260914183200 supabase/migrations/20260914183200_business_group_partner_app_scope_compat.sql
          apply_if_missing 20260914183300 supabase/migrations/20260914183300_business_group_rpc_security.sql

      - name: Verify hierarchy schema, compatibility and RPC security
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              exists (
                select 1 from information_schema.columns
                where table_schema = 'public' and table_name = 'intermediary_groups' and column_name = 'group_mode'
              ) as group_mode_ready,
              exists (
                select 1 from information_schema.columns
                where table_schema = 'public' and table_name = 'partners' and column_name = 'parent_partner_id'
              ) as parent_partner_ready,
              to_regprocedure('public.service_create_business_intermediary_group(text,text,uuid[],uuid)') is not null as create_group_rpc_ready,
              to_regprocedure('public.service_assign_business_intermediary_group_members(uuid,uuid[],uuid,text)') is not null as assign_group_rpc_ready,
              to_regprocedure('public.service_convert_intermediary_group_to_business(uuid,uuid)') is not null as convert_group_rpc_ready,
              to_regprocedure('public.service_assign_partner_branch(uuid,uuid,uuid)') is not null as assign_branch_rpc_ready,
              to_regprocedure('public.service_remove_partner_branch(uuid,uuid)') is not null as remove_branch_rpc_ready,
              to_regprocedure('public.service_revert_business_intermediary_group_to_legacy(uuid,uuid,uuid,text)') is not null as rollback_rpc_ready,
              to_regprocedure('public.partner_app_commercial_scope()') is not null as partner_scope_rpc_ready,
              has_function_privilege('service_role', 'public.service_create_business_intermediary_group(text,text,uuid[],uuid)', 'EXECUTE') as service_role_execute,
              not has_function_privilege('authenticated', 'public.service_create_business_intermediary_group(text,text,uuid[],uuid)', 'EXECUTE') as authenticated_blocked,
              not has_function_privilege('anon', 'public.service_create_business_intermediary_group(text,text,uuid[],uuid)', 'EXECUTE') as anon_blocked
          ")
          echo "$result"
          for key in \
            group_mode_ready \
            parent_partner_ready \
            create_group_rpc_ready \
            assign_group_rpc_ready \
            convert_group_rpc_ready \
            assign_branch_rpc_ready \
            remove_branch_rpc_ready \
            rollback_rpc_ready \
            partner_scope_rpc_ready \
            service_role_execute \
            authenticated_blocked \
            anon_blocked
          do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done

      - name: Verify migration history parity for hierarchy versions
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select version
            from supabase_migrations.schema_migrations
            where version in ('20260914183000','20260914183100','20260914183200','20260914183300')
            order by version;
          ")
          echo "$result"
          for version in 20260914183000 20260914183100 20260914183200 20260914183300; do
            echo "$result" | grep -q "\"version\"[[:space:]]*:[[:space:]]*\"$version\""
          done
