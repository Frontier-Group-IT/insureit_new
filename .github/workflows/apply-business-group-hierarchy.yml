name: Apply Business Group hierarchy migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260914183000_business_group_partner_branch_hierarchy.sql'
      - 'supabase/migrations/20260914183100_business_group_hierarchy_rollback_rpc.sql'
      - 'supabase/migrations/20260914183200_business_group_partner_app_scope_compat.sql'
      - 'supabase/migrations/20260914183300_business_group_rpc_security.sql'
      - '.github/workflows/apply-business-group-hierarchy.yml'

permissions:
  contents: read

concurrency:
  group: insureit-business-group-hierarchy-schema
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply reversible Business Group hierarchy schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          for file in \
            supabase/migrations/20260914183000_business_group_partner_branch_hierarchy.sql \
            supabase/migrations/20260914183100_business_group_hierarchy_rollback_rpc.sql \
            supabase/migrations/20260914183200_business_group_partner_app_scope_compat.sql \
            supabase/migrations/20260914183300_business_group_rpc_security.sql; do
            test -f "$file"
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Capture pre-migration invariants
        shell: bash
        run: |
          set -euo pipefail
          before=$(supabase db query --linked --output-format json "
            select
              (select count(*) from public.intermediary_groups) as group_count,
              (select count(*) from public.intermediary_group_memberships) as membership_count,
              exists(select 1 from information_schema.columns where table_schema='public' and table_name='intermediary_groups' and column_name='group_mode') as group_mode_exists,
              exists(select 1 from information_schema.columns where table_schema='public' and table_name='partners' and column_name='parent_partner_id') as parent_partner_id_exists
          ")
          echo "$before"
          printf '%s' "$before" > /tmp/business_group_before.json

      - name: Apply Business Group hierarchy migrations in order
        shell: bash
        run: |
          set -euo pipefail
          for version in 20260914183000 20260914183100 20260914183200 20260914183300; do
            file=$(ls "supabase/migrations/${version}_"*.sql)
            echo "Applying $file"
            supabase db query --linked --file "$file"
            supabase migration repair --linked --status applied "$version"
          done

      - name: Verify schema, compatibility and rollback surface
        shell: bash
        run: |
          set -euo pipefail
          after=$(supabase db query --linked --output-format json "
            select
              (select count(*) from public.intermediary_groups) as group_count,
              (select count(*) from public.intermediary_group_memberships) as membership_count,
              exists(select 1 from information_schema.columns where table_schema='public' and table_name='intermediary_groups' and column_name='group_mode') as group_mode_exists,
              exists(select 1 from information_schema.columns where table_schema='public' and table_name='partners' and column_name='parent_partner_id') as parent_partner_id_exists,
              not exists(select 1 from public.intermediary_groups where group_mode <> 'legacy_employee') as existing_groups_preserved_as_legacy,
              not exists(select 1 from public.partners where parent_partner_id is not null) as no_branch_backfill,
              to_regprocedure('public.service_create_business_intermediary_group(text,text,uuid[],uuid)') is not null as create_rpc_ready,
              to_regprocedure('public.service_assign_business_intermediary_group_members(uuid,uuid[],uuid,text)') is not null as assign_rpc_ready,
              to_regprocedure('public.service_assign_partner_branch(uuid,uuid,uuid)') is not null as branch_rpc_ready,
              to_regprocedure('public.service_remove_partner_branch(uuid,uuid)') is not null as detach_rpc_ready,
              to_regprocedure('public.service_revert_business_intermediary_group_to_legacy(uuid,uuid,uuid,text)') is not null as rollback_rpc_ready,
              to_regprocedure('public.business_group_hierarchy_schema_ready()') is not null as readiness_rpc_ready,
              has_function_privilege('service_role', 'public.service_create_business_intermediary_group(text,text,uuid[],uuid)', 'EXECUTE') as service_role_create_execute,
              not has_function_privilege('authenticated', 'public.service_create_business_intermediary_group(text,text,uuid[],uuid)', 'EXECUTE') as authenticated_create_blocked
          ")
          echo "$after"
          echo "$after" | grep -Eq '"group_mode_exists"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"parent_partner_id_exists"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"existing_groups_preserved_as_legacy"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"no_branch_backfill"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"create_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"assign_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"branch_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"detach_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"rollback_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"readiness_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"service_role_create_execute"[[:space:]]*:[[:space:]]*true'
          echo "$after" | grep -Eq '"authenticated_create_blocked"[[:space:]]*:[[:space:]]*true'

          before_groups=$(jq -r '.[0].group_count' /tmp/business_group_before.json)
          before_memberships=$(jq -r '.[0].membership_count' /tmp/business_group_before.json)
          after_groups=$(jq -r '.[0].group_count' <<<"$after")
          after_memberships=$(jq -r '.[0].membership_count' <<<"$after")
          test "$before_groups" = "$after_groups" || { echo "::error::Group count changed during additive migration."; exit 1; }
          test "$before_memberships" = "$after_memberships" || { echo "::error::Membership count changed during additive migration."; exit 1; }

      - name: Verify readiness RPC returns true
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "select public.business_group_hierarchy_schema_ready() as ready")
          echo "$result"
          echo "$result" | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'
