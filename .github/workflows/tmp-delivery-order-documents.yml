name: Temporary Delivery Order document editor

on:
  push:
    branches:
      - ui/delivery-order-assessment-documents

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/delivery-order-assessment-documents
      - name: Apply Delivery Order patch
        run: python .github/scripts/tmp_delivery_order_documents.py
      - name: Commit result
        shell: bash
        run: |
          git rm .github/workflows/tmp-delivery-order-documents.yml .github/scripts/tmp_delivery_order_documents.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/self-managed-milestone.tsx
          git commit -m "Add Delivery Order assessment document uploads"
          git push origin HEAD:ui/delivery-order-assessment-documents
