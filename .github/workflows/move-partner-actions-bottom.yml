name: Move partner actions to page bottom

on:
  push:
    branches:
      - fix/partner-actions-bottom

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-actions-bottom
          fetch-depth: 0

      - name: Apply layout change
        run: python .github/scripts/move_partner_actions.py

      - name: Validate web portal
        run: |
          npm ci
          npm run typecheck:web

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/form-submit-button.tsx \
            apps/web-portal/app/customers/applications/posp-misp-application-editor.tsx \
            'apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx'
          git commit -m "Move partner edit actions below migration section"
          git push origin HEAD:fix/partner-actions-bottom
