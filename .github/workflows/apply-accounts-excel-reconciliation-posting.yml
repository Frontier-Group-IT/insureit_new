name: Apply Accounts Excel reconciliation posting migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/202609161830_accounts_excel_reconciliation_posting.sql'
      - '.github/workflows/apply-accounts-excel-reconciliation-posting.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Accounts Excel reconciliation posting migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/202609161830_accounts_excel_reconciliation_posting.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Accounts reconciliation migration is applied
        shell: bash
        run: |
          set -euo pipefail
          state=$(supabase db query --linked --output-format json "
            select exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '202609161830'
            ) as applied;
          ")
          echo "$state"
          if echo "$state" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration 202609161830 is already recorded as applied; skipping re-application."
          else
            supabase db query --linked --file supabase/migrations/202609161830_accounts_excel_reconciliation_posting.sql
            supabase migration repair --linked --status applied 202609161830
          fi

      - name: Verify reconciliation RPC contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.post_accounts_excel_reconciliation(uuid,jsonb,jsonb,jsonb)') is not null as function_exists,
              has_function_privilege('service_role', 'public.post_accounts_excel_reconciliation(uuid,jsonb,jsonb,jsonb)', 'EXECUTE') as service_role_can_execute,
              has_function_privilege('public', 'public.post_accounts_excel_reconciliation(uuid,jsonb,jsonb,jsonb)', 'EXECUTE') as public_can_execute;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_exists"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"service_role_can_execute"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"public_can_execute"[[:space:]]*:[[:space:]]*false'
