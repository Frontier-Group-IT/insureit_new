name: Temporary patch Partner banner visibility

on:
  push:
    branches:
      - partner/fix-visible-banners-distinct-icons
    paths:
      - '.github/workflows/tmp-publish-partner-0-1-dashboard-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: partner/fix-visible-banners-distinct-icons
          fetch-depth: 0
      - name: Patch Partner Home visuals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/partner-app/app/(tabs)/index.tsx')
          s=p.read_text()
          pairs=[
          ('resizeMode="contain"\n          />\n          <View style={styles.heroTopRow}>','resizeMode="cover"\n          />\n          <View style={styles.heroBackdropShade} />\n          <View style={styles.heroTopRow}>'),
          ('<QuickAction asset={GeneratedDashboardAssets.policyAdd} label="Policy Intake" onPress={() => router.push(\'/policy-intake-new\')} />\n                    <QuickAction asset={GeneratedDashboardAssets.renewalAdd} label="Renewals" onPress={() => router.push(\'/renewals\')} />\n                    <QuickAction asset={GeneratedDashboardAssets.policyVerified} label="Claims" onPress={() => router.push(\'/(tabs)/claims\')} />','<QuickAction icon="file-plus" label="Policy Intake" onPress={() => router.push(\'/policy-intake-new\')} />\n                    <QuickAction icon="refresh-cw" label="Renewals" onPress={() => router.push(\'/renewals\')} />\n                    <QuickAction icon="shield" label="Claims" onPress={() => router.push(\'/(tabs)/claims\')} />'),
          ('<Image\n                        source={GeneratedDashboardAssets.pendingDocument}\n                        style={styles.pendingHeroAsset}\n                        resizeMode="contain"\n                      />','<View style={styles.pendingHeaderSpacer} />'),
          ("hero: { height: 106, overflow: 'hidden', backgroundColor: '#062D5F', paddingHorizontal: 20, paddingTop: 7 },\n  heroBackdrop: { position: 'absolute', top: -3, right: -18, width: 330, height: 110, opacity: 0.42 },\n  heroTopRow: { zIndex: 1,","hero: { height: 112, overflow: 'hidden', backgroundColor: '#062D5F', paddingHorizontal: 20, paddingTop: 7 },\n  heroBackdrop: { ...StyleSheet.absoluteFillObject, width: '100%', height: '100%', opacity: 0.82 },\n  heroBackdropShade: { ...StyleSheet.absoluteFillObject, backgroundColor: 'rgba(3,34,75,0.34)' },\n  heroTopRow: { zIndex: 2,"),
          ("heroGreeting: { zIndex: 1,","heroGreeting: { zIndex: 2,"),
          ("quickIconCircle: { width: 39, height: 39, borderRadius: 20,","quickIconCircle: { width: 42, height: 42, borderRadius: 21,"),
          ('<Feather name={icon} size={20} color={partnerTheme.colors.brandStrong} />','<Feather name={icon} size={23} color={partnerTheme.colors.brandStrong} />'),
          ("pendingCard: { marginTop: 11, paddingHorizontal: 14, paddingTop: 11, paddingBottom: 8, borderRadius: 18, overflow: 'hidden', backgroundColor: '#EAF5FF',","pendingCard: { marginTop: 11, minHeight: 142, paddingHorizontal: 14, paddingTop: 11, paddingBottom: 8, borderRadius: 18, overflow: 'hidden', backgroundColor: '#EAF5FF',"),
          ("pendingBackdrop: { position: 'absolute', top: -2, right: -38, width: 235, height: 112, opacity: 0.42 },\n  pendingHeroIcon: { width: 42, height: 42, borderRadius: 21, alignItems: 'center', justifyContent: 'center', backgroundColor: '#FFFFFF' },\n  pendingHeroAsset: { width: 48, height: 48 },\n  pendingList: { marginTop: 2, paddingRight: 2 },","pendingBackdrop: { position: 'absolute', right: 4, bottom: 4, width: 132, height: 132, opacity: 0.9 },\n  pendingHeaderSpacer: { width: 122, height: 1 },\n  pendingList: { marginTop: 2, paddingRight: 118 },")]
          for old,new in pairs:
              if old not in s:
                  raise SystemExit('missing source fragment: '+old[:120])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/partner-app/app/(tabs)/index.tsx'
          git commit -m 'Make Partner banners visible and quick icons distinct'
          git push origin HEAD:partner/fix-visible-banners-distinct-icons
