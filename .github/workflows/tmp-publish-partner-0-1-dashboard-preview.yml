name: Temporary publish Partner 0.1.0 dashboard preview

on:
  push:
    branches:
      - partner/preview-0.1.0-dashboard-refresh
    paths:
      - '.github/workflows/tmp-publish-partner-0-1-dashboard-preview.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
      ACCEPTED_BASELINE: 774ba2932c52678a8851f9eb5ed054e1545017d0
      EXPECTED_DASHBOARD_COMMIT: be94a1b7c1ee134027667f5d3119bcd65c374e3c

    steps:
      - name: Checkout exact branch snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact 0.1.0 dashboard-search-and-logo app delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin partner/preview-0.1.0-dashboard-refresh
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/partner/preview-0.1.0-dashboard-refresh)" ] || {
            echo "::error::Branch advanced after checkout." >&2
            exit 1
          }
          git merge-base --is-ancestor "$EXPECTED_DASHBOARD_COMMIT" HEAD || {
            echo "::error::Expected verified dashboard commit is not contained in publish head." >&2
            exit 1
          }
          changed_app_files=$(git diff --name-only "$ACCEPTED_BASELINE" HEAD -- apps/partner-app)
          printf '%s\n' "$changed_app_files"
          expected_files=$(printf '%s\n' 'apps/partner-app/app/(tabs)/index.tsx' 'apps/partner-app/app/search.tsx' 'apps/partner-app/assets/insureit-partner-official.png')
          [ "$changed_app_files" = "$expected_files" ] || {
            echo "::error::Refusing OTA: Partner app delta is not limited to Home dashboard, Search handoff and official Partner logo." >&2
            exit 1
          }

      - name: Validate installed-runtime identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const expo = app.expo || {};
          if (expo.version !== '0.1.0') throw new Error(`Expected installed-compatible app version/runtime 0.1.0, found ${expo.version}`);
          if (expo.android?.versionCode !== 1 || expo.ios?.buildNumber !== '1') throw new Error('Expected Partner 0.1.0 native build identity.');
          if (expo.android?.package !== 'com.insureit.partner' || expo.ios?.bundleIdentifier !== 'com.insureit.partner') throw new Error('Unexpected Partner package identity.');
          if (expo.runtimeVersion?.policy !== 'appVersion') throw new Error('Expected appVersion runtime policy.');
          if (expo?.extra?.eas?.projectId !== '8ade82c1-4c96-4f09-b90b-802270fb406d') throw new Error('Unexpected Partner EAS project.');
          if (expo?.updates?.url !== 'https://u.expo.dev/8ade82c1-4c96-4f09-b90b-802270fb406d') throw new Error('Unexpected Partner update URL.');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Require synchronized dependency lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is out of sync."
            git diff -- package-lock.json
            exit 1
          fi

      - name: Verify Partner 0.1.0 source before OTA
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace apps/partner-app run verify:routes
          npm --workspace apps/partner-app run verify:phase5
          npm --workspace apps/partner-app run verify:visual
          node apps/partner-app/scripts/verify-policy-intake-source-contract.mjs
          npm --workspace apps/partner-app run verify:pre-apk
          npm --workspace apps/partner-app run verify:uat
          npm run typecheck:partner
          npm run lint:partner
          npm run build:partner:web

      - name: Verify Expo access
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "::error::EXPO_TOKEN_PARTNER is missing."; exit 1; }
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish dashboard OTA to existing Partner preview channel
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Partner 0.1.0 Home reference polish ${EXPECTED_DASHBOARD_COMMIT}" \
            --non-interactive \
            --json > partner-dashboard-preview-update.json
          cat partner-dashboard-preview-update.json

      - name: Verify latest preview update metadata
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update:list --branch preview --limit 1 --json --non-interactive > latest-preview.json || true
          cat latest-preview.json || true

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Partner 0.1.0 Home reference-polish preview OTA'
            echo
            echo "- Accepted phone baseline: \`${ACCEPTED_BASELINE}\`"
            echo "- Verified dashboard source: \`${EXPECTED_DASHBOARD_COMMIT}\`"
            echo '- Runtime required: `0.1.0`'
            echo '- Channel: `preview`'
            echo '- App delta: Home dashboard + Search query handoff + official Partner logo asset only'
            echo '- Header: compact navy area, logo only, full-name regular-weight greeting, no watermark'
            echo '- Dashboard icons: bundled Feather/Lucide-style vector icons; no new native dependency'
            echo '- Business card: compact This Month reference layout with bar visual and existing cohort metrics'
            echo '- Commission invariant: payout total for the exact Policies Sold cohort'
            echo '- Native APK/AAB build: NOT triggered'
          } >> "$GITHUB_STEP_SUMMARY"
