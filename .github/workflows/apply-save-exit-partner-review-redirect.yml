name: Apply Save and Exit partner review redirect
on:
  push:
    branches:
      - feature/save-exit-partner-review-redirect-20260805
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update redirect destinations
        shell: python
        run: |
          from pathlib import Path

          normal = Path('apps/web-portal/app/customers/posp-misp/new/submit/route.ts')
          text = normal.read_text()
          old = '? new URL("/customers/posp-misp", requestUrl)'
          new = '? new URL(`/intermediaries/applications/${applicationId}?success=${success}`, requestUrl)'
          if old not in text:
              raise SystemExit('Normal Save & Exit redirect was not found')
          normal.write_text(text.replace(old, new, 1))

          legacy = Path('apps/web-portal/app/customers/posp-misp/new/legacy-submit/route.ts')
          text = legacy.read_text()
          old = '? new URL("/customers/posp-misp", request.url)'
          new = '? new URL(`/intermediaries/applications/${result.applicationId}?success=primary_details_saved`, request.url)'
          if old not in text:
              raise SystemExit('Legacy Save & Exit redirect was not found')
          legacy.write_text(text.replace(old, new, 1))
      - name: Verify focused change
        shell: python
        run: |
          from pathlib import Path
          normal = Path('apps/web-portal/app/customers/posp-misp/new/submit/route.ts').read_text()
          legacy = Path('apps/web-portal/app/customers/posp-misp/new/legacy-submit/route.ts').read_text()
          assert 'new URL(`/intermediaries/applications/${applicationId}?success=${success}`, requestUrl)' in normal
          assert 'new URL(`/intermediaries/applications/${result.applicationId}?success=primary_details_saved`, request.url)' in legacy
          assert 'workflow?stage=documents&success=' in normal
          assert 'workflow?stage=documents&success=primary_details_saved' in legacy
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-save-exit-partner-review-redirect.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web-portal/app/customers/posp-misp/new/submit/route.ts apps/web-portal/app/customers/posp-misp/new/legacy-submit/route.ts .github/workflows/apply-save-exit-partner-review-redirect.yml
          git commit -m "Fix Save and Exit partner review redirect"
          git push
