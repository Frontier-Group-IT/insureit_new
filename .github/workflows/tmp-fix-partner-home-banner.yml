name: Temporary fix Partner home banner and pending artwork

on:
  push:
    branches:
      - partner/home-banner-branding-pending-fix
    paths:
      - .github/workflows/tmp-fix-partner-home-banner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: partner/home-banner-branding-pending-fix
          fetch-depth: 0

      - name: Apply focused Partner home visual fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/partner-app/app/(tabs)/index.tsx')
          text = path.read_text()

          replacements = [
            (
              "  customerAction: require('../../assets/partner/actions/customer-register.png'),",
              "  customerAction: require('../../assets/partner/actions/add-customer.png'),",
            ),
            (
              '''            <Image
              source={require('../../assets/insureit-partner-official.png')}
              style={styles.heroLogo}
              resizeMode="contain"
            />''',
              '''            <View style={styles.heroBrand}>
              <Image
                source={require('../../assets/insureit-partner-official.png')}
                style={styles.heroLogo}
                resizeMode="contain"
              />
              <Text style={styles.heroBrandText} accessibilityLabel="insureit Partner">
                <Text style={styles.heroBrandInsureit}>insureit</Text>
                <Text style={styles.heroBrandPartner}> Partner</Text>
              </Text>
            </View>''',
            ),
            (
              '''                    <Image
                      source={GeneratedDashboardAssets.pendingTasks}
                      style={styles.pendingBackdrop}
                      resizeMode="contain"
                    />''',
              '''                    <Image
                      source={GeneratedDashboardAssets.pendingTasks}
                      style={styles.pendingBackdrop}
                      resizeMode="cover"
                    />''',
            ),
            (
              "  hero: { height: 152, overflow: 'hidden', backgroundColor: '#062D5F', paddingHorizontal: 20, paddingTop: 10 },",
              "  hero: { height: 174, overflow: 'hidden', backgroundColor: '#062D5F', paddingTop: 10 },",
            ),
            (
              "  heroBackdrop: { ...StyleSheet.absoluteFillObject, width: '100%', height: '100%', opacity: 0.94 },",
              "  heroBackdrop: { ...StyleSheet.absoluteFillObject, opacity: 0.97 },",
            ),
            (
              "  heroBackdropShade: { ...StyleSheet.absoluteFillObject, backgroundColor: 'rgba(3,34,75,0.22)' },",
              "  heroBackdropShade: { ...StyleSheet.absoluteFillObject, backgroundColor: 'rgba(3,34,75,0.16)' },",
            ),
            (
              "  heroTopRow: { zIndex: 2, flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' },",
              "  heroTopRow: { zIndex: 2, flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', paddingHorizontal: 20 },",
            ),
            (
              "  heroLogo: { width: 36, height: 43, tintColor: '#FFFFFF' },",
              "  heroBrand: { flexDirection: 'row', alignItems: 'center', gap: 9, maxWidth: '66%' },\n  heroLogo: { width: 36, height: 43, tintColor: '#FFFFFF' },\n  heroBrandText: { flexShrink: 1, fontSize: 16.5, lineHeight: 21, fontWeight: '800', letterSpacing: -0.2 },\n  heroBrandInsureit: { color: '#FFFFFF' },\n  heroBrandPartner: { color: '#F7B267' },",
            ),
            (
              "  heroGreeting: { zIndex: 2, marginTop: 5, maxWidth: '84%' },",
              "  heroGreeting: { zIndex: 2, position: 'absolute', left: 20, right: 92, bottom: 13 },",
            ),
            (
              "  heroGreetingText: { color: '#FFFFFF', fontSize: 15.5, lineHeight: 20, fontWeight: '400', letterSpacing: -0.05 },",
              "  heroGreetingText: { color: '#FFFFFF', fontSize: 16, lineHeight: 21, fontWeight: '500', letterSpacing: -0.05, textShadowColor: 'rgba(0,0,0,0.28)', textShadowOffset: { width: 0, height: 1 }, textShadowRadius: 3 },",
            ),
            (
              "  pendingBackdrop: { position: 'absolute', right: -8, top: 0, width: 190, height: 154, opacity: 1 },",
              "  pendingBackdrop: { position: 'absolute', right: 9, top: 9, width: 172, height: 136, borderRadius: 14, opacity: 1 },",
            ),
            (
              "  pendingHeaderSpacer: { width: 154, height: 1 },",
              "  pendingHeaderSpacer: { width: 166, height: 1 },",
            ),
            (
              "  pendingList: { marginTop: 4, paddingRight: 150 },",
              "  pendingList: { marginTop: 4, paddingRight: 166 },",
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected source fragment not found:\n{old}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify focused source contract
        shell: bash
        run: |
          grep -F "customerAction: require('../../assets/partner/actions/add-customer.png')" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "heroBrandPartner: { color: '#F7B267' }" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "hero: { height: 174" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F 'resizeMode="cover"' 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "pendingBackdrop: { position: 'absolute', right: 9, top: 9, width: 172, height: 136" 'apps/partner-app/app/(tabs)/index.tsx'

      - name: Install dependencies
        run: npm ci

      - name: Verify Partner source
        run: |
          npm --workspace apps/partner-app run verify:routes
          npm --workspace apps/partner-app run verify:phase5
          npm --workspace apps/partner-app run verify:visual
          node apps/partner-app/scripts/verify-policy-intake-source-contract.mjs
          npm --workspace apps/partner-app run verify:pre-apk
          npm --workspace apps/partner-app run verify:uat
          npm run typecheck:partner
          npm run lint:partner
          npm run build:partner:web

      - name: Commit focused implementation
        shell: bash
        run: |
          if git diff --quiet -- 'apps/partner-app/app/(tabs)/index.tsx'; then
            echo 'No source changes to commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'apps/partner-app/app/(tabs)/index.tsx'
          git commit -m 'Polish Partner home branding and pending banner'
          git push origin HEAD:partner/home-banner-branding-pending-fix
