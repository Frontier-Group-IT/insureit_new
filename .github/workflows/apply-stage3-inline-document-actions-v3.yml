name: Apply Stage 3 inline document action UI v3

"on":
  push:
    branches:
      - ui/stage3-inline-document-actions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/stage3-inline-document-actions
          fetch-depth: 0
      - name: Apply scoped UI patch
        run: python .github/scripts/apply-stage3-inline-document-actions.py
      - name: Commit scoped UI change and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-stage3-inline-document-actions.yml .github/workflows/apply-stage3-inline-document-actions-v2.yml .github/workflows/apply-stage3-inline-document-actions-v3.yml .github/scripts/apply-stage3-inline-document-actions.py
          git add apps/web-portal/components/final-documents/final-documents-workspace-v2.tsx
          git commit -m "Match Stage 3 document actions to Stage 1"
          git push origin HEAD:ui/stage3-inline-document-actions
