name: Temporary policy intake reset context fix
on:
  push:
    branches: [fix/policy-intake-reset-context]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/policy-intake-reset-context
      - name: Patch reset linkage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          f=Path('apps/web-portal/components/policy-unified-form.tsx')
          s=f.read_text()
          k='const POLICY_DRAFT_KEY = "insureit:policy-onboarding:draft:v2";\n'
          if 'POLICY_INTAKE_PENDING_KEY' not in s:
            s=s.replace(k,k+'const POLICY_INTAKE_PENDING_KEY = "insureit:policy-intake:pending:v1";\nconst POLICY_ONBOARDING_RESET_EVENT = "insureit:policy-onboarding:reset";\n',1)
          old='try{sessionStorage.removeItem(POLICY_DRAFT_KEY);}catch{}'
          new='try{sessionStorage.removeItem(POLICY_DRAFT_KEY);sessionStorage.removeItem(POLICY_INTAKE_PENDING_KEY);window.dispatchEvent(new Event(POLICY_ONBOARDING_RESET_EVENT));}catch{}'
          if old not in s and new not in s: raise SystemExit('reset anchor not found')
          s=s.replace(old,new,1)
          f.write_text(s)
          c=Path('apps/web-portal/components/policy-intake-onboarding-context.tsx')
          s=c.read_text()
          key='const KEY="insureit:policy-intake:pending:v1";\n'
          if 'const RESET_EVENT=' not in s: s=s.replace(key,key+'const RESET_EVENT="insureit:policy-onboarding:reset";\n',1)
          marker='  useEffect(()=>{\n    if(!context)return;\n'
          effect='  useEffect(()=>{\n    const clear=()=>{setContext(null);setError(null);setOpening(false);setDesktopTarget(null);};\n    window.addEventListener(RESET_EVENT,clear);\n    return()=>window.removeEventListener(RESET_EVENT,clear);\n  },[]);\n\n'
          if 'addEventListener(RESET_EVENT,clear)' not in s:
            if marker not in s: raise SystemExit('context effect anchor not found')
            s=s.replace(marker,effect+marker,1)
          c.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-policy-intake-reset-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx apps/web-portal/components/policy-intake-onboarding-context.tsx .github/workflows/tmp-fix-policy-intake-reset-context.yml
          git commit -m "Reset policy intake context with onboarding form"
          git push origin HEAD:fix/policy-intake-reset-context
