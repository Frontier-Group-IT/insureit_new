name: Move policy OCR via repository API

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/move-policy-ocr-api.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Patch policy form through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          path = 'apps/web-portal/components/policy-form-authbridge.tsx'
          api = f'https://api.github.com/repos/{repo}/contents/{path}?ref=main'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'insureit-policy-ocr-patch',
          }
          request = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(request) as response:
              current = json.load(response)
          text = base64.b64decode(current['content']).decode('utf-8')

          import_anchor = 'import { lookupPolicyRegistrationRc, type PolicyRcReview } from "@/app/policies/authbridge-rc-actions";'
          import_line = 'import { PolicyOcrImportPanel } from "@/components/policy-ocr-import-panel";'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('AuthBridge import anchor not found')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          old_button = '<button type="button" onClick={submitPolicy} disabled={isSubmitting} className="rounded-xl bg-white px-5 py-2.5 text-[10px] font-bold text-[#071D49] shadow-sm disabled:opacity-60">{isSubmitting ? "Booking policy…" : "Book Active Policy"}</button>'
          new_buttons = '<div className="flex flex-wrap items-center gap-2"><PolicyOcrImportPanel/><button type="button" onClick={submitPolicy} disabled={isSubmitting} className="rounded-xl bg-white px-5 py-2.5 text-[10px] font-bold text-[#071D49] shadow-sm disabled:opacity-60">{isSubmitting ? "Booking policy…" : "Book Active Policy"}</button></div>'
          if '<PolicyOcrImportPanel/>' not in text:
              if old_button not in text:
                  raise SystemExit('Policy header booking button anchor not found')
              text = text.replace(old_button, new_buttons, 1)

          payload = json.dumps({
              'message': 'Move policy OCR workflow into onboarding header',
              'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
              'sha': current['sha'],
              'branch': 'main',
          }).encode('utf-8')
          update = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{path}',
              data=payload,
              headers={**headers, 'Content-Type': 'application/json'},
              method='PUT',
          )
          with urllib.request.urlopen(update) as response:
              result = json.load(response)
          print(result['commit']['sha'])
          PY
