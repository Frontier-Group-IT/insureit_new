name: One-time mobile Policies bottom navigation patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-mobile-bottom-policies.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch bottom navigation
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('apps/mobile-app/components/customer-dashboard/index.tsx'): [
                  (
                      "export function BottomNavigation({ onClaims, onVehicles, onSupport, onProfile }: { onClaims: () => void; onVehicles: () => void; onSupport: () => void; onProfile: () => void }) {",
                      "export function BottomNavigation({ onPolicies, onVehicles, onSupport, onProfile }: { onPolicies: () => void; onVehicles: () => void; onSupport: () => void; onProfile: () => void }) {",
                  ),
                  (
                      '<BottomItem label="Claims" icon="file-document-check-outline" onPress={onClaims} tone={{ accent: palette.navy, soft: palette.blueSoft }} />',
                      '<BottomItem label="Policies" icon="file-certificate-outline" onPress={onPolicies} tone={{ accent: palette.navy, soft: palette.blueSoft }} />',
                  ),
              ],
              Path('apps/mobile-app/app/customer/home.tsx'): [
                  (
                      "<BottomNavigation onClaims={() => router.push('/customer/claims')} onVehicles={() => router.push('/customer/vehicles')} onSupport={() => router.push('/customer/support')} onProfile={() => router.push('/customer/profile')} />",
                      "<BottomNavigation onPolicies={() => router.push('/customer/policies')} onVehicles={() => router.push('/customer/vehicles')} onSupport={() => router.push('/customer/support')} onProfile={() => router.push('/customer/profile')} />",
                  ),
              ],
              Path('apps/mobile-app/components/group/group-home-screen.tsx'): [
                  (
                      "<BottomNavigation onClaims={() => router.push('/customer/group/claims')} onVehicles={() => router.push('/customer/group/fleet')} onSupport={() => router.push('/customer/group/accounts')} onProfile={() => router.push(underReview ? '/customer/profile' : '/customer/group/profile')} />",
                      "<BottomNavigation onPolicies={() => router.push('/customer/group/policies')} onVehicles={() => router.push('/customer/group/fleet')} onSupport={() => router.push('/customer/group/accounts')} onProfile={() => router.push(underReview ? '/customer/profile' : '/customer/group/profile')} />",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Mobile typecheck
        run: npm run typecheck:mobile

      - name: Mobile lint
        run: npm run lint:mobile

      - name: Mobile web export
        run: npm run build:mobile:web

      - name: Confirm navigation patch
        run: |
          grep -n 'BottomItem label="Policies"' apps/mobile-app/components/customer-dashboard/index.tsx
          grep -n "onPolicies={() => router.push('/customer/policies')}" apps/mobile-app/app/customer/home.tsx
          grep -n "onPolicies={() => router.push('/customer/group/policies')}" apps/mobile-app/components/group/group-home-screen.tsx

      - name: Commit verified patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-mobile-bottom-policies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/components/customer-dashboard/index.tsx apps/mobile-app/app/customer/home.tsx apps/mobile-app/components/group/group-home-screen.tsx .github/workflows/tmp-mobile-bottom-policies.yml
          git commit -m "Replace mobile Claims nav with Policies"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
