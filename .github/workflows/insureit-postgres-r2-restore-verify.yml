name: INSUREIT PostgreSQL R2 isolated restore verification (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insureit-postgres-restore-rehearsal
  cancel-in-progress: false

jobs:
  restore_test:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: insureit-production-backup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned R2 and cryptography dependencies
        run: python -m pip install boto3==1.35.99 cryptography==44.0.2
      - name: Verify encrypted R2 archive and stage SQL on ephemeral runner
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DB_BACKUP_ENCRYPTION_KEY: ${{ secrets.DB_BACKUP_ENCRYPTION_KEY }}
          R2_BUCKET: insureit-production-backups
          RESTORE_DIR: ${{ runner.temp }}/insureit-db-restore
        run: python -u scripts/backup/verify_postgres_r2_restore.py
      - name: Audit auth, storage and public schema coverage in decrypted archive
        run: python scripts/backup/audit_postgres_archive_coverage.py "$RUNNER_TEMP/insureit-db-restore"
      - name: Restore into isolated Supabase PostgreSQL 17 container
        run: |
          set -euo pipefail
          # No external network and no port mapping: never reachable by production.
          # This pinned image is from the official Supabase self-hosted docker-compose.yml.
          # Do not attach it to production, map ports, or provide production DB credentials.
          docker run --detach --name insureit-restore-check --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/backup/fixtures/isolated_supabase_auth_helpers.sql,target=/docker-entrypoint-initdb.d/init-scripts/96-insureit-auth-helpers.sql,readonly" \
            --env POSTGRES_PASSWORD=ephemeral-not-for-use \
            --env POSTGRES_DB=postgres \
            supabase/postgres:17.6.1.136 >/dev/null
          ready=0
          for i in $(seq 1 40); do
            if docker exec insureit-restore-check pg_isready -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "ISOLATED RESTORE FAILED: target database did not become ready"
            exit 1
          fi
          # Test compatibility of the *isolated* image against known enabled
          # production extension names; uses local pg_available_extensions only.
          # The result is a count, never extension SQL or production data.
          required_extensions="'hypopg','index_advisor','pg_stat_statements','pg_trgm','pgcrypto','supabase_vault','uuid-ossp'"
          available="$(docker exec -u postgres insureit-restore-check psql -X -A -t -d postgres -c \
            "select count(*) from pg_available_extensions where name in ($required_extensions);" 2>/dev/null || true)"
          if [ "$available" != "7" ]; then
            echo "ISOLATED TARGET INCOMPLETE: required_extension_availability=$available/7; restore not attempted"
            exit 1
          fi
          echo "Isolated target extension availability preflight passed (7/7)"
          # pg_available_extensions reports availability, not installation.
          # Recreate the exact extension names/schemas observed on INSUREIT in
          # this disposable offline database, before applying schema.sql.
          docker cp scripts/backup/fixtures/isolated_supabase_extensions.sql \
            insureit-restore-check:/tmp/offline-extensions.sql
          if ! docker exec -u postgres insureit-restore-check \
            psql -X --set ON_ERROR_STOP=1 -d postgres -f /tmp/offline-extensions.sql \
            > "$RUNNER_TEMP/restore-extensions.log" 2>&1; then
            python scripts/backup/classify_pg_restore_error.py extensions "$RUNNER_TEMP/restore-extensions.log"
            echo "ISOLATED EXTENSIONS INITIALIZATION FAILED: no production database affected"
            exit 1
          fi
          installed="$(docker exec -u postgres insureit-restore-check psql -X -A -t -d postgres -c \
            "select count(*) from pg_extension where extname in ($required_extensions);" 2>/dev/null || true)"
          if [ "$installed" != "7" ]; then
            echo "ISOLATED TARGET INCOMPLETE: required_extension_installation=$installed/7"
            exit 1
          fi
          echo "Offline extension installation verified (7/7); versions and platform services not certified"
          # Supabase CLI role dumps can reference reserved platform roles
          # absent from vanilla postgres:17. This is a *test-only* scaffold.
          docker cp scripts/backup/fixtures/isolated_supabase_roles.sql insureit-restore-check:/tmp/offline-fixture-roles.sql
          if ! docker exec -u postgres insureit-restore-check \
            psql -X --set ON_ERROR_STOP=1 --dbname postgres --file /tmp/offline-fixture-roles.sql \
            > "$RUNNER_TEMP/restore-fixture.log" 2>&1; then
            python scripts/backup/classify_pg_restore_error.py fixture "$RUNNER_TEMP/restore-fixture.log"
            echo "ISOLATED ROLE FIXTURE FAILED: offline environment setup incomplete"
            exit 1
          fi
          echo "Offline Supabase role-name placeholders initialized (not production privileges)"
          docker cp "$RUNNER_TEMP/insureit-db-restore/roles.sql" insureit-restore-check:/tmp/roles.sql
          docker cp "$RUNNER_TEMP/insureit-db-restore/schema.sql" insureit-restore-check:/tmp/schema.sql
          docker cp "$RUNNER_TEMP/insureit-db-restore/data.sql" insureit-restore-check:/tmp/data.sql
          # The four Auth helpers are installed at first boot from the
          # mounted offline-only SQL before managed schema ownership locks.
          # Do not grant postgres CREATE on auth or replace platform role grants.
          auth_helpers="$(docker exec -u postgres insureit-restore-check psql -X -A -t -d postgres -c \
            "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname='auth' and p.proname in ('uid','jwt','role','email') and p.pronargs=0;" 2>/dev/null || true)"
          if [ "$auth_helpers" != "4" ]; then
            echo "ISOLATED AUTH HELPERS INCOMPLETE: installed=$auth_helpers/4"
            exit 1
          fi
          echo "Offline Auth helpers installed (4/4); no production Auth services used"
          # Keep potentially sensitive SQL errors out of public GitHub logs.
          # A plain Postgres 17 image may lack Supabase platform roles/extensions.
          for part in roles schema data; do
            # Supabase's documented restore procedure disables triggers for the
            # data COPY stage; this is safe ONLY in the isolated disposable DB.
            if [ "$part" = data ]; then
              if ! timeout 600 docker exec -u postgres insureit-restore-check \
                psql -X --single-transaction --set ON_ERROR_STOP=1 --dbname postgres \
                  --command "SET session_replication_role = replica" --file "/tmp/$part.sql" \
                > "$RUNNER_TEMP/restore-$part.log" 2>&1; then
                python scripts/backup/classify_pg_restore_error.py "$part" "$RUNNER_TEMP/restore-$part.log"
                echo "ISOLATED RESTORE INCOMPLETE: component=$part; restore blocked; existing R2 archive preserved"
                exit 1
              fi
              echo "Isolated restore component validated: $part"
              continue
            fi
            if ! timeout 600 docker exec -u postgres insureit-restore-check \
              psql -X --set ON_ERROR_STOP=1 --dbname postgres --file "/tmp/$part.sql" \
              > "$RUNNER_TEMP/restore-$part.log" 2>&1; then
              python scripts/backup/classify_pg_restore_error.py "$part" "$RUNNER_TEMP/restore-$part.log"
              echo "ISOLATED RESTORE INCOMPLETE: component=$part; restore blocked; existing R2 archive preserved"
              exit 1
            fi
            echo "Isolated restore component validated: $part"
          done
          docker exec -u postgres insureit-restore-check \
            psql -X -A -t -d postgres -c \
            "select count(*) from pg_tables where schemaname='public';" \
            > "$RUNNER_TEMP/restored-tables.count"
          count="$(cat "$RUNNER_TEMP/restored-tables.count")"
          if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -lt 1 ]; then
            echo "ISOLATED RESTORE FAILED: no public tables restored"
            exit 1
          fi
          echo "Isolated public schema table count checked"
          python scripts/backup/verify_postgres_offline_row_counts.py \
            "$RUNNER_TEMP/insureit-db-restore" insureit-restore-check
          echo "ISOLATED RESTORE PASSED: public table count and archived auth/storage row counts verified"
      - name: Remove temporary SQL and isolated database
        if: always()
        run: |
          docker rm --force --volumes insureit-restore-check >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/insureit-db-restore"
          rm -f "$RUNNER_TEMP"/restore-*.log "$RUNNER_TEMP"/restored-tables.count
