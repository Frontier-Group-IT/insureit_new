name: Temporary Gluestack Preview Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-gluestack-preview-release.yml'

permissions:
  contents: read

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify mobile runtime
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
        run: |
          npm run typecheck:mobile
          npm run build:mobile:web
      - name: Verify Expo credential
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile-app
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@18 whoami --non-interactive
      - name: Queue compatible Android preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile-app
        run: npx --yes eas-cli@18 build --platform android --profile preview --non-interactive --no-wait
      - name: Publish gluestack preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile-app
        run: npx --yes eas-cli@18 update --channel preview --environment preview --message "Gluestack dynamic dashboard attention greeting 2026-08-15" --non-interactive
