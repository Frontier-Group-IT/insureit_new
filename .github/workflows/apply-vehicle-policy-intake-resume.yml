name: Apply Vehicle Policy Intake resume schema

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260831123000_vehicle_policy_intake_resume.sql'
      - '.github/workflows/apply-vehicle-policy-intake-resume.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Vehicle and Policy Intake schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Vehicle Register and Policy Intake resume migration
        run: supabase db query --linked --file supabase/migrations/20260831123000_vehicle_policy_intake_resume.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260831123000

      - name: Verify schema
        run: |
          result=$(supabase db query --linked --output-format json "
            select
              to_regclass('public.policy_intake_onboarding_drafts') is not null as draft_table_ready,
              to_regprocedure('public.finalize_policy_intake_motor_v1(uuid,jsonb,integer)') is not null as finalize_rpc_ready
          ")
          echo "$result"
          echo "$result" | grep -Eq '"draft_table_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"finalize_rpc_ready"[[:space:]]*:[[:space:]]*true'
