name: Temporary guarded claim patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: diagnostic-placeholder
      SUPABASE_SERVICE_ROLE_KEY: diagnostic-placeholder
      POSP_MISP_DATA_ENCRYPTION_KEY: diagnostic-placeholder-key-with-sufficient-length
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      ICALL_GATEWAY_URL: https://example.invalid
      ICALL_GATEWAY_SECRET: diagnostic-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Route legacy claim action through canonical workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-portal/app/actions.ts')
          text = path.read_text()
          start_marker = 'export async function updateClaimStatus(id: string, formData: FormData) {'
          end_marker = 'type ClaimForWorkflow = {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''export async function updateClaimStatus(id: string, formData: FormData) {
            const nextStatus = textValue(formData, "current_status");
            const canonicalForm = new FormData();

            for (const [key, value] of formData.entries()) {
              if (key !== "current_status") canonicalForm.append(key, value);
            }
            if (nextStatus) canonicalForm.set("next_status", nextStatus);

            await advanceClaimWorkflow(id, canonicalForm);
          }
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          rm .github/workflows/temporary-claim-guard-patch.yml
      - name: Commit guarded action
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/actions.ts .github/workflows/temporary-claim-guard-patch.yml
          git commit -m "Guard legacy claim status through canonical workflow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Build web portal
        run: npm run build:web
