name: Apply Policy Intake pair-delete migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260908152200_delete_completed_policy_intake_pair.sql'
      - '.github/workflows/apply-policy-intake-pair-delete.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Policy Intake pair-delete migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260908152200_delete_completed_policy_intake_pair.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Policy Intake pair-delete migration
        run: supabase db query --linked --file supabase/migrations/20260908152200_delete_completed_policy_intake_pair.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260908152200

      - name: Verify coordinated pair-delete RPC
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.delete_policy_with_completed_intake_pair(uuid,uuid,uuid)') is not null as function_ready,
              not has_function_privilege('authenticated','public.delete_policy_with_completed_intake_pair(uuid,uuid,uuid)','EXECUTE') as no_authenticated_execute,
              has_function_privilege('service_role','public.delete_policy_with_completed_intake_pair(uuid,uuid,uuid)','EXECUTE') as service_role_execute
          ")
          echo "$result"
          for key in function_ready no_authenticated_execute service_role_execute; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
