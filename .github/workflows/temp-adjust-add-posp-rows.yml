name: Temporary adjust Add POSP rows

on:
  push:
    paths:
      - scripts/temp_adjust_add_posp_rows.py
      - .github/workflows/temp-adjust-add-posp-rows.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply Add POSP row adjustments
        run: python scripts/temp_adjust_add_posp_rows.py
      - name: Validate patch
        run: |
          git diff --check
          grep -Fq 'xl:grid-cols-5' apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx
          grep -Fq 'label="Upload Documents"' apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx
          test "$(grep -c 'href="/customers/posp-misp/import" className="rounded-lg' apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx || true)" -eq 0
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Refine Add POSP field rows"
            git pull --rebase origin main
            git push origin main
          fi
