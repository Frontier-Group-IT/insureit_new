name: Temporary fix internal shared stage invocation

on:
  push:
    branches:
      - ui/internal-stages-match-external
    paths:
      - .github/workflows/tmp-fix-internal-stage-shared-call.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/internal-stages-match-external
          fetch-depth: 0
      - name: Fix shared milestone body invocation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile-app/app/customer/internal-claim-stage.tsx')
          text = path.read_text()
          old = '''      <View pointerEvents="none">\n        <ExternalClaimMilestoneStageBody\n          key={stageKey}\n          values={externalValues}\n          set={() => undefined}\n          milestones={externalMilestones}\n          claimId={claim.id}\n          customerId={claim.customer_id}\n        />\n      </View>'''
          new = '''      <View pointerEvents="none">\n        {ExternalClaimMilestoneStageBody(stageKey as any, externalValues, () => undefined, externalMilestones, claim.id, claim.customer_id)}\n      </View>'''
          if old not in text:
              raise SystemExit('Expected shared milestone JSX invocation not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/internal-claim-stage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix internal shared milestone body invocation"
          git push origin HEAD:ui/internal-stages-match-external
