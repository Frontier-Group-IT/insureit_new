name: Patch AGENTS unresolved CI blocker v2

on:
  push:
    branches:
      - docs/unresolved-ci-blocker-agent-rule-v2-20260810
    paths:
      - tmp/patch-agents-unresolved-ci-blocker-v2.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/unresolved-ci-blocker-agent-rule-v2-20260810
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch AGENTS.md
        run: python tmp/patch-agents-unresolved-ci-blocker-v2.py
      - name: Remove temporary patch files and commit
        run: |
          rm -f tmp/patch-agents-unresolved-ci-blocker-v2.py
          rm -f .github/workflows/patch-agents-unresolved-ci-blocker-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md tmp/patch-agents-unresolved-ci-blocker-v2.py .github/workflows/patch-agents-unresolved-ci-blocker-v2.yml
          git commit -m "docs: record unresolved CI verification blocker"
          git push origin HEAD:docs/unresolved-ci-blocker-agent-rule-v2-20260810
