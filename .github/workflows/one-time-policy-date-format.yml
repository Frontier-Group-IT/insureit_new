name: One-time policy date input repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[policy-date-format-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply policy date corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web-portal/components/policy-unified-form.tsx')
          s = p.read_text()

          old = 'function isoDate(value: string | null) { if(!value||value==="NA")return""; if(/^\\d{4}-\\d{2}-\\d{2}$/.test(value))return value; const match=value.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/); return match?`${match[3]}-${match[2].padStart(2,"0")}-${match[1].padStart(2,"0")}`:""; }'
          new = '''function isoDate(value: string | null) { if(!value||value==="NA")return""; if(/^\\d{4}-\\d{2}-\\d{2}$/.test(value))return value; const match=value.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/); return match?`${match[3]}-${match[2].padStart(2,"0")}-${match[1].padStart(2,"0")}`:""; }
          function displayDate(value:string){if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(value))return"";const[y,m,d]=value.split("-");return`${d}/${m}/${y}`;}
          function parseDisplayDate(value:string){const match=value.match(/^(\\d{2})\\/(\\d{2})\\/(\\d{4})$/);if(!match)return"";const day=Number(match[1]),month=Number(match[2]),year=Number(match[3]);const date=new Date(Date.UTC(year,month-1,day));if(date.getUTCFullYear()!==year||date.getUTCMonth()!==month-1||date.getUTCDate()!==day)return"";return`${match[3]}-${match[2]}-${match[1]}`;}
          function dateTyping(value:string){const digits=value.replace(/\\D/g,"").slice(0,8);if(digits.length<=2)return digits;if(digits.length<=4)return`${digits.slice(0,2)}/${digits.slice(2)}`;return`${digits.slice(0,2)}/${digits.slice(2,4)}/${digits.slice(4)}`;}
          function policyExpiryFrom(start:string){if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(start))return"";const[y,m,d]=start.split("-").map(Number);const expiry=new Date(Date.UTC(y+1,m-1,d));expiry.setUTCDate(expiry.getUTCDate()-1);return expiry.toISOString().slice(0,10);}'''
          assert old in s, 'isoDate anchor not found'
          s = s.replace(old, new, 1)

          old = '<div><Field label="Policy issuance date" type="date" value={form.issuanceDate} onChange={e=>update("issuanceDate",e.target.value)} required/><CompactSourceMeta label="Month" value={form.issuanceDate?new Date(`${form.issuanceDate}T00:00:00`).toLocaleDateString("en-US",{month:"short",year:"2-digit"}):"—"}/></div>'
          new = '<div><DateField label="Policy issuance date" value={form.issuanceDate} onChange={value=>update("issuanceDate",value)} required/><CompactSourceMeta label="Month" value={form.issuanceDate?new Date(`${form.issuanceDate}T00:00:00`).toLocaleDateString("en-US",{month:"short",year:"2-digit"}):"—"}/></div>'
          assert old in s, 'issuance date field not found'
          s = s.replace(old, new, 1)

          old = '<PolicyValidityField validFrom={form.validFrom} validUpto={form.validUpto} onFromChange={value=>update("validFrom",value)} onUptoChange={value=>update("validUpto",value)}/>'
          new = '<PolicyValidityField validFrom={form.validFrom} validUpto={form.validUpto} onFromChange={value=>setForm(current=>({...current,validFrom:value,validUpto:policyExpiryFrom(value)}))} onUptoChange={value=>update("validUpto",value)}/>'
          assert old in s, 'policy validity wiring not found'
          s = s.replace(old, new, 1)

          old = '<Field label="PayIn Bill Date" type="date" value={form.payinBillDate} onChange={e=>update("payinBillDate",e.target.value)}/>'
          new = '<DateField label="PayIn Bill Date" value={form.payinBillDate} onChange={value=>update("payinBillDate",value)}/>'
          assert old in s, 'payin bill date not found'
          s = s.replace(old, new, 1)

          old = 'function PolicyValidityField({validFrom,validUpto,onFromChange,onUptoChange}:{validFrom:string;validUpto:string;onFromChange:(value:string)=>void;onUptoChange:(value:string)=>void}){return <div><label className={labelClass}>Policy validity <Required/></label><div className="grid h-10 grid-cols-2 overflow-hidden rounded-xl border border-[#D8DEE9] bg-white transition hover:border-[#B8C2D1] focus-within:border-[#315B9A] focus-within:ring-2 focus-within:ring-[#DCE8FA]"><label className="relative min-w-0 border-r border-[#E1E6ED]"><span className="pointer-events-none absolute left-3 top-1 text-[7px] font-bold uppercase tracking-[.06em] text-[#7A8798]">From</span><input aria-label="Valid from" type="date" value={validFrom} onChange={e=>onFromChange(e.target.value)} required className="h-full w-full border-0 bg-transparent px-3 pb-0.5 pt-3 text-[9.5px] font-medium text-[#17203A] outline-none"/></label><label className="relative min-w-0"><span className="pointer-events-none absolute left-3 top-1 text-[7px] font-bold uppercase tracking-[.06em] text-[#7A8798]">Upto</span><input aria-label="Valid upto" type="date" value={validUpto} onChange={e=>onUptoChange(e.target.value)} required className="h-full w-full border-0 bg-transparent px-3 pb-0.5 pt-3 text-[9.5px] font-medium text-[#17203A] outline-none"/></label></div></div>;}'
          new = 'function PolicyValidityField({validFrom,validUpto,onFromChange,onUptoChange}:{validFrom:string;validUpto:string;onFromChange:(value:string)=>void;onUptoChange:(value:string)=>void}){return <div><label className={labelClass}>Policy validity <Required/></label><div className="grid h-10 grid-cols-2 overflow-hidden rounded-xl border border-[#D8DEE9] bg-white transition hover:border-[#B8C2D1] focus-within:border-[#315B9A] focus-within:ring-2 focus-within:ring-[#DCE8FA]"><label className="relative min-w-0 border-r border-[#E1E6ED]"><span className="pointer-events-none absolute left-3 top-1 z-10 text-[7px] font-bold uppercase tracking-[.06em] text-[#7A8798]">From</span><FormattedDateInput ariaLabel="Valid from" value={validFrom} onChange={onFromChange} required className="h-full w-full border-0 bg-transparent px-3 pb-0.5 pt-3 text-[9.5px] font-medium text-[#17203A] outline-none"/></label><label className="relative min-w-0"><span className="pointer-events-none absolute left-3 top-1 z-10 text-[7px] font-bold uppercase tracking-[.06em] text-[#7A8798]">Upto</span><FormattedDateInput ariaLabel="Valid upto" value={validUpto} onChange={onUptoChange} required className="h-full w-full border-0 bg-transparent px-3 pb-0.5 pt-3 text-[9.5px] font-medium text-[#17203A] outline-none"/></label></div></div>;}'
          assert old in s, 'PolicyValidityField definition not found'
          s = s.replace(old, new, 1)

          anchor = 'function Field({label,required,...props}:InputHTMLAttributes<HTMLInputElement>&{label:string}){return <div><label className={labelClass}>{label}{required?<Required/>:null}</label><input {...props} required={required} className={inputClass}/></div>;}'
          addition = '''function CalendarIcon(){return <svg aria-hidden="true" viewBox="0 0 24 24" className="h-3.5 w-3.5" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M8 3.5v4"/><path d="M16 3.5v4"/><path d="M4 10h16"/></svg>;}
          function FormattedDateInput({ariaLabel,value,onChange,required,className}:{ariaLabel:string;value:string;onChange:(value:string)=>void;required?:boolean;className:string}){const[display,setDisplay]=useState(()=>displayDate(value));const pickerRef=useRef<HTMLInputElement>(null);useEffect(()=>{setDisplay(displayDate(value));},[value]);const commit=()=>{if(!display.trim()){onChange("");return;}const parsed=parseDisplayDate(display);if(parsed){onChange(parsed);setDisplay(displayDate(parsed));}else setDisplay(displayDate(value));};return <div className="relative h-full w-full"><input aria-label={ariaLabel} value={display} onChange={e=>setDisplay(dateTyping(e.target.value))} onBlur={commit} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();commit();}}} inputMode="numeric" maxLength={10} placeholder="DD/MM/YYYY" required={required} className={`${className} pr-8 placeholder:text-[#A8B2C0]`}/><input ref={pickerRef} aria-hidden="true" tabIndex={-1} type="date" value={value} onChange={e=>{onChange(e.target.value);setDisplay(displayDate(e.target.value));}} className="pointer-events-none absolute bottom-0 right-0 h-px w-px opacity-0"/><button type="button" tabIndex={-1} aria-label={`Open ${ariaLabel} calendar`} onMouseDown={e=>e.preventDefault()} onClick={()=>{const picker=pickerRef.current;if(!picker)return;if(typeof picker.showPicker==="function")picker.showPicker();else picker.click();}} className="absolute right-1.5 top-1/2 grid h-7 w-7 -translate-y-1/2 place-items-center rounded-md text-[#53657D] transition hover:bg-[#EEF3F8] hover:text-[#17365D]"><CalendarIcon/></button></div>;}
          function DateField({label,value,onChange,required}:{label:string;value:string;onChange:(value:string)=>void;required?:boolean}){return <div><label className={labelClass}>{label}{required?<Required/>:null}</label><FormattedDateInput ariaLabel={label} value={value} onChange={onChange} required={required} className={inputClass}/></div>;}
          ''' + anchor
          assert anchor in s, 'Field definition anchor not found'
          s = s.replace(anchor, addition, 1)

          old = 'function SettlementField({date,voucher,onDateChange,onVoucherChange}:{date:string;voucher:string;onDateChange:(value:string)=>void;onVoucherChange:(value:string)=>void}){return <div><label className={labelClass}>Settlement</label><div className="grid h-10 grid-cols-[.88fr_1.12fr] overflow-hidden rounded-xl border border-[#D8DEE9] bg-white transition hover:border-[#B8C2D1] focus-within:border-[#315B9A] focus-within:ring-2 focus-within:ring-[#DCE8FA]"><label className="relative min-w-0 border-r border-[#E1E6ED]"><span className="pointer-events-none absolute left-3 top-1 text-[7px] font-bold uppercase tracking-[.06em] text-[#7A8798]">Date</span><input aria-label="Payout date" type="date" value={date} onChange={e=>onDateChange(e.target.value)} className="h-full w-full border-0 bg-transparent px-3 pb-0.5 pt-3 text-[9.5px] font-medium text-[#17203A] outline-none"/></label><label className="relative min-w-0"><span className="pointer-events-none absolute left-3 top-1 text-[7px] font-bold uppercase tracking-[.06em] text-[#7A8798]">Voucher</span><input aria-label="Payout voucher number" value={voucher} onChange={e=>onVoucherChange(e.target.value)} placeholder="Reference" className="h-full w-full border-0 bg-transparent px-3 pb-0.5 pt-3 text-[9.5px] font-medium text-[#17203A] outline-none placeholder:text-[#B0BAC8]"/></label></div></div>;}'
          new = 'function SettlementField({date,voucher,onDateChange,onVoucherChange}:{date:string;voucher:string;onDateChange:(value:string)=>void;onVoucherChange:(value:string)=>void}){return <div><label className={labelClass}>Settlement</label><div className="grid h-10 grid-cols-[.88fr_1.12fr] overflow-hidden rounded-xl border border-[#D8DEE9] bg-white transition hover:border-[#B8C2D1] focus-within:border-[#315B9A] focus-within:ring-2 focus-within:ring-[#DCE8FA]"><label className="relative min-w-0 border-r border-[#E1E6ED]"><span className="pointer-events-none absolute left-3 top-1 z-10 text-[7px] font-bold uppercase tracking-[.06em] text-[#7A8798]">Date</span><FormattedDateInput ariaLabel="Payout date" value={date} onChange={onDateChange} className="h-full w-full border-0 bg-transparent px-3 pb-0.5 pt-3 text-[9.5px] font-medium text-[#17203A] outline-none"/></label><label className="relative min-w-0"><span className="pointer-events-none absolute left-3 top-1 text-[7px] font-bold uppercase tracking-[.06em] text-[#7A8798]">Voucher</span><input aria-label="Payout voucher number" value={voucher} onChange={e=>onVoucherChange(e.target.value)} placeholder="Reference" className="h-full w-full border-0 bg-transparent px-3 pb-0.5 pt-3 text-[9.5px] font-medium text-[#17203A] outline-none placeholder:text-[#B0BAC8]"/></label></div></div>;}'
          assert old in s, 'SettlementField definition not found'
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          git commit -m "fix: standardize policy dates and auto validity [policy-date-format-fixed]"
          git push origin HEAD:main
