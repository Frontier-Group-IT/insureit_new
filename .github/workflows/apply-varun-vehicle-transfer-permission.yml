name: Apply Varun vehicle transfer permission

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260924185500_varun_vehicle_transfer_permission.sql'
      - '.github/workflows/apply-varun-vehicle-transfer-permission.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Varun vehicle transfer permission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260924185500_varun_vehicle_transfer_permission.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Varun vehicle transfer permission migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260924185500'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260924185500_varun_vehicle_transfer_permission.sql
            supabase migration repair --linked --status applied 20260924185500
          fi

      - name: Verify Varun effective vehicle permission override
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select exists(
              select 1
              from public.employee_permission_overrides epo
              join public.profiles p on p.id = epo.profile_id
              where lower(coalesce(p.email, '')) = 'varun.sabharwal@insureit.in'
                and p.is_active = true
                and epo.capability = 'view_vehicles'
                and epo.access_level in ('edit','approve')
                and epo.scope_type = 'organization'
                and (epo.expires_at is null or epo.expires_at > now())
            ) as ready;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'
