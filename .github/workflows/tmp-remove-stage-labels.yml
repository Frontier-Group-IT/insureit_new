name: TEMP remove stage labels

on:
  push:
    branches:
      - ui/compact-document-upload-actions
    paths:
      - '.github/workflows/tmp-remove-stage-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/compact-document-upload-actions
          fetch-depth: 0
      - name: Remove visible STEP X OF 9 labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('apps/mobile-app/components/external-claim-ui.tsx'),
              Path('apps/mobile-app/components/compact-document-upload-navigation.tsx'),
          ]
          target = '          <Text style={styles.eyebrow}>STEP {step} OF 9</Text>\n'
          for path in files:
              text = path.read_text()
              if target not in text:
                  raise SystemExit(f'Expected stage label not found in {path}')
              path.write_text(text.replace(target, '', 1))
          PY
          rm .github/workflows/tmp-remove-stage-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/components/external-claim-ui.tsx apps/mobile-app/components/compact-document-upload-navigation.tsx .github/workflows/tmp-remove-stage-labels.yml
          git commit -m "Remove stage count labels from claim headers"
          git push origin HEAD:ui/compact-document-upload-actions
