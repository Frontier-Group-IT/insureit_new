name: Temporary GCV CPA patch

on:
  push:
    branches:
      - policy/gcv-cpa-required
    paths:
      - .github/workflows/tmp-gcv-cpa-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: policy/gcv-cpa-required
          fetch-depth: 0
      - name: Apply targeted policy validation changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {text.count(old)} for: {old[:120]}")
              p.write_text(text.replace(old, new, 1))

          form = "apps/web-portal/components/policy-unified-form.tsx"
          replace_once(
              form,
              '      [form.policyProduct,form.policyNo,form.insurerId,form.idv,form.od,form.tp,form.validFrom,form.validUpto],',
              '      [form.policyProduct,form.policyNo,form.insurerId,form.idv,form.od,form.tp,...(form.vehicleClass==="GCV"?[form.cpa]:[]),form.validFrom,form.validUpto],'
          )
          replace_once(
              form,
              '  function buildEditPayload():PolicyEditPayload{return{policy:{',
              '  function buildEditPayload():PolicyEditPayload{return{vehicleClass:form.vehicleClass,policy:{'
          )
          replace_once(
              form,
              '  function submitPolicy(){ if(isEdit){',
              '  function submitPolicy(){ if(form.vehicleClass==="GCV"&&numeric(form.cpa)<=0){setSubmitError("CPA amount is mandatory for GCV policies and must be greater than ₹0.");goToSection(2);return;} if(isEdit){'
          )
          replace_once(
              form,
              '        <Field label="CPA amount" type="number" min="0" value={form.cpa} onChange={e=>{const value=e.target.value;setForm(current=>({...current,cpa:value,cpaOpted:Number(value||0)>0?"Yes":"No"}));}} placeholder="₹ 0.00"/>',
              '        <Field label="CPA amount" type="number" min={form.vehicleClass==="GCV"?"0.01":"0"} step="0.01" value={form.cpa} onChange={e=>{const value=e.target.value;setForm(current=>({...current,cpa:value,cpaOpted:Number(value||0)>0?"Yes":"No"}));}} placeholder="₹ 0.00" required={form.vehicleClass==="GCV"}/>'
          )

          onboard = "apps/web-portal/app/policies/policy-onboarding-actions.ts"
          replace_once(
              onboard,
              '  const name = cleanName(payload.customer.name ?? "");\n',
              '  const name = cleanName(payload.customer.name ?? "");\n  const vehicleClass = String(payload.vehicle.classCode ?? "").trim().toUpperCase();\n  const cpaAmount = Number(numericPayloadValue(payload.premium.cpa, false, "0"));\n'
          )
          replace_once(
              onboard,
              '  if (!payload.vehicle.classCode) return "Select the vehicle class.";\n',
              '  if (!vehicleClass) return "Select the vehicle class.";\n  if (vehicleClass === "GCV" && (!payload.premium.cpaOpted || !Number.isFinite(cpaAmount) || cpaAmount <= 0)) return "CPA amount is mandatory for GCV policies and must be greater than 0.";\n'
          )

          edit = "apps/web-portal/app/policies/policy-edit-actions.ts"
          replace_once(
              edit,
              'export type PolicyEditPayload = {\n  policy: {',
              'export type PolicyEditPayload = {\n  vehicleClass: string;\n  policy: {'
          )
          replace_once(
              edit,
              '  if (payload.policy.validUpto < payload.policy.validFrom) return { ok: false, error: "Policy Valid Upto cannot be before Valid From." };\n\n  const monetaryValues = [',
              '  if (payload.policy.validUpto < payload.policy.validFrom) return { ok: false, error: "Policy Valid Upto cannot be before Valid From." };\n  const cpaAmount = Number(payload.premium.cpa);\n  if (payload.vehicleClass.trim().toUpperCase() === "GCV" && (!payload.premium.cpaOpted || !Number.isFinite(cpaAmount) || cpaAmount <= 0)) {\n    return { ok: false, error: "CPA amount is mandatory for GCV policies and must be greater than 0." };\n  }\n\n  const monetaryValues = ['
          )
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx apps/web-portal/app/policies/policy-onboarding-actions.ts apps/web-portal/app/policies/policy-edit-actions.ts
          git diff --cached --check
          git commit -m "Require positive CPA for GCV policies"
          git push origin HEAD:policy/gcv-cpa-required
