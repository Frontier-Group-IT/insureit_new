name: Patch self-managed claim theme

on:
  push:
    branches:
      - feature/self-managed-claims
    paths:
      - '.github/workflows/patch-self-managed-claim-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/self-managed-claims
          fetch-depth: 0
      - name: Align self-managed tracker with managed claim theme
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/mobile-app/app/customer/self-managed-claim-detail.tsx')
          s = p.read_text()
          replacements = {
            '<MaterialCommunityIcons name={next ? \'flag-outline\' : \'check-decagram\'} size={20} color="#FFFFFF" />': '<MaterialCommunityIcons name={next ? \'flag-outline\' : \'check-decagram\'} size={20} color="#0B63CE" />',
            "heroCard: { borderRadius: 22, backgroundColor: '#082A66', padding: 16, marginBottom: 12 },": "heroCard: { borderRadius: 18, borderWidth: 1, borderColor: '#CFE0FF', backgroundColor: '#F8FBFF', padding: 13, paddingLeft: 17, marginBottom: 10, overflow: 'hidden', shadowColor: palette.navy, shadowOpacity: 0.055, shadowRadius: 10, elevation: 2 },",
            "heroTop: { flexDirection: 'row', gap: 12, alignItems: 'center' },": "heroTop: { flexDirection: 'row', gap: 10, alignItems: 'center' },",
            "heroEyebrow: { color: '#AFC6E9', fontSize: 9, fontWeight: '900', letterSpacing: 0.8 },": "heroEyebrow: { color: '#0B63CE', fontSize: 10, fontWeight: '900', letterSpacing: 0.6 },",
            "heroValue: { color: '#FFF', fontSize: 21, fontWeight: '900', marginTop: 2 },": "heroValue: { color: palette.navy, fontSize: 19, fontWeight: '900', marginTop: 2 },",
            "heroMeta: { color: '#BFD0E8', fontSize: 10, fontWeight: '700', marginTop: 3 },": "heroMeta: { color: '#667085', fontSize: 10.5, fontWeight: '700', marginTop: 3 },",
            "progressRing: { width: 54, height: 54, borderRadius: 27, backgroundColor: '#174A93', borderWidth: 4, borderColor: '#F3C83A', alignItems: 'center', justifyContent: 'center' },": "progressRing: { width: 52, height: 52, borderRadius: 26, backgroundColor: '#EEF5FF', borderWidth: 3, borderColor: '#0B63CE', alignItems: 'center', justifyContent: 'center' },",
            "progressRingText: { color: '#FFF', fontSize: 11, fontWeight: '900' },": "progressRingText: { color: '#0B63CE', fontSize: 11, fontWeight: '900' },",
            "progressTrack: { height: 6, borderRadius: 99, backgroundColor: '#244A7D', overflow: 'hidden', marginTop: 13 },": "progressTrack: { height: 8, borderRadius: 99, backgroundColor: '#E8EEF7', overflow: 'hidden', marginTop: 12 },",
            "progressFill: { height: '100%', backgroundColor: '#F3C83A' },": "progressFill: { height: '100%', backgroundColor: '#0B63CE' },",
            "currentStageCard: { flexDirection: 'row', gap: 10, alignItems: 'center', borderRadius: 16, backgroundColor: '#123D7E', marginTop: 13, padding: 12 },": "currentStageCard: { flexDirection: 'row', gap: 10, alignItems: 'center', borderRadius: 14, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#CFE0FF', marginTop: 11, padding: 11 },",
            "currentStageIcon: { width: 38, height: 38, borderRadius: 12, alignItems: 'center', justifyContent: 'center', backgroundColor: '#24569C' },": "currentStageIcon: { width: 40, height: 40, borderRadius: 13, alignItems: 'center', justifyContent: 'center', backgroundColor: '#EEF5FF' },",
            "currentStageLabel: { color: '#AFC6E9', fontSize: 8, fontWeight: '900', letterSpacing: 0.7 },": "currentStageLabel: { color: '#0B63CE', fontSize: 9.5, fontWeight: '900', letterSpacing: 0.5 },",
            "currentStageTitle: { color: '#FFF', fontSize: 13, fontWeight: '900', marginTop: 1 },": "currentStageTitle: { color: palette.navy, fontSize: 13.5, fontWeight: '900', marginTop: 2 },",
            "currentStageHint: { color: '#C9D8EE', fontSize: 9.5, lineHeight: 13, fontWeight: '600', marginTop: 2 },": "currentStageHint: { color: '#667085', fontSize: 11, lineHeight: 15, fontWeight: '700', marginTop: 3 },",
            "currentStageAction: { paddingHorizontal: 10, paddingVertical: 8, borderRadius: 10, backgroundColor: '#FFF' },": "currentStageAction: { paddingHorizontal: 10, paddingVertical: 8, borderRadius: 10, backgroundColor: palette.navy },",
            "currentStageActionText: { color: '#0A43A3', fontSize: 8.5, fontWeight: '900' },": "currentStageActionText: { color: '#FFFFFF', fontSize: 9, fontWeight: '900' },",
            "infoCard: { borderRadius: 18, backgroundColor: '#FFF', borderWidth: 1, borderColor: '#E1E8F0', padding: 12, marginBottom: 12 },": "infoCard: { borderRadius: 18, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#DCE8F4', padding: 13, marginBottom: 10, shadowColor: palette.navy, shadowOpacity: 0.045, shadowRadius: 9, elevation: 1 },",
            "sectionCard: { borderRadius: 18, backgroundColor: '#FFF', borderWidth: 1, borderColor: '#E1E8F0', padding: 13, marginBottom: 14 },": "sectionCard: { borderRadius: 18, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#DCE8F4', padding: 13, marginBottom: 10, shadowColor: palette.navy, shadowOpacity: 0.045, shadowRadius: 9, elevation: 1 },",
            "timelineCard: { borderRadius: 20, backgroundColor: '#FFF', borderWidth: 1, borderColor: '#E1E8F0', padding: 12, marginBottom: 12 },": "timelineCard: { borderRadius: 18, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#DCE8F4', padding: 13, marginBottom: 10, shadowColor: palette.navy, shadowOpacity: 0.045, shadowRadius: 9, elevation: 1 },",
            "milestoneCard: { flex: 1, marginBottom: 9, padding: 11, borderRadius: 14, backgroundColor: '#F8FAFC', borderWidth: 1, borderColor: '#EEF1F5' },": "milestoneCard: { flex: 1, marginBottom: 9, padding: 11, borderRadius: 14, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#E5ECF5' },",
            "milestoneCardActive: { backgroundColor: '#F2F7FF', borderColor: '#BBD2F3' },": "milestoneCardActive: { backgroundColor: '#EEF5FF', borderColor: '#CFE0FF' },",
            "activityCard: { borderRadius: 18, backgroundColor: '#FFF', borderWidth: 1, borderColor: '#E1E8F0', padding: 13, marginBottom: 12 },": "activityCard: { borderRadius: 18, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#DCE8F4', padding: 13, marginBottom: 10, shadowColor: palette.navy, shadowOpacity: 0.045, shadowRadius: 9, elevation: 1 },"
          }
          missing = []
          for old, new in replacements.items():
            if old not in s:
              missing.append(old[:80])
            else:
              s = s.replace(old, new)
          if missing:
            raise SystemExit('Theme patch anchors missing: ' + ' | '.join(missing))
          p.write_text(s)
      - name: Harmonize self-managed form accents
        shell: python
        run: |
          from pathlib import Path
          files = [
            'apps/mobile-app/app/customer/self-managed-claim.tsx',
            'apps/mobile-app/app/customer/self-managed-spot-status.tsx',
            'apps/mobile-app/app/customer/self-managed-milestone.tsx',
            'apps/mobile-app/app/customer/self-managed-documents.tsx',
          ]
          for name in files:
            p = Path(name)
            s = p.read_text()
            s = s.replace("backgroundColor: '#082A66'", "backgroundColor: palette.navy")
            s = s.replace("backgroundColor: '#0A43A3'", "backgroundColor: palette.navy")
            p.write_text(s)
      - name: Commit theme alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/self-managed-claim-detail.tsx apps/mobile-app/app/customer/self-managed-claim.tsx apps/mobile-app/app/customer/self-managed-spot-status.tsx apps/mobile-app/app/customer/self-managed-milestone.tsx apps/mobile-app/app/customer/self-managed-documents.tsx
          git commit -m "Align self-managed claim UI with managed claim theme"
          git push origin HEAD:feature/self-managed-claims
