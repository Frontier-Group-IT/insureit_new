name: INSUREIT R2 Storage source-manifest parity audit (manual read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insureit-r2-storage-source-parity-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: insureit-production-backup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned R2 verification dependencies
        run: python -m pip install boto3==1.35.99 cryptography==44.0.2
      - name: Compare source Storage LIST inventory with authenticated R2 manifest (no file reads)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_BUCKET: insureit-production-backups
        run: python -u scripts/backup/audit_storage_source_manifest.py
