name: Publish Partner 0.1.0 cumulative OTA once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-partner-0-1-home-hero-reference-once.yml'
      - 'scripts/partner/patch-0-1-home-hero-reference.mjs'
      - 'scripts/partner/patch-0-1-home-refinements.mjs'
      - 'scripts/partner/patch-0-1-business-date-filter.mjs'
      - 'scripts/partner/patch-0-1-policy-intake-network.mjs'
      - 'scripts/partner/compat/partner-business-date-filter.tsx'
      - 'scripts/partner/compat/partner-business-reference-0-1.tsx'
      - 'apps/partner-app/assets/partner/banners/business-growth-11.png'
      - 'scripts/partner/compat/partner-more-reference-0-1.tsx'
      - 'scripts/partner/compat/partner-policies-reference-0-1.tsx'
      - 'apps/partner-app/assets/partner/banners/policies-header-reference.jpg'
      - 'scripts/partner/compat/partner-claims-reference-0-1.tsx'
      - 'apps/partner-app/assets/partner/banners/claims-header-reference.jpg'
      - 'scripts/partner/compat/partner-search-home-reference-0-1.tsx'
      - 'scripts/partner/compat/partner-policy-detail-reference-0-1.tsx'
      - 'scripts/partner/compat/partner-policy-intake-reference-0-1.tsx'
      - 'scripts/partner/patch-0-1-partner-screen-hide-topbar.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
      COMPAT_SHA: 74039199991888777911deb30cf248e8f36cf8a8

    steps:
      - name: Check out current main tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
          fetch-depth: 0

      - name: Check out approved Partner 0.1.0 compatibility source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPAT_SHA }}
          path: compat
          fetch-depth: 0

      - name: Verify exact Partner 0.1.0 compatibility source
        shell: bash
        run: |
          set -euo pipefail
          cd compat
          [ "$(git rev-parse HEAD)" = "$COMPAT_SHA" ] || { echo "Refusing OTA: compatibility checkout is not the approved source." >&2; exit 1; }
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const expo = app.expo || {};
          if (expo.version !== '0.1.0') process.exit(1);
          if (expo?.runtimeVersion?.policy !== 'appVersion') process.exit(1);
          if (expo?.extra?.eas?.projectId !== '8ade82c1-4c96-4f09-b90b-802270fb406d') process.exit(1);
          NODE

      - name: Apply accepted Home hero/status-strip tuning
        shell: bash
        run: |
          set -euo pipefail
          node tooling/scripts/partner/patch-0-1-home-hero-reference.mjs 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "hero: { height: 158" 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "opacity: 0.70, transform: \[{ scale: 0.92 }\]" 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "body: { marginTop: -10" 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "searchShell: { minHeight: 49" 'compat/apps/partner-app/app/(tabs)/index.tsx'

      - name: Apply Home refinements
        shell: bash
        run: |
          set -euo pipefail
          node tooling/scripts/partner/patch-0-1-home-refinements.mjs 'compat/apps/partner-app/app/(tabs)/index.tsx'
          ! grep -q '<Text style={styles.sectionTitle}>Recent Activity</Text>' 'compat/apps/partner-app/app/(tabs)/index.tsx'
          ! grep -q '<Text style={styles.sectionTitle}>Your Impact</Text>' 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "pendingRow: { minHeight: 40" 'compat/apps/partner-app/app/(tabs)/index.tsx'

      - name: Install 0.1-safe Business date filter
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/scripts/partner/compat/partner-business-date-filter.tsx compat/apps/partner-app/components/partner-business-date-filter-compat.tsx
          grep -q 'export function PartnerBusinessDateFilterCompat' compat/apps/partner-app/components/partner-business-date-filter-compat.tsx

      - name: Install current Business layout
        shell: bash
        run: |
          set -euo pipefail
          node tooling/scripts/partner/patch-0-1-partner-screen-hide-topbar.mjs 'compat/apps/partner-app/components/partner-screen.tsx'
          mkdir -p compat/apps/partner-app/assets/partner/banners
          cp tooling/apps/partner-app/assets/partner/banners/business-growth-11.png compat/apps/partner-app/assets/partner/banners/business-growth-11.png
          cp tooling/scripts/partner/compat/partner-business-reference-0-1.tsx 'compat/apps/partner-app/app/(tabs)/business.tsx'
          test -s compat/apps/partner-app/assets/partner/banners/business-growth-11.png
          grep -q "business-growth-11.png" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q "height: 158" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q 'Business Overview' 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q 'Month-wise Trend' 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q 'Business by Product' 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q 'Quick Actions' 'compat/apps/partner-app/app/(tabs)/business.tsx'

      - name: Install ffmpeg for legacy Policies banner normalization
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install current Policies layout
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/scripts/partner/compat/partner-policies-reference-0-1.tsx 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          mkdir -p compat/apps/partner-app/assets/partner/banners
          cp tooling/apps/partner-app/assets/partner/banners/policies-header-reference.jpg compat/apps/partner-app/assets/partner/banners/policies-header-reference.jpg
          ffmpeg -hide_banner -loglevel error -y -i compat/apps/partner-app/assets/partner/banners/policies-header-reference.jpg -frames:v 1 -c:v mjpeg -q:v 2 -pix_fmt yuvj420p /tmp/policies-header-reference.jpg
          mv /tmp/policies-header-reference.jpg compat/apps/partner-app/assets/partner/banners/policies-header-reference.jpg
          grep -q "policies-header-reference.jpg" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q "height: 158" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q 'Manage. Track. Grow.' 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q 'Policy Intake' 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q 'Expiring Soon' 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q 'Lapsed' 'compat/apps/partner-app/app/(tabs)/policies.tsx'

      - name: Install current Claims layout
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/scripts/partner/compat/partner-claims-reference-0-1.tsx 'compat/apps/partner-app/app/(tabs)/claims.tsx'
          mkdir -p compat/apps/partner-app/assets/partner/banners
          cp tooling/apps/partner-app/assets/partner/banners/claims-header-reference.jpg compat/apps/partner-app/assets/partner/banners/claims-header-reference.jpg
          test -s compat/apps/partner-app/assets/partner/banners/claims-header-reference.jpg
          grep -q 'Total Claims' 'compat/apps/partner-app/app/(tabs)/claims.tsx'
          grep -q 'Load More Claims' 'compat/apps/partner-app/app/(tabs)/claims.tsx'
          grep -q "claims-header-reference.jpg" 'compat/apps/partner-app/app/(tabs)/claims.tsx'
          ! grep -q "Support. Settle. Keep" 'compat/apps/partner-app/app/(tabs)/claims.tsx'
          ! grep -q "heroSubtitle" 'compat/apps/partner-app/app/(tabs)/claims.tsx'

      - name: Install current More/Profile layout
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/apps/partner-app/assets/partner-login-logo.png compat/apps/partner-app/assets/partner-login-logo.png
          cp tooling/scripts/partner/compat/partner-more-reference-0-1.tsx 'compat/apps/partner-app/app/(tabs)/more.tsx'
          grep -q 'GROW & LEARN' 'compat/apps/partner-app/app/(tabs)/more.tsx'
          grep -q 'Profile & registration' 'compat/apps/partner-app/app/(tabs)/more.tsx'
          grep -q "heroLogo: { width: 30, height: 35" 'compat/apps/partner-app/app/(tabs)/more.tsx'
          grep -q "<Text style={styles.heroTitle}>Profile</Text>" 'compat/apps/partner-app/app/(tabs)/more.tsx'
          grep -q "height: 158" 'compat/apps/partner-app/app/(tabs)/more.tsx'
          grep -q "top: 30" 'compat/apps/partner-app/app/(tabs)/more.tsx'
          grep -q "bottom: 24" 'compat/apps/partner-app/app/(tabs)/more.tsx'

      - name: Install current Search layout
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/scripts/partner/compat/partner-search-home-reference-0-1.tsx 'compat/apps/partner-app/app/search.tsx'
          grep -q "hero-banner.jpg" 'compat/apps/partner-app/app/search.tsx'
          grep -q "Good Morning" 'compat/apps/partner-app/app/search.tsx'
          grep -q "Search customer, vehicle number or policy number" 'compat/apps/partner-app/app/search.tsx'
          ! grep -q 'eyebrow="SEARCH"' 'compat/apps/partner-app/app/search.tsx'

      - name: Install current Policy Details layout
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/scripts/partner/compat/partner-policy-detail-reference-0-1.tsx 'compat/apps/partner-app/app/policy/[id].tsx'
          grep -q '<Text style={styles.headerEyebrow}>BUSINESS</Text>' 'compat/apps/partner-app/app/policy/[id].tsx'
          grep -q '<Text style={styles.headerTitle}>Policy Details</Text>' 'compat/apps/partner-app/app/policy/[id].tsx'
          grep -q 'Quick Actions' 'compat/apps/partner-app/app/policy/[id].tsx'
          grep -q 'Policy Overview' 'compat/apps/partner-app/app/policy/[id].tsx'
          grep -q 'Customer & Vehicle' 'compat/apps/partner-app/app/policy/[id].tsx'
          ! grep -q 'onBack={() => router.back()}' 'compat/apps/partner-app/app/policy/[id].tsx'

      - name: Install current Send Policy to Operations layout
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/scripts/partner/compat/partner-policy-intake-reference-0-1.tsx 'compat/apps/partner-app/app/policy-intake-new.tsx'
          node tooling/scripts/partner/patch-0-1-policy-intake-network.mjs 'compat/apps/partner-app/app/policy-intake-new.tsx'
          grep -q '<Text style={styles.headerTitle}>Send Policy to Operations</Text>' 'compat/apps/partner-app/app/policy-intake-new.tsx'
          grep -q 'Search partner, lead source or POSP...' 'compat/apps/partner-app/app/policy-intake-new.tsx'
          grep -q '<Text style={styles.sectionTitle}>Lead Source</Text>' 'compat/apps/partner-app/app/policy-intake-new.tsx'
          grep -q '<Text style={styles.cancelText}>Cancel</Text>' 'compat/apps/partner-app/app/policy-intake-new.tsx'
          grep -q '<Text style={styles.continueText}>Continue</Text>' 'compat/apps/partner-app/app/policy-intake-new.tsx'
          ! grep -q 'NEW POLICY INTAKE' 'compat/apps/partner-app/app/policy-intake-new.tsx'
          ! grep -q 'Review details, attach the policy copy, then submit' 'compat/apps/partner-app/app/policy-intake-new.tsx'
          ! grep -q 'onBack={requestClose}' 'compat/apps/partner-app/app/policy-intake-new.tsx'
          ! grep -q 'usePartnerNetwork' 'compat/apps/partner-app/app/policy-intake-new.tsx'

      - name: Require Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN_PARTNER is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: compat/package-lock.json

      - name: Install compatibility dependencies
        working-directory: compat
        run: npm ci --no-audit --no-fund

      - name: Verify Partner app typecheck
        working-directory: compat/apps/partner-app
        run: npx tsc --noEmit

      - name: Verify Expo token and linked Partner project
        working-directory: compat/apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish Partner 0.1.0 cumulative OTA
        working-directory: compat/apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Partner 0.1.0 cumulative Home + Business + Policies + Claims + More + Search + Policy Details + Send Policy" \
            --clear-cache \
            --non-interactive

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Partner 0.1.0 cumulative OTA"
            echo
            echo "- Source baseline: $COMPAT_SHA"
            echo "- Channel: preview"
            echo "- Runtime: 0.1.0"
            echo "- Home refinements: preserved"
            echo "- Business refinements: preserved"
            echo "- Policies refinements: preserved"
            echo "- Claims refinements: preserved"
            echo "- More/Profile refinements: preserved"
            echo "- Search refinements: preserved"
            echo "- Policy Details reference redesign: included"
            echo "- Send Policy to Operations reference redesign: included"
            echo "- Native APK/AAB build: not used"
          } >> "$GITHUB_STEP_SUMMARY"
