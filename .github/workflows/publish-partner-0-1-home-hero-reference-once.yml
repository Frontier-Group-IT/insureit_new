name: Publish Partner 0.1.0 home refinements OTA once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-partner-0-1-home-hero-reference-once.yml'
      - 'scripts/partner/patch-0-1-home-hero-reference.mjs'
      - 'scripts/partner/patch-0-1-home-refinements.mjs'
      - 'scripts/partner/patch-0-1-business-date-filter.mjs'
      - 'scripts/partner/compat/partner-business-date-filter.tsx'
      - 'scripts/partner/compat/partner-business-reference-0-1.tsx'
      - 'apps/partner-app/assets/business-header-reference.jpg'
      - 'scripts/partner/compat/partner-more-reference-0-1.tsx'
      - 'scripts/partner/compat/partner-policies-reference-0-1.tsx'
      - 'apps/partner-app/assets/partner/banners/policies-header-reference.jpg'
      - 'scripts/partner/compat/partner-claims-reference-0-1.tsx'
      - 'scripts/partner/compat/partner-search-home-reference-0-1.tsx'
      - 'scripts/partner/patch-0-1-partner-screen-hide-topbar.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
      COMPAT_SHA: 74039199991888777911deb30cf248e8f36cf8a8

    steps:
      - name: Check out current main tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
          fetch-depth: 0

      - name: Check out approved Partner 0.1.0 compatibility source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPAT_SHA }}
          path: compat
          fetch-depth: 0

      - name: Verify exact Partner 0.1.0 compatibility source
        shell: bash
        run: |
          set -euo pipefail
          cd compat
          [ "$(git rev-parse HEAD)" = "$COMPAT_SHA" ] || {
            echo "Refusing OTA: compatibility checkout is not the approved source." >&2
            exit 1
          }
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const expo = app.expo || {};
          if (expo.version !== '0.1.0') {
            console.error(`Refusing OTA: expected Partner runtime 0.1.0, found ${expo.version ?? 'missing'}.`);
            process.exit(1);
          }
          if (expo?.runtimeVersion?.policy !== 'appVersion') {
            console.error('Refusing OTA: expected appVersion runtime policy.');
            process.exit(1);
          }
          if (expo?.extra?.eas?.projectId !== '8ade82c1-4c96-4f09-b90b-802270fb406d') {
            console.error('Refusing OTA: unexpected Partner EAS project ID.');
            process.exit(1);
          }
          NODE

      - name: Apply accepted hero/status-strip tuning
        shell: bash
        run: |
          set -euo pipefail
          node tooling/scripts/partner/patch-0-1-home-hero-reference.mjs 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "edges={\['top'\]}" 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "safeArea: { flex: 1, backgroundColor: '#F4F6F9' }" 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q 'Feather name="clock" size={17}' 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "hero: { height: 158" 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "opacity: 0.70, transform: \[{ scale: 0.92 }\]" 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "body: { marginTop: -10" 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "searchShell: { minHeight: 49" 'compat/apps/partner-app/app/(tabs)/index.tsx'

      - name: Apply Home refinement patch
        shell: bash
        run: |
          set -euo pipefail
          node tooling/scripts/partner/patch-0-1-home-refinements.mjs 'compat/apps/partner-app/app/(tabs)/index.tsx'
          if grep -q '<Text style={styles.sectionTitle}>Recent Activity</Text>' 'compat/apps/partner-app/app/(tabs)/index.tsx'; then
            echo "Recent Activity still present on Home after refinement patch." >&2
            exit 1
          fi
          if grep -q '<Text style={styles.sectionTitle}>Your Impact</Text>' 'compat/apps/partner-app/app/(tabs)/index.tsx'; then
            echo "Your Impact still present on Home after refinement patch." >&2
            exit 1
          fi
          grep -q "backgroundColor: 'rgba(3,30,68,0.42)'" 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "policyAdd: require('../../assets/generated-dashboard/policy-add.png')" 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q '<QuickAction asset={GeneratedDashboardAssets.policyAdd} imageScale={1.22} label="Policy Intake"' 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q 'imageScale = 1' 'compat/apps/partner-app/app/(tabs)/index.tsx'
          grep -q "pendingRow: { minHeight: 40" 'compat/apps/partner-app/app/(tabs)/index.tsx'

      - name: Install 0.1-safe Business Report date-filter component
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/scripts/partner/compat/partner-business-date-filter.tsx \
            compat/apps/partner-app/components/partner-business-date-filter-compat.tsx
          grep -q 'export function PartnerBusinessDateFilterCompat' \
            compat/apps/partner-app/components/partner-business-date-filter-compat.tsx

      - name: Install reference-style Business layout for runtime 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          node tooling/scripts/partner/patch-0-1-partner-screen-hide-topbar.mjs \
            'compat/apps/partner-app/components/partner-screen.tsx'
          cp tooling/apps/partner-app/assets/business-header-reference.jpg \
            compat/apps/partner-app/assets/business-header-reference.jpg

          # Use the verified Business JPEG bytes directly. This exact asset
          # previously passed the Partner Expo web review build; re-decoding it
          # with ffmpeg is both unnecessary and is what blocked the shared 0.1 OTA.
          test -s compat/apps/partner-app/assets/business-header-reference.jpg
          file compat/apps/partner-app/assets/business-header-reference.jpg | grep -q 'JPEG image data'

          cp tooling/scripts/partner/compat/partner-business-reference-0-1.tsx \
            'compat/apps/partner-app/app/(tabs)/business.tsx'
          test -s compat/apps/partner-app/assets/business-header-reference.jpg
          grep -q "business-header-reference.jpg" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q "height: 158" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q "left: '-6%'" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q "top: -8" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q "width: '112%'" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q "height: 182" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q "opacity: 0.70" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -Fq "transform: [{ scale: 0.92 }]" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q "marginTop: -10" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q "height: 49" 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q 'hideTopBar' 'compat/apps/partner-app/components/partner-screen.tsx'
          grep -q 'Business Overview' 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q 'Month-wise Trend' 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q 'Business by Product' 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q 'Quick Actions' 'compat/apps/partner-app/app/(tabs)/business.tsx'
          grep -q 'PartnerBusinessDateFilterCompat' 'compat/apps/partner-app/app/(tabs)/business.tsx'
          test -s compat/apps/partner-app/assets/business-header-reference.jpg
          grep -q "business-header-reference.jpg" 'compat/apps/partner-app/app/(tabs)/business.tsx'

      - name: Install current Policies layout for runtime 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/scripts/partner/compat/partner-policies-reference-0-1.tsx \
            'compat/apps/partner-app/app/(tabs)/policies.tsx'
          mkdir -p compat/apps/partner-app/assets/partner/banners

          cp tooling/apps/partner-app/assets/partner/banners/policies-header-reference.jpg \
            compat/apps/partner-app/assets/partner/banners/policies-header-reference.jpg

          test -s compat/apps/partner-app/assets/partner/banners/policies-header-reference.jpg
          file compat/apps/partner-app/assets/partner/banners/policies-header-reference.jpg | grep -q 'JPEG image data'

          # The supplied banner is a progressive JPEG. The legacy Expo 0.1 asset
          # pipeline cannot read it reliably, so normalize the copied compatibility
          # asset to a baseline JPEG before Metro exports the OTA bundle.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y \
            -i compat/apps/partner-app/assets/partner/banners/policies-header-reference.jpg \
            -frames:v 1 -c:v mjpeg -q:v 2 -pix_fmt yuvj420p \
            /tmp/policies-header-reference.jpg
          mv /tmp/policies-header-reference.jpg \
            compat/apps/partner-app/assets/partner/banners/policies-header-reference.jpg
          test -s compat/apps/partner-app/assets/partner/banners/policies-header-reference.jpg
          file compat/apps/partner-app/assets/partner/banners/policies-header-reference.jpg | grep -q 'JPEG image data'
          grep -q "policies-header-reference.jpg" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q "height: 158" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q "left: '-6%'" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q "width: '112%'" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q "height: 182" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q "opacity: 0.55" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q "insureit-partner-official.png" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q 'Feather name="clock" size={17}' 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q "heroTitle: { color: '#FFFFFF', fontSize: 14" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -Fq "transform: [{ scale: 0.92 }]" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q "marginTop: -10" 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q 'Manage. Track. Grow.' 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q 'Policy Intake' 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q 'Load More Policies' 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q 'Expiring Soon' 'compat/apps/partner-app/app/(tabs)/policies.tsx'
          grep -q 'Lapsed' 'compat/apps/partner-app/app/(tabs)/policies.tsx'

      - name: Install reference-style More layout for runtime 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/apps/partner-app/assets/partner-login-logo.png \
            compat/apps/partner-app/assets/partner-login-logo.png
          cp tooling/scripts/partner/compat/partner-more-reference-0-1.tsx \
            'compat/apps/partner-app/app/(tabs)/more.tsx'
          grep -q 'GROW & LEARN' 'compat/apps/partner-app/app/(tabs)/more.tsx'
          grep -q 'Profile & registration' 'compat/apps/partner-app/app/(tabs)/more.tsx'
          grep -q 'Settings & app info' 'compat/apps/partner-app/app/(tabs)/more.tsx'

      - name: Install reference-style Claims layout for runtime 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/scripts/partner/compat/partner-claims-reference-0-1.tsx \
            'compat/apps/partner-app/app/(tabs)/claims.tsx'
          grep -q 'Support. Settle. Keep' 'compat/apps/partner-app/app/(tabs)/claims.tsx'
          grep -q 'Total Claims' 'compat/apps/partner-app/app/(tabs)/claims.tsx'
          grep -q 'Load More Claims' 'compat/apps/partner-app/app/(tabs)/claims.tsx'
          grep -q "partner-login-logo.png" 'compat/apps/partner-app/app/(tabs)/claims.tsx'

      - name: Install Home-style Search layout for runtime 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          cp tooling/scripts/partner/compat/partner-search-home-reference-0-1.tsx \
            'compat/apps/partner-app/app/search.tsx'
          grep -q "hero-banner.jpg" 'compat/apps/partner-app/app/search.tsx'
          grep -q "Good Morning" 'compat/apps/partner-app/app/search.tsx'
          grep -q "Search customer, vehicle number or policy number" 'compat/apps/partner-app/app/search.tsx'
          if grep -q 'eyebrow="SEARCH"' 'compat/apps/partner-app/app/search.tsx'; then
            echo "Legacy Search top bar is still present." >&2
            exit 1
          fi
          if grep -q 'PartnerSearchField' 'compat/apps/partner-app/app/search.tsx'; then
            echo "Legacy standalone Search field is still present." >&2
            exit 1
          fi

      - name: Require Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN_PARTNER is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: compat/package-lock.json

      - name: Install compatibility dependencies
        working-directory: compat
        run: npm ci --no-audit --no-fund

      - name: Verify Partner app typecheck
        working-directory: compat/apps/partner-app
        run: npx tsc --noEmit

      - name: Verify Expo token and linked Partner project
        working-directory: compat/apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish Partner 0.1.0 home refinements OTA
        working-directory: compat/apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Partner 0.1.0 Business + Policies + Claims + More reference layouts" \
            --clear-cache \
            --non-interactive

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Partner 0.1.0 home refinements OTA"
            echo
            echo "- Source baseline: $COMPAT_SHA"
            echo "- Channel: preview"
            echo "- Runtime: 0.1.0"
            echo "- Home: Policy Intake quick-action visible icon scaled to match the other Quick Action icons; prior hero/compact-home refinements preserved"
            echo "- Business Report: reference-style compact dashboard layout + JS-only date range preserved"
            echo "- Policies: user-supplied banner with exact approved Home hero geometry, KPI cards, Policy Intake CTA, compact lifecycle tabs and dense policy cards"
            echo "- Claims: reference-style hero, official existing Partner logo, search/filter controls, KPI cards, lifecycle tabs, dense claim cards and manual Load More"
            echo "- More: reference-style branded header, grouped sections, Home-matched typography and account actions"
            echo "- Search: Home-matched hero, greeting, activity/profile actions and floating search field on runtime 0.1.0"
            echo "- No native build or dependency change"
          } >> "$GITHUB_STEP_SUMMARY"
