name: Temporary Assessment Report simplifier

on:
  push:
    branches:
      - ui/delivery-order-assessment-documents

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/delivery-order-assessment-documents
      - name: Keep only Assessment Report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile-app/app/customer/self-managed-milestone.tsx')
          s = p.read_text()
          s = s.replace("type DeliveryOrderDocumentKey = 'assessment_upload' | 'assessment_report';", "type DeliveryOrderDocumentKey = 'assessment_report';")
          s = s.replace("const ASSESSMENT_UPLOAD_DOCUMENT_TYPE = 'Assessment Upload';\n", "")
          s = s.replace(".in('document_type', [ASSESSMENT_UPLOAD_DOCUMENT_TYPE, ASSESSMENT_REPORT_DOCUMENT_TYPE])", ".eq('document_type', ASSESSMENT_REPORT_DOCUMENT_TYPE)")
          s = s.replace("  const assessmentUpload = documents.find((item) => item.document_type === ASSESSMENT_UPLOAD_DOCUMENT_TYPE) ?? null;\n", "")
          s = s.replace("  const documentFor = (key: DeliveryOrderDocumentKey) => key === 'assessment_upload' ? assessmentUpload : assessmentReport;", "  const documentFor = (_key: DeliveryOrderDocumentKey) => assessmentReport;")
          s = s.replace("    const documentType = key === 'assessment_upload' ? ASSESSMENT_UPLOAD_DOCUMENT_TYPE : ASSESSMENT_REPORT_DOCUMENT_TYPE;", "    const documentType = ASSESSMENT_REPORT_DOCUMENT_TYPE;")
          s = s.replace("  const tiles: Array<{ key: DeliveryOrderDocumentKey; title: string; icon: keyof typeof MaterialCommunityIcons.glyphMap }> = [\n    { key: 'assessment_upload', title: 'Assessment Upload', icon: 'file-upload-outline' },\n    { key: 'assessment_report', title: 'Assessment Report', icon: 'file-document-check-outline' },\n  ];", "  const tiles: Array<{ key: DeliveryOrderDocumentKey; title: string; icon: keyof typeof MaterialCommunityIcons.glyphMap }> = [\n    { key: 'assessment_report', title: 'Assessment Report', icon: 'file-document-check-outline' },\n  ];")
          s = s.replace('<View style={styles.approvalDocumentsBadge}><Text style={styles.approvalDocumentsBadgeText}>2 ITEMS</Text></View>', '<View style={styles.approvalDocumentsBadge}><Text style={styles.approvalDocumentsBadgeText}>1 ITEM</Text></View>')
          s = s.replace('Upload Delivery Order assessment documents', 'Upload the Delivery Order assessment report')
          s = s.replace('PDF and image files up to 10 MB each. Selected files upload immediately to Claim Documents.', 'PDF or image up to 10 MB. The selected Assessment Report uploads immediately to Claim Documents.')
          p.write_text(s)
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/self-managed-milestone.tsx
          git commit -m "Keep only Assessment Report in Delivery Order documents"
          git push origin HEAD:ui/delivery-order-assessment-documents
