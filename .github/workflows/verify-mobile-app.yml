name: Verify mobile app

on:
  push:
    branches:
      - feature/self-managed-claims
      - feature/self-managed-production-integration-v2
      - feature/self-managed-production-integration-v3
    paths:
      - 'apps/mobile-app/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-mobile-app.yml'
  pull_request:
    paths:
      - 'apps/mobile-app/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-mobile-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-mobile-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-public-anon-key' }}

jobs:
  verify:
    name: typecheck, lint and Expo web review build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Detect generated lockfile changes
        id: lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated lockfile for repair
        if: steps.lockfile.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Require synchronized dependency lockfile
        if: steps.lockfile.outputs.changed == 'true'
        shell: bash
        run: |
          echo "::error::package-lock.json is out of sync with package.json. Download the generated-package-lock artifact and commit it."
          git diff -- package-lock.json
          exit 1

      - name: Mobile typecheck
        run: npm run typecheck:mobile

      - name: Mobile lint
        run: npm run lint:mobile

      - name: Customer notification bell panel regression
        run: node apps/mobile-app/scripts/customer-notification-panel-regression.mjs

      - name: Customer Add Vehicle Policy Type regression
        run: node apps/mobile-app/scripts/customer-add-vehicle-policy-type-regression.mjs

      - name: Customer Start Claim OTA regression
        run: node apps/mobile-app/scripts/customer-start-claim-ota-regression.mjs

      - name: Customer internal claim video upload regression
        run: node apps/mobile-app/scripts/customer-internal-video-upload-regression.mjs

      - name: Customer claim video Camera and Gallery/File regression
        run: node apps/mobile-app/scripts/customer-claim-video-source-regression.mjs

      - name: Customer verified voice note UI regression
        run: node apps/mobile-app/scripts/customer-verified-voice-note-ui-regression.mjs

      - name: Managed claim card parity regression
        run: node apps/mobile-app/scripts/managed-claim-card-parity-regression.mjs

      - name: Build Expo web review export
        run: npm run build:mobile:web

      - name: Upload browser review build
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-review-${{ github.sha }}
          path: apps/mobile-app/dist-web
          if-no-files-found: error
          retention-days: 14

      - name: Verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mobile app review gate"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Dependency lockfile: must remain synchronized"
            echo "- Static checks: TypeScript typecheck and Expo lint"
            echo "- Add Vehicle regression: Policy Type is absent from the Customer Add Vehicle UI while vehicle-linked policy creation remains Motor-backed"
            echo "- Start Claim / production OTA regression: Draft persistence precedes navigation and downloaded startup updates are activated"
            echo "- Internal claim video regression: multi-select, 3-way concurrency, verification/re-upload guards, 50 MB limit and resumable upload contract remain intact"
            echo "- Claim video source regression: internal and external Accident Video flows offer Camera and Gallery / File while reusing the installed expo-image-picker native capability"
            echo "- Verified voice-note regression: verified audio uses the green locked card, hides destructive actions and plays from the Voice note ready row"
            echo "- Managed claim card parity: Sankalp managed and external cards share compact layout and animated status treatment"
            echo "- Review build: Expo web export"
            echo "- Artifact: \`mobile-web-review-${GITHUB_SHA}\` (retained for 14 days after a green run)"
            echo "- Production deployment: not triggered by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
