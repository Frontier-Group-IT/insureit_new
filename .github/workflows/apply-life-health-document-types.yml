name: Apply Life Health document types

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260929062841_extend_life_health_case_document_types.sql'
      - '.github/workflows/apply-life-health-document-types.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Verify Life Health document type schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260929062841_extend_life_health_case_document_types.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Life Health document migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260929062841'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260929062841_extend_life_health_case_document_types.sql
            supabase migration repair --linked --status applied 20260929062841
          fi

      - name: Verify Life Health document type constraint
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              convalidated as validated,
              pg_get_constraintdef(oid) like '%kyc%' as kyc_allowed,
              pg_get_constraintdef(oid) like '%other_document%' as other_document_allowed
            from pg_constraint
            where conrelid = 'public.life_health_case_documents'::regclass
              and conname = 'life_health_case_documents_document_type_check';
          ")
          echo "$result"
          echo "$result" | grep -Eq '"validated"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"kyc_allowed"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"other_document_allowed"[[:space:]]*:[[:space:]]*true'
