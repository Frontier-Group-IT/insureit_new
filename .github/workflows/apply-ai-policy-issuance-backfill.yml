name: Apply AI Policy Intake issuance-date draft backfill

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20261117193000_verified_ai_draft_issuance_backfill.sql'
      - '.github/workflows/apply-ai-policy-issuance-backfill.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply AI Policy Intake issuance-date draft backfill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20261117193000_verified_ai_draft_issuance_backfill.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20261117193000'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20261117193000_verified_ai_draft_issuance_backfill.sql
            supabase migration repair --linked --status applied 20261117193000
          fi

      - name: Verify service-role-only issuance-date function
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.fill_verified_ai_draft_issuance_date_v1(uuid,uuid,text,date)') is not null as function_exists,
              has_function_privilege('service_role','public.fill_verified_ai_draft_issuance_date_v1(uuid,uuid,text,date)','execute') as service_exec,
              has_function_privilege('authenticated','public.fill_verified_ai_draft_issuance_date_v1(uuid,uuid,text,date)','execute') as auth_exec;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_exists"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"service_exec"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"auth_exec"[[:space:]]*:[[:space:]]*false'
