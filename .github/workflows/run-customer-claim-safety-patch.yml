name: Run Customer claim safety patch

on:
  push:
    branches:
      - customer/canonical-0-3-0-production-baseline
    paths:
      - '.github/workflows/run-customer-claim-safety-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer/canonical-0-3-0-production-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped Customer fixes
        run: python scripts/apply_customer_claim_safety_fixes.py
      - name: Validate patch
        run: |
          git diff --check
          if grep -q "claim_milestones.*upsert" apps/mobile-app/app/customer/internal-spot-status.tsx; then
            echo "Managed Stage 2 still writes claim_milestones"
            exit 1
          fi
      - name: Commit scoped changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile-app/app/customer/start-claim.tsx apps/mobile-app/components/internal-claim-stage-one.tsx apps/mobile-app/components/internal-claim-stage-one-tracker.tsx apps/mobile-app/app/customer/internal-spot-status.tsx
          git commit -m 'Fix canonical Customer claim regressions'
          git push origin HEAD:customer/canonical-0-3-0-production-baseline
