name: Fix legacy remarks and pending state

on:
  push:
    branches:
      - fix/legacy-remarks-pending-toast

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-remarks-pending-toast
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix_legacy_remarks_pending_toast.py
      - run: npm ci
      - run: npm run typecheck:web
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal .github/scripts/fix_legacy_remarks_pending_toast.py
          git commit -m "Remove legacy remarks and show pending redirects"
          git push origin HEAD:fix/legacy-remarks-pending-toast
