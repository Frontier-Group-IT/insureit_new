name: temp remove registration training subtitles

on:
  push:
    paths:
      - .github/workflows/temp-remove-registration-training-subtitles.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch stage subtitles
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-portal/app/intermediaries/applications/training-exam-stage.tsx')
          text = path.read_text()

          replacements = [
              (
                  '<ProcessSection id="registration-requirement" number="3" title="Registration" subtitle="Download the generated form and upload the signed copy." state=',
                  '<ProcessSection id="registration-requirement" number="3" title="Registration" state=',
              ),
              (
                  '<ProcessSection id="training-requirement" number="4" title={isIcall ? "Training & Examination" : "Training"} subtitle={isIcall ? "Register, track training progress and fetch the final exam result from iCall." : "Assign and track training."} state=',
                  '<ProcessSection id="training-requirement" number="4" title={isIcall ? "Training & Examination" : "Training"} state=',
              ),
              (
                  'subtitle: string; state: "current" | "completed";',
                  'subtitle?: string; state: "current" | "completed";',
              ),
              (
                  '<p className="mt-0.5 text-[9px] text-[#64748B]">{subtitle}</p>',
                  '{subtitle ? <p className="mt-0.5 text-[9px] text-[#64748B]">{subtitle}</p> : null}',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source not found: {old}')
              text = text.replace(old, new, 1)

          if 'Download the generated form and upload the signed copy.' in text:
              raise SystemExit('Registration subtitle still present')
          if 'Register, track training progress and fetch the final exam result from iCall.' in text:
              raise SystemExit('Training subtitle still present')

          path.write_text(text)
          PY
          git diff --check
      - name: Commit focused change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/intermediaries/applications/training-exam-stage.tsx
          git rm .github/workflows/temp-remove-registration-training-subtitles.yml
          git commit -m "Remove registration and training stage subtitles"
          git push
