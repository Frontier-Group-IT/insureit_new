name: Temporary reorder policy sidebar bottom

on:
  push:
    paths:
      - scripts/temp_reorder_policy_sidebar_bottom.py
      - .github/workflows/temp-reorder-policy-sidebar-bottom.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply sidebar reorder
        run: python scripts/temp_reorder_policy_sidebar_bottom.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -Fq '<SummaryRow label="Partner payout" value={money.format(grossPayout)} bold/><SummaryRow label="Retention"' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Reorder policy sidebar payout rows"
            git pull --rebase origin main
            git push origin main
          fi
