name: Extract customer 3D icons from approved ZIP
on:
  push:
    branches:
      - fix/customer-3d-icons-zip-mapping-20261103
    paths:
      - .github/workflows/extract-customer-3d-icons.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and validate approved PNG icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          source = Path('apps/web-portal/public/assets/insurance_icons_transparent_pngs.zip')
          target = Path('apps/web-portal/public/assets/customer-3d-icons')
          expected = {'insurance_quote','my_vehicles','renewals','vehicle_exchange','e_challan','support','profile','settings','vehicle_register','brand_new_vehicle','mobile','email','location','total_documents','policy_related','claims','vehicle_and_policy','payments','other_queries','help_and_support'}
          with ZipFile(source) as z:
              names = [n for n in z.namelist() if not n.endswith('/')]
              assert len(names) == 20, f'Expected 20, found {len(names)}'
              actual = {Path(n).stem for n in names}
              assert actual == expected, f'Mismatch: {actual ^ expected}'
              target.mkdir(parents=True, exist_ok=True)
              for name in names:
                  filename = Path(name).name
                  assert filename.endswith('.png') and '/' not in name.strip('/'), f'Unexpected path {name}'
                  content = z.read(name)
                  assert content.startswith(b'\x89PNG\r\n\x1a\n') and len(content) > 1000, f'Invalid PNG: {name}'
                  (target / filename).write_bytes(content)
                  print(filename, len(content))
          PY
      - name: Commit extracted PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/public/assets/customer-3d-icons/
          if ! git diff --cached --quiet; then
            git commit -m "Add 20 approved customer 3D PNG icon assets"
            git push origin HEAD:fix/customer-3d-icons-zip-mapping-20261103
          fi
