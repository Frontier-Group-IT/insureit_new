name: Temporary remove policy header metadata

on:
  push:
    paths:
      - scripts/temp_remove_policy_header_meta.py
      - .github/workflows/temp-remove-policy-header-meta.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply header cleanup
        run: python scripts/temp_remove_policy_header_meta.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          ! grep -q 'Database enabled' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'Creates or links the customer and vehicle, then books the policy and financial details in one transaction.' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Remove policy onboarding header metadata"
            git push
          fi
