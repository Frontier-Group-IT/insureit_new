name: Apply Partner insurer claim number migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20261029113000_partner_insurer_claim_number_after_intimation.sql'
      - '.github/workflows/apply-partner-insurer-claim-number.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner insurer claim number migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact current main and configuration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply scoped claim number RPC
        run: supabase db query --linked --file supabase/migrations/20261029113000_partner_insurer_claim_number_after_intimation.sql
      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20261029113000
      - name: Verify scoped claim number RPC
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.partner_app_save_insurer_claim_number(uuid,text)') is not null as rpc_ready,
              has_function_privilege('authenticated','public.partner_app_save_insurer_claim_number(uuid,text)','EXECUTE') as authenticated_execute,
              position('partner_app_claim_in_scope' in pg_get_functiondef('public.partner_app_save_insurer_claim_number(uuid,text)'::regprocedure)) > 0 as partner_scope_enforced
          ")
          echo "$result"
          echo "$result" | grep -Eq '"rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"authenticated_execute"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"partner_scope_enforced"[[:space:]]*:[[:space:]]*true'
