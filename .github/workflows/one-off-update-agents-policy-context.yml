name: One-off update AGENTS policy context

on:
  push:
    paths:
      - '.github/workflows/one-off-update-agents-policy-context.yml'

permissions:
  contents: write

jobs:
  update-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Insert durable Policy Onboarding and AuthBridge context
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          source = path.read_text()
          marker = '## Production readiness protocol\n'
          if marker not in source:
              raise SystemExit('AGENTS insertion marker not found')

          section = r'''## Policy Onboarding current operating context

This section records the current durable state of the Add Policy workflow so future agents edit the component that is actually rendered and preserve the approved UI/API behavior.

### Rendered route and source-of-truth files

- **VERIFIED:** `/policies/new` renders `PolicyFormAuthbridge` from `apps/web-portal/components/policy-form-authbridge.tsx`; it does **not** render `apps/web-portal/components/policy-form.tsx`.
- The route is `apps/web-portal/app/policies/new/page.tsx` and also renders `PolicyOcrImportPanel`.
- **LEARNING:** before changing any visible page, trace the route import tree and confirm the exact rendered component. Do not assume a similarly named component is live. A previous edit was applied to `policy-form.tsx`, deployed successfully, and produced no visible Add Policy change because the live route used `policy-form-authbridge.tsx`.
- When the user says a deployed UI change is not visible, verify: current `main` source, route import, rendered component, deployment source commit, and Vercel final status before blaming browser cache.

### Approved Add Policy UI decisions

The live Add Policy form must currently preserve these user-approved decisions unless the user explicitly changes them:

- Section 01 label is **Policy Type**, not Business Line. Current value list contains `Motor`.
- Intermediary Type options are `POSP`, `MISP`, and `SIBL / Partner`. Do not restore `Direct` without approval.
- Section 04 is **Projected insurer pay-in**.
- `OD / NET basis` is not shown on the main Policy Onboarding page.
- `Retention` belongs in Section 04 Projected insurer pay-in, not in intermediary payout/settlement.
- Billing/reconciliation fields are intentionally removed from the main Policy Onboarding page for a later dedicated billing page. Do not re-add Pay-in Bill Number, Pay-in Billed Amount, Pay-in Bill Date, Pay-in Status, or Short Payout to the main form without approval.
- The **Live Summary** card itself should remain sticky on desktop (`position: sticky` / Tailwind equivalent with a top offset). The other sidebar cards should scroll normally.
- Policy Onboarding is customer/vehicle tolerant: the booking flow may link an existing customer/vehicle or create missing records during final onboarding. Preserve conflict/review handling rather than forcing customer-first data entry.

### AuthBridge Detailed RC response shape and mapping

The verified decrypted AuthBridge Detailed RC service 372 response places provider data under `data.msg` with these sections:

- `Registration Details`
- `Vehicle Details`
- `Owners Details`
- `Insurance Details`
- `Hypothecation Details`
- `RC Status`

Map from those exact sections. Do not flatten the response and guess generic aliases when an exact key is available.

Important verified provider keys used by Policy Onboarding include:

- Registration: `Registration Number`, `Registration Date`, `RTO`, `Status`, `Status As On`, `Fitness Date/RC Expiry Date`, `Tax Upto`, `Vehicle Tax Up to`.
- Vehicle: `Vehicle Class`, `Vehicle Category`, `Maker/Manufacturer`, `Model / Makers Class`, `Fuel Type`, `Manufacture Date`, `Engine Capacity`, `Gross Weight`, `Unloading Weight`, `Seating Capacity`, `Vehicle Standing Capacity`, `sleeper Capacity`, `Wheel Base`, `No of cylinder`, `Body Type`, `Color`, `Norms Type`, `Chassis Number`, `Engine Number`, `Is Commercial`.
- Owner: `Owners Name`, present/permanent address city, district, state and pincode fields, plus address strings when needed by the approved workflow.
- Insurance: `Insurance Company`, `Policy Number`, `Insurance To Date/Insurance Upto`.
- Hypothecation: `Financed`, `Financer Name`.
- RC status/compliance: permit, national permit and PUCC fields when returned.

Policy-form capacity mapping is class-dependent:

- PCP / TWP → Engine Capacity / CC
- PCV → Seating Capacity
- GCV → Gross Weight / GVW
- MISD → Vehicle Category first, then CC/GVW fallback as appropriate
- CPM → Gross Weight / equipment-capacity fallback pending any more specific approved source

The AuthBridge review UI should expose useful returned RC fields in structured sections and hide empty/`NA` values rather than showing a wall of missing values. Current useful groups are Vehicle Summary, Technical Details, Registration & Compliance, Existing Insurance, Hypothecation, Permit details, and Owner summary/address where required.

### AuthBridge apply behavior and data handling

- Use an explicit `Fetch RC details` action; never trigger provider calls per keystroke.
- Show the provider result in a review modal before applying fields.
- Applying RC data should populate only blank/manual-safe fields by default and preserve existing user-entered values unless the user explicitly chooses a replacement/conflict action.
- The approved internal portal may display and populate the full chassis and engine numbers returned by AuthBridge. They do not need UI masking on this internal workflow. This approval does **not** permit logging, committing, or storing real chassis/engine values in repository context files, fixtures, screenshots, or debug logs.
- Existing RC insurance information is reference-only for the new policy being booked and must not silently overwrite the policy being entered.
- Keep gateway credentials and AuthBridge secrets server-side even though the portal is internal and the gateway uses controlled infrastructure/static IP. Internal-only status is not a reason to expose secrets to the browser.

### Policy Onboarding implementation and deployment evidence

- The corrected live-component UI changes were implemented in commit `6e42df35d4784e6ada57eda324d5dac86188803c` (`policy-form-authbridge.tsx`).
- The corrective production trigger commit was `1a767b8a5ad539d5e64f03355479435f2c3d6e74`.
- **DEPLOYED / VERIFIED:** GitHub/Vercel status for that corrective deployment reached `success`. This verifies that deployment, not every later `main` commit.
- Ordinary commits still do not deploy automatically. For any later release, update `.deploy/production-trigger.json` only after the user explicitly requests deployment, then verify the exact new deployment reaches Vercel success before reporting it live.

'''

          if '## Policy Onboarding current operating context\n' in source:
              raise SystemExit('Policy Onboarding context section already exists')

          path.write_text(source.replace(marker, section + marker, 1))
          PY

      - name: Commit AGENTS context update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          git commit -m "Document current Policy Onboarding and AuthBridge context"
          git push origin main
