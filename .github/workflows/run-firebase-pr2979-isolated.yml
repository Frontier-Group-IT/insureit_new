name: Run Firebase PR2979 isolated verification
on:
  push:
    branches:
      - ci/run-customer-firebase-pr2979-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firebase-pr-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-firebase-otp-direct-2026-10-08
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Firebase backend and native source regression tests
        run: |
          node --test \
            apps/mobile-app/lib/firebase-otp-readiness.test.cjs \
            apps/mobile-app/lib/firebase-native-phone-flow.test.cjs \
            apps/mobile-app/lib/firebase-data-client.test.cjs \
            pocs/customer-firebase-auth/sql-draft.test.cjs \
            pocs/customer-firebase-auth/server-identity-binding.test.cjs \
            pocs/customer-firebase-auth/firebase-admin-verifier.test.cjs \
            pocs/customer-firebase-auth/firebase-binding-backend.test.cjs \
            pocs/customer-firebase-auth/supabase-identity-store.test.cjs \
            pocs/customer-firebase-auth/android-config.test.cjs \
            pocs/customer-firebase-auth/edge-binding-source.test.cjs \
            pocs/customer-firebase-auth/auth-uid-compatibility.test.cjs \
            pocs/customer-firebase-auth/signup-edge-source.test.cjs \
            pocs/customer-firebase-auth/doc-read-edge-source.test.cjs \
            pocs/customer-firebase-auth/mobile-document-client-source.test.cjs \
            pocs/customer-firebase-auth/customer-identity-source.test.cjs \
            pocs/customer-firebase-auth/upload-ticket-edge-source.test.cjs \
            pocs/customer-firebase-auth/upload-client-source.test.cjs \
            pocs/customer-firebase-auth/customer-auth-route-source.test.cjs \
            apps/mobile-app/lib/firebase-android-auth-adapter.test.cjs
      - name: Validate staging isolation smoke runner syntax
        run: node --check pocs/customer-firebase-auth/staging-customer-isolation.mjs
      - name: Complete Customer App workspace TypeScript checks
        run: npm run typecheck:mobile

# Validate feature-gated Android Firebase login and fallback paths (2026-10-10).

# 2026-10-10: customer policy route typecheck correction and claim document integration.

# CI: validate all routed customer screens, signed claim uploads and restored Firebase startup.

# Verify Firebase customer add-policy and add-vehicle flows against entire mobile app.

# Validate Firebase customer profile, policy and vehicle onboarding with native workspace types.

# Run Customer App KYC identity integration for individual, corporate, dealership and group.

# 2026-10-10 claim assistance, support conversations and customer KYC latest source check.

# Validate self-managed claim write, upload and customer session routes.
