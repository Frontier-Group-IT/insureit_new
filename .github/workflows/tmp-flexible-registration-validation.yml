name: Apply flexible registration validation
on:
  push:
    paths:
      - '.github/workflows/tmp-flexible-registration-validation.yml'
jobs:
  apply-change:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/flexible-policy-registration-validation
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update frontend and server registration validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          frontend = Path('apps/web-portal/components/policy-unified-form.tsx')
          text = frontend.read_text()
          replacements = [
              (
                  'function normalizeRegistrationInput(value:string){return value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,10);}',
                  'function normalizeRegistrationInput(value:string){return value.toUpperCase().replace(/[^A-Z0-9]/g,"");}'
              ),
              (
                  'function isValidRegisteredVehicleNumber(value:string){return /^[A-Z]{2}[A-Z0-9]{6}[0-9]{2}$/.test(value);}',
                  'function isValidRegisteredVehicleNumber(value:string){return /^[A-Z]{2}[A-Z0-9]*[0-9]{2}$/.test(value);}'
              ),
              (
                  'const registrationValidationMessage="Enter a valid 10-character registration number: first 2 letters and last 2 digits.";',
                  'const registrationValidationMessage="Enter a valid registration number starting with 2 letters and ending with 2 digits.";'
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one frontend match, found {count}: {old}')
              text = text.replace(old, new, 1)
          frontend.write_text(text)

          server = Path('apps/web-portal/app/policies/policy-onboarding-actions.ts')
          text = server.read_text()
          old = 'if (mode === "registered" && !/^[A-Z]{2}[A-Z0-9]{6}[0-9]{2}$/.test(rawRegistration)) return "Enter a valid 10-character vehicle registration number with 2 letters at the start and 2 digits at the end.";'
          new = 'if (mode === "registered" && !/^[A-Z]{2}[A-Z0-9]*[0-9]{2}$/.test(rawRegistration)) return "Enter a valid vehicle registration number starting with 2 letters and ending with 2 digits.";'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one server match, found {count}')
          server.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-flexible-registration-validation.yml
          git add apps/web-portal/components/policy-unified-form.tsx apps/web-portal/app/policies/policy-onboarding-actions.ts .github/workflows/tmp-flexible-registration-validation.yml
          git commit -m "Allow variable-length registered vehicle numbers"
          git push origin HEAD:feature/flexible-policy-registration-validation
