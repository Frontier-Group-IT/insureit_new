name: Fix policy summary portal tracking

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-policy-summary-portal.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node .github/scripts/fix-policy-summary-portal.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-form-authbridge.tsx
          git commit -m "Render policy live summary through viewport portal"
          git push origin main
