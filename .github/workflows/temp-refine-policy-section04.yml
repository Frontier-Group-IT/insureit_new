name: Temporary refine policy section04

on:
  push:
    paths:
      - scripts/temp_refine_policy_section04.py
      - .github/workflows/temp-refine-policy-section04.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Section 04 refinement
        run: python scripts/temp_refine_policy_section04.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'OD Pay-in %' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'TP Pay-in %' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'Indicative margin' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'Pay-in outcome' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'label="Retention"' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'Projected OD amount' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'Projected TP amount' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Refine projected insurer pay-in section"
            git pull --rebase origin main
            git push origin main
          fi
