name: Temporary PR Payin-Payout sidebar patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ui/policy-payin-payout-sidebar' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/policy-payin-payout-sidebar
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply sidebar patch
        run: python .github/scripts/tmp_patch_payin_payout_sidebar.py
      - name: Verify focused regression
        working-directory: apps/web-portal
        run: npm ci && npm run policy-ocr:onboarding-import-regression
      - name: Remove temporary patch files and push
        shell: bash
        run: |
          rm -f .github/workflows/tmp-patch-payin-payout-sidebar.yml
          rm -f .github/workflows/tmp-pr-patch-payin-payout-sidebar.yml
          rm -f .github/scripts/tmp_patch_payin_payout_sidebar.py
          rm -f tmp-trigger-payin-payout-sidebar.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move Payin-Payout into policy summary sidebar"
          git push origin HEAD:ui/policy-payin-payout-sidebar
