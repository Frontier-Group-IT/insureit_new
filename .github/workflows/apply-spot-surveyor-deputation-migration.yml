name: Apply spot surveyor deputation migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply spot surveyor deputation migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260903120000_atomic_spot_surveyor_deputation.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply spot surveyor deputation migration
        run: supabase db query --linked --file supabase/migrations/20260903120000_atomic_spot_surveyor_deputation.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260903120000

      - name: Verify spot surveyor deputation migration
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.depute_spot_surveyor(uuid,text,text,text,uuid)') is not null as function_ready,
              exists (
                select 1
                from pg_constraint
                where conname = 'customer_activity_events_event_type_check'
                  and pg_get_constraintdef(oid) like '%spot_surveyor_deputed%'
              ) as event_type_ready
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"event_type_ready"[[:space:]]*:[[:space:]]*true'
