name: Temporary patch policy intake V2 access

on:
  push:
    branches:
      - feat/policy-intake-sales-operations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/policy-intake-sales-operations
      - name: Patch V2 role grants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web-portal/lib/access-control-role-matrix-v2.ts')
          s=p.read_text()
          def rep(old,new,count=1):
            global s
            if old not in s: raise SystemExit(f'marker missing: {old}')
            s=s.replace(old,new,count)

          rep('  grant("policies.edit", "edit", "organization"),\n  grant("policies.ocr_training.review", "edit"),', '  grant("policies.edit", "edit", "organization"),\n  grant("policy_intakes.view", "view", "organization"),\n  grant("policy_intakes.create", "edit", "organization"),\n  grant("policy_intakes.review", "edit", "organization"),\n  grant("policies.ocr_training.review", "edit"),', 1)
          rep('      grant("policies.edit", "edit", "organization"),\n      grant("policies.ocr_training.review", "edit"),', '      grant("policies.edit", "edit", "organization"),\n      grant("policy_intakes.view", "view", "organization"),\n      grant("policy_intakes.create", "edit", "organization"),\n      grant("policy_intakes.review", "edit", "organization"),\n      grant("policies.ocr_training.review", "edit"),', 1)
          rep('      grant("policies.view", "view", "organization"),\n      grant("tasks.view", "view", "organization"),', '      grant("policies.view", "view", "organization"),\n      grant("policy_intakes.view", "view", "organization"),\n      grant("policy_intakes.create", "edit", "organization"),\n      grant("tasks.view", "view", "organization"),', 1)

          marker='    code: "sales_operations_head"'
          start=s.index(marker); end=s.index('    code: "backoffice_executive"', start)
          chunk=s[start:end]
          chunk=chunk.replace('      grant("kyc.approve", "approve", "organization"),', '      grant("kyc.approve", "approve", "organization"),\n      grant("policies.view", "view", "organization"),\n      grant("policies.create", "edit", "organization"),\n      grant("policy_intakes.view", "view", "organization"),\n      grant("policy_intakes.create", "edit", "organization"),\n      grant("policy_intakes.review", "edit", "organization"),')
          s=s[:start]+chunk+s[end:]

          start=s.index('    code: "backoffice_executive"'); end=s.index('    code: "sales_head"', start)
          chunk=s[start:end]
          chunk=chunk.replace('      grant("kyc.review", "edit", "organization"),', '      grant("kyc.review", "edit", "organization"),\n      grant("policy_intakes.view", "view", "organization"),\n      grant("policy_intakes.review", "edit", "organization"),')
          s=s[:start]+chunk+s[end:]

          for code,nextcode in [('sales_head','zonal_head'),('zonal_head','asm'),('asm','sales_manager'),('sales_manager','relationship_manager')]:
            start=s.index(f'    code: "{code}"'); end=s.index(f'    code: "{nextcode}"', start)
            chunk=s[start:end]
            chunk=chunk.replace('      grant("reports.view", "view", "hierarchy"),', '      grant("reports.view", "view", "hierarchy"),\n      grant("policy_intakes.view", "view", "hierarchy"),\n      grant("policy_intakes.create", "edit", "hierarchy"),')
            s=s[:start]+chunk+s[end:]

          start=s.index('    code: "relationship_manager"'); end=s.index('    code: "claims_head"', start)
          chunk=s[start:end]
          chunk=chunk.replace('      grant("tasks.view", "view", "self"),', '      grant("tasks.view", "view", "self"),\n      grant("policy_intakes.view", "view", "self"),\n      grant("policy_intakes.create", "edit", "self"),')
          s=s[:start]+chunk+s[end:]
          p.write_text(s)

          p=Path('apps/web-portal/lib/access-control-effective-v2.ts'); s=p.read_text()
          old='  "policies.create": "edit",\n  "reports.view": "view",'
          new='  "policies.create": "edit",\n  "policy_intakes.view": "view",\n  "policy_intakes.review": "edit",\n  "reports.view": "view",'
          if old not in s: raise SystemExit('effective ceiling marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web-portal/lib/access-control-role-matrix-v2.ts apps/web-portal/lib/access-control-effective-v2.ts
          git commit -m "Integrate policy intakes with V2 role matrix"
          git push origin HEAD:feat/policy-intake-sales-operations
