name: Publish Partner preview 0.1.0 exact commit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-partner-preview-0.1.0-temp.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
      PARTNER_SOURCE_SHA: 74039199991888777911deb30cf248e8f36cf8a8
    steps:
      - name: Check out exact approved Partner preview commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PARTNER_SOURCE_SHA }}
          fetch-depth: 0

      - name: Require exact source and runtime 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$PARTNER_SOURCE_SHA" ] || { echo "Wrong Partner source commit" >&2; exit 1; }
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const customer = require('./apps/mobile-app/app.json');
          const expo = app.expo || {};
          if (expo.version !== '0.1.0') {
            console.error(`Refusing OTA: expected Partner runtime 0.1.0, found ${expo.version ?? 'missing'}.`);
            process.exit(1);
          }
          if (expo?.runtimeVersion?.policy !== 'appVersion') {
            console.error('Refusing OTA: Partner runtime policy must be appVersion.');
            process.exit(1);
          }
          if (!expo?.extra?.eas?.projectId || !expo?.updates?.url) {
            console.error('Refusing OTA: Partner EAS/update linkage is incomplete.');
            process.exit(1);
          }
          if (expo.extra.eas.projectId === customer?.expo?.extra?.eas?.projectId || expo.updates.url === customer?.expo?.updates?.url) {
            console.error('Refusing OTA: Partner cannot reuse Customer EAS/update identity.');
            process.exit(1);
          }
          console.log(`Verified Partner runtime ${expo.version}; project ${expo.extra.eas.projectId}`);
          NODE

      - name: Require Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify linked Partner Expo project
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish exact Partner preview OTA
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "INSUREIT Partner Figma header sync ${PARTNER_SOURCE_SHA}" \
            --non-interactive \
            --json | tee partner-preview-update.json

      - name: Upload OTA result
        uses: actions/upload-artifact@v4
        with:
          name: partner-preview-ota-result
          path: apps/partner-app/partner-preview-update.json
          if-no-files-found: error
