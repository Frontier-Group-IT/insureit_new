name: Apply effective permission migration

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-effective-permission-migration.mjs"
      - ".github/workflows/apply-effective-permission-migration.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-effective-permission-migration.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No migration changes required."
          else
            git add apps/web-portal
            git commit -m "Align workflow guards with effective permissions"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
