name: Apply service enquiry support ticket unification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20261007111500_unify_support_tickets_with_service_enquiries.sql'
      - '.github/workflows/apply-service-enquiry-support-ticket-unification.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply unified service enquiry schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20261007111500_unify_support_tickets_with_service_enquiries.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure unification migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20261007111500'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20261007111500_unify_support_tickets_with_service_enquiries.sql
            supabase migration repair --linked --status applied 20261007111500
          fi

      - name: Verify unified support-ticket contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              exists(
                select 1 from information_schema.columns
                where table_schema='public' and table_name='service_enquiries' and column_name='claim_id'
              ) as claim_id_ready,
              exists(
                select 1 from information_schema.columns
                where table_schema='public' and table_name='service_enquiries' and column_name='category'
              ) as category_ready,
              exists(
                select 1 from information_schema.columns
                where table_schema='public' and table_name='service_enquiries' and column_name='priority'
              ) as priority_ready,
              to_regclass('public.service_enquiry_messages') is not null as messages_ready,
              to_regclass('public.service_enquiry_attachments') is not null as attachments_ready,
              position(
                'support_ticket'
                in pg_get_constraintdef(
                  (
                    select oid from pg_constraint
                    where conrelid='public.service_enquiries'::regclass
                      and conname='service_enquiries_service_type_check'
                  )
                )
              ) > 0 as support_type_ready;
          ")
          echo "$result"
          for key in claim_id_ready category_ready priority_ready messages_ready attachments_ready support_type_ready; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true" || {
              echo "::error::Service enquiry support-ticket verification failed for $key"
              exit 1
            }
          done
