name: Update policy summary sidebar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-policy-summary-sidebar.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node .github/scripts/update-policy-summary-sidebar.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-form-authbridge.tsx
          git commit -m "Keep policy live summary sticky and remove booking card"
          git push origin main
