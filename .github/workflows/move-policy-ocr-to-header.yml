name: Move policy OCR to header

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/move-policy-ocr-to-header.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node .github/scripts/move-policy-ocr-to-header.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-form-authbridge.tsx
          git commit -m "Move policy OCR workflow into onboarding header"
          git push origin main
