name: Revert Partner preview to last good 0.1.0 OTA once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/revert-partner-preview-to-last-good-0.1.0-once.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
      PARTNER_SOURCE_SHA: 74039199991888777911deb30cf248e8f36cf8a8
    steps:
      - name: Check out last known good Partner 0.1.0 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PARTNER_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source and runtime 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$PARTNER_SOURCE_SHA" ] || { echo "Wrong Partner source commit" >&2; exit 1; }
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const expo = app.expo || {};
          if (expo.version !== '0.1.0') {
            console.error(`Refusing rollback OTA: expected Partner runtime 0.1.0, found ${expo.version ?? 'missing'}.`);
            process.exit(1);
          }
          if (expo?.runtimeVersion?.policy !== 'appVersion') {
            console.error('Refusing rollback OTA: Partner runtime policy must be appVersion.');
            process.exit(1);
          }
          if (expo?.extra?.eas?.projectId !== '8ade82c1-4c96-4f09-b90b-802270fb406d') {
            console.error('Refusing rollback OTA: unexpected Partner EAS project.');
            process.exit(1);
          }
          console.log(`Restoring Partner runtime ${expo.version} from ${process.env.PARTNER_SOURCE_SHA}`);
          NODE

      - name: Require Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN_PARTNER is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Partner app typecheck
        working-directory: apps/partner-app
        run: npx tsc --noEmit

      - name: Verify linked Partner Expo project
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish rollback OTA
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "REVERT Partner preview to last good 0.1.0 ${PARTNER_SOURCE_SHA}" \
            --non-interactive \
            --json > partner-preview-rollback.json
          cat partner-preview-rollback.json
