name: Apply customer verified-mobile existing-master link

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260926121500_customer_verified_mobile_existing_master_link.sql'
      - '.github/workflows/apply-customer-verified-mobile-existing-master-link.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply verified-mobile customer master linking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260926121500_customer_verified_mobile_existing_master_link.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure verified-mobile master-link migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260926121500'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260926121500_customer_verified_mobile_existing_master_link.sql
            supabase migration repair --linked --status applied 20260926121500
          fi

      - name: Verify customer linking contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.ensure_customer_signup_profile(text,text,text)') is not null as signup_rpc_ready,
              to_regprocedure('public.try_claim_existing_customer_master(uuid,uuid,text,text)') is not null as claim_helper_ready,
              position('auth.users' in pg_get_functiondef('public.try_claim_existing_customer_master(uuid,uuid,text,text)'::regprocedure)) > 0 as verified_phone_guard,
              position('Multiple existing customer records match' in pg_get_functiondef('public.try_claim_existing_customer_master(uuid,uuid,text,text)'::regprocedure)) > 0 as ambiguity_guard,
              position('customer_mobile_signup_claimed_existing' in pg_get_functiondef('public.try_claim_existing_customer_master(uuid,uuid,text,text)'::regprocedure)) > 0 as audit_guard,
              not exists (
                select 1
                from public.customers duplicate
                join auth.users u on u.id = duplicate.profile_id
                where duplicate.creation_channel='direct_customer_onboarding'
                  and duplicate.partner_type is null
                  and public.customer_signup_master_is_empty(duplicate.id)
                  and (
                    select count(*)
                    from public.customers canonical
                    where canonical.id <> duplicate.id
                      and canonical.profile_id is null
                      and lower(coalesce(canonical.status,'active'))='active'
                      and lower(coalesce(canonical.onboarding_status,'active'))='active'
                      and (canonical.partner_type is null or canonical.partner_type='individual_proprietor')
                      and public.normalize_customer_mobile(canonical.phone)=public.normalize_customer_mobile(u.phone)
                      and (
                        public.normalize_customer_identity_name(canonical.contact_name)=public.normalize_customer_identity_name(duplicate.contact_name)
                        or public.normalize_customer_identity_name(canonical.company_name)=public.normalize_customer_identity_name(duplicate.contact_name)
                        or public.normalize_customer_identity_name(canonical.legal_trade_name)=public.normalize_customer_identity_name(duplicate.contact_name)
                      )
                      and not exists (
                        select 1 from public.customer_memberships cm
                        where cm.customer_id=canonical.id and cm.status='active' and cm.profile_id<>duplicate.profile_id
                      )
                      and (
                        canonical.creation_channel is distinct from 'direct_customer_onboarding'
                        or not public.customer_signup_master_is_empty(canonical.id)
                      )
                  ) = 1
              ) as no_safe_signup_split_remaining;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"signup_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"claim_helper_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"verified_phone_guard"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"ambiguity_guard"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"audit_guard"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"no_safe_signup_split_remaining"[[:space:]]*:[[:space:]]*true'
