name: Apply registration input constraint fix

on:
  push:
    branches:
      - fix/remove-registration-input-length-constraint

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-registration-input-length-constraint
          fetch-depth: 0
      - name: Remove stale registration input constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web-portal/components/policy-unified-form.tsx')
          text = path.read_text()
          old = ' maxLength={10} pattern="[A-Za-z]{2}[A-Za-z0-9]{6}[0-9]{2}"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale registration constraint block, found {count}')
          path.write_text(text.replace(old, '', 1))
          PY
      - name: Verify flexible validator remains intact
        run: |
          grep -F 'function isValidRegisteredVehicleNumber(value:string){return /^[A-Z]{2}[A-Z0-9]*[0-9]{2}$/.test(value);}' apps/web-portal/components/policy-unified-form.tsx
          if grep -F 'maxLength={10} pattern="[A-Za-z]{2}[A-Za-z0-9]{6}[0-9]{2}"' apps/web-portal/components/policy-unified-form.tsx; then
            echo 'Stale fixed-length attributes still present.' >&2
            exit 1
          fi
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-remove-registration-input-constraints.yml
          git add apps/web-portal/components/policy-unified-form.tsx
          git commit -m 'Remove stale registration input length constraint'
          git push origin HEAD:fix/remove-registration-input-length-constraint
