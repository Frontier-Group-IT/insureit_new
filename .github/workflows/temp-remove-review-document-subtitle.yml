name: Temporary remove review document subtitle

on:
  push:
    paths:
      - .github/workflows/temp-remove-review-document-subtitle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove Documents subtitle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-portal/app/intermediaries/applications/[id]/page.tsx')
          text = path.read_text()
          old = '''function DocumentsCard({ children }: { children: React.ReactNode }) { return <section className="rounded-2xl border border-[#DCE5EF] bg-white p-5 shadow-sm"><div className="mb-4 flex items-center gap-3"><span className="grid h-9 w-9 place-items-center rounded-xl border border-[#E1E7FF] bg-[#F1F4FF] text-[#4F46E5]"><Icon name="documents" className="h-4.5 w-4.5" /></span><div><h2 className="text-[13px] font-semibold text-[#17203A]">Documents</h2><p className="mt-0.5 text-[9.5px] font-medium text-[#64748B]">Visual checklist for uploaded identity, bank and qualification files.</p></div></div>{children}</section>; }'''
          new = '''function DocumentsCard({ children }: { children: React.ReactNode }) { return <section className="rounded-2xl border border-[#DCE5EF] bg-white p-5 shadow-sm"><div className="mb-4 flex items-center gap-3"><span className="grid h-9 w-9 place-items-center rounded-xl border border-[#E1E7FF] bg-[#F1F4FF] text-[#4F46E5]"><Icon name="documents" className="h-4.5 w-4.5" /></span><div><h2 className="text-[13px] font-semibold text-[#17203A]">Documents</h2></div></div>{children}</section>; }'''
          if old not in text:
              raise SystemExit('DocumentsCard subtitle block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Validate focused diff
        run: |
          git diff --check
          grep -q 'function DocumentsCard' 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
          ! grep -q 'Visual checklist for uploaded identity, bank and qualification files.' 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
          ! grep -q 'Ten-slot checklist for identity, bank, qualification and named supporting files.' 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
      - name: Commit app change and remove temporary workflow
        run: |
          rm .github/workflows/temp-remove-review-document-subtitle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx' .github/workflows/temp-remove-review-document-subtitle.yml
          git commit -m 'Remove application review document subtitle'
          git push