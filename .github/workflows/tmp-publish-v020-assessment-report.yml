name: Publish v020 Billing Assessment and Work Approval Icons OTA

on:
  push:
    branches:
      - hotfix/mobile-v0.2-delivery-order-assessment-report

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/mobile-v0.2-delivery-order-assessment-report
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Confirm v020 native-compatible baseline
        run: node -e "const c=require('./apps/mobile-app/app.json');if(c.expo.version!=='0.2.0')process.exit(2);if(JSON.stringify(c).includes('react-native-compressor'))process.exit(3)"
      - name: Confirm Billing Bill Upload
        run: |
          grep -q "function FinalBillUpload" apps/mobile-app/app/customer/self-managed-milestone.tsx
      - name: Backport Work Approval custom icons from PR 703
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          if grep -q "WORK_APPROVAL_ICONS" apps/mobile-app/app/customer/self-managed-milestone.tsx; then
            echo "Work Approval custom icons are already present."
          else
            git cherry-pick e12e918a699d0b053a942280dda09e7fe089b275
            git push origin HEAD:hotfix/mobile-v0.2-delivery-order-assessment-report
          fi
      - name: Verify Work Approval icon assets
        run: |
          grep -q "WORK_APPROVAL_ICONS" apps/mobile-app/app/customer/self-managed-milestone.tsx
          test -f apps/mobile-app/assets/claims/claim-approval.png
          test -f apps/mobile-app/assets/claims/claim-survey.png
          test -f apps/mobile-app/assets/claims/claim-documents.png
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck:mobile
      - name: Lint
        run: npm run lint:mobile
      - name: Expo web build
        run: npm run build:mobile:web
      - name: Publish OTA
        working-directory: apps/mobile-app
        run: npx eas-cli update --channel preview --environment preview --message "Work Approval custom icons plus Billing and Stage 7 fixes for v0.2.0" --non-interactive
