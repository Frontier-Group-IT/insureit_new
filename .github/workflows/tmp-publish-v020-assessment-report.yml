name: Publish v020 Assessment Report OTA

on:
  push:
    branches:
      - hotfix/mobile-v0.2-delivery-order-assessment-report

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/mobile-v0.2-delivery-order-assessment-report
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Confirm v020 baseline
        run: node -e "const c=require('./apps/mobile-app/app.json');if(c.expo.version!=='0.2.0')process.exit(2);if(JSON.stringify(c).includes('react-native-compressor'))process.exit(3)"
      - name: Apply hotfix
        run: python scripts/apply-v020-assessment-report-hotfix.py
      - name: Commit hotfix source
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add apps/mobile-app/app/customer/self-managed-milestone.tsx
          git commit -m "Show Stage 7 Assessment Report inline on v0.2"
          git push origin HEAD:hotfix/mobile-v0.2-delivery-order-assessment-report
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck:mobile
      - name: Lint
        run: npm run lint:mobile
      - name: Expo web build
        run: npm run build:mobile:web
      - name: Publish OTA
        working-directory: apps/mobile-app
        run: npx eas-cli update --channel preview --environment preview --message "Stage 7 Assessment Report inline row for v0.2.0" --non-interactive
