name: Publish v020 Billing and Assessment OTA

on:
  push:
    branches:
      - hotfix/mobile-v0.2-delivery-order-assessment-report

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/mobile-v0.2-delivery-order-assessment-report
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Confirm v020 native-compatible baseline
        run: node -e "const c=require('./apps/mobile-app/app.json');if(c.expo.version!=='0.2.0')process.exit(2);if(JSON.stringify(c).includes('react-native-compressor'))process.exit(3)"
      - name: Apply Billing Bill Upload safely
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          if grep -q "function FinalBillUpload" apps/mobile-app/app/customer/self-managed-milestone.tsx; then
            echo "Billing Bill Upload is already present."
          else
            git show cf18e724a7646ff37361cb218c1c42d6158eb3f2:.github/tmp/apply-final-bill-v3.py > /tmp/apply-final-bill-v3.py
            python /tmp/apply-final-bill-v3.py
            python - <<'PY'
          from pathlib import Path
          p=Path('apps/mobile-app/app/customer/self-managed-milestone.tsx')
          s=p.read_text()
          old="import { Modal, Pressable, StyleSheet, Text, View } from 'react-native';"
          new="import { Linking, Modal, Pressable, StyleSheet, Text, View } from 'react-native';"
          if old in s:
              s=s.replace(old,new,1)
          elif 'Linking' not in s.split('\n')[4]:
              raise SystemExit('React Native import anchor mismatch')
          p.write_text(s)
          PY
            git diff --check
            git add apps/mobile-app/app/customer/self-managed-milestone.tsx
            git commit -m "Backport Billing Bill Upload to v0.2"
            git push origin HEAD:hotfix/mobile-v0.2-delivery-order-assessment-report
          fi
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck:mobile
      - name: Lint
        run: npm run lint:mobile
      - name: Expo web build
        run: npm run build:mobile:web
      - name: Publish OTA
        working-directory: apps/mobile-app
        run: npx eas-cli update --channel preview --environment preview --message "Billing Bill Upload and Stage 7 Assessment Report for v0.2.0" --non-interactive
