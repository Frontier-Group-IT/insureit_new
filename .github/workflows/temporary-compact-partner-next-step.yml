name: Temporary compact Partner next-step validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'feature/compact-partner-next-step'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_INSUREIT_LAUNCH_SCOPE: intermediary

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compact Partner next-step changes
        run: python .github/scripts/apply-compact-partner-next-step.py

      - name: Install dependencies
        run: npm ci

      - name: Lint web portal
        run: npm run lint:web

      - name: Typecheck web portal
        run: npm run typecheck:web

      - name: Build web portal
        run: npm run build:web

      - name: Commit validated page change
        run: |
          rm -f .github/workflows/temporary-compact-partner-next-step.yml
          rm -f .github/scripts/apply-compact-partner-next-step.py
          rm -f .github/temporary-compact-partner-next-step-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/intermediaries/applications/'[id]'/page.tsx
          git add -u .github
          git commit -m "Redesign Partner review next step"
          git push origin HEAD:${{ github.head_ref }}
