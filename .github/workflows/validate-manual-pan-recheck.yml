name: Validate manual PAN recheck

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web-portal/app/intermediaries/applications/[id]/**"
      - ".github/workflows/validate-manual-pan-recheck.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      PAN_VERIFICATION_WORKER_KEY: placeholder-worker-key
      NEXT_PUBLIC_INSUREIT_LAUNCH_SCOPE: intermediary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run build:web
