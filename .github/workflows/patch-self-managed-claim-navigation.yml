name: Patch self-managed claim navigation

on:
  push:
    branches:
      - feature/self-managed-claims
    paths:
      - '.github/workflows/patch-self-managed-claim-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/self-managed-claims
          fetch-depth: 0
      - name: Patch claim entry and reopen routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          group = Path('apps/mobile-app/components/group/group-records-screen.tsx')
          text = group.read_text()
          replacements = [
              (
                  "type RecordRow = { id: string; customerId: string; accountName: string; title: string; subtitle: string; meta: string; status: string; tone: 'blue' | 'green' | 'orange' | 'red' };",
                  "type RecordRow = { id: string; customerId: string; accountName: string; title: string; subtitle: string; meta: string; status: string; tone: 'blue' | 'green' | 'orange' | 'red'; claimServiceMode?: string };"
              ),
              (
                  "status: ['Closed','Settled','Claim Complete'].includes(claim.current_status) ? 'Completed' : /pending|awaited|document/i.test(claim.current_status) ? 'Action Required' : 'Open', tone: ['Closed','Settled','Claim Complete'].includes(claim.current_status) ? 'green' : /pending|awaited|document/i.test(claim.current_status) ? 'orange' : 'blue' } as RecordRow));",
                  "status: ['Closed','Settled','Claim Complete'].includes(claim.current_status) ? 'Completed' : /pending|awaited|document/i.test(claim.current_status) ? 'Action Required' : 'Open', tone: ['Closed','Settled','Claim Complete'].includes(claim.current_status) ? 'green' : /pending|awaited|document/i.test(claim.current_status) ? 'orange' : 'blue', claimServiceMode: (claim as Claim & { claim_service_mode?: string }).claim_service_mode } as RecordRow));"
              ),
              (
                  "{ label: 'Add Claim', icon: 'file-plus-outline' as const, href: '/customer/report-accident' as const }",
                  "{ label: 'Add Claim', icon: 'file-plus-outline' as const, href: '/customer/start-claim' as const }"
              ),
              (
                  "openRecord(router, mode, row.id)",
                  "openRecord(router, mode, row)"
              ),
              (
                  "function openRecord(router: ReturnType<typeof useLoadingRouter>, mode: Mode, id: string) {\n  if (mode === 'claims') return router.push({ pathname: '/customer/claim-detail', params: { id } });\n  if (mode === 'fleet') return router.push({ pathname: '/customer/vehicle-detail', params: { id } });\n  return router.push({ pathname: '/customer/policy-detail', params: { id } } as any);\n}",
                  "function openRecord(router: ReturnType<typeof useLoadingRouter>, mode: Mode, row: RecordRow) {\n  if (mode === 'claims') return router.push(row.claimServiceMode === 'self_managed' ? { pathname: '/customer/self-managed-claim-detail', params: { id: row.id } } : { pathname: '/customer/claim-detail', params: { id: row.id } });\n  if (mode === 'fleet') return router.push({ pathname: '/customer/vehicle-detail', params: { id: row.id } });\n  return router.push({ pathname: '/customer/policy-detail', params: { id: row.id } } as any);\n}"
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Group records exact patch expected 1 occurrence, found {text.count(old)}: {old[:80]}')
              text = text.replace(old, new, 1)
          group.write_text(text)

          claims = Path('apps/mobile-app/app/customer/claims.tsx')
          text = claims.read_text()
          old = "onPress={() => router.push({ pathname: '/customer/claim-detail', params: { id: claim.id } })}"
          new = "onPress={() => router.push((claim as Claim & { claim_service_mode?: string }).claim_service_mode === 'self_managed' ? { pathname: '/customer/self-managed-claim-detail', params: { id: claim.id } } : { pathname: '/customer/claim-detail', params: { id: claim.id } })}"
          if text.count(old) != 1:
              raise SystemExit(f'Customer claims exact patch expected 1 occurrence, found {text.count(old)}')
          claims.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/patch-self-managed-claim-navigation.yml
      - name: Commit isolated navigation patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/components/group/group-records-screen.tsx apps/mobile-app/app/customer/claims.tsx .github/workflows/patch-self-managed-claim-navigation.yml
          git commit -m "Route self-managed claims to customer tracker"
          git push origin HEAD:feature/self-managed-claims
