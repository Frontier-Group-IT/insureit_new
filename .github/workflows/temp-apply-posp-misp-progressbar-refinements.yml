name: Temporary POSP MISP progressbar refinements

on:
  push:
    branches:
      - fix/posp-misp-progressbar-refinements-20260807
    paths:
      - .github/workflows/temp-apply-posp-misp-progressbar-refinements.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused UI patch
        run: python .github/scripts/apply-posp-misp-progressbar-refinements.py
      - name: Validate diff
        run: git diff --check
      - name: Remove temporary patch files
        run: rm .github/scripts/apply-posp-misp-progressbar-refinements.py .github/workflows/temp-apply-posp-misp-progressbar-refinements.yml
      - name: Commit application changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: refine POSP MISP progressbar presentation"
          git push
