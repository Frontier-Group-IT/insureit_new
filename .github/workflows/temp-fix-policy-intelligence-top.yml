name: Temporary fix policy intelligence top

on:
  push:
    paths:
      - scripts/temp_fix_policy_intelligence_top.py
      - .github/workflows/temp-fix-policy-intelligence-top.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply positioning fix
        run: python scripts/temp_fix_policy_intelligence_top.py
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-onboarding-intelligence.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Align policy intelligence below onboarding header"
            git push
          fi
# branch trigger
