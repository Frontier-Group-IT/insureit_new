name: Apply voice campaign workflow schema

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260921145500_voice_campaigns.sql'
      - '.github/workflows/apply-voice-campaigns.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply voice campaign workflow schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260921145500_voice_campaigns.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply voice campaign migration
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/migrations/20260921145500_voice_campaigns.sql
          supabase migration repair --linked --status applied 20260921145500

      - name: Verify schema contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regclass('public.voice_campaigns') is not null as campaigns_ready,
              to_regclass('public.voice_campaign_members') is not null as members_ready,
              exists (
                select 1 from information_schema.columns
                where table_schema='public'
                  and table_name='external_renewal_voice_attempts'
                  and column_name='voice_campaign_id'
              ) as attempt_campaign_ready
          ")
          echo "$result"
          for key in campaigns_ready members_ready attempt_campaign_ready; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
