name: Temporary restore policy intake completion handoff
on:
  push:
    branches: [fix/policy-intake-reset-context]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/policy-intake-reset-context
      - name: Restore runCreate pending intake handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web-portal/components/policy-unified-form.tsx')
          s=p.read_text()
          old='if(result.ok){try{sessionStorage.removeItem(POLICY_DRAFT_KEY);sessionStorage.removeItem(POLICY_INTAKE_PENDING_KEY);window.dispatchEvent(new Event(POLICY_ONBOARDING_RESET_EVENT));}catch{}router.push(`/policies?success=policy_created&policy=${encodeURIComponent(result.policyCode)}`);return;}'
          new='if(result.ok){try{sessionStorage.removeItem(POLICY_DRAFT_KEY);}catch{}router.push(`/policies?success=policy_created&policy=${encodeURIComponent(result.policyCode)}`);return;}'
          if old not in s: raise SystemExit('runCreate exact anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-policy-intake-reset-runcreate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx .github/workflows/tmp-fix-policy-intake-reset-runcreate.yml
          git commit -m "Preserve intake handoff until policy completion bridge"
          git push origin HEAD:fix/policy-intake-reset-context
