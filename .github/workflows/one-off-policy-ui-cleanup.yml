name: One-off policy onboarding UI cleanup

on:
  push:
    paths:
      - '.github/workflows/one-off-policy-ui-cleanup.yml'

permissions:
  contents: write

jobs:
  update-policy-form:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply requested policy onboarding UI changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-portal/components/policy-form.tsx')
          source = path.read_text()

          replacements = [
              (
                  'options={["POSP", "MISP", "SIBL / Partner", "Direct"]}',
                  'options={["POSP", "MISP", "SIBL / Partner"]}',
              ),
              (
                  '<Select label="Business line" value={form.businessLine} onChange={(e) => update("businessLine", e.target.value)} options={["Motor"]} placeholder="Select business line" />',
                  '<Select label="Policy type" value={form.businessLine} onChange={(e) => update("businessLine", e.target.value)} options={["Motor"]} placeholder="Select policy type" />',
              ),
              (
                  '<aside className="space-y-4 xl:sticky xl:top-4 xl:self-start">',
                  '<aside className="space-y-4 xl:self-start">',
              ),
              (
                  '<div className="overflow-hidden rounded-2xl border border-[#D9E2F0] bg-white shadow-[0_8px_24px_rgba(15,23,42,0.05)]">\n            <div className="border-b border-[#E7ECF3] bg-[#F8FAFC] px-4 py-3"><p className="text-[9px] font-bold uppercase tracking-[0.12em] text-[#4F46E5]">Live summary</p>',
                  '<div className="overflow-hidden rounded-2xl border border-[#D9E2F0] bg-white shadow-[0_8px_24px_rgba(15,23,42,0.05)] xl:sticky xl:top-4 xl:z-10">\n            <div className="border-b border-[#E7ECF3] bg-[#F8FAFC] px-4 py-3"><p className="text-[9px] font-bold uppercase tracking-[0.12em] text-[#4F46E5]">Live summary</p>',
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Required UI target not found: {old[:90]}')
              source = source.replace(old, new, 1)

          bill_fields = [
              '            <Field label="Pay-in bill number" value={form.payinBillNo} onChange={(e) => { update("payinBillNo", e.target.value.toUpperCase()); update("payinStatus", e.target.value ? "Billed" : "Unbilled"); }} placeholder="INV/2627/001" />\n',
              '            <Field label="Pay-in billed amount" type="number" min="0" value={form.payinBilledAmount} onChange={(e) => update("payinBilledAmount", e.target.value)} placeholder="₹ 0.00" />\n',
              '            <Field label="Pay-in bill date" type="date" value={form.payinBillDate} onChange={(e) => update("payinBillDate", e.target.value)} />\n',
              '            <Select label="Pay-in status" value={form.payinStatus} onChange={(e) => update("payinStatus", e.target.value)} options={["Unbilled", "Billed", "Part Received", "Received", "Short Received", "Reconciled"]} placeholder="Select status" />\n',
              '            <ReadOnly label="Short payout" value={money.format(calculations.shortPayout)} />\n',
          ]

          for field in bill_fields:
              if field not in source:
                  raise SystemExit(f'Billing field not found: {field[:90]}')
              source = source.replace(field, '', 1)

          path.write_text(source)
          PY

      - name: Commit focused UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-form.tsx
          git commit -m "Refine policy onboarding summary and fields"
          git push origin main
