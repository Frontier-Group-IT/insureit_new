name: Temporary intermediary register consistency validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Build web portal
        run: npm run build:web
