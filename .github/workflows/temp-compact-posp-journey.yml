name: Temporary compact POSP journey patch

on:
  push:
    paths:
      - scripts/temp_compact_posp_journey.py
      - .github/workflows/temp-compact-posp-journey.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply journey layout patch
        run: python scripts/temp_compact_posp_journey.py
      - name: Validate and commit application change
        run: |
          rm scripts/temp_compact_posp_journey.py .github/workflows/temp-compact-posp-journey.yml
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          grep -q 'min-w-\[900px\]' apps/web-portal/app/intermediaries/applications/'[id]'/page.tsx
          grep -q 'flex min-w-0 items-center justify-center gap-2' apps/web-portal/app/intermediaries/applications/'[id]'/page.tsx
          ! grep -q 'const status = done ? "Completed"' apps/web-portal/app/intermediaries/applications/'[id]'/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/intermediaries/applications/'[id]'/page.tsx scripts/temp_compact_posp_journey.py .github/workflows/temp-compact-posp-journey.yml
          git commit -m "Compact POSP and MISP account journey layout"
          git push
