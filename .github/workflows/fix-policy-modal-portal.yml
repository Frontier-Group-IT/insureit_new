name: Fix policy modal viewport rendering

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-policy-modal-portal.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply modal portal patch
        run: node .github/scripts/fix-policy-modal-portal.mjs
      - name: Commit modal fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-form-authbridge.tsx
          git commit -m "Render policy popups in viewport portal"
          git push origin main
