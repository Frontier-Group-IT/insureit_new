name: Deploy production to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verified_commit:
        description: Feature/PR head commit verified by the canonical web-portal gate
        required: true
        type: string
      verification_run_id:
        description: Successful Verify web portal GitHub Actions run ID for verified_commit
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: insureit-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate verified release and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact main snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate verification provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERIFIED_COMMIT: ${{ inputs.verified_commit }}
          INPUT_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          set -euo pipefail

          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced after this deployment started. The newer main merge will receive its own deployment run."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERIFIED_COMMIT="$INPUT_VERIFIED_COMMIT"
            VERIFICATION_RUN_ID="$INPUT_VERIFICATION_RUN_ID"
          else
            merged_pr_json=$(gh api -H "Accept: application/vnd.github+json"               "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls"               --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | first')

            if [[ -z "$merged_pr_json" || "$merged_pr_json" == "null" ]]; then
              echo "::error::Automatic production deployment requires a merged pull request into main. Direct pushes are not deployed automatically."
              exit 1
            fi

            VERIFIED_COMMIT=$(jq -r '.head.sha' <<<"$merged_pr_json")
            if [[ -z "$VERIFIED_COMMIT" || "$VERIFIED_COMMIT" == "null" ]]; then
              echo "::error::Could not resolve the merged pull request head commit."
              exit 1
            fi

            runs_json=$(gh api               "repos/$GITHUB_REPOSITORY/actions/workflows/verify-web-portal.yml/runs?event=pull_request&status=completed&head_sha=$VERIFIED_COMMIT&per_page=20")
            VERIFICATION_RUN_ID=$(jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' <<<"$runs_json" | head -n 1)

            if [[ -z "$VERIFICATION_RUN_ID" || "$VERIFICATION_RUN_ID" == "null" ]]; then
              echo "::error::No successful Verify web portal pull-request run was found for $VERIFIED_COMMIT."
              exit 1
            fi
          fi

          if [[ ! "$VERIFIED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::verified_commit must be a full 40-character Git SHA."
            exit 1
          fi
          if [[ ! "$VERIFICATION_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::verification_run_id must be numeric."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if ! git merge-base --is-ancestor "$VERIFIED_COMMIT" "$GITHUB_SHA"; then
              echo "::error::The verified commit is not contained in the selected main snapshot."
              exit 1
            fi
          else
            merge_commit_sha=$(jq -r '.merge_commit_sha' <<<"$merged_pr_json")
            if [[ "$merge_commit_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::The selected main snapshot is not the merge result of the verified pull request."
              exit 1
            fi
          fi

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFICATION_RUN_ID")
          run_name=$(jq -r '.name' <<<"$run_json")
          run_event=$(jq -r '.event' <<<"$run_json")
          run_head=$(jq -r '.head_sha' <<<"$run_json")
          run_conclusion=$(jq -r '.conclusion' <<<"$run_json")
          if [[ "$run_name" != "Verify web portal" || "$run_event" != "pull_request" || "$run_head" != "$VERIFIED_COMMIT" || "$run_conclusion" != "success" ]]; then
            echo "::error::Verification provenance mismatch: expected a successful Verify web portal pull_request run for $VERIFIED_COMMIT."
            exit 1
          fi

          merged_pr_count=$(gh api -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/commits/$VERIFIED_COMMIT/pulls"             --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')
          if [[ "$merged_pr_count" -lt 1 ]]; then
            echo "::error::The verified commit is not associated with a merged pull request into main."
            exit 1
          fi

          echo "VERIFIED_COMMIT=$VERIFIED_COMMIT" >> "$GITHUB_ENV"
          echo "VERIFICATION_RUN_ID=$VERIFICATION_RUN_ID" >> "$GITHUB_ENV"
          echo "Verified release provenance: run $VERIFICATION_RUN_ID -> commit $VERIFIED_COMMIT -> current main $GITHUB_SHA"

      - name: Wait for required schema deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          changed_migrations=$(git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep '^supabase/migrations/' || true)
          if [[ -z "$changed_migrations" ]]; then
            echo "No Supabase migration changed in this release; schema wait not required."
            exit 0
          fi

          # This deployment gate currently has an automated schema-run dependency only
          # for the vehicle/policy intake resume migration. Do not wait on that unrelated
          # workflow for every future migration, which would deadlock production deploys.
          if grep -qx 'supabase/migrations/20260831123000_vehicle_policy_intake_resume.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-vehicle-policy-intake-resume.yml"
            echo "Vehicle/policy intake migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260903120000_atomic_spot_surveyor_deputation.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-spot-surveyor-deputation-migration.yml"
            echo "Spot surveyor deputation migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260903130000_secure_initial_document_stage_advance.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-secure-initial-document-stage-migration.yml"
            echo "Secure initial document stage migration detected. Waiting for its schema workflow..."
          else
            echo "::error::Supabase migration changed without a matching automated schema deployment gate:"
            echo "$changed_migrations"
            echo "::error::Apply and verify the migration first, then add its workflow to this deployment gate."
            exit 1
          fi

          if [[ -n "${schema_workflow:-}" ]]; then
            for attempt in {1..60}; do
              runs_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$schema_workflow/runs?head_sha=$GITHUB_SHA&per_page=10")
              run_json=$(jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.created_at) | last // {}' <<<"$runs_json")
              conclusion=$(jq -r '.conclusion // empty' <<<"$run_json")
              status=$(jq -r '.status // empty' <<<"$run_json")
              run_id=$(jq -r '.id // empty' <<<"$run_json")

              if [[ "$conclusion" == "success" ]]; then
                echo "Schema deployment succeeded in run $run_id."
                exit 0
              fi
              if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" || "$conclusion" == "timed_out" ]]; then
                echo "::error::Schema deployment run $run_id finished with conclusion: $conclusion"
                exit 1
              fi

              echo "Schema deployment status: ${status:-not-started}; waiting..."
              sleep 5
            done

            echo "::error::Timed out waiting for the schema deployment."
            exit 1
          fi

      - name: Verify deploy hook secret
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Repository secret VERCEL_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

      - name: Trigger Vercel production deploy hook
        id: deploy
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          http_status=$(curl             --silent             --show-error             --output vercel-response.json             --write-out "%{http_code}"             --request POST             "$VERCEL_DEPLOY_HOOK_URL")

          echo "Vercel response status: $http_status"
          cat vercel-response.json
          echo

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "::error::Vercel deploy hook returned HTTP $http_status."
            exit 1
          fi

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Vercel production deployment requested"
            echo
            echo "- Branch: `main`"
            echo "- Trigger commit: `${GITHUB_SHA}`"
            echo "- Trigger: `${GITHUB_EVENT_NAME}`"
            echo "- Requested by: `${GITHUB_ACTOR}`"
            echo "- Full verification run reused: `${VERIFICATION_RUN_ID}`"
            echo "- Verified feature commit: `${VERIFIED_COMMIT}`"
            echo "- Release provenance: successful PR gate, merged into the exact current main snapshot"
            echo
            echo "Vercel Git auto-deployments are disabled for every branch. This workflow is the only automatic production path and invokes the production deploy hook only after verified merge provenance is established. Check Vercel for the final build and deployment result."
          } >> "$GITHUB_STEP_SUMMARY"
