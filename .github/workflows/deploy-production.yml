name: Deploy production to Vercel

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: insureit-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate verified merge and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact main snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate verification provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "::notice::main advanced after this deployment started. The newer main merge will receive its own deployment run."
            exit 0
          fi

          prs_json=$(gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")
          pr_json=$(jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | sort_by(.merged_at) | last // {}' <<<"$prs_json")

          PR_NUMBER=$(jq -r '.number // empty' <<<"$pr_json")
          VERIFIED_COMMIT=$(jq -r '.head.sha // empty' <<<"$pr_json")
          PR_MERGE_COMMIT=$(jq -r '.merge_commit_sha // empty' <<<"$pr_json")

          if [[ -z "$PR_NUMBER" || -z "$VERIFIED_COMMIT" ]]; then
            echo "::notice::Current main commit is not a merged pull request. Skipping automatic production deployment."
            exit 0
          fi

          if git merge-base --is-ancestor "$VERIFIED_COMMIT" "$GITHUB_SHA"; then
            PROVENANCE_MODE="verified-head-ancestor"
          elif [[ -n "$PR_MERGE_COMMIT" && "$PR_MERGE_COMMIT" == "$GITHUB_SHA" ]]; then
            PROVENANCE_MODE="verified-squash-merge"
          else
            echo "::error::Merged PR head $VERIFIED_COMMIT is neither contained in current main $GITHUB_SHA nor bound to it as the PR merge commit ($PR_MERGE_COMMIT)."
            exit 1
          fi

          runs_json=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$VERIFIED_COMMIT&event=pull_request&status=completed&per_page=100")
          run_json=$(jq --arg sha "$VERIFIED_COMMIT" '[.workflow_runs[] | select(.name == "Verify web portal" and .event == "pull_request" and .head_sha == $sha and .conclusion == "success")] | sort_by(.created_at) | last // {}' <<<"$runs_json")
          VERIFICATION_RUN_ID=$(jq -r '.id // empty' <<<"$run_json")

          if [[ -z "$VERIFICATION_RUN_ID" ]]; then
            echo "::error::No successful Verify web portal pull_request run found for merged PR head $VERIFIED_COMMIT."
            exit 1
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "VERIFIED_COMMIT=$VERIFIED_COMMIT" >> "$GITHUB_ENV"
          echo "VERIFICATION_RUN_ID=$VERIFICATION_RUN_ID" >> "$GITHUB_ENV"
          echo "PROVENANCE_MODE=$PROVENANCE_MODE" >> "$GITHUB_ENV"
          echo "Verified release provenance: PR #$PR_NUMBER -> run $VERIFICATION_RUN_ID -> commit $VERIFIED_COMMIT -> current main $GITHUB_SHA ($PROVENANCE_MODE)"

      - name: Wait for required schema deployment
        if: env.VERIFIED_COMMIT != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          changed_migrations=$(git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}" | grep '^supabase/migrations/' || true)
          if [[ -z "$changed_migrations" ]]; then
            echo "No Supabase migration changed in this release; schema wait not required."
            exit 0
          fi

          if grep -qx 'supabase/migrations/20260903151000_reviewed_claim_assistance_intake.sql' <<<"$changed_migrations" || grep -qx 'supabase/migrations/20260903160000_fix_initial_document_finalization.sql' <<<"$changed_migrations"; then
            unexpected_migrations=$(grep -vxE 'supabase/migrations/20260903151000_reviewed_claim_assistance_intake.sql|supabase/migrations/20260903160000_fix_initial_document_finalization.sql' <<<"$changed_migrations" || true)
            if [[ -n "$unexpected_migrations" ]]; then
              echo "::error::Claim journey release contains an unrelated migration:"
              echo "$unexpected_migrations"
              exit 1
            fi
            schema_workflow="apply-claim-journey-alignment-migrations.yml"
            echo "Claim journey migrations detected. Waiting for their schema workflow..."
          elif grep -qx 'supabase/migrations/20260831123000_vehicle_policy_intake_resume.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-vehicle-policy-intake-resume.yml"
            echo "Vehicle/policy intake migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260903120000_atomic_spot_surveyor_deputation.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-spot-surveyor-deputation-migration.yml"
            echo "Spot surveyor deputation migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260903130000_secure_initial_document_stage_advance.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-secure-initial-document-stage-migration.yml"
            echo "Secure initial document stage migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260903150000_partner_web_renewal_window_pagination.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-partner-renewal-pagination.yml"
            echo "Partner renewal pagination migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260903170000_protect_verified_managed_claim_documents.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-managed-claim-document-protection.yml"
            echo "Managed claim document protection migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260903193000_complete_spot_survey_atomically.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-spot-survey-completion-migration.yml"
            echo "Spot survey completion migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260905180000_vehicle_rc_lookup_cache.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-vehicle-rc-cache.yml"
            echo "Vehicle RC cache migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260905195000_prevent_duplicate_active_managed_claims.sql' <<<"$changed_migrations" || grep -qx 'supabase/migrations/20260905213000_fix_managed_claim_guard_enum_cast.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-managed-claim-active-policy-guard.yml"
            echo "Managed claim active-policy guard migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260905223000_external_renewal_opportunities.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-external-renewal-opportunities.yml"
            echo "External renewal opportunity migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260906210000_external_renewal_interaction_tracking.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-external-renewal-interactions.yml"
            echo "External renewal interaction migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260906223000_external_renewal_followup_worklist.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-external-renewal-followup-worklist.yml"
            echo "External renewal follow-up worklist migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260906233000_external_renewal_policy_intake_link.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-external-renewal-policy-intake-link.yml"
            echo "External renewal Policy Intake link migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260906234500_external_renewal_intake_lifecycle.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-external-renewal-intake-lifecycle.yml"
            echo "External renewal intake lifecycle migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260906235500_external_renewal_intake_visibility.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-external-renewal-intake-visibility.yml"
            echo "External renewal intake visibility migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260907001500_external_renewal_intake_detail_state.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-external-renewal-intake-detail-state.yml"
            echo "External renewal intake detail-state migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260907004500_external_renewal_terminal_state_guard.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-external-renewal-terminal-state-guard.yml"
            echo "External renewal terminal-state guard migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260907010000_external_renewal_reporting.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-external-renewal-reporting.yml"
            echo "External renewal reporting migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260906143000_persist_initial_document_submission.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-initial-document-submission-persistence.yml"
            echo "Initial document submission persistence migration detected. Waiting for its schema workflow..."
          elif grep -qx 'supabase/migrations/20260906190000_persist_managed_claim_stage_transitions.sql' <<<"$changed_migrations"; then
            schema_workflow="apply-managed-claim-stage-persistence.yml"
            echo "Managed claim stage persistence migration detected. Waiting for its schema workflow..."
          else
            echo "::error::Supabase migration changed without a matching automated schema deployment gate:"
            echo "$changed_migrations"
            echo "::error::Apply and verify the migration first, then add its workflow to this deployment gate."
            exit 1
          fi

          for attempt in {1..60}; do
            runs_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$schema_workflow/runs?head_sha=$GITHUB_SHA&per_page=10")
            run_json=$(jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.created_at) | last // {}' <<<"$runs_json")
            conclusion=$(jq -r '.conclusion // empty' <<<"$run_json")
            status=$(jq -r '.status // empty' <<<"$run_json")
            run_id=$(jq -r '.id // empty' <<<"$run_json")

            if [[ "$conclusion" == "success" ]]; then
              echo "Schema deployment succeeded in run $run_id."
              exit 0
            fi
            if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" || "$conclusion" == "timed_out" ]]; then
              echo "::error::Schema deployment run $run_id finished with conclusion: $conclusion"
              exit 1
            fi

            echo "Schema deployment status: ${status:-not-started}; waiting..."
            sleep 5
          done

          echo "::error::Timed out waiting for the schema deployment."
          exit 1

      - name: Verify deploy hook secret
        if: env.VERIFIED_COMMIT != ''
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Repository secret VERCEL_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

      - name: Trigger Vercel production deploy hook
        if: env.VERIFIED_COMMIT != ''
        id: deploy
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          http_status=$(curl \
            --silent \
            --show-error \
            --output vercel-response.json \
            --write-out "%{http_code}" \
            --request POST \
            "$VERCEL_DEPLOY_HOOK_URL")

          echo "Vercel response status: $http_status"
          cat vercel-response.json
          echo

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "::error::Vercel deploy hook returned HTTP $http_status."
            exit 1
          fi

      - name: Write deployment summary
        if: env.VERIFIED_COMMIT != ''
        shell: bash
        run: |
          {
            echo "## Automatic Vercel production deployment requested"
            echo
            echo "- Branch: `main`"
            echo "- Main commit: `${GITHUB_SHA}`"
            echo "- Merged PR: `#${PR_NUMBER}`"
            echo "- Verified PR head: `${VERIFIED_COMMIT}`"
            echo "- Verify web portal run: `${VERIFICATION_RUN_ID}`"
            echo "- Provenance mode: `${PROVENANCE_MODE}`"
            echo "- Trigger: `${GITHUB_EVENT_NAME}`"
            echo
            echo "The production deploy hook was invoked automatically only after the merged PR's canonical verification was confirmed."
          } >> "$GITHUB_STEP_SUMMARY"
