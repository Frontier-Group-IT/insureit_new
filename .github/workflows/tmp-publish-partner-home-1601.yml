name: Temporary publish Partner 0.1.0 preview OTA for PR 1601

on:
  push:
    branches:
      - partner/preview-0.1.0-dashboard-refresh
    paths:
      - '.github/workflows/tmp-publish-partner-home-1601.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
      EXPECTED_MERGE_COMMIT: 4a7e0f495f17a9662d0c55bd495e76f6924783af

    steps:
      - name: Checkout exact branch snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require merged PR 1601 in exact branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin partner/preview-0.1.0-dashboard-refresh
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/partner/preview-0.1.0-dashboard-refresh)" ] || {
            echo "::error::Branch advanced after checkout." >&2
            exit 1
          }
          git merge-base --is-ancestor "$EXPECTED_MERGE_COMMIT" HEAD || {
            echo "::error::Merged PR 1601 commit is not contained in publish head." >&2
            exit 1
          }

      - name: Validate installed-runtime identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const expo = app.expo || {};
          if (expo.version !== '0.1.0') throw new Error(`Expected installed-compatible Partner app version/runtime 0.1.0, found ${expo.version}`);
          if (expo.android?.versionCode !== 1 || expo.ios?.buildNumber !== '1') throw new Error('Expected Partner 0.1.0 native build identity.');
          if (expo.android?.package !== 'com.insureit.partner' || expo.ios?.bundleIdentifier !== 'com.insureit.partner') throw new Error('Unexpected Partner package identity.');
          if (expo.runtimeVersion?.policy !== 'appVersion') throw new Error('Expected appVersion runtime policy.');
          if (expo?.extra?.eas?.projectId !== '8ade82c1-4c96-4f09-b90b-802270fb406d') throw new Error('Unexpected Partner EAS project.');
          if (expo?.updates?.url !== 'https://u.expo.dev/8ade82c1-4c96-4f09-b90b-802270fb406d') throw new Error('Unexpected Partner update URL.');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Require synchronized dependency lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is out of sync."
            git diff -- package-lock.json
            exit 1
          fi

      - name: Verify Partner source before OTA
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace apps/partner-app run verify:routes
          npm --workspace apps/partner-app run verify:phase5
          npm --workspace apps/partner-app run verify:visual
          node apps/partner-app/scripts/verify-policy-intake-source-contract.mjs
          npm --workspace apps/partner-app run verify:pre-apk
          npm --workspace apps/partner-app run verify:uat
          npm run typecheck:partner
          npm run lint:partner
          npm run build:partner:web

      - name: Verify Expo access
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "::error::EXPO_TOKEN_PARTNER is missing."; exit 1; }
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish OTA to existing Partner preview channel
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Partner 0.1.0 home banner branding and pending artwork PR 1601 ${EXPECTED_MERGE_COMMIT}" \
            --non-interactive \
            --json > partner-pr1601-preview-update.json
          cat partner-pr1601-preview-update.json

      - name: Verify latest preview update metadata
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update:list --branch preview --limit 1 --json --non-interactive > latest-preview.json || true
          cat latest-preview.json || true

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Partner 0.1.0 preview OTA — PR 1601'
            echo
            echo "- Required merge commit: \`${EXPECTED_MERGE_COMMIT}\`"
            echo '- Runtime: `0.1.0`'
            echo '- Channel: `preview`'
            echo '- Native APK/AAB build: NOT triggered'
          } >> "$GITHUB_STEP_SUMMARY"
