name: Temporary close policy header gap

on:
  push:
    paths:
      - scripts/temp_close_policy_header_gap.py
      - .github/workflows/temp-close-policy-header-gap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply policy header gap fix
        run: python scripts/temp_close_policy_header_gap.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -Fq 'sticky top-[72px] z-50 -mt-5 mb-4' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Remove policy header navigator gap"
            git pull --rebase origin main
            git push origin main
          fi
