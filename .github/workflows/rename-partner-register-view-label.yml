name: Rename partner register linked account action

on:
  push:
    branches: [fix/partner-register-view-label]
    paths:
      - ".github/workflows/rename-partner-register-view-label.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-register-view-label
      - name: Rename action label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web-portal/app/intermediaries/intermediary-register.tsx')
          text = path.read_text()
          old = 'View linked {linkedType.toUpperCase()}'
          new = 'View {linkedType.toUpperCase()}'
          if old not in text:
              raise SystemExit('Expected label not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/intermediaries/intermediary-register.tsx
          git commit -m "Rename linked account view action"
          git push
