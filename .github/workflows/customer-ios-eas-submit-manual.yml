name: Customer iOS EAS Submit (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SUBMIT_TESTFLIGHT to upload the existing signed IPA to App Store Connect (not publish)'
        required: true
        type: string
      asc_app_id:
        description: 'Numeric Apple ID of INSUREIT Customer in App Store Connect > App Information (not bundle ID)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit-ios:
    name: Submit existing Customer IPA to TestFlight
    if: ${{ inputs.confirm == 'SUBMIT_TESTFLIGHT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout approved iOS release branch
        uses: actions/checkout@v4
        with:
          ref: release/customer-ios-current-main-20261028
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm ci
      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || (echo "::error::EXPO_TOKEN is missing" && exit 1)
      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Configure iOS EAS Submit profile for the existing app record
        working-directory: apps/mobile-app
        env:
          ASC_APP_ID: ${{ inputs.asc_app_id }}
        shell: bash
        run: |
          if [[ ! "$ASC_APP_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::App Store Connect Apple ID must be numeric and correspond to INSUREIT Customer."
            exit 1
          fi
          node -e 'const fs=require("fs");const p="eas.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));c.submit??={};c.submit.production??={};c.submit.production.ios={ascAppId:process.env.ASC_APP_ID,appleTeamId:"455GGC36YS"};fs.writeFileSync(p,JSON.stringify(c,null,2)+String.fromCharCode(10))'
      - name: Validate generated EAS configuration
        working-directory: apps/mobile-app
        run: node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("eas.json","utf8"));if(!c.submit?.production?.ios?.ascAppId)process.exit(1);console.log("EAS submit production profile valid")'
      - name: Submit verified signed IPA to App Store Connect
        working-directory: apps/mobile-app
        run: eas submit --platform ios --id caaa8af4-2b41-4a0d-9354-b87b1d3e4c84 --profile production --non-interactive
