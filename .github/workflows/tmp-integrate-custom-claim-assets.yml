name: Temporary custom claim asset integration

on:
  push:
    branches:
      - mobile/integrate-custom-claim-assets
    paths:
      - '.github/workflows/tmp-integrate-custom-claim-assets.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/integrate-custom-claim-assets
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire custom claim assets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # Start Claim: switch from temporary WebP artwork to the user-supplied PNG artwork.
          p = Path('apps/mobile-app/app/customer/start-claim.tsx')
          s = p.read_text()
          s = s.replace("require('../../assets/brand/start-claim/start-claim-hero.webp')", "require('../../assets/brand/start-claim/start-claim-hero.png')")
          s = s.replace("require('../../assets/brand/start-claim/start-claim-footer-scene.webp')", "require('../../assets/brand/start-claim/start-claim-footer-scene.png')")
          p.write_text(s)

          # Spot Intimation: use the custom document artworks as a compact readiness strip.
          p = Path('apps/mobile-app/app/customer/self-managed-claim.tsx')
          s = p.read_text()
          s = s.replace(
              "import { Modal, Pressable, StyleSheet, Text, View } from 'react-native';",
              "import { Image, Modal, Pressable, StyleSheet, Text, View } from 'react-native';",
          )
          marker = "      <View style={styles.voicePlaceholder}>"
          insert = '''      <View style={styles.documentReadyCard}>\n        <View style={styles.documentReadyHeader}>\n          <View>\n            <Text style={styles.documentReadyTitle}>Documents to keep ready</Text>\n            <Text style={styles.documentReadySubtitle}>These are commonly needed as the claim progresses.</Text>\n          </View>\n          <View style={styles.documentReadyBadge}><Text style={styles.documentReadyBadgeText}>Optional now</Text></View>\n        </View>\n        <View style={styles.documentReadyGrid}>\n          <DocumentReadyTile title="RC Copy" source={require('../../assets/brand/spot-intimation/glossy_green_vehicle_document_icon.png')} />\n          <DocumentReadyTile title="Insurance Copy" source={require('../../assets/brand/spot-intimation/glossy_blue_secure_policy_document_icon.png')} />\n          <DocumentReadyTile title="Driver Licence" source={require('../../assets/brand/spot-intimation/glossy_purple_id_card_icon.png')} />\n          <DocumentReadyTile title="GR / Load Bill" source={require('../../assets/brand/spot-intimation/glossy_orange_delivery_document_icon.png')} />\n        </View>\n      </View>\n\n'''
          if marker not in s:
              raise SystemExit('Spot Intimation insertion marker not found')
          s = s.replace(marker, insert + marker, 1)

          function_marker = "function TimePickerField({ label, value, onPress }: { label: string; value: string; onPress: () => void }) {"
          function_insert = '''function DocumentReadyTile({ title, source }: { title: string; source: any }) {\n  return <View style={styles.documentReadyTile}>\n    <View style={styles.documentReadyArtworkWrap}><Image source={source} style={styles.documentReadyArtwork} resizeMode="contain" /></View>\n    <Text style={styles.documentReadyTileText} numberOfLines={2}>{title}</Text>\n  </View>;\n}\n\n'''
          if function_marker not in s:
              raise SystemExit('Spot Intimation function marker not found')
          s = s.replace(function_marker, function_insert + function_marker, 1)

          style_marker = "  voicePlaceholder: { borderRadius: 17, borderWidth: 1, borderColor: '#CADAF0'"
          style_insert = '''  documentReadyCard: { borderRadius: 18, borderWidth: 1, borderColor: '#D7E2EF', backgroundColor: '#FFFFFF', padding: 12, marginBottom: 12, shadowColor: '#14375F', shadowOpacity: 0.05, shadowRadius: 9, shadowOffset: { width: 0, height: 4 }, elevation: 1 },\n  documentReadyHeader: { flexDirection: 'row', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10, marginBottom: 10 },\n  documentReadyTitle: { color: palette.navy, fontSize: 12.5, fontWeight: '900' },\n  documentReadySubtitle: { color: '#6D7B8F', fontSize: 9.5, lineHeight: 13, fontWeight: '600', marginTop: 2 },\n  documentReadyBadge: { borderRadius: 999, backgroundColor: '#EEF5FF', paddingHorizontal: 9, paddingVertical: 5 },\n  documentReadyBadgeText: { color: '#0A43A3', fontSize: 8.5, fontWeight: '900' },\n  documentReadyGrid: { flexDirection: 'row', gap: 8 },\n  documentReadyTile: { flex: 1, minWidth: 0, borderRadius: 14, backgroundColor: '#F7FAFF', borderWidth: 1, borderColor: '#E2EAF4', paddingVertical: 9, paddingHorizontal: 5, alignItems: 'center' },\n  documentReadyArtworkWrap: { width: 48, height: 48, alignItems: 'center', justifyContent: 'center' },\n  documentReadyArtwork: { width: 46, height: 46 },\n  documentReadyTileText: { color: palette.navy, fontSize: 8.5, lineHeight: 11, fontWeight: '800', textAlign: 'center', marginTop: 4 },\n'''
          if style_marker not in s:
              raise SystemExit('Spot Intimation style marker not found')
          s = s.replace(style_marker, style_insert + style_marker, 1)
          p.write_text(s)

          # Claim Intimation upload tabs: use matching custom artwork for the four supported document types.
          p = Path('apps/mobile-app/components/external-claim-document-tabs.tsx')
          s = p.read_text()
          s = s.replace(
              "import { Pressable, ScrollView, StyleSheet, Text, View } from 'react-native';",
              "import { Image, Pressable, ScrollView, StyleSheet, Text, View } from 'react-native';",
          )
          map_marker = "const MAX_UPLOAD_SIZE_BYTES = 5 * 1024 * 1024;\n"
          map_insert = '''\nfunction documentArtwork(type: string) {\n  if (type === 'RC Copy') return require('../assets/brand/spot-intimation/glossy_green_vehicle_document_icon.png');\n  if (type === 'Insurance copy') return require('../assets/brand/spot-intimation/glossy_blue_secure_policy_document_icon.png');\n  if (type === 'Driver Licence') return require('../assets/brand/spot-intimation/glossy_purple_id_card_icon.png');\n  if (type === 'GR/Load bill') return require('../assets/brand/spot-intimation/glossy_orange_delivery_document_icon.png');\n  return null;\n}\n'''
          if map_marker not in s:
              raise SystemExit('Document tabs map marker not found')
          s = s.replace(map_marker, map_marker + map_insert, 1)

          declaration_marker = "          const uploading = uploadingType === document.type;\n"
          if declaration_marker not in s:
              raise SystemExit('Document tabs declaration marker not found')
          s = s.replace(declaration_marker, declaration_marker + "          const artwork = documentArtwork(document.type);\n", 1)

          old_icon = '''            <View style={[styles.documentIcon, uploaded && styles.documentIconUploaded]}>\n              <MaterialCommunityIcons name={(document.icon || 'file-document-outline') as keyof typeof MaterialCommunityIcons.glyphMap} size={23} color={uploaded ? '#FFFFFF' : '#0A43A3'} />\n            </View>'''
          new_icon = '''            <View style={[styles.documentIcon, uploaded && styles.documentIconUploaded]}>\n              {artwork ? <Image source={artwork} style={styles.documentArtwork} resizeMode="contain" /> : <MaterialCommunityIcons name={(document.icon || 'file-document-outline') as keyof typeof MaterialCommunityIcons.glyphMap} size={23} color={uploaded ? '#FFFFFF' : '#0A43A3'} />}\n            </View>'''
          if old_icon not in s:
              raise SystemExit('Document tabs icon block not found')
          s = s.replace(old_icon, new_icon, 1)

          style_marker = "  grid: { padding: 12, flexDirection: 'row', flexWrap: 'wrap', gap: 10 },"
          if style_marker not in s:
              raise SystemExit('Document tabs style marker not found')
          s = s.replace(style_marker, style_marker + " documentArtwork: { width: 42, height: 42 },", 1)
          p.write_text(s)
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/mobile-app/app/customer/start-claim.tsx apps/mobile-app/app/customer/self-managed-claim.tsx apps/mobile-app/components/external-claim-document-tabs.tsx
          git diff --cached --check
          git commit -m 'Integrate custom claim artwork'
          git push origin HEAD:mobile/integrate-custom-claim-assets
