name: Apply claim journey alignment migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply claim journey alignment migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260903151000_reviewed_claim_assistance_intake.sql
          test -f supabase/migrations/20260903160000_fix_initial_document_finalization.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply claim journey migrations
        run: |
          supabase db query --linked --file supabase/migrations/20260903151000_reviewed_claim_assistance_intake.sql
          supabase db query --linked --file supabase/migrations/20260903160000_fix_initial_document_finalization.sql

      - name: Record migrations as applied
        run: |
          supabase migration repair --linked --status applied 20260903151000
          supabase migration repair --linked --status applied 20260903160000

      - name: Verify protected claim RPCs
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.resolve_claim_assistance_intake(uuid,text,claim_status,text,uuid)') is not null as assistance_ready,
              to_regprocedure('public.advance_initial_documents_verified(uuid,uuid)') is not null as finalization_ready,
              position(
                'Initial Documents Pending'
                in pg_get_functiondef('public.advance_initial_documents_verified(uuid,uuid)'::regprocedure)
              ) > 0 as pending_status_ready
          ")
          echo "$result"
          echo "$result" | grep -Eq '"assistance_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"finalization_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"pending_status_ready"[[:space:]]*:[[:space:]]*true'
