name: Temporary build cumulative mobile recovery

on:
  push:
    branches:
      - recovery/mobile-today-cumulative
    paths:
      - '.github/workflows/tmp-build-mobile-recovery.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-build-mobile-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/mobile-today-cumulative
          fetch-depth: 0

      - name: Fetch approved mobile feature branches
        run: |
          git fetch origin \
            ui/mobile-claim-tracker-progress-ring \
            fix/claim-intimation-bulk-picker-runtime \
            ui/my-claims-self-tracked-status-colors-v2 \
            ui/compact-document-upload-actions \
            ui/compact-claim-identity-card

      - name: Compose cumulative mobile changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "antnish1"
          git config user.email "shahdolho@gmail.com"

          git merge --no-ff --no-edit origin/ui/mobile-claim-tracker-progress-ring
          git merge --no-ff --no-edit origin/fix/claim-intimation-bulk-picker-runtime
          git merge --no-ff --no-edit origin/ui/my-claims-self-tracked-status-colors-v2
          git merge --no-ff --no-edit origin/ui/compact-document-upload-actions
          git merge --no-ff --no-edit -X theirs origin/ui/compact-claim-identity-card

          python <<'PY'
          from pathlib import Path

          milestone = Path('apps/mobile-app/app/customer/self-managed-milestone.tsx')
          text = milestone.read_text()
          import_line = "import { CompactDocumentActionBar, CompactDocumentStageHeader } from '@/components/compact-document-upload-navigation';\n"
          anchor = "import { AppDatePicker } from '@/components/design-system';\n"
          if import_line not in text:
              if anchor not in text: raise SystemExit('milestone import anchor missing')
              text = text.replace(anchor, import_line + anchor, 1)
          marker = "  return (\n    <Screen title={definition.label} showTitleHeader={false}>\n"
          if "const documentUploadStage = key === 'claim_intimation';" not in text:
              if marker not in text: raise SystemExit('milestone return marker missing')
              prefix = "  const documentUploadStage = key === 'claim_intimation';\n  const primaryLabel = saving ? 'Saving...' : key === 'payment_encashment' ? 'Complete Claim' : key === 'vehicle_delivery' && values.vehicle_received !== 'yes' ? 'Save Vehicle Status' : 'Save & Continue';\n\n"
              text = text.replace(marker, prefix + marker, 1)
          old_header = """      <ExternalClaimStageHeader
        step={step}
        title={definition.label}
        subtitle={subtitleFor(key)}
        vehicleNo={vehicleNo}
        claimNo={claimNo}
        onBack={() => router.back()}
      />
"""
          new_header = """      {documentUploadStage ? <CompactDocumentStageHeader
        step={step}
        title={definition.label}
        subtitle={subtitleFor(key)}
        vehicleNo={vehicleNo}
        claimNo={claimNo}
      /> : <ExternalClaimStageHeader
        step={step}
        title={definition.label}
        subtitle={subtitleFor(key)}
        vehicleNo={vehicleNo}
        claimNo={claimNo}
        onBack={() => router.back()}
      />}
"""
          if '<CompactDocumentStageHeader' not in text:
              if old_header not in text: raise SystemExit('milestone shared header block missing')
              text = text.replace(old_header, new_header, 1)
          old_action = """      <ClaimActionBar
        primaryDisabled={saving || loading}
        primaryIcon={key === 'payment_encashment' ? 'check' : 'arrow-right'}
        primaryLabel={saving ? 'Saving...' : key === 'payment_encashment' ? 'Complete Claim' : key === 'vehicle_delivery' && values.vehicle_received !== 'yes' ? 'Save Vehicle Status' : 'Save & Continue'}
        onAssistance={openAssistance}
        onPrimary={() => void save()}
      />
"""
          new_action = """      {documentUploadStage ? <CompactDocumentActionBar
        claimId={claimId}
        step={step}
        milestones={milestones}
        primaryDisabled={saving || loading}
        primaryLabel={primaryLabel}
        onPrimary={() => void save()}
      /> : <ClaimActionBar
        primaryDisabled={saving || loading}
        primaryIcon={key === 'payment_encashment' ? 'check' : 'arrow-right'}
        primaryLabel={primaryLabel}
        onAssistance={openAssistance}
        onPrimary={() => void save()}
      />}
"""
          if '<CompactDocumentActionBar' not in text:
              if old_action not in text: raise SystemExit('milestone shared action block missing')
              text = text.replace(old_action, new_action, 1)
          milestone.write_text(text)

          ui = Path('apps/mobile-app/components/external-claim-ui.tsx')
          ui_text = ui.read_text().replace('          <Text style={styles.eyebrow}>STEP {step} OF 9</Text>\n', '', 1)
          ui.write_text(ui_text)
          PY

          git add apps/mobile-app/app/customer/self-managed-milestone.tsx apps/mobile-app/components/external-claim-ui.tsx
          git commit -m "Integrate overlapping claim stage UI changes" || true

      - name: Verify restored behaviors are present
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function ProgressRing" apps/mobile-app/app/customer/claim-detail.tsx
          grep -q "#C43838" apps/mobile-app/app/customer/claims.tsx
          grep -Fq "type: ['application/pdf', 'image/*']" apps/mobile-app/components/external-claim-document-tabs.tsx
          test -f apps/mobile-app/components/compact-document-upload-navigation.tsx
          grep -q "CompactDocumentStageHeader" apps/mobile-app/app/customer/self-managed-milestone.tsx
          grep -q "ClaimIdentityCard" apps/mobile-app/app/customer/self-managed-milestone.tsx
          grep -q "ClaimIdentityCard" apps/mobile-app/app/customer/self-managed-claim.tsx
          grep -q "ClaimIdentityCard" apps/mobile-app/app/customer/self-managed-spot-status.tsx
          grep -q "CLAIM DETAILS" apps/mobile-app/components/external-claim-ui.tsx
          ! grep -q "STEP {step} OF 9" apps/mobile-app/components/external-claim-ui.tsx

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile
        run: npm run typecheck:mobile

      - name: Lint mobile
        run: npm run lint:mobile

      - name: Clean temporary recovery audit files and push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tmp-audit-mobile-recovery-merge.yml 2>/dev/null || true
          git rm -f .github/workflows/tmp-audit-mobile-recovery-report.yml 2>/dev/null || true
          git rm -f recovery-merge-audit.txt 2>/dev/null || true
          git rm -f .github/workflows/tmp-build-mobile-recovery.yml
          git commit -m "chore: remove temporary mobile recovery workflows" || true
          git push origin HEAD:recovery/mobile-today-cumulative
