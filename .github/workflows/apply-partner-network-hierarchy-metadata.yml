name: Apply Partner Network hierarchy metadata migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260915164000_partner_network_authorized_hierarchy_metadata.sql'
      - '.github/workflows/apply-partner-network-hierarchy-metadata.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner Network hierarchy metadata migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260915164000_partner_network_authorized_hierarchy_metadata.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Partner Network hierarchy metadata migration
        run: supabase db query --linked --file supabase/migrations/20260915164000_partner_network_authorized_hierarchy_metadata.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260915164000

      - name: Verify Partner Network RPC hierarchy contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.partner_app_network()') is not null as function_ready,
              has_function_privilege('authenticated', 'public.partner_app_network()', 'EXECUTE') as authenticated_execute,
              coalesce((select p.prosecdef from pg_proc p where p.oid = 'public.partner_app_network()'::regprocedure), false) as security_definer,
              position('parent_partner_id' in pg_get_functiondef('public.partner_app_network()'::regprocedure)) > 0 as hierarchy_metadata_ready
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"authenticated_execute"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"security_definer"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"hierarchy_metadata_ready"[[:space:]]*:[[:space:]]*true'
