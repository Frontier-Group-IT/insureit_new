name: Temporary Vercel app-root validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app-root-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-portal
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: diagnostic-placeholder
      SUPABASE_SERVICE_ROLE_KEY: diagnostic-placeholder
      POSP_MISP_DATA_ENCRYPTION_KEY: diagnostic-placeholder-key-with-sufficient-length
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      ICALL_GATEWAY_URL: https://example.invalid
      ICALL_GATEWAY_SECRET: diagnostic-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from web portal root
        run: npm install
      - name: Typecheck web portal
        run: npm run typecheck
      - name: Build web portal
        run: npm run build
