name: Apply Partner code PT format migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260916140000_partner_code_pt_format.sql'
      - 'supabase/verification/20260916140000_partner_code_pt_format.sql'
      - '.github/workflows/apply-partner-code-pt-format.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner code PT format migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260916140000_partner_code_pt_format.sql
          test -f supabase/verification/20260916140000_partner_code_pt_format.sql
          test -f supabase/rollbacks/20260916140000_partner_code_pt_format.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Partner code PT format migration
        run: supabase db query --linked --file supabase/migrations/20260916140000_partner_code_pt_format.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260916140000

      - name: Verify Partner code PT migration
        run: supabase db query --linked --file supabase/verification/20260916140000_partner_code_pt_format.sql
