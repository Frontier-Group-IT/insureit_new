name: Temporary policy lead source patch

on:
  push:
    branches:
      - policy/lead-source-master-only

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: policy/lead-source-master-only
          fetch-depth: 0
      - name: Apply exact policy source workflow changes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "apps/web-portal/components/policy-unified-form.tsx": [
                  (
                      '  const availableSources=useMemo(()=>sources.filter(item=>item.type===form.intermediaryType),[sources,form.intermediaryType]);\n',
                      '  const availableSources=useMemo(()=>sources.filter(item=>item.type===form.intermediaryType),[sources,form.intermediaryType]);\n  const selectedSourceId=useMemo(()=>availableSources.find(item=>item.code===form.intermediaryCode&&item.label.trim().toLowerCase()===form.leadSource.trim().toLowerCase())?.value??"",[availableSources,form.intermediaryCode,form.leadSource]);\n'
                  ),
                  (
                      '  function changeLeadSource(value:string){ const selected=sources.find(item=>item.type===form.intermediaryType&&item.label.trim().toLowerCase()===value.trim().toLowerCase()); setForm(current=>({...current,leadSource:value,intermediaryCode:selected?.code??"",rmName:selected?.rmName??""})); }\n',
                      '  function changeLeadSource(value:string){ const selected=availableSources.find(item=>item.value===value); setForm(current=>({...current,leadSource:selected?.label??"",intermediaryCode:selected?.code??"",rmName:selected?.rmName??""})); }\n'
                  ),
                  (
                      '  function submitPolicy(){ if(form.vehicleClass==="GCV"&&numeric(form.cpa)<=0){setSubmitError("CPA amount is mandatory for GCV policies and must be greater than ₹0.");goToSection(2);return;} ',
                      '  function submitPolicy(){ if(!selectedSourceId){setSubmitError("Select a valid active Partner/POSP/MISP as the Lead Source.");goToSection(0);return;} if(form.vehicleClass==="GCV"&&numeric(form.cpa)<=0){setSubmitError("CPA amount is mandatory for GCV policies and must be greater than ₹0.");goToSection(2);return;} '
                  ),
                  (
                      '    <datalist id="policy-lead-source-master-options">{availableSources.map(item=><option key={item.value} value={item.label}>{[item.code,item.rmName].filter(Boolean).join(" · ")}</option>)}</datalist>\n',
                      ''
                  ),
                  (
                      '        <div><Field label="Lead source" list="policy-lead-source-master-options" autoComplete="off" value={form.leadSource} onChange={e=>changeLeadSource(e.target.value)} placeholder={form.intermediaryType?"Start typing a name":"Select intermediary type first"} disabled={!form.intermediaryType} required/><CompactSourceMeta label="ID" value={form.intermediaryCode||"Select lead source"}/><input type="hidden" aria-label="Intermediary code" value={form.intermediaryCode} readOnly/></div>\n',
                      '        <div><label className={labelClass}>Lead source <Required/></label><select className={inputClass} value={selectedSourceId} onChange={e=>changeLeadSource(e.target.value)} disabled={!form.intermediaryType} required><option value="">{form.intermediaryType?"Select registered source":"Select intermediary type first"}</option>{availableSources.map(item=><option key={item.value} value={item.value}>{item.label} · {item.code}</option>)}</select><CompactSourceMeta label="ID" value={form.intermediaryCode||"Select lead source"}/><input type="hidden" aria-label="Intermediary code" value={form.intermediaryCode} readOnly/></div>\n'
                  ),
              ],
              "apps/web-portal/app/policies/policy-onboarding-actions.ts": [
                  (
                      'import { createSupabaseAdminClient } from "@/lib/supabase-admin";\n',
                      'import { createSupabaseAdminClient } from "@/lib/supabase-admin";\nimport { resolvePolicyIntermediarySource } from "@/lib/policy-intermediary-source";\n'
                  ),
                  (
                      '  const validationError = validatePayload(payload);\n  if (validationError) return { ok: false, kind: "validation", error: validationError };\n\n  const phone = normalizedPhone(payload.customer.phone);\n',
                      '  const validationError = validatePayload(payload);\n  if (validationError) return { ok: false, kind: "validation", error: validationError };\n  const sourceResolution = await resolvePolicyIntermediarySource(payload.policy);\n  if (!sourceResolution.ok) return { ok: false, kind: "validation", error: sourceResolution.error };\n  payload = { ...payload, policy: { ...payload.policy, ...sourceResolution.source }, customer: { ...payload.customer, source: sourceResolution.source.leadSource } };\n\n  const phone = normalizedPhone(payload.customer.phone);\n'
                  ),
              ],
              "apps/web-portal/app/policies/policy-edit-actions.ts": [
                  (
                      'import { createSupabaseAdminClient } from "@/lib/supabase-admin";\n',
                      'import { createSupabaseAdminClient } from "@/lib/supabase-admin";\nimport { resolvePolicyIntermediarySource } from "@/lib/policy-intermediary-source";\n'
                  ),
                  (
                      '  try {\n    const admin = createSupabaseAdminClient();\n    const { data, error } = await admin.rpc("update_motor_policy", {\n      p_policy_id: policyId,\n      p_payload: payload,\n    });\n',
                      '  try {\n    const sourceResolution = await resolvePolicyIntermediarySource(payload.policy);\n    if (!sourceResolution.ok) return { ok: false, error: sourceResolution.error };\n    const normalizedPayload = { ...payload, policy: { ...payload.policy, ...sourceResolution.source } };\n    const admin = createSupabaseAdminClient();\n    const { data, error } = await admin.rpc("update_motor_policy", {\n      p_policy_id: policyId,\n      p_payload: normalizedPayload,\n    });\n'
                  ),
              ],
          }

          changed = False
          for filename, items in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in items:
                  if old in text:
                      text = text.replace(old, new, 1)
                      changed = True
                  elif new and new in text:
                      continue
                  elif not new and old not in text:
                      continue
                  else:
                      raise SystemExit(f"Expected text not found in {filename}: {old[:120]!r}")
              path.write_text(text)

          if changed:
              Path(".policy-source-patch-changed").write_text("yes")
          PY
      - name: Commit patch
        run: |
          if [ ! -f .policy-source-patch-changed ]; then
            echo "Patch already applied."
            exit 0
          fi
          rm .policy-source-patch-changed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx apps/web-portal/app/policies/policy-onboarding-actions.ts apps/web-portal/app/policies/policy-edit-actions.ts
          git commit -m "Restrict policy lead source to active intermediary master"
          git push origin HEAD:policy/lead-source-master-only
