name: Publish current v0.2 Assessment Report UI OTA once

on:
  push:
    branches:
      - release/mobile-v0.2-current

permissions:
  contents: read

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish Assessment Report UI current v0.2 OTA'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/mobile-v0.2-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Confirm current v0.2 runtime
        run: node -e "const c=require('./apps/mobile-app/app.json');if(c.expo.version!=='0.2.0')process.exit(2)"
      - name: Confirm Assessment Report icon and sizing
        run: |
          grep -q "ASSESSMENT_REPORT_ICON" apps/mobile-app/app/customer/self-managed-milestone.tsx
          grep -q "deliveryReportRow: { minHeight: 58, borderRadius: 13" apps/mobile-app/app/customer/self-managed-milestone.tsx
          test -f apps/mobile-app/assets/claims/claim-assessment.png
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck:mobile
      - name: Lint
        run: npm run lint:mobile
      - name: Expo web build
        run: npm run build:mobile:web
      - name: Publish OTA
        working-directory: apps/mobile-app
        run: npx eas-cli update --channel preview --environment preview --message "Assessment Report upload sizing and custom icon for v0.2.0" --non-interactive
