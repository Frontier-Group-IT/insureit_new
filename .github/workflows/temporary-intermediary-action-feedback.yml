name: Temporary intermediary action feedback validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix/intermediary-action-loading-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_INSUREIT_LAUNCH_SCOPE: intermediary

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused intermediary feedback changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          submit_button = "apps/web-portal/components/form-submit-button.tsx"
          replace_once(
              submit_button,
              'const defaultClassName = "inline-flex items-center justify-center gap-2 rounded-md bg-[var(--brand-accent)] px-4 py-2 text-[11px] font-semibold text-white shadow-sm hover:bg-[#5D55D8] disabled:cursor-not-allowed disabled:opacity-80";\n',
              'const defaultClassName = "inline-flex items-center justify-center gap-2 rounded-md bg-[var(--brand-accent)] px-4 py-2 text-[11px] font-semibold text-white shadow-sm hover:bg-[#5D55D8] disabled:cursor-not-allowed disabled:opacity-80";\nconst interactionClassName = "cursor-pointer transition duration-150 ease-out hover:-translate-y-px hover:shadow-md active:translate-y-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#818CF8] focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:translate-y-0 disabled:shadow-none disabled:opacity-70";\n',
          )
          replace_once(
              submit_button,
              '  className = defaultClassName,\n  disabled = false,\n}: {\n  label?: string;\n  pendingLabel?: string;\n  className?: string;\n  disabled?: boolean;\n}) {',
              '  className = defaultClassName,\n  disabled = false,\n  icon,\n}: {\n  label?: string;\n  pendingLabel?: string;\n  className?: string;\n  disabled?: boolean;\n  icon?: React.ReactNode;\n}) {',
          )
          replace_once(submit_button, '      className={className}\n', '      className={`${interactionClassName} ${className}`}\n')
          replace_once(submit_button, '      {pending ? <InsureItButtonLoader label={pendingLabel} /> : label}\n', '      {pending ? <InsureItButtonLoader label={pendingLabel} /> : <>{icon}{label}</>}\n')

          review_page = "apps/web-portal/app/intermediaries/applications/[id]/page.tsx"
          replace_once(review_page, 'import { AppShell } from "@/components/shell";\n', 'import { AppShell } from "@/components/shell";\nimport { FormSubmitButton } from "@/components/form-submit-button";\n')
          replace_once(
              review_page,
              '<CompactSubmit label={profile.partner_type === "misp" ? "Create MISP account" : "Create POSP account"} />',
              '<CompactSubmit label={profile.partner_type === "misp" ? "Create MISP ID" : "Create POSP ID"} pendingLabel={profile.partner_type === "misp" ? "Creating MISP ID…" : "Creating POSP ID…"} />',
          )
          replace_once(review_page, '<CompactSubmit label="Create user" secondary />', '<CompactSubmit label="Create user" pendingLabel="Creating user…" secondary />')
          replace_once(review_page, '<CompactSubmit label="Resend link" secondary />', '<CompactSubmit label="Resend link" pendingLabel="Sending link…" secondary />')
          old_compact = 'function CompactSubmit({ label, secondary = false }: { label: string; secondary?: boolean }) { return <button type="submit" className={`inline-flex h-9 items-center rounded-xl px-4 text-[10px] font-semibold ${secondary ? "border border-white/30 bg-white/10 text-white" : "bg-gradient-to-r from-[#635BFF] to-[#4B8DF8] text-white"}`}>{label}</button>; }'
          new_compact = "\n".join([
              'function CompactSubmit({ label, pendingLabel, secondary = false }: { label: string; pendingLabel: string; secondary?: boolean }) {',
              '  return <FormSubmitButton',
              '    label={label}',
              '    pendingLabel={pendingLabel}',
              '    className={`inline-flex h-9 items-center justify-center rounded-xl px-4 text-[10px] font-semibold ${secondary ? "border border-white/30 bg-white/10 text-white hover:border-white/50 hover:bg-white/20" : "bg-gradient-to-r from-[#635BFF] to-[#4B8DF8] text-white hover:brightness-110"}`}',
              '  />;',
              '}',
          ])
          replace_once(review_page, old_compact, new_compact)

          success_modal = "apps/web-portal/app/intermediaries/applications/[id]/id-success-modal.tsx"
          replace_once(success_modal, 'import { createLinkedIntermediaryAccount } from "./account-review-actions";\n', 'import { FormSubmitButton } from "@/components/form-submit-button";\nimport { createLinkedIntermediaryAccount } from "./account-review-actions";\n')
          old_modal_button = "\n".join([
              '              <button type="submit" className="inline-flex h-10 w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-[#635BFF] to-[#4B8DF8] px-4 text-[10.5px] font-semibold text-white shadow-[0_12px_24px_rgba(79,70,229,.22)] transition hover:brightness-105">',
              '                Create {accountLabel} ID <ArrowRight className="h-4 w-4" />',
              '              </button>',
          ])
          new_modal_button = "\n".join([
              '              <FormSubmitButton',
              '                label={`Create ${accountLabel} ID`}',
              '                pendingLabel={`Creating ${accountLabel} ID…`}',
              '                icon={<ArrowRight className="h-4 w-4" />}',
              '                className="inline-flex h-10 w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-[#635BFF] to-[#4B8DF8] px-4 text-[10.5px] font-semibold text-white shadow-[0_12px_24px_rgba(79,70,229,.22)] hover:brightness-110"',
              '              />',
          ])
          replace_once(success_modal, old_modal_button, new_modal_button)

          register = "apps/web-portal/app/intermediaries/intermediary-register.tsx"
          replace_once(
              register,
              '<FormSubmitButton label={`Create ${allowedType.toUpperCase()}`} pendingLabel="Creating" className="rounded-lg bg-[#635BFF] px-3 py-2 text-[9px] font-semibold text-white disabled:opacity-60" />',
              '<FormSubmitButton label={`Create ${allowedType.toUpperCase()} ID`} pendingLabel={`Creating ${allowedType.toUpperCase()} ID…`} className="rounded-lg bg-[#635BFF] px-3 py-2 text-[9px] font-semibold text-white hover:bg-[#554DE8] disabled:opacity-60" />',
          )
          replace_once(
              register,
              '<FormSubmitButton label="Create user" pendingLabel="Sending link" className="rounded-lg bg-[#0F2A55] px-3 py-1.5 text-[9px] font-semibold text-white disabled:opacity-60" />',
              '<FormSubmitButton label="Create user" pendingLabel="Creating user…" className="rounded-lg bg-[#0F2A55] px-3 py-1.5 text-[9px] font-semibold text-white hover:bg-[#173A70] disabled:opacity-60" />',
          )
          replace_once(
              register,
              '<FormSubmitButton label="Resend link" pendingLabel="Sending again" className="rounded-lg border border-amber-200 bg-amber-50 px-3 py-1.5 text-[9px] font-semibold text-amber-800 disabled:opacity-60" />',
              '<FormSubmitButton label="Resend link" pendingLabel="Sending link…" className="rounded-lg border border-amber-200 bg-amber-50 px-3 py-1.5 text-[9px] font-semibold text-amber-800 hover:border-amber-300 hover:bg-amber-100 disabled:opacity-60" />',
          )

          audited = [Path(review_page), Path(success_modal), Path(register)]
          for file in audited:
              text = file.read_text()
              if "createLinkedIntermediaryAccount" in text and '<button type="submit"' in text:
                  raise SystemExit(f"Raw submit button remains in linked-account surface: {file}")

          print("Intermediary action feedback patch applied successfully.")
          PY

      - name: Install dependencies
        run: npm ci || (sleep 10 && npm ci)

      - name: Lint web portal
        run: npm run lint:web

      - name: Typecheck web portal
        run: npm run typecheck:web

      - name: Build web portal
        run: npm run build:web

      - name: Commit validated application changes
        run: |
          rm .github/workflows/temporary-intermediary-action-feedback.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web-portal/components/form-submit-button.tsx \
            'apps/web-portal/app/intermediaries/applications/[id]/page.tsx' \
            'apps/web-portal/app/intermediaries/applications/[id]/id-success-modal.tsx' \
            apps/web-portal/app/intermediaries/intermediary-register.tsx \
            .github/workflows/temporary-intermediary-action-feedback.yml
          git commit -m "Fix intermediary action loading feedback"
          git push origin HEAD:${{ github.head_ref }}
