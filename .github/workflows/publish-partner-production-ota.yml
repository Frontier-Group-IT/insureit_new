name: Publish Partner production OTA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/partner-app/.trigger-production-ota'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "Refusing Partner production OTA: checkout is not current origin/main." >&2
            exit 1
          }

      - name: Validate Partner production OTA linkage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const customer = require('./apps/mobile-app/app.json');
          const expo = app.expo || {};
          const projectId = expo?.extra?.eas?.projectId;
          const updateUrl = expo?.updates?.url;
          if (expo.version !== '0.2.0') {
            console.error(`Refusing Partner production OTA: expected runtime/app version 0.2.0, found ${expo.version ?? 'missing'}.`);
            process.exit(1);
          }
          if (!projectId || !updateUrl) {
            console.error('Refusing Partner production OTA: missing EAS project/update configuration.');
            process.exit(1);
          }
          if (projectId === customer?.expo?.extra?.eas?.projectId || updateUrl === customer?.expo?.updates?.url) {
            console.error('Refusing Partner production OTA: Partner app cannot share Customer EAS/update identity.');
            process.exit(1);
          }
          if (expo?.runtimeVersion?.policy !== 'appVersion') {
            console.error('Refusing Partner production OTA: expected appVersion runtime policy.');
            process.exit(1);
          }
          console.log(`Partner production runtime ${expo.version}; project ${projectId}`);
          NODE

      - name: Require Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck Partner app
        run: npm --workspace apps/partner-app run typecheck

      - name: Verify Expo token can access Partner project
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish Partner production OTA
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel production \
            --environment production \
            --message "INSUREIT Partner production 0.2.0 from main ${GITHUB_SHA}" \
            --non-interactive \
            --json > partner-production-update.json
          cat partner-production-update.json

      - name: OTA summary
        if: always()
        shell: bash
        run: |
          {
            echo "## INSUREIT Partner production OTA"
            echo
            echo "- Source: current \`main\` only"
            echo "- Channel: \`production\`"
            echo "- Runtime: \`0.2.0\`"
            echo "- Runtime policy: \`appVersion\`"
            echo "- No APK/AAB/native build"
          } >> "$GITHUB_STEP_SUMMARY"
