name: Publish Partner production OTA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/partner-app/.trigger-production-ota'
      - '.github/workflows/verify-partner-app.yml'
      - 'apps/partner-app/app/**'
      - 'apps/partner-app/components/**'
      - 'apps/partner-app/lib/**'
      - 'apps/partner-app/assets/**'
      - '.github/workflows/publish-partner-production-ota.yml'

concurrency:
  group: partner-production-ota
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
    steps:
      # Pin each queued publication to the verified merged commit that triggered it.
      # main can advance while workflows wait; publishing its newer HEAD would mix
      # unrelated commits into an older release and fail the exact-HEAD race guard.
      - name: Check out verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require release commit to belong to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Refusing Partner production OTA: source commit is not in origin/main." >&2
            exit 1
          }

      - name: Require merged PR for automatic publication
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > /tmp/partner-ota-merged-pr.json
          node <<'NODE'
          const fs = require('fs');
          const matches = JSON.parse(fs.readFileSync('/tmp/partner-ota-merged-pr.json', 'utf8'));
          if (!Array.isArray(matches) || !matches.some(pr =>
            pr.merged_at && pr.base?.ref === 'main' && pr.merge_commit_sha === process.env.GITHUB_SHA
          )) throw new Error('Auto OTA refused: main commit is not a verified merged PR');
          NODE

      - name: Gate automatic publishing to OTA-compatible changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          # Workflow updates and explicit release trigger are intentional release controls.
          # Block any mixed changes involving native configuration, dependencies,
          # migrations, or unrelated app surfaces instead of silently publishing them.
          git diff --name-only "${{ github.event.before }}" HEAD > /tmp/partner-ota-changes
          cat /tmp/partner-ota-changes
          node <<'NODE'
          const fs = require('fs');
          const files = fs.readFileSync('/tmp/partner-ota-changes', 'utf8').trim().split('\n').filter(Boolean);
          if (!files.length) throw new Error('No changes to publish');
          for (const file of files) {
            const approved = file === 'apps/partner-app/.trigger-production-ota'
              || file === '.github/workflows/publish-partner-production-ota.yml'
              || file === '.github/workflows/verify-partner-app.yml'
              || /^apps\/partner-app\/(app|components|lib|assets)\//.test(file);
            const native = /(^|\/)(android|ios)\//.test(file)
              || /\.(gradle|podspec|xcworkspace|xcodeproj|entitlements)$/.test(file);
            if (!approved || native) throw new Error('Auto OTA refused: requires release review for ' + file);
          }
          NODE

      - name: Validate Partner production OTA linkage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const customer = require('./apps/mobile-app/app.json');
          const expo = app.expo || {};
          const projectId = expo?.extra?.eas?.projectId;
          const updateUrl = expo?.updates?.url;
          if (expo.version !== '0.2.0') {
            console.error(`Refusing Partner production OTA: expected runtime/app version 0.2.0, found ${expo.version ?? 'missing'}.`);
            process.exit(1);
          }
          if (!projectId || !updateUrl) {
            console.error('Refusing Partner production OTA: missing EAS project/update configuration.');
            process.exit(1);
          }
          if (projectId === customer?.expo?.extra?.eas?.projectId || updateUrl === customer?.expo?.updates?.url) {
            console.error('Refusing Partner production OTA: Partner app cannot share Customer EAS/update identity.');
            process.exit(1);
          }
          if (expo?.runtimeVersion?.policy !== 'appVersion') {
            console.error('Refusing Partner production OTA: expected appVersion runtime policy.');
            process.exit(1);
          }
          console.log(`Partner production runtime ${expo.version}; project ${projectId}`);
          NODE

      - name: Require Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck Partner app
        run: npm --workspace apps/partner-app run typecheck

      - name: Verify Partner release contracts
        run: |
          npm --workspace apps/partner-app run verify:routes
          npm --workspace apps/partner-app run verify:phase5
          npm --workspace apps/partner-app run verify:visual
          npm --workspace apps/partner-app run verify:pre-apk
          npm --workspace apps/partner-app run verify:phase6
          npm --workspace apps/partner-app run verify:uat
          npm run lint:partner

      - name: Verify Expo token can access Partner project
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish Partner production OTA
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel production \
            --environment production \
            --message "INSUREIT Partner production 0.2.0 from main ${GITHUB_SHA}" \
            --non-interactive \
            --json > partner-production-update.json
          cat partner-production-update.json

      - name: OTA summary
        if: always()
        shell: bash
        run: |
          {
            echo "## INSUREIT Partner production OTA"
            echo
            echo "- Source: verified merged commit in \`main\` (pinned to event SHA)"
            echo "- Channel: \`production\`"
            echo "- Runtime: \`0.2.0\`"
            echo "- Runtime policy: \`appVersion\`"
            echo "- No APK/AAB/native build"
          } >> "$GITHUB_STEP_SUMMARY"
