name: Temporary intermediary documents UI redesign

on:
  push:
    branches: [main]
    paths:
      - 'scripts/temp_redesign_intermediary_documents_ui.py'
      - '.github/workflows/temp-redesign-intermediary-documents-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply documents UI redesign
        run: python scripts/temp_redesign_intermediary_documents_ui.py
      - name: Validate patch
        run: |
          git diff --check
          grep -F 'POSP Onboarding' apps/web-portal/app/intermediaries/applications/'[id]'/workflow/page.tsx || grep -F 'profile.partner_type.toUpperCase()} Onboarding' apps/web-portal/app/intermediaries/applications/'[id]'/workflow/page.tsx
          grep -F 'Required documents:' apps/web-portal/app/customers/applications/posp-misp-application-editor.tsx
          grep -F 'Required complete' apps/web-portal/app/customers/applications/posp-misp-application-editor.tsx
          grep -F 'grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-5' apps/web-portal/components/intermediary-document-grid.tsx
          grep -F 'compact ? "h-40"' apps/web-portal/components/document-visual-card.tsx
          ! grep -F 'Stage rail: no card/background' apps/web-portal/app/intermediaries/applications/'[id]'/workflow/workflow-theme.module.css
      - name: Commit application change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-portal/app/intermediaries/applications/'[id]'/workflow/page.tsx apps/web-portal/app/intermediaries/applications/'[id]'/workflow/workflow-theme.module.css apps/web-portal/app/customers/applications/posp-misp-application-editor.tsx
          git commit -m 'Redesign intermediary documents onboarding UI'
          git push
