name: Branch CPA formula patch

on:
  push:
    branches:
      - fix/cpa-payin-payout-calculations

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cpa-formula-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cpa-payin-payout-calculations
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch policy calculation formula
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-portal/components/policy-unified-form.tsx')
          text = path.read_text()
          old = 'const calculations=useMemo(()=>{ const od=numeric(form.od),tp=numeric(form.tp),cpa=form.cpaOpted==="Yes"?numeric(form.cpa):0; const net=od+tp+cpa,gst=form.vehicleClass==="GCV"?((od+cpa)*.18)+(tp*.05):net*.18,gross=net+gst; const projectedOd=od*numeric(form.projectedOdPercent)/100,projectedTp=tp*numeric(form.projectedTpPercent)/100; const totalPayin=projectedOd+projectedTp+numeric(form.insurerScheme),tds=totalPayin*.10,payinAfterTds=totalPayin-tds; const payoutOd=od*numeric(form.payoutOdPercent)/100,payoutTp=form.payoutBasis==="OD"?0:tp*numeric(form.payoutTpPercent)/100; const grossPayout=Math.max(0,payoutOd+payoutTp),indicativeMargin=payinAfterTds-grossPayout; return{net,gst,gross,projectedOd,projectedTp,totalPayin,tds,payinAfterTds,payoutOd,payoutTp,grossPayout,indicativeMargin}; },[form]);'
          new = 'const calculations=useMemo(()=>{ const od=numeric(form.od),tp=numeric(form.tp),cpa=form.cpaOpted==="Yes"?numeric(form.cpa):0,tpWithCpa=tp+cpa; const net=od+tpWithCpa,gst=form.vehicleClass==="GCV"?((od+cpa)*.18)+(tp*.05):net*.18,gross=net+gst; const projectedOd=od*numeric(form.projectedOdPercent)/100,projectedTp=tpWithCpa*numeric(form.projectedTpPercent)/100; const totalPayin=projectedOd+projectedTp+numeric(form.insurerScheme),tds=totalPayin*.10,payinAfterTds=totalPayin-tds; const payoutOd=od*numeric(form.payoutOdPercent)/100,payoutTp=form.payoutBasis==="OD"?0:tpWithCpa*numeric(form.payoutTpPercent)/100; const grossPayout=Math.max(0,payoutOd+payoutTp),indicativeMargin=payinAfterTds-grossPayout; return{net,gst,gross,projectedOd,projectedTp,totalPayin,tds,payinAfterTds,payoutOd,payoutTp,grossPayout,indicativeMargin}; },[form]);'
          if old not in text:
              raise SystemExit('Expected policy calculation formula was not found; refusing to patch.')
          text = text.replace(old, new, 1)
          text = text.replace('Default: OD + TP + scheme · {money.format(calculated)}', 'Default: OD PayIn + TP/CPA PayIn + scheme · {money.format(calculated)}', 1)
          path.write_text(text)
          PY
      - name: Commit patched formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use CPA in TP PayIn and payout [cpa-formula-patched]"
          git push origin HEAD:fix/cpa-payin-payout-calculations
