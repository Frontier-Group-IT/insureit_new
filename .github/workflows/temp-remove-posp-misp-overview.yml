name: Temp remove POSP MISP overview

on:
  push:
    paths:
      - scripts/temp_remove_posp_misp_overview.py
      - .github/workflows/temp-remove-posp-misp-overview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/temp_remove_posp_misp_overview.py
