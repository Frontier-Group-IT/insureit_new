name: Apply policy conflict resolution patch

on:
  push:
    branches:
      - feature/policy-onboarding-conflict-resolution
    paths:
      - .github/workflows/apply-policy-conflict-resolution.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/policy-onboarding-conflict-resolution
          fetch-depth: 0

      - name: Fix registered vehicle identity conflict handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web-portal/app/policies/policy-onboarding-conflicts.ts')
          text = path.read_text()
          old = '''  const identifiedVehicle = registrationVehicle ?? chassisVehicle ?? engineVehicle;
  if (!identifiedVehicle && engineVehicle) {
    return {
      type: "vehicle_identity_conflict",
      message: "This engine number is already linked to an existing vehicle. Review that vehicle before creating another vehicle record.",
      enteredRegistration: registration,
      enteredChassis: chassis,
      enteredEngine: engine,
      existingVehicleId: engineVehicle.id,
      existingVehicleNo: engineVehicle.vehicle_no,
      existingMake: engineVehicle.make,
      existingModel: engineVehicle.model,
      existingPath: `/vehicles/${engineVehicle.id}`,
    };
  }
'''
          new = '''  if (mode === "registered" && !registrationVehicle && (chassisVehicle || engineVehicle)) {
    const existing = chassisVehicle ?? engineVehicle!;
    return {
      type: "vehicle_identity_conflict",
      message: "The entered chassis or engine number already belongs to a different registered vehicle. Review the vehicle identity before booking this policy.",
      enteredRegistration: registration,
      enteredChassis: chassis,
      enteredEngine: engine,
      existingVehicleId: existing.id,
      existingVehicleNo: existing.vehicle_no,
      existingMake: existing.make,
      existingModel: existing.model,
      existingPath: `/vehicles/${existing.id}`,
    };
  }

  const identifiedVehicle = mode === "registered" ? registrationVehicle : (chassisVehicle ?? engineVehicle);
'''
          if old not in text:
              raise SystemExit('Expected vehicle identity block not found')
          text = text.replace(old, new, 1)
          text = text.replace('  const insurerId = String(payload.policy.insuranceCompanyId ?? "");\n', '', 1)
          text = text.replace('\n  void insurerId;\n  return null;\n', '\n  return null;\n', 1)
          path.write_text(text)
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/policies/policy-onboarding-conflicts.ts
          git commit -m "Fix registered vehicle identity conflict detection"
          git push origin HEAD:feature/policy-onboarding-conflict-resolution
