name: Apply policy conflict resolution patch

on:
  push:
    branches:
      - feature/policy-onboarding-conflict-resolution
    paths:
      - .automation/apply_policy_conflict_resolution.py
      - .github/workflows/apply-policy-conflict-resolution.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/policy-onboarding-conflict-resolution
          fetch-depth: 0

      - name: Correct one-shot script guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.automation/apply_policy_conflict_resolution.py')
          text = path.read_text()
          bad = '''        ownership_line_match = ownership_pattern.search(text)\n        if ownership_line_match:\n            raise SystemExit("Ownership pattern unexpectedly remained after replacement")\n'''
          if bad not in text:
              raise SystemExit('Expected guard block not found')
          path.write_text(text.replace(bad, '', 1))
          PY

      - name: Apply conflict resolution patch
        run: python .automation/apply_policy_conflict_resolution.py

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/policies/policy-onboarding-actions.ts apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Implement policy onboarding conflict resolution"
            git push origin HEAD:feature/policy-onboarding-conflict-resolution
          fi
