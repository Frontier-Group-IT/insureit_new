name: Temporary customer Exchange quick action patch

on:
  push:
    branches:
      - mobile/customer-exchange-quick-action
    paths:
      - .github/workflows/temp-customer-exchange-quick-action.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/customer-exchange-quick-action
          fetch-depth: 0

      - name: Patch customer quick actions
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/mobile-app/app/customer/home.tsx')
          text = path.read_text()

          old_call = """        onClaim={() => router.push('/customer/start-claim')}\n      />"""
          new_call = """        onClaim={() => router.push('/customer/start-claim')}\n        onExchange={() => undefined}\n      />"""
          assert text.count(old_call) == 1, 'QuickActionDock call site changed unexpectedly'
          text = text.replace(old_call, new_call)

          old_dock = """function QuickActionDock({ renewalDue, claimTasks, onRenewals, onQuote, onChallan, onClaim }: { renewalDue: number; claimTasks: number; onRenewals: () => void; onQuote: () => void; onChallan: () => void; onClaim: () => void }) {\n  return (\n    <View style={styles.quickDock}>\n      <View style={styles.sectionHeader}>\n        <Text style={styles.sectionEyebrow}>Quick actions</Text>\n        <Text style={styles.sectionHint}>One tap services</Text>\n      </View>\n      <View style={styles.quickGrid}>\n        <QuickAction icon=\"calendar-month-outline\" image={require('../../assets/brand/dashboard/dashboard-renewal.png')} label=\"Renewal\" badge={renewalDue} animateBadge tone=\"#FFF6E8\" color=\"#C98918\" onPress={onRenewals} />\n        <QuickAction icon=\"shield-plus-outline\" image={require('../../assets/brand/dashboard/dashboard-start-claim.png')} label=\"Start claim\" badge={claimTasks} tone=\"#E8F8F0\" color=\"#10A66F\" onPress={onClaim} />\n        <QuickAction icon=\"file-document-edit-outline\" image={require('../../assets/brand/dashboard/dashboard-get-quote.png')} label=\"Get Quote\" tone=\"#EAF3FF\" color=\"#174EA6\" onPress={onQuote} />\n        <QuickAction icon=\"ticket-confirmation-outline\" image={require('../../assets/brand/dashboard/dashboard-echallan.png')} label=\"Pay Challan\" tone=\"#E6FAFD\" color=\"#0EAFC8\" onPress={onChallan} />\n      </View>\n    </View>\n  );\n}"""
          new_dock = """function QuickActionDock({ renewalDue, claimTasks, onRenewals, onQuote, onChallan, onClaim, onExchange }: { renewalDue: number; claimTasks: number; onRenewals: () => void; onQuote: () => void; onChallan: () => void; onClaim: () => void; onExchange: () => void }) {\n  return (\n    <View style={styles.quickDock}>\n      <View style={styles.sectionHeader}>\n        <Text style={styles.sectionEyebrow}>Quick actions</Text>\n        <Text style={styles.sectionHint}>One tap services</Text>\n      </View>\n      <ScrollView\n        horizontal\n        nestedScrollEnabled\n        showsHorizontalScrollIndicator={false}\n        contentContainerStyle={styles.quickGrid}\n        style={styles.quickScroller}\n      >\n        <QuickAction icon=\"calendar-month-outline\" image={require('../../assets/brand/dashboard/dashboard-renewal.png')} label=\"Renewal\" badge={renewalDue} animateBadge tone=\"#FFF6E8\" color=\"#C98918\" onPress={onRenewals} />\n        <QuickAction icon=\"shield-plus-outline\" image={require('../../assets/brand/dashboard/dashboard-start-claim.png')} label=\"Start claim\" badge={claimTasks} tone=\"#E8F8F0\" color=\"#10A66F\" onPress={onClaim} />\n        <QuickAction icon=\"swap-horizontal\" image={require('../../assets/brand/dashboard/dashboard-exchange.png')} label=\"Exchange\" tone=\"#EAF3FF\" color=\"#174EA6\" onPress={onExchange} />\n        <QuickAction icon=\"file-document-edit-outline\" image={require('../../assets/brand/dashboard/dashboard-get-quote.png')} label=\"Get Quote\" tone=\"#EAF3FF\" color=\"#174EA6\" onPress={onQuote} />\n        <QuickAction icon=\"ticket-confirmation-outline\" image={require('../../assets/brand/dashboard/dashboard-echallan.png')} label=\"Pay Challan\" tone=\"#E6FAFD\" color=\"#0EAFC8\" onPress={onChallan} />\n      </ScrollView>\n    </View>\n  );\n}"""
          assert text.count(old_dock) == 1, 'QuickActionDock implementation changed unexpectedly'
          text = text.replace(old_dock, new_dock)

          old_styles = """  quickGrid: { flexDirection: 'row', gap: 8 },\n  quickAction: { flex: 1, minHeight: 74, borderRadius: 15, backgroundColor: '#F8FBFF', borderWidth: 1, borderColor: '#E0EAF5', alignItems: 'center', justifyContent: 'center', paddingHorizontal: 4, position: 'relative' },"""
          new_styles = """  quickScroller: { marginHorizontal: -2 },\n  quickGrid: { flexDirection: 'row', gap: 8, paddingHorizontal: 2 },\n  quickAction: { width: 78, flexShrink: 0, minHeight: 74, borderRadius: 15, backgroundColor: '#F8FBFF', borderWidth: 1, borderColor: '#E0EAF5', alignItems: 'center', justifyContent: 'center', paddingHorizontal: 4, position: 'relative' },"""
          assert text.count(old_styles) == 1, 'Quick action styles changed unexpectedly'
          text = text.replace(old_styles, new_styles)

          path.write_text(text)

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/home.tsx
          git diff --cached --check
          git commit -m "Add Exchange customer quick action"
          git push origin HEAD:mobile/customer-exchange-quick-action
