name: Apply Reports net premium consistency migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260916113000_reports_net_premium_consistency.sql'
      - '.github/workflows/apply-reports-net-premium-consistency.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Reports net premium consistency migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260916113000_reports_net_premium_consistency.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Reports net premium consistency migration
        run: supabase db query --linked --file supabase/migrations/20260916113000_reports_net_premium_consistency.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260916113000

      - name: Verify Reports net premium RPCs
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.get_distribution_report_v2(uuid[],uuid[],date,date,uuid,text,text,integer,integer,integer,integer)') is not null as distribution_rpc_ready,
              to_regprocedure('public.get_renewal_report_v4(uuid[],integer,uuid,uuid,text,text,text,text,integer,integer)') is not null as renewal_rpc_ready,
              to_regprocedure('public.get_finance_report_v4(uuid[],date,date,uuid,uuid,text,text,text,text,integer,integer)') is not null as finance_rpc_ready;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"distribution_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"renewal_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"finance_rpc_ready"[[:space:]]*:[[:space:]]*true'
