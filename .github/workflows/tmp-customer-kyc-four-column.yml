name: Temporary Customer KYC four-column patch

on:
  push:
    branches:
      - feature/customer-kyc-four-column-row

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-kyc-four-column-row
          fetch-depth: 0
      - name: Update KYC field grid
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-portal/app/customers/[id]/edit/customer-profile-editor.tsx')
          text = path.read_text()
          marker = 'KYC and GST Details'
          old = 'className="mt-3 grid gap-3 md:grid-cols-2 xl:grid-cols-3"'
          new = 'className="mt-3 grid gap-3 md:grid-cols-2 xl:grid-cols-4"'
          start = text.index(marker)
          pos = text.index(old, start)
          text = text[:pos] + new + text[pos + len(old):]
          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/tmp-customer-kyc-four-column.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/customers/'[id]'/edit/customer-profile-editor.tsx .github/workflows/tmp-customer-kyc-four-column.yml
          git commit -m "Align Customer KYC fields in one desktop row"
          git push origin HEAD:feature/customer-kyc-four-column-row
