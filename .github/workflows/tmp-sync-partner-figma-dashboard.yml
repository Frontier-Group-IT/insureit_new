name: Temporary sync Partner dashboard from Figma

on:
  push:
    branches:
      - partner/figma-dashboard-sync
    paths:
      - '.github/workflows/tmp-sync-partner-figma-dashboard.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: partner/figma-dashboard-sync
          fetch-depth: 0

      - name: Download and optimize Figma assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p /tmp/figma-src apps/partner-app/assets/figma-dashboard
          curl -fL 'https://www.figma.com/api/mcp/asset/a6fa5aba-18ea-4ca9-bd3b-eb09ffb63636.png' -o /tmp/figma-src/hero.png
          curl -fL 'https://www.figma.com/api/mcp/asset/8ba9fc8f-74d8-49ec-b171-b3579aeb4715.png' -o /tmp/figma-src/pending.png
          curl -fL 'https://www.figma.com/api/mcp/asset/dd3f8790-1472-4493-bee1-7cb69296096a.png' -o /tmp/figma-src/policy-intake.png
          curl -fL 'https://www.figma.com/api/mcp/asset/66ffb3ae-3794-49a0-95d8-b2096d4743f8.png' -o /tmp/figma-src/renewals.png
          curl -fL 'https://www.figma.com/api/mcp/asset/95150f8d-b6f4-4168-a902-a0a270e2701c.png' -o /tmp/figma-src/claims.png
          curl -fL 'https://www.figma.com/api/mcp/asset/42c58330-ff0d-4ba2-9816-12420fb740b8.png' -o /tmp/figma-src/customers.png
          curl -fL 'https://www.figma.com/api/mcp/asset/977ea85f-fab0-47c7-839d-a9a79ca2f1d4.png' -o /tmp/figma-src/renewal-due.png
          python <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('/tmp/figma-src')
          out = Path('apps/partner-app/assets/figma-dashboard')

          hero = Image.open(src/'hero.png').convert('RGB')
          target_ratio = 960/400
          w, h = hero.size
          if w / h > target_ratio:
              nw = int(h * target_ratio)
              left = (w - nw) // 2
              hero = hero.crop((left, 0, left + nw, h))
          else:
              nh = int(w / target_ratio)
              top = (h - nh) // 2
              hero = hero.crop((0, top, w, top + nh))
          hero = hero.resize((960, 400), Image.Resampling.LANCZOS)
          hero.save(out/'hero-banner.jpg', 'JPEG', quality=80, optimize=True, progressive=True)

          pending = Image.open(src/'pending.png').convert('RGBA')
          pending.thumbnail((414, 311), Image.Resampling.LANCZOS)
          pending.save(out/'pending-tasks.png', 'PNG', optimize=True)

          for incoming, outgoing in [
              ('policy-intake.png', 'quick-policy-intake.png'),
              ('renewals.png', 'quick-renewals.png'),
              ('claims.png', 'quick-claims.png'),
              ('customers.png', 'quick-customers.png'),
              ('renewal-due.png', 'renewal-due.png'),
          ]:
              image = Image.open(src/incoming).convert('RGBA')
              image.thumbnail((96, 96), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (96, 96), (0, 0, 0, 0))
              canvas.alpha_composite(image, ((96-image.width)//2, (96-image.height)//2))
              canvas.save(out/outgoing, 'PNG', optimize=True)
          PY
          du -h apps/partner-app/assets/figma-dashboard/*

      - name: Apply Figma dashboard layout
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p = Path('apps/partner-app/app/(tabs)/index.tsx')
          s = p.read_text()

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected source fragment: {label}')
              s = s.replace(old, new, 1)

          rep("  policyAdd: require('../../assets/generated-dashboard/policy-add.png'),\n  policySold: require('../../assets/generated-dashboard/policy-sold.png'),\n  commissionEarned: require('../../assets/generated-dashboard/commission-earned.png'),\n  renewalAdd: require('../../assets/generated-dashboard/renewal-add.png'),\n  policyVerified: require('../../assets/generated-dashboard/policy-verified.png'),\n  renewalDue: require('../../assets/generated-dashboard/renewal-due.png'),\n  homeHeader: require('../../assets/generated-dashboard/home-header-insurance.jpg'),\n  pendingTasks: require('../../assets/generated-dashboard/pending-tasks-illustration.jpg'),\n  pendingDocument: require('../../assets/generated-dashboard/pending-document-alert.png'),\n  customerAction: require('../../assets/partner/actions/add-customer.png'),",
              "  policyAdd: require('../../assets/figma-dashboard/quick-policy-intake.png'),\n  policySold: require('../../assets/generated-dashboard/policy-verified.png'),\n  commissionEarned: require('../../assets/generated-dashboard/commission-earned.png'),\n  renewalAdd: require('../../assets/figma-dashboard/quick-renewals.png'),\n  policyVerified: require('../../assets/figma-dashboard/quick-claims.png'),\n  renewalDue: require('../../assets/figma-dashboard/renewal-due.png'),\n  homeHeader: require('../../assets/figma-dashboard/hero-banner.jpg'),\n  pendingTasks: require('../../assets/figma-dashboard/pending-tasks.png'),\n  pendingDocument: require('../../assets/generated-dashboard/pending-document-alert.png'),\n  customerAction: require('../../assets/figma-dashboard/quick-customers.png'),",
              'asset mapping')

          rep("              <Text style={styles.heroBrandText} accessibilityLabel=\"insureit Partner\">\n\n                <Text style={styles.heroBrandInsureit}>insureit</Text>\n\n                <Text style={styles.heroBrandPartner}> Partner</Text>\n\n              </Text>",
              "              <View style={styles.heroBrandCopy} accessibilityLabel=\"insureit Partner\">\n                <Text style={styles.heroBrandInsureit}>insureit</Text>\n                <Text style={styles.heroBrandPartner}>Partner</Text>\n              </View>",
              'stacked brand')

          old_chart = "function MiniBusinessChart() {\n  const bars = [13, 19, 27, 35, 43, 52];\n  return (\n    <View accessible={false} importantForAccessibility=\"no-hide-descendants\" style={styles.businessChart}>\n      <View style={styles.businessChartBaseline} />\n      <View style={styles.businessBars}>\n        {bars.map((height, index) => (\n          <View\n            key={height}\n            style={[\n              styles.businessBar,\n              { height, opacity: 0.46 + index * 0.085 },\n            ]}\n          />\n        ))}\n      </View>\n    </View>\n  );\n}"
          new_chart = "function MiniBusinessChart() {\n  const bars = [18, 26, 36, 47];\n  return (\n    <View accessible={false} importantForAccessibility=\"no-hide-descendants\" style={styles.businessChart}>\n      <View style={styles.businessChartPanel}>\n        <View style={styles.businessBars}>\n          {bars.map((height, index) => (\n            <View key={height} style={[styles.businessBar, { height, opacity: 0.55 + index * 0.14 }]} />\n          ))}\n        </View>\n        <Feather name=\"trending-up\" size={48} color=\"#1579E6\" style={styles.businessTrendGlyph} />\n      </View>\n    </View>\n  );\n}"
          rep(old_chart, new_chart, 'business chart')

          rep("  hero: { height: 174, overflow: 'hidden', backgroundColor: '#062D5F', paddingTop: 10 },\n  heroBackdrop: { ...StyleSheet.absoluteFillObject, opacity: 0.97 },\n  heroBackdropShade: { ...StyleSheet.absoluteFillObject, backgroundColor: 'rgba(3,34,75,0.16)' },\n  heroTopRow: { zIndex: 2, flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', paddingHorizontal: 20 },\n  heroBrand: { flexDirection: 'row', alignItems: 'center', gap: 9, maxWidth: '66%' },\n  heroLogo: { width: 36, height: 43, tintColor: '#FFFFFF' },\n  heroBrandText: { flexShrink: 1, fontSize: 16.5, lineHeight: 21, fontWeight: '800', letterSpacing: -0.2 },\n  heroBrandInsureit: { color: '#FFFFFF' },\n  heroBrandPartner: { color: '#F7B267' },\n  heroActions: { flexDirection: 'row', alignItems: 'center', gap: 8 },",
              "  hero: { height: 152, overflow: 'hidden', backgroundColor: '#054D9E', paddingTop: 9 },\n  heroBackdrop: { ...StyleSheet.absoluteFillObject, opacity: 1 },\n  heroBackdropShade: { ...StyleSheet.absoluteFillObject, backgroundColor: 'rgba(3,34,75,0.06)' },\n  heroTopRow: { zIndex: 2, flexDirection: 'row', alignItems: 'flex-start', justifyContent: 'space-between', paddingHorizontal: 14 },\n  heroBrand: { flexDirection: 'row', alignItems: 'flex-start', gap: 7, maxWidth: '60%' },\n  heroLogo: { width: 33, height: 39, tintColor: '#FFFFFF' },\n  heroBrandCopy: { paddingTop: 1 },\n  heroBrandInsureit: { color: '#FFFFFF', fontSize: 16, lineHeight: 18, fontWeight: '800', letterSpacing: -0.15 },\n  heroBrandPartner: { color: '#F5AB2E', fontSize: 16, lineHeight: 18, fontWeight: '800', letterSpacing: -0.15 },\n  heroActions: { flexDirection: 'row', alignItems: 'center', gap: 8 },",
              'hero styles')

          rep("  heroGreeting: { zIndex: 2, position: 'absolute', left: 20, right: 92, bottom: 13 },\n  heroGreetingText: { color: '#FFFFFF', fontSize: 16, lineHeight: 21, fontWeight: '500', letterSpacing: -0.05, textShadowColor: 'rgba(0,0,0,0.28)', textShadowOffset: { width: 0, height: 1 }, textShadowRadius: 3 },\n\n  body: { marginTop: -13, paddingHorizontal: 16 },\n  searchShell: { minHeight: 56, flexDirection: 'row', alignItems: 'center', gap: 9, paddingHorizontal: 14, borderRadius: 17, backgroundColor: '#FFFFFF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#D8E4F2', shadowColor: '#173B6C', shadowOpacity: 0.08, shadowRadius: 14, shadowOffset: { width: 0, height: 5 }, elevation: 3 },",
              "  heroGreeting: { zIndex: 2, position: 'absolute', left: 14, right: 92, bottom: 8 },\n  heroGreetingText: { color: '#FFFFFF', fontSize: 15, lineHeight: 19, fontWeight: '500', letterSpacing: -0.05, textShadowColor: 'rgba(0,0,0,0.28)', textShadowOffset: { width: 0, height: 1 }, textShadowRadius: 3 },\n\n  body: { marginTop: -10, paddingHorizontal: 14 },\n  searchShell: { minHeight: 48, flexDirection: 'row', alignItems: 'center', gap: 9, paddingHorizontal: 13, borderRadius: 16, backgroundColor: '#FFFFFF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#D8E4F2', shadowColor: '#173B6C', shadowOpacity: 0.08, shadowRadius: 14, shadowOffset: { width: 0, height: 5 }, elevation: 3 },",
              'hero greeting and search')

          rep("  businessCard: { marginTop: 10, padding: 12, borderRadius: 15, backgroundColor: '#FFFFFF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#E1EAF5', shadowColor: '#12355E', shadowOpacity: 0.04, shadowRadius: 10, shadowOffset: { width: 0, height: 3 }, elevation: 2 },",
              "  businessCard: { marginTop: 8, minHeight: 166, padding: 10, borderRadius: 14, backgroundColor: '#FFFFFF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#E1EAF5', shadowColor: '#12355E', shadowOpacity: 0.04, shadowRadius: 10, shadowOffset: { width: 0, height: 3 }, elevation: 2 },",
              'business card')

          rep("  businessChart: { width: 118, height: 64, justifyContent: 'flex-end', paddingHorizontal: 5, paddingBottom: 4 },\n  businessChartBaseline: { position: 'absolute', left: 4, right: 4, bottom: 4, height: StyleSheet.hairlineWidth, backgroundColor: '#DCE8F5' },\n  businessBars: { height: 56, flexDirection: 'row', alignItems: 'flex-end', justifyContent: 'space-between' },\n  businessBar: { width: 13, borderTopLeftRadius: 3, borderTopRightRadius: 3, backgroundColor: '#8BB6E7' },",
              "  businessChart: { width: 86, height: 76, alignItems: 'center', justifyContent: 'center' },\n  businessChartPanel: { width: 72, height: 68, borderRadius: 12, backgroundColor: '#EEF7FF', overflow: 'hidden', justifyContent: 'flex-end', paddingHorizontal: 10, paddingBottom: 9 },\n  businessBars: { height: 50, flexDirection: 'row', alignItems: 'flex-end', justifyContent: 'space-between' },\n  businessBar: { width: 8, borderRadius: 3, backgroundColor: '#1784EB' },\n  businessTrendGlyph: { position: 'absolute', left: 12, top: 4, transform: [{ rotate: '-4deg' }] },",
              'business visual')

          rep("  quickSection: { marginTop: 11, paddingHorizontal: 10, paddingTop: 8, paddingBottom: 10, borderRadius: 18, backgroundColor: '#FFFFFF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#E4EBF4' },\n  quickGrid: { flexDirection: 'row', gap: 5 },\n  quickActionTouch: { flex: 1, minHeight: 88 },\n  quickAction: { flex: 1, minHeight: 88, alignItems: 'center', justifyContent: 'center', gap: 5, paddingVertical: 7, paddingHorizontal: 2, borderRadius: 13, backgroundColor: '#F3F8FF' },\n  quickIconCircle: { width: 42, height: 42, borderRadius: 21, alignItems: 'center', justifyContent: 'center', backgroundColor: '#E9F3FF' },\n  quickImageAsset: { width: 46, height: 46 },",
              "  quickSection: { marginTop: 8, paddingHorizontal: 9, paddingTop: 8, paddingBottom: 9, borderRadius: 16, backgroundColor: '#FFFFFF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#E4EBF4' },\n  quickGrid: { flexDirection: 'row', gap: 5 },\n  quickActionTouch: { flex: 1, minHeight: 74 },\n  quickAction: { flex: 1, minHeight: 74, alignItems: 'center', justifyContent: 'center', gap: 4, paddingVertical: 5, paddingHorizontal: 2, borderRadius: 11, backgroundColor: '#F5FAFF' },\n  quickIconCircle: { width: 35, height: 35, borderRadius: 18, alignItems: 'center', justifyContent: 'center', backgroundColor: '#E9F3FF' },\n  quickImageAsset: { width: 38, height: 38 },",
              'quick actions')

          rep("  pendingCard: { marginTop: 11, minHeight: 154, paddingHorizontal: 14, paddingTop: 11, paddingBottom: 10, borderRadius: 18, overflow: 'hidden', backgroundColor: '#EAF5FF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#D3E7FA' },\n  pendingBackdrop: { position: 'absolute', right: 9, top: 9, width: 172, height: 136, borderRadius: 14, opacity: 1 },\n  pendingHeaderSpacer: { width: 166, height: 1 },\n  pendingList: { marginTop: 4, paddingRight: 166 },",
              "  pendingCard: { marginTop: 8, minHeight: 134, paddingHorizontal: 14, paddingTop: 10, paddingBottom: 8, borderRadius: 16, overflow: 'hidden', backgroundColor: '#E3F2FF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#D3E7FA' },\n  pendingBackdrop: { position: 'absolute', right: -2, top: -9, width: 207, height: 156, opacity: 0.68 },\n  pendingHeaderSpacer: { width: 185, height: 1 },\n  pendingList: { marginTop: 2, paddingRight: 178 },",
              'pending banner')

          rep("  renewalStrip: { marginTop: 11, minHeight: 72, flexDirection: 'row', alignItems: 'center', gap: 10, paddingHorizontal: 13, paddingVertical: 9, borderRadius: 17, backgroundColor: '#FFFFFF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#DDE8F5' },",
              "  renewalStrip: { marginTop: 8, minHeight: 58, flexDirection: 'row', alignItems: 'center', gap: 9, paddingHorizontal: 12, paddingVertical: 7, borderRadius: 15, backgroundColor: '#FFFFFF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#DDE8F5' },",
              'renewal strip')

          p.write_text(s)
          PY

      - name: Verify optimized asset budget
        shell: bash
        run: |
          set -euo pipefail
          total=$(du -cb apps/partner-app/assets/figma-dashboard/* | tail -1 | cut -f1)
          echo "Optimized Figma dashboard assets: ${total} bytes"
          [ "$total" -lt 300000 ] || { echo "::error::Figma dashboard asset bundle exceeds 300 KB"; exit 1; }

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --no-audit --no-fund

      - name: Verify Partner source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package-lock.json
          npm --workspace apps/partner-app run verify:routes
          npm --workspace apps/partner-app run verify:phase5
          npm --workspace apps/partner-app run verify:visual
          node apps/partner-app/scripts/verify-policy-intake-source-contract.mjs
          npm --workspace apps/partner-app run verify:pre-apk
          npm --workspace apps/partner-app run verify:uat
          npm run typecheck:partner
          npm run lint:partner
          npm run build:partner:web

      - name: Commit Figma dashboard implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/partner-app/app/(tabs)/index.tsx' apps/partner-app/assets/figma-dashboard
          git commit -m 'Sync Partner dashboard to Figma design'
          git push origin HEAD:partner/figma-dashboard-sync
