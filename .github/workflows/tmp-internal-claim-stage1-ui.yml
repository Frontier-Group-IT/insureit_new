name: Temporary internal claim stage 1 UI patch

on:
  push:
    branches:
      - ui/internal-claim-stage1-external-layout
    paths:
      - '.github/workflows/tmp-internal-claim-stage1-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/internal-claim-stage1-external-layout
          fetch-depth: 0

      - name: Apply Stage 1 UI-only layout alignment
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          path = Path('apps/mobile-app/app/customer/internal-claim-stage.tsx')
          text = path.read_text()

          def once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'missing expected fragment: {old[:80]}')
              text = text.replace(old, new, 1)

          once(
              "import { ExternalClaimStageHeader } from '@/components/external-claim-ui';",
              "import { ClaimFormSection, ClaimIdentityCard, ExternalClaimStageHeader } from '@/components/external-claim-ui';",
          )
          once(
              "  const [vehicleNo, setVehicleNo] = useState('');",
              "  const [vehicleNo, setVehicleNo] = useState('');\n  const [vehicleMeta, setVehicleMeta] = useState('');",
          )
          once(
              "const vehicleResult = await supabase.from('vehicles').select('vehicle_no').eq('id', nextClaim.vehicle_id).maybeSingle();",
              "const vehicleResult = await supabase.from('vehicles').select('vehicle_no,make,model').eq('id', nextClaim.vehicle_id).maybeSingle();",
          )
          once(
              "        setVehicleNo(vehicleResult.data?.vehicle_no ?? '');\n        setLoading(false);",
              "        setVehicleNo(vehicleResult.data?.vehicle_no ?? '');\n        setVehicleMeta([vehicleResult.data?.make, vehicleResult.data?.model].filter(Boolean).join(' · '));\n        setLoading(false);",
          )
          once(
              "subtitle={isCompleted ? 'Completed by the claims desk' : isCurrent ? projection.substage : 'Awaiting this operations stage'}",
              "subtitle={stageKey === 'spot_intimation' ? 'Start tracking an incident.' : isCompleted ? 'Completed by the claims desk' : isCurrent ? projection.substage : 'Awaiting this operations stage'}",
          )

          header_end = "      />\n\n      <View style={styles.readOnlyNotice}>"
          once(header_end, """      />

      {stageKey === 'spot_intimation' ? (
        <ClaimIdentityCard
          claimNo={claim.insurer_claim_no || claim.claim_no}
          insurerName="Sankalp Managed"
          vehicleNo={vehicleNo}
          vehicleMeta={vehicleMeta}
        />
      ) : null}

      {stageKey !== 'spot_intimation' ? <View style={styles.readOnlyNotice}>""")
          once(
              "      </View>\n\n      {message ? <Message type=\"error\">{message}</Message> : null}\n\n      <View style={styles.fieldsCard}>",
              "      </View> : null}\n\n      {message ? <Message type=\"error\">{message}</Message> : null}\n\n      {stageKey === 'spot_intimation' ? (\n        <ClaimFormSection title=\"Incident Details\" subtitle=\"Accident date, time and first insurer intimation\" iconImage={require('../../assets/claims/claim-intimation.png')}>\n          <View style={styles.stageOneFieldGrid}>\n            {STAGE_FIELDS.spot_intimation.map((field) => <ReadOnlyValue key={field.label} label={field.label} value={firstValue(mergedDetails, field.keys, field.fallback)} money={field.money} />)}\n          </View>\n        </ClaimFormSection>\n      ) : <View style={styles.fieldsCard}>",
          )
          once(
              "        </View>\n      </View>\n\n      {stageKey === 'spot_intimation' ? (",
              "        </View>\n      </View>}\n\n      {stageKey === 'spot_intimation' ? (",
          )

          once(
              "style={({ pressed }) => [styles.initialDocumentsAction, pressed && styles.initialDocumentsActionPressed]}",
              "style={({ pressed }) => [styles.initialDocumentsAction, styles.stageOneDocumentsAction, pressed && styles.initialDocumentsActionPressed]}",
          )
          once(
              '<View style={styles.initialDocumentsIcon}><MaterialCommunityIcons name="file-upload-outline" size={21} color="#FFFFFF" /></View>',
              '<View style={[styles.initialDocumentsIcon, styles.stageOneDocumentsIcon]}><MaterialCommunityIcons name="file-upload-outline" size={21} color="#0A43A3" /></View>',
          )
          once(
              '<Text style={styles.initialDocumentsTitle}>Initial claim documents</Text>',
              '<Text style={[styles.initialDocumentsTitle, styles.stageOneDocumentsTitle]}>Initial claim documents</Text>',
          )
          once(
              '<Text style={styles.initialDocumentsText}>Upload or replace the Spot Intimation documents requested by Operations.</Text>',
              '<Text style={[styles.initialDocumentsText, styles.stageOneDocumentsText]}>Upload or replace the Spot Intimation documents requested by Operations.</Text>',
          )
          once(
              '<MaterialCommunityIcons name="chevron-right" size={20} color="#FFFFFF" />',
              '<MaterialCommunityIcons name="chevron-right" size={20} color="#0A43A3" />',
          )

          once(
              "const styles = StyleSheet.create({\n",
              "const styles = StyleSheet.create({\n  stageOneFieldGrid: { gap: 8 },\n  stageOneDocumentsAction: { backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#D7E2EF' },\n  stageOneDocumentsIcon: { backgroundColor: '#EAF2FF' },\n  stageOneDocumentsTitle: { color: palette.navy },\n  stageOneDocumentsText: { color: '#607089' },\n",
          )

          path.write_text(text)
          PY
          python /tmp/patch.py

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-internal-claim-stage1-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/internal-claim-stage.tsx .github/workflows/tmp-internal-claim-stage1-ui.yml
          git commit -m "Align internal claim Stage 1 with external layout"
          git push origin HEAD:ui/internal-claim-stage1-external-layout
