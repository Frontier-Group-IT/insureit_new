name: Temporary policy metadata readability

on:
  push:
    paths:
      - scripts/temp_policy_meta_readability.py
      - .github/workflows/temp-policy-meta-readability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply metadata readability patch
        run: python scripts/temp_policy_meta_readability.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'text-\[10px\].*text-\[#244C73\]' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'source==="Assigned"' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'source==="Master"' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Improve policy source metadata readability"
            git push
          fi
