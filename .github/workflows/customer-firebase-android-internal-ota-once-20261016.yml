name: One-time approved Customer Firebase Android internal OTP fix OTA
on:
  push:
    branches:
      - agent/customer-firebase-android-internal-ota-approved-once-20261016
    paths:
      - '.github/workflows/customer-firebase-android-internal-ota-once-20261016.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: customer-firebase-internal-android-ota
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_CUSTOMER || secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      APPROVED_SOURCE_SHA: 8e08a73d0c037b08c3035a2ee136c9b107a48460
      REVIEWED_MAIN_SHA: d2eea4e9fb199e199f83996b1757e96adb6364ed
      TRIGGER_MESSAGE: ${{ github.event.head_commit.message }}
      EXPO_PUBLIC_SUPABASE_URL: https://ilzhsfqqjyppzzvfscmh.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj
      EXPO_PUBLIC_CUSTOMER_FIREBASE_OTP_SESSION_BRIDGE_ENABLED: 'true'
    steps:
      - name: Check exact owner-approved one-time trigger and reject reruns
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_RUN_ATTEMPT" = "1" ] || { echo "One-time OTA cannot be rerun."; exit 1; }
          [ "$TRIGGER_MESSAGE" = 'ci(customer): owner-approved one-time Android Firebase internal OTA 0.3.2 (11)' ] || exit 1
          [ "$GITHUB_REF" = 'refs/heads/agent/customer-firebase-android-internal-ota-approved-once-20261016' ] || exit 1
          test -n "${EXPO_TOKEN:-}" || { echo "No Expo credential; no OTA will be published."; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: 8e08a73d0c037b08c3035a2ee136c9b107a48460
          fetch-depth: 0

      - name: Validate immutable reviewed source, main ancestry, and no new Firebase/mobile edits
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_SHA" ] || exit 1
          git fetch origin main feature/customer-firebase-otp-gateway-0-3-2-20261014
          [ "$(git rev-parse origin/feature/customer-firebase-otp-gateway-0-3-2-20261014)" = "$APPROVED_SOURCE_SHA" ] || {
            echo "Migration source moved after approval. Refusing OTA."; exit 1;
          }
          git merge-base --is-ancestor "$REVIEWED_MAIN_SHA" "$APPROVED_SOURCE_SHA" || exit 1
          changed="$(git diff --name-only "$REVIEWED_MAIN_SHA" origin/main -- apps/mobile-app supabase/functions/customer-firebase-bind supabase/functions/customer-firebase-session-bridge supabase/functions/customer-firebase-signup .github/workflows/publish-customer-release-production-ota.yml)"
          [ -z "$changed" ] || { echo "Sensitive production/main changes since review: $changed"; exit 1; }
          node <<'NODE'
          const app=require('./apps/mobile-app/app.json').expo;
          const eas=require('./apps/mobile-app/eas.json');
          const fs=require('fs');
          const flow=fs.readFileSync('./apps/mobile-app/lib/firebase-native-phone-flow.ts','utf8');
          const conf=eas.build?.['firebase-internal-test'];
          if(app.version!=='0.3.2' || app.android?.versionCode!==11 ||
            app.android?.package!=='com.insureit.mobile' || app.runtimeVersion?.policy!=='appVersion' ||
            conf?.channel!=='firebase-internal' || conf?.android?.buildType!=='app-bundle' ||
            conf?.env?.EXPO_PUBLIC_CUSTOMER_FIREBASE_OTP_SESSION_BRIDGE_ENABLED!=='true' ||
            eas.build.production?.env?.EXPO_PUBLIC_CUSTOMER_FIREBASE_OTP_SESSION_BRIDGE_ENABLED!=='false' ||
            !flow.includes('getAutoVerifiedUser') || !flow.includes('clearPreviousFirebaseUser') ||
            !flow.includes('auto_verified'))throw Error('Incorrect or unsafe Customer Firebase Android OTA source');
          console.log('Verified approved Android 0.3.2 OTA source and unchanged native runtime');
          NODE

      - name: Require all five exact-head CI workflows successful
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?per_page=100&head_sha='+os.environ['APPROVED_SOURCE_SHA']
          req=Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urlopen(req,timeout=30) as r:runs=json.load(r)['workflow_runs']
          green={r['name'] for r in runs if r['status']=='completed' and r['conclusion']=='success'}
          required={'Verify Customer Firebase OTP Readiness','Verify mobile app','Verify web portal','Verify Partner app','INSUREIT dependency assurance evidence'}
          missing=required-green
          if missing:raise SystemExit('Refusing OTA; missing source CI: '+', '.join(sorted(missing)))
          print('All five reviewed Customer Firebase source checks passed')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and locally verify Android Firebase regression and mobile typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test apps/mobile-app/lib/firebase-native-phone-flow.test.cjs apps/mobile-app/lib/firebase-otp-errors.test.cjs apps/mobile-app/lib/firebase-android-auth-adapter.test.cjs
          npm run typecheck:mobile

      - name: Verify EAS internal channel is separate from production, no prior internal OTA
        working-directory: apps/mobile-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli channel:view firebase-internal --json --non-interactive > /tmp/eas-internal-view.txt
          npx eas-cli channel:view production --json --non-interactive > /tmp/eas-production-view.txt
          node <<'NODE'
          const fs=require('fs');
          const parse=(path)=>{
            const text=fs.readFileSync(path,'utf8').trim();
            try {return JSON.parse(text)} catch {
              const start=text.indexOf('{');
              if(start===-1)throw Error('EAS channel response has no JSON');
              return JSON.parse(text.slice(start));
            }
          };
          const a=parse('/tmp/eas-internal-view.txt');
          const b=parse('/tmp/eas-production-view.txt');
          const internal=a.currentPage||a, production=b.currentPage||b;
          const internalBranch=internal.updateBranches?.find(x=>x.name==='firebase-internal');
          if(internal.name!=='firebase-internal'||internal.isPaused||!internalBranch)throw Error('Unexpected Android internal OTA channel');
          if((internalBranch.updateGroups||[]).length!==0)throw Error('Internal branch already has updates: refuse duplicate/overwrite');
          if(production.name!=='production'||production.updateBranches?.some(x=>x.name==='firebase-internal'))throw Error('Production channel is linked to internal branch, refusing OTA');
          console.log('Verified firebase-internal branch has no previous groups and is NOT mapped to production');
          NODE

      - name: PUBLISH EXACTLY ONE Android JS OTA to firebase-internal (never production)
        working-directory: apps/mobile-app
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only "$REVIEWED_MAIN_SHA" origin/main -- apps/mobile-app supabase/functions/customer-firebase-bind supabase/functions/customer-firebase-session-bridge supabase/functions/customer-firebase-signup .github/workflows/publish-customer-release-production-ota.yml)"
          [ -z "$changed" ] || { echo "Sensitive main changes detected, refusing publish."; exit 1; }
          npx eas-cli update --branch firebase-internal --platform android \
            --message "Customer 0.3.2 Android OTP auto-verification fix (approved once) 8e08a73d0c037b08c3035a2ee136c9b107a48460" \
            --non-interactive --json > firebase-internal-android-ota-result.json
          test -s firebase-internal-android-ota-result.json
          echo 'One Android JS OTA was published to firebase-internal. No APK/AAB or Google Play release.'

      - name: Save Expo Android-only internal update reference
        uses: actions/upload-artifact@v4
        with:
          name: approved-once-customer-firebase-internal-android-ota
          path: apps/mobile-app/firebase-internal-android-ota-result.json
          retention-days: 7

      - name: Final OTA summary
        if: always()
        run: |
          {
            echo '## Approved one-time INSUREIT Customer Firebase Android OTA'
            echo '- Source: 8e08a73d0c037b08c3035a2ee136c9b107a48460'
            echo '- Expo branch: firebase-internal; Android only; runtime 0.3.2'
            echo '- This workflow does NOT build APK/AAB or publish production'
            echo '- See EAS update reference artifact if publication succeeded'
          } >> "$GITHUB_STEP_SUMMARY"
