name: Temporary correct internal shared stage call

on:
  push:
    branches:
      - ui/internal-stages-match-external
    paths:
      - .github/workflows/tmp-fix-internal-stage-call-regex.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/internal-stages-match-external
          fetch-depth: 0
      - name: Correct shared stage body call
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('apps/mobile-app/app/customer/internal-claim-stage.tsx')
          text = path.read_text()
          pattern = re.compile(r'<View pointerEvents="none">\s*<ExternalClaimMilestoneStageBody\s+key=\{stageKey\}\s+values=\{externalValues\}\s+set=\{\(\) => undefined\}\s+milestones=\{externalMilestones\}\s+claimId=\{claim\.id\}\s+customerId=\{claim\.customer_id\}\s*/>\s*</View>')
          replacement = '<View pointerEvents="none">\n        {ExternalClaimMilestoneStageBody(stageKey as any, externalValues, () => undefined, externalMilestones, claim.id, claim.customer_id)}\n      </View>'
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one shared stage invocation, found {count}')
          path.write_text(text)
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/internal-claim-stage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Correct internal shared milestone stage call"
          git push origin HEAD:ui/internal-stages-match-external
