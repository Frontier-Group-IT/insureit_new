name: Temporary refine POSP identity rows

on:
  push:
    branches: [main]
    paths:
      - 'scripts/temp_refine_posp_identity_rows.py'
      - '.github/workflows/temp-refine-posp-identity-rows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply POSP identity row refinement
        run: python scripts/temp_refine_posp_identity_rows.py
      - name: Validate patch
        run: |
          git diff --check
          grep -F 'Applicant name' apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx
          grep -F 'Same applicant' apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx
      - name: Commit application change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx
          git commit -m 'Refine Add POSP identity and contact rows'
          git push
