name: Apply Partner associate commercial scope migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260918150000_partner_associate_commercial_scope.sql'
      - '.github/workflows/apply-partner-associate-commercial-scope.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner associate commercial scope migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260918150000_partner_associate_commercial_scope.sql
          test -f supabase/rollbacks/20260918150000_partner_associate_commercial_scope.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Partner associate commercial scope migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260918150000'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260918150000_partner_associate_commercial_scope.sql
            supabase migration repair --linked --status applied 20260918150000
          fi

      - name: Verify Partner associate commercial scope contract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify_partner_associate_scope.sql <<'SQL'
          do $verify$
          begin
            if position(
              'partner_app_current_identity()'
              in pg_get_functiondef('public.partner_app_commercial_scope()'::regprocedure)
            ) = 0 then
              raise exception 'partner_app_commercial_scope does not use canonical current identity';
            end if;

            if position(
              'v_identity := public.partner_app_legacy_current_identity()'
              in pg_get_functiondef('public.partner_app_commercial_scope()'::regprocedure)
            ) > 0 then
              raise exception 'partner_app_commercial_scope still bypasses canonical identity';
            end if;

            if not has_function_privilege('authenticated', 'public.partner_app_commercial_scope()', 'EXECUTE') then
              raise exception 'authenticated cannot execute partner_app_commercial_scope';
            end if;

            if to_regprocedure('public.partner_app_current_identity()') is null then
              raise exception 'partner_app_current_identity is missing';
            end if;

            if to_regprocedure('public.partner_portal_associate_identity()') is null then
              raise exception 'partner_portal_associate_identity is missing';
            end if;
          end
          $verify$;
          SQL
          supabase db query --linked --file /tmp/verify_partner_associate_scope.sql

      - name: Verify active associate resolves Partner family scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify_active_associate_scope.sql <<'SQL'
          do $verify$
          declare
            v_auth_user_id uuid;
            v_expected_partner_id uuid;
            v_scope jsonb;
          begin
            select
              a.auth_user_id,
              public.partner_app_resolve_partner_family(a.intermediary_id)
            into v_auth_user_id, v_expected_partner_id
            from public.partner_portal_associate_accounts a
            where a.status = 'active'
            order by a.activated_at desc nulls last, a.created_at desc
            limit 1;

            if v_auth_user_id is null then
              return;
            end if;

            perform set_config('request.jwt.claim.sub', v_auth_user_id::text, true);
            perform set_config('request.jwt.claim.role', 'authenticated', true);

            v_scope := public.partner_app_commercial_scope();

            if coalesce(v_scope ->> 'actor_kind', '') <> 'intermediary' then
              raise exception 'associate actor_kind is not intermediary: %', v_scope;
            end if;

            if coalesce(v_scope ->> 'scope_mode', '') <> 'partner_family' then
              raise exception 'associate scope_mode is not partner_family: %', v_scope;
            end if;

            if not exists (
              select 1
              from jsonb_array_elements_text(coalesce(v_scope -> 'partner_ids', '[]'::jsonb)) x(value)
              where x.value::uuid = v_expected_partner_id
            ) then
              raise exception 'associate scope does not contain expected Partner: %', v_scope;
            end if;
          end
          $verify$;
          SQL
          supabase db query --linked --file /tmp/verify_active_associate_scope.sql
