name: Apply Partner Activity policy timestamp fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-partner-activity-policy-timestamp.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner Activity policy timestamp fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260915143000_partner_activity_policy_event_timestamp.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Partner Activity timestamp function
        run: supabase db query --linked --file supabase/migrations/20260915143000_partner_activity_policy_event_timestamp.sql

      - name: Verify Partner Activity policy timestamp source
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.partner_app_activity(integer)') is not null as function_ready,
              position(
                'coalesce(p.created_at,p.issuance_date::timestamptz)'
                in replace(pg_get_functiondef('public.partner_app_activity(integer)'::regprocedure), ' ', '')
              ) > 0 as policy_created_at_first,
              has_function_privilege(
                'authenticated',
                'public.partner_app_activity(integer)',
                'EXECUTE'
              ) as authenticated_execute;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"policy_created_at_first"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"authenticated_execute"[[:space:]]*:[[:space:]]*true'
