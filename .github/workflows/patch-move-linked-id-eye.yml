name: Patch linked POSP MISP eye placement

on:
  push:
    branches:
      - fix/move-linked-id-eye-to-label-20260810

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/move-linked-id-eye-to-label-20260810
          fetch-depth: 0
      - run: python scripts/temp_move_linked_id_eye.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-move-linked-id-eye.yml scripts/temp_move_linked_id_eye.py
          git add 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
          git commit -m "fix: move linked account eye beside ID label"
          git push origin HEAD:fix/move-linked-id-eye-to-label-20260810
