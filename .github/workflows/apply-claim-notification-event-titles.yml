name: Apply claim notification event titles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260903141000_claim_event_notification_titles.sql'
      - '.github/workflows/apply-claim-notification-event-titles.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply claim notification event titles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply claim notification event title migration
        run: supabase db query --linked --file supabase/migrations/20260903141000_claim_event_notification_titles.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260903141000

      - name: Verify notification title logic
        shell: bash
        run: |
          result=$(supabase db query --linked --output-format json "
            select
              position('verified during spot survey' in lower(pg_get_functiondef(
                'public.create_claim_status_notifications()'::regprocedure
              ))) > 0 as event_title_logic_ready,
              position('regexp_replace' in lower(pg_get_functiondef(
                'public.create_claim_status_notifications()'::regprocedure
              ))) > 0 as event_title_transform_ready
          ")
          echo "$result"
          echo "$result" | grep -Eq '"event_title_logic_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"event_title_transform_ready"[[:space:]]*:[[:space:]]*true'
