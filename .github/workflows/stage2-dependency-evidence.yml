name: Stage 2 dependency evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stage2-capture-dependency-audit.sh'
      - '.github/workflows/stage2-dependency-evidence.yml'
  push:
    paths:
      - 'scripts/stage2-capture-dependency-audit.sh'
      - '.github/workflows/stage2-dependency-evidence.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify lockfile clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture workspace evidence
        run: bash scripts/stage2-capture-dependency-audit.sh
      - name: Upload audit evidence (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-dependency-evidence
          path: security-audit-artifacts/
          retention-days: 30
          if-no-files-found: warn
