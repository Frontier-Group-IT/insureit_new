name: Apply Partner Branch Network contacts migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260917114000_partner_branch_network_contacts.sql'
      - '.github/workflows/apply-partner-branch-network-contacts.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner Branch Network contacts migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260917114000_partner_branch_network_contacts.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Branch Network contacts migration is applied
        shell: bash
        run: |
          set -euo pipefail
          state=$(supabase db query --linked --output-format json "
            select exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '20260917114000'
            ) as applied;
          ")
          echo "$state"
          if echo "$state" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration 20260917114000 is already recorded as applied; skipping re-application."
          else
            supabase db query --linked --file supabase/migrations/20260917114000_partner_branch_network_contacts.sql
            supabase migration repair --linked --status applied 20260917114000
          fi

      - name: Verify Branch Network contacts RPC
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.partner_app_branch_network_contacts()') is not null as rpc_exists,
              pg_get_functiondef('public.partner_app_branch_network_contacts()'::regprocedure) like '%branch_partner.parent_partner_id%' as branch_parent_guard,
              pg_get_functiondef('public.partner_app_branch_network_contacts()'::regprocedure) like '%parent_membership.partner_id = parent_partner.id%' as parent_group_scope;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"rpc_exists"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"branch_parent_guard"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"parent_group_scope"[[:space:]]*:[[:space:]]*true'
