name: Temporary document grid artifact
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch final document readers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx')
          text = workflow.read_text()
          replacements = [
            ('type Document = { id: string; document_type: string; file_name: string; storage_bucket: string; storage_path: string; verification_status: string };', 'type Document = { id: string; document_type: string; document_label: string | null; file_name: string; storage_bucket: string; storage_path: string; verification_status: string };'),
            ('select("id,document_type,file_name,storage_bucket,storage_path,verification_status")', 'select("id,document_type,document_label,file_name,storage_bucket,storage_path,verification_status")'),
            ('  const context = accountContext(application.draft_data);', '  const context = accountContext(application.draft_data);\n  const legacyDocuments = profile.existing_registration_confirmed === true || ["excel_import", "legacy_import"].includes(profile.record_source) || asObject(application.draft_data).legacy_mode === "existing";'),
            ('  const docList = (documents ?? []).map((item) => ({ document_type: item.document_type, file_name: item.file_name }));', '  const docList = (documents ?? []).map((item) => ({ document_type: item.document_type, document_label: item.document_label, file_name: item.file_name }));'),
            ('<IntermediaryDocumentUploadController applicationId={id} enabled={viewStage === "documents" && editable} showGst={Boolean(profile.gst_number)} />', '<IntermediaryDocumentUploadController applicationId={id} enabled={viewStage === "documents" && editable} showGst={Boolean(profile.gst_number)} legacyDocuments={legacyDocuments} />'),
            ('documents={docList} />\n              {viewStage === "primary"', 'documents={docList} legacyDocuments={legacyDocuments} />\n              {viewStage === "primary"'),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'workflow pattern missing: {old[:120]}')
            text = text.replace(old, new, 1)
          workflow.write_text(text)

          review = Path('apps/web-portal/app/intermediaries/applications/[id]/page.tsx')
          text = review.read_text()
          replacements = [
            ('import { DocumentVisualCard } from "@/components/document-visual-card";', 'import { IntermediaryDocumentGrid } from "@/components/intermediary-document-grid";'),
            ('  document_received_at: string | null;\n};', '  document_received_at: string | null;\n  record_source: string | null;\n  existing_registration_confirmed: boolean | null;\n};'),
            ('  file_name: string;\n  storage_bucket: string;', '  file_name: string;\n  document_label: string | null;\n  storage_bucket: string;'),
            ('associate_name,document_received_at").eq("application_id", id)', 'associate_name,document_received_at,record_source,existing_registration_confirmed").eq("application_id", id)'),
            ('select("id,document_type,file_name,storage_bucket,storage_path,verification_status,created_at")', 'select("id,document_type,document_label,file_name,storage_bucket,storage_path,verification_status,created_at")'),
            ('  const isMisp = accountContext === "misp";', '  const isMisp = accountContext === "misp";\n  const legacyDocuments = profile.existing_registration_confirmed === true || ["excel_import", "legacy_import"].includes(profile.record_source ?? "") || draft.legacy_mode === "existing";'),
            ('        <section id="documents"><DocumentsCard><DocumentChecklist documents={documents ?? []} /></DocumentsCard></section>', '        <section id="documents"><DocumentsCard><IntermediaryDocumentGrid documents={documentLinks} legacy={legacyDocuments} hasGst={Boolean(profile.gst_number)} editable={false} /></DocumentsCard></section>'),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'review pattern missing: {old[:120]}')
            text = text.replace(old, new, 1)

          text, count = re.subn(r'\nconst partnerDocuments = \[[\s\S]*?\] as const;\n', '\n', text, count=1)
          if count != 1:
            raise SystemExit('partnerDocuments block not removed')

          anchor = '  const stats = isPartner\n'
          if anchor not in text:
            raise SystemExit('stats anchor missing')
          document_links = '''  const documentLinks = await Promise.all((documents ?? []).map(async (document) => {
    const { data } = await admin.storage.from(document.storage_bucket).createSignedUrl(document.storage_path, 900);
    return {
      document_type: document.document_type,
      document_label: document.document_label,
      file_name: document.file_name,
      href: data?.signedUrl ?? null,
    };
  }));

'''
          text = text.replace(anchor, document_links + anchor, 1)

          old_journey = 'function partnerJourney(profile: Profile, docs: Document[], activePartner: boolean): JourneyItem[] { const primary = profile.workflow_stage !== "pre_iib" || Boolean(profile.partner_id); const types = new Set(docs.map((item) => item.document_type)); const complete = activePartner || ["aadhaar_front", "pan_copy", "cancelled_cheque"].every((type) => types.has(type)); return [{ label: "Primary details", done: primary, active: !primary }, { label: "Partner documents", done: complete, active: primary && !complete }]; }'
          new_journey = 'function partnerJourney(profile: Profile, docs: Document[], activePartner: boolean): JourneyItem[] { const primary = profile.workflow_stage !== "pre_iib" || Boolean(profile.partner_id); const types = new Set(docs.map((item) => item.document_type)); const required = ["aadhaar_front", "aadhaar_back", "pan_copy", "cancelled_cheque", "photograph", ...(profile.gst_number ? ["gst_copy"] : [])]; const complete = activePartner || required.every((type) => types.has(type)); return [{ label: "Primary details", done: primary, active: !primary }, { label: "Partner documents", done: complete, active: primary && !complete }]; }'
          if old_journey not in text:
            raise SystemExit('partner journey pattern missing')
          text = text.replace(old_journey, new_journey, 1)

          text, count = re.subn(r'function DocumentChecklist\([\s\S]*?(?=function DocumentsCard)', '', text, count=1)
          if count != 1:
            raise SystemExit('legacy document checklist block not removed')
          review.write_text(text)
          PY
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run build:web
      - name: Package patched files
        run: |
          mkdir -p 'artifact/apps/web-portal/app/intermediaries/applications/[id]/workflow'
          mkdir -p 'artifact/apps/web-portal/app/intermediaries/applications/[id]'
          cp 'apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx' 'artifact/apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx'
          cp 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx' 'artifact/apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
      - uses: actions/upload-artifact@v4
        with:
          name: patched-document-readers
          path: artifact
