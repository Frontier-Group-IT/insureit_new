name: Apply Partner associate accounts migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260918134500_partner_associate_accounts.sql'
      - '.github/workflows/apply-partner-associate-accounts.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner associate accounts migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260918134500_partner_associate_accounts.sql
          test -f supabase/rollbacks/20260918134500_partner_associate_accounts.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Partner associate accounts migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260918134500'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260918134500_partner_associate_accounts.sql
            supabase migration repair --linked --status applied 20260918134500
          fi

      - name: Verify Partner associate accounts contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regclass('public.partner_portal_associate_accounts') is not null as associate_accounts_ready,
              to_regclass('public.partner_portal_associate_account_audit') is not null as associate_audit_ready,
              to_regprocedure('public.partner_portal_associate_identity()') is not null as associate_identity_ready,
              to_regprocedure('public.partner_app_current_identity_before_associate_accounts()') is not null as previous_identity_preserved,
              to_regprocedure('public.partner_app_activate_current_account_before_associate_accounts()') is not null as previous_activation_preserved,
              has_function_privilege('authenticated', 'public.partner_app_current_identity()', 'EXECUTE') as current_identity_exec,
              has_function_privilege('authenticated', 'public.partner_app_activate_current_account()', 'EXECUTE') as activate_exec,
              position('partner_portal_associate_identity' in pg_get_functiondef('public.partner_app_current_identity()'::regprocedure)) > 0 as identity_wrapped,
              exists (
                select 1 from pg_constraint
                where conrelid='public.intermediary_portal_accounts'::regclass
                  and conname='intermediary_portal_accounts_intermediary_id_key'
              ) as primary_login_constraint_preserved;
          ")
          echo "$result"
          for key in associate_accounts_ready associate_audit_ready associate_identity_ready previous_identity_preserved previous_activation_preserved current_identity_exec activate_exec identity_wrapped primary_login_constraint_preserved; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
