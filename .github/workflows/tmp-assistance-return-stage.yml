name: Temporary assistance return-stage implementation

on:
  push:
    branches:
      - fix/claim-intimation-bulk-upload-v2
    paths:
      - '.github/workflows/tmp-assistance-return-stage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claim-intimation-bulk-upload-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply return-stage navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'apps/mobile-app/app/customer/self-managed-claim.tsx': [
              (
                "onAssistance={() => editing ? router.push({ pathname: '/customer/request-claim-assistance', params: { id: claimId } }) : router.push('/customer/support')}",
                "onAssistance={() => editing ? router.push({ pathname: '/customer/request-claim-assistance', params: { id: claimId, returnStage: 'spot_intimation' } }) : router.push('/customer/support')}"
              ),
            ],
            'apps/mobile-app/app/customer/self-managed-spot-status.tsx': [
              (
                "onAssistance={() => id && router.push({ pathname: '/customer/request-claim-assistance', params: { id } })}",
                "onAssistance={() => id && router.push({ pathname: '/customer/request-claim-assistance', params: { id, returnStage: 'spot_status' } })}"
              ),
            ],
            'apps/mobile-app/app/customer/self-managed-milestone.tsx': [
              (
                "router.push({ pathname: '/customer/request-claim-assistance', params: { id: claimId } });",
                "router.push({ pathname: '/customer/request-claim-assistance', params: { id: claimId, returnStage: key } });"
              ),
            ],
            'apps/mobile-app/app/customer/request-claim-assistance.tsx': [
              (
                "type ClaimRow = {\n  id: string;\n  claim_no: string;\n  claim_service_mode: string | null;\n  assistance_status: string | null;\n  policy_id: string | null;\n  policy_service_source: string | null;\n};\n",
                "type ClaimRow = {\n  id: string;\n  claim_no: string;\n  claim_service_mode: string | null;\n  assistance_status: string | null;\n  policy_id: string | null;\n  policy_service_source: string | null;\n};\n\nconst MILESTONE_RETURN_STAGES = new Set([\n  'claim_intimation',\n  'work_approval',\n  'repair_ri',\n  'billing',\n  'delivery_order',\n  'vehicle_delivery',\n  'payment_encashment',\n]);\n"
              ),
              (
                "  const { id } = useLocalSearchParams<{ id?: string }>();",
                "  const params = useLocalSearchParams<{ id?: string | string[]; returnStage?: string | string[] }>();\n  const id = Array.isArray(params.id) ? params.id[0] : params.id;\n  const returnStage = Array.isArray(params.returnStage) ? params.returnStage[0] : params.returnStage;"
              ),
              (
                "    router.replace({ pathname: '/customer/self-managed-claim-detail', params: { id: claim.id, assistance: 'requested' } });",
                "    if (returnStage === 'spot_intimation') {\n      router.replace({ pathname: '/customer/self-managed-claim', params: { id: claim.id } });\n      return;\n    }\n    if (returnStage === 'spot_status') {\n      router.replace({ pathname: '/customer/self-managed-spot-status', params: { id: claim.id } });\n      return;\n    }\n    if (returnStage && MILESTONE_RETURN_STAGES.has(returnStage)) {\n      router.replace({ pathname: '/customer/self-managed-milestone', params: { id: claim.id, key: returnStage } });\n      return;\n    }\n    router.replace({ pathname: '/customer/self-managed-claim-detail', params: { id: claim.id, assistance: 'requested' } });"
              ),
            ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {file_name}: {old[:120]}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npx tsc --noEmit

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-assistance-return-stage.yml
          git add apps/mobile-app/app/customer/self-managed-claim.tsx \
                  apps/mobile-app/app/customer/self-managed-spot-status.tsx \
                  apps/mobile-app/app/customer/self-managed-milestone.tsx \
                  apps/mobile-app/app/customer/request-claim-assistance.tsx
          git commit -m "Return to originating claim stage after assistance request"
          git push origin HEAD:fix/claim-intimation-bulk-upload-v2
