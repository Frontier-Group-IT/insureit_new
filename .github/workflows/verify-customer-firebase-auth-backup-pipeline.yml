name: Verify encrypted Customer Auth backup pipeline in disposable PostgreSQL
on:
  push:
    branches:
      - feat/customer-firebase-protected-auth-backup-kit-20261017
    paths:
      - 'scripts/customer-firebase-auth-encrypted-backup.sh'
      - 'scripts/customer-firebase-auth-restore-rehearsal.sh'
      - '.github/workflows/verify-customer-firebase-auth-backup-pipeline.yml'
  pull_request:
    paths:
      - 'scripts/customer-firebase-auth-encrypted-backup.sh'
      - 'scripts/customer-firebase-auth-restore-rehearsal.sh'
      - '.github/workflows/verify-customer-firebase-auth-backup-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and exercise encrypted backup to isolated restore
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/customer-firebase-auth-encrypted-backup.sh
          bash -n scripts/customer-firebase-auth-restore-rehearsal.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          mkdir -p "$temp/bin" "$temp/backups"
          export TMPDIR="$temp"
          for tool in psql pg_dump pg_restore; do
            # Share only this synthetic temp directory, needed by pg_restore TOC.
            printf '#!/usr/bin/env bash\nexec docker run --rm --network host -i -v "%s:%s:ro" postgres:17-alpine %s "$@"\n' "$temp" "$temp" "$tool" > "$temp/bin/$tool"
            chmod 700 "$temp/bin/$tool"
          done
          export PATH="$temp/bin:$PATH"
          admin='postgresql://postgres:synthetic-only@127.0.0.1:5432/postgres'
          psql "$admin" -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE synthetic_auth_source'
          psql "$admin" -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE synthetic_auth_target'
          for db in synthetic_auth_source synthetic_auth_target; do
            psql "postgresql://postgres:synthetic-only@127.0.0.1:5432/$db" \
              -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema auth;
          create table auth.users(
            id uuid primary key,
            email text,
            encrypted_password text not null
          );
          create table auth.identities(
            id text primary key,
            user_id uuid not null references auth.users(id)
          );
          create table auth.schema_migrations(version text primary key);
          insert into auth.schema_migrations values ('synthetic-migration');
          SQL
          done
          psql 'postgresql://postgres:synthetic-only@127.0.0.1:5432/synthetic_auth_source' \
            -v ON_ERROR_STOP=1 -q <<'SQL'
          insert into auth.users values(
            '11111111-1111-4111-8111-111111111111',
            'synthetic@example.invalid',
            'synthetic-encrypted-password-placeholder'
          );
          insert into auth.identities values(
            'synthetic-identity','11111111-1111-4111-8111-111111111111'
          );
          SQL
          age-keygen -o "$temp/owner.agekey" >/dev/null 2>&1
          pub="$(awk '/^# public key:/ {print $4; exit}' "$temp/owner.agekey")"
          test -n "$pub"
          export INSUREIT_BACKUP_DB_URL='postgresql://postgres:synthetic-only@127.0.0.1:5432/synthetic_auth_source'
          export INSUREIT_BACKUP_AGE_RECIPIENT="$pub"
          export INSUREIT_BACKUP_DIR="$temp/backups"
          export INSUREIT_BACKUP_DISPOSABLE_LOCAL_TEST='YES_SYNTHETIC_ONLY'
          bash scripts/customer-firebase-auth-encrypted-backup.sh
          archive="$(find "$temp/backups" -maxdepth 1 -name '*.dump.age' -print -quit)"
          test -n "$archive"
          export INSUREIT_BACKUP_FILE="$archive"
          export INSUREIT_BACKUP_AGE_IDENTITY="$temp/owner.agekey"
          export INSUREIT_RESTORE_TEST_DB_URL='postgresql://postgres:synthetic-only@127.0.0.1:5432/synthetic_auth_target'
          export INSUREIT_RESTORE_ISOLATED_ACK='I_CONFIRM_DISPOSABLE_AUTH_DB'
          age-keygen -o "$temp/wrong.agekey" >/dev/null 2>&1
          INSUREIT_BACKUP_AGE_IDENTITY="$temp/wrong.agekey" \
            bash scripts/customer-firebase-auth-restore-rehearsal.sh \
            >"$temp/wrong-key.log" 2>&1 && {
              echo 'ERROR: incorrect key was accepted' >&2; exit 1;
            }
          test "$(psql "$INSUREIT_RESTORE_TEST_DB_URL" -Atqc 'select count(*) from auth.users')" = 0
          bash scripts/customer-firebase-auth-restore-rehearsal.sh
          test "$(psql "$INSUREIT_RESTORE_TEST_DB_URL" -Atqc \
            "select count(*) from auth.users where id='11111111-1111-4111-8111-111111111111' and encrypted_password='synthetic-encrypted-password-placeholder'")" = 1
          test "$(psql "$INSUREIT_RESTORE_TEST_DB_URL" -Atqc \
            "select count(*) from auth.identities where id='synthetic-identity' and user_id='11111111-1111-4111-8111-111111111111'")" = 1
          test "$(psql "$INSUREIT_RESTORE_TEST_DB_URL" -Atqc \
            "select count(*) from auth.schema_migrations where version='synthetic-migration'")" = 1
          bash scripts/customer-firebase-auth-restore-rehearsal.sh \
            >"$temp/nonempty.log" 2>&1 && {
              echo 'ERROR: nonempty Auth target was accepted' >&2; exit 1;
            }
          cp "$archive" "$temp/corrupt.dump.age"
          (cd "$temp" && sha256sum corrupt.dump.age > corrupt.dump.age.sha256)
          printf 'corrupt' >> "$temp/corrupt.dump.age"
          INSUREIT_BACKUP_FILE="$temp/corrupt.dump.age" \
            bash scripts/customer-firebase-auth-restore-rehearsal.sh \
            >"$temp/checksum.log" 2>&1 && {
              echo 'ERROR: corrupted checksum accepted' >&2; exit 1;
            }
          INSUREIT_RESTORE_TEST_DB_URL='postgresql://postgres:synthetic-only@db.example.net:5432/postgres' \
            bash scripts/customer-firebase-auth-restore-rehearsal.sh \
            >"$temp/remote.log" 2>&1 && {
              echo 'ERROR: remote restore target accepted' >&2; exit 1;
            }
          echo 'PASS: synthetic pg_dump -> age -> checksum -> isolated restore preserved UUID, hash and identity, denied bad key/corruption/nonempty/remote.'
          echo 'NOT PROOF of production Auth backup, offsite storage, matching GoTrue restore or original sign-in.'
