name: Remove duplicate import KPI cards

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Keep a single KPI row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-portal/app/customers/posp-misp/import/import-row-review-table.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('import { useMemo, useState } from "react";', 'import { useState } from "react";'),
              ('  const summary=useMemo(()=>rows.reduce((result,row)=>{const key=row.validation_errors?.length?"attention":row.status==="submitted"?"submitted":row.status==="failed"?"failed":"ready";result[key]=(result[key]??0)+1;return result;},{} as Record<string,number>),[rows]);\n', ''),
              ('    <div className="mb-3 grid gap-2 sm:grid-cols-4"><SummaryCard label="Total rows" value={rows.length}/><SummaryCard label="Ready" value={summary.ready??0} tone="success"/><SummaryCard label="Needs attention" value={summary.attention??0} tone="danger"/><SummaryCard label="Submitted" value={summary.submitted??0} tone="success"/></div>\n', ''),
              ('function SummaryCard({label,value,tone}:{label:string;value:number;tone?:"success"|"danger"}){return <div className="rounded-xl border border-[#E2E8F0] bg-white px-4 py-3"><p className="text-[9px] font-semibold uppercase tracking-[0.06em] text-[#64748B]">{label}</p><p className={`mt-1 text-xl font-semibold ${tone==="danger"?"text-red-700":tone==="success"?"text-emerald-700":"text-[#071D49]"}`}>{value}</p></div>}\n', ''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected block not found: {old[:90]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/remove-duplicate-import-kpis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/customers/posp-misp/import/import-row-review-table.tsx
          git commit -m "Keep one import KPI row"
          git push origin HEAD:main
