name: Publish Partner 0.1.0 policy detail reference OTA once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-partner-0-1-policy-detail-reference-once.yml'
      - 'scripts/partner/compat/partner-policy-detail-reference-0-1.tsx'
      - 'scripts/partner/patch-0-1-partner-screen-hide-topbar.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
      COMPAT_SHA: 74039199991888777911deb30cf248e8f36cf8a8

    steps:
      - name: Check out current main tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
          fetch-depth: 0

      - name: Check out approved Partner 0.1.0 compatibility source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPAT_SHA }}
          path: compat
          fetch-depth: 0

      - name: Verify exact Partner 0.1.0 compatibility source
        shell: bash
        run: |
          set -euo pipefail
          cd compat
          [ "$(git rev-parse HEAD)" = "$COMPAT_SHA" ] || { echo "Refusing OTA: compatibility checkout is not the approved source." >&2; exit 1; }
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const expo = app.expo || {};
          if (expo.version !== '0.1.0') process.exit(1);
          if (expo?.runtimeVersion?.policy !== 'appVersion') process.exit(1);
          if (expo?.extra?.eas?.projectId !== '8ade82c1-4c96-4f09-b90b-802270fb406d') process.exit(1);
          NODE

      - name: Install reference-style Policy Details layout for runtime 0.1.0
        shell: bash
        run: |
          set -euo pipefail
          node tooling/scripts/partner/patch-0-1-partner-screen-hide-topbar.mjs \
            'compat/apps/partner-app/components/partner-screen.tsx'
          cp tooling/scripts/partner/compat/partner-policy-detail-reference-0-1.tsx \
            'compat/apps/partner-app/app/policy/[id].tsx'
          grep -q 'hideTopBar' 'compat/apps/partner-app/components/partner-screen.tsx'
          grep -q '<Text style={styles.headerEyebrow}>BUSINESS</Text>' 'compat/apps/partner-app/app/policy/[id].tsx'
          grep -q '<Text style={styles.headerTitle}>Policy Details</Text>' 'compat/apps/partner-app/app/policy/[id].tsx'
          grep -q 'Quick Actions' 'compat/apps/partner-app/app/policy/[id].tsx'
          grep -q 'Policy Overview' 'compat/apps/partner-app/app/policy/[id].tsx'
          grep -q 'Customer & Vehicle' 'compat/apps/partner-app/app/policy/[id].tsx'
          if grep -q 'onBack={() => router.back()}' 'compat/apps/partner-app/app/policy/[id].tsx'; then
            echo "Back arrow wiring is still present in the redesigned Policy Details header." >&2
            exit 1
          fi

      - name: Require Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN_PARTNER is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: compat/package-lock.json

      - name: Install compatibility dependencies
        working-directory: compat
        run: npm ci --no-audit --no-fund

      - name: Verify Partner app typecheck
        working-directory: compat/apps/partner-app
        run: npx tsc --noEmit

      - name: Verify Expo token and linked Partner project
        working-directory: compat/apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Publish Partner 0.1.0 Policy Details reference OTA
        working-directory: compat/apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Partner 0.1.0 Policy Details reference redesign" \
            --clear-cache \
            --non-interactive

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Partner 0.1.0 Policy Details reference OTA"
            echo
            echo "- Source baseline: $COMPAT_SHA"
            echo "- Channel: preview"
            echo "- Runtime: 0.1.0"
            echo "- Header keeps BUSINESS and Policy Details left aligned; no back arrow or header logo"
            echo "- Reference-style summary, Quick Actions, Policy Overview, Premium, Customer & Vehicle, and Commercial Attribution cards"
            echo "- Native APK/AAB build: not used"
          } >> "$GITHUB_STEP_SUMMARY"
