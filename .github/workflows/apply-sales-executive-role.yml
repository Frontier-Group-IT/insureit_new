name: Apply Sales Executive role migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260921131500_add_sales_executive_app_role.sql'
      - 'supabase/rollbacks/20260921131500_add_sales_executive_app_role.sql'
      - '.github/workflows/apply-sales-executive-role.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Sales Executive role migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260921131500_add_sales_executive_app_role.sql
          test -f supabase/rollbacks/20260921131500_add_sales_executive_app_role.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Sales Executive role migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260921131500'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260921131500_add_sales_executive_app_role.sql
            supabase migration repair --linked --status applied 20260921131500
          fi

      - name: Verify Sales Executive enum value
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select exists(
              select 1
              from pg_enum e
              join pg_type t on t.oid = e.enumtypid
              join pg_namespace n on n.oid = t.typnamespace
              where n.nspname='public'
                and t.typname='app_role'
                and e.enumlabel='sales_executive'
            ) as ready;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'
