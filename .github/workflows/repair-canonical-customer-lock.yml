name: Repair canonical Customer lockfile

on:
  push:
    branches:
      - customer/canonical-0-3-0-production-baseline
    paths:
      - '.github/workflows/repair-canonical-customer-lock.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical Customer branch
        uses: actions/checkout@v4
        with:
          ref: customer/canonical-0-3-0-production-baseline
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate synchronized lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Synchronize canonical Customer package lock'
          git push origin HEAD:customer/canonical-0-3-0-production-baseline
