name: Validate IT super user access

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web-portal/lib/permission-management.ts"
      - ".github/workflows/validate-it-super-user-access.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
