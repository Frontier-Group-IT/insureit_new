name: Build Partner production AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/partner-app/.trigger-production-aab'
      - '.github/workflows/build-partner-production-aab.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_PARTNER }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "Refusing Partner production build: checkout is not current origin/main." >&2
            exit 1
          }

      - name: Validate Partner production identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const customer = require('./apps/mobile-app/app.json');
          const eas = require('./apps/partner-app/eas.json');
          const expo = app.expo || {};
          const projectId = expo?.extra?.eas?.projectId;
          if (!projectId) throw new Error('Partner app is not linked to a dedicated EAS project.');
          if (projectId === customer?.expo?.extra?.eas?.projectId) throw new Error('Partner app cannot share the Customer EAS project ID.');
          if (expo.android?.package !== 'com.insureit.partner') throw new Error('Unexpected Android package identity.');
          if (expo.version !== '0.2.0') throw new Error(`Expected Partner version 0.2.0, found ${expo.version || 'missing'}.`);
          if (expo.runtimeVersion?.policy !== 'appVersion') throw new Error('Partner runtime policy must remain appVersion.');
          if (!eas?.build?.production) throw new Error('EAS production profile is missing.');
          console.log(`Partner production build: ${expo.android.package} v${expo.version}; project ${projectId}`);
          NODE

      - name: Require Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN_PARTNER is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Partner app
        run: |
          npm --workspace apps/partner-app run verify:phase6
          npm run typecheck:partner
          npm run lint:partner

      - name: Verify Expo project access
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Build production Android App Bundle
        working-directory: apps/partner-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli build --platform android --profile production --non-interactive --wait --json > partner-production-aab.json
          cat partner-production-aab.json

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## INSUREIT Partner production AAB"
            echo
            echo "- Source: current \`main\` only"
            echo "- Android package: \`com.insureit.partner\`"
            echo "- EAS profile: \`production\`"
            echo "- Output: Android App Bundle (AAB)"
            echo "- Production channel: \`production\`"
          } >> "$GITHUB_STEP_SUMMARY"
