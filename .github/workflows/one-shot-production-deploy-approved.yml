name: One-shot production deploy approved

on:
  push:
    branches:
      - ops/direct-prod-deploy-20260903

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger existing Vercel production hook
    runs-on: ubuntu-latest
    steps:
      - name: Verify current main snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: cce652069f70dafcb3af6d2ad3855c33d157b403
        run: |
          set -euo pipefail
          current_main=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq '.object.sha')
          if [ "$current_main" != "$EXPECTED_MAIN" ]; then
            echo "::error::main moved from approved snapshot: $EXPECTED_MAIN -> $current_main"
            exit 1
          fi
          echo "Approved production snapshot: $current_main"

      - name: Trigger existing Vercel production deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not configured"
            exit 1
          fi
          http_status=$(curl --silent --show-error --output vercel-response.json --write-out "%{http_code}" --request POST "$VERCEL_DEPLOY_HOOK_URL")
          cat vercel-response.json
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Vercel deploy hook returned HTTP $http_status"
            exit 1
          fi
