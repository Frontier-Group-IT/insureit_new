name: One-time XLSX lock repair PR 2971

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'apps/web-portal/package.json'
      - '.github/workflows/assurance-xlsx-lock-pr2971.yml'

permissions:
  contents: write

jobs:
  lock:
    if: >-
      github.event.pull_request.number == 2971 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/stage2-xlsx-0203-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/stage2-xlsx-0203-20261008
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate lock against official SheetJS tarball
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm dedupe --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify source integrity and workbook regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const lock=require('./package-lock.json');
          const entry=lock.packages['node_modules/xlsx'] || lock.packages['apps/web-portal/node_modules/xlsx'];
          const expected='https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz';
          if(!entry || entry.version!=='0.20.3' || entry.resolved!==expected || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(entry.integrity||'')) {
            throw Error('SheetJS tarball version, official source or lock integrity missing');
          }
          const all=Object.entries(lock.packages).filter(([k])=>/(^|\/)node_modules\/xlsx$/.test(k));
          if(all.some(([k,p])=>p.version!=='0.20.3')) throw Error('Legacy vulnerable XLSX still installed');
          console.log('SheetJS official version/URL/lock integrity verified:',entry.version,entry.resolved);
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all >/tmp/dependency-tree.txt
          cd apps/web-portal
          node scripts/sheetjs-xlsx-0203-regression.mjs
      - name: Commit generated lockfile only to review branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'security: synchronize audited SheetJS tarball npm lockfile' --only package-lock.json
          git push origin HEAD:refs/heads/security/stage2-xlsx-0203-20261008
