name: INSUREIT R2 encrypted backup restore verification (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insureit-r2-restore-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: insureit-production-backup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependencies
        run: python -m pip install boto3==1.35.99 cryptography==44.0.2
      - name: Restore samples in memory and verify SHA256
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_BUCKET: insureit-production-backups
        run: python -u scripts/backup/verify_r2_restore.py
