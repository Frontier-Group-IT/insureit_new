name: Temporary Fresh Expo Preview APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-expo-preview-fresh-apk.yml'

permissions:
  contents: read

jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo credential
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@18 whoami --non-interactive
        working-directory: apps/mobile-app
      - name: Queue fresh preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@18 build --platform android --profile preview --non-interactive --no-wait
        working-directory: apps/mobile-app
