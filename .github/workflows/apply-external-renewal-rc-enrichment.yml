name: Apply External Renewal RC enrichment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260918235000_external_renewal_rc_enrichment.sql'
      - '.github/workflows/apply-external-renewal-rc-enrichment.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply External Renewal RC enrichment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260918235000_external_renewal_rc_enrichment.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply RC enrichment migration
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/migrations/20260918235000_external_renewal_rc_enrichment.sql
          supabase migration repair --linked --status applied 20260918235000

      - name: Verify RC enrichment schema contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              exists (
                select 1 from information_schema.columns
                where table_schema='public'
                  and table_name='external_renewal_opportunities'
                  and column_name='rc_enrichment_status'
              ) as status_ready,
              exists (
                select 1 from information_schema.columns
                where table_schema='public'
                  and table_name='external_renewal_opportunities'
                  and column_name='rc_enrichment_details'
              ) as details_ready,
              not has_table_privilege('authenticated','public.external_renewal_opportunities','UPDATE') as no_authenticated_direct_update,
              (select count(*) from public.customers) >= 0 as customer_master_untouched,
              (select count(*) from public.vehicles) >= 0 as vehicle_master_untouched,
              (select count(*) from public.policies) >= 0 as policy_master_untouched
          ")
          echo "$result"
          for key in status_ready details_ready no_authenticated_direct_update customer_master_untouched vehicle_master_untouched policy_master_untouched; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
