name: Apply external policy copy link

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260928061127_link_customer_policy_copy_to_external_policy.sql'
      - '.github/workflows/apply-external-policy-copy-link.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Verify external policy copy link schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260928061127_link_customer_policy_copy_to_external_policy.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure external policy copy migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260928061127'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260928061127_link_customer_policy_copy_to_external_policy.sql
            supabase migration repair --linked --status applied 20260928061127
          fi

      - name: Verify policy copy link trigger
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.link_customer_policy_copy_to_external_policy()') is not null as function_ready,
              exists (
                select 1 from pg_trigger
                where tgrelid = to_regclass('public.customer_documents')
                  and tgname = 'trg_link_customer_policy_copy_to_external_policy'
                  and not tgisinternal
              ) as trigger_ready;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"trigger_ready"[[:space:]]*:[[:space:]]*true'
