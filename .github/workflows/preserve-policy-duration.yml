name: Preserve policy duration in conflict resolution

on:
  push:
    branches:
      - feature/policy-onboarding-conflict-resolution
    paths:
      - .automation/preserve_policy_duration.py
      - .github/workflows/preserve-policy-duration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/policy-onboarding-conflict-resolution
          fetch-depth: 0

      - name: Apply policy duration patch
        run: python .automation/preserve_policy_duration.py

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          git commit -m "Preserve policy duration when shifting renewal dates"
          git push origin HEAD:feature/policy-onboarding-conflict-resolution
