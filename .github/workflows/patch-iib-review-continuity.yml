name: Patch IIB review continuity

on:
  push:
    branches:
      - fix/iib-registration-finalization
    paths:
      - '.github/workflows/patch-iib-review-continuity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/iib-registration-finalization
          fetch-depth: 0

      - name: Apply narrow continuity follow-up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          deploy = Path('.github/workflows/deploy-production.yml')
          text = deploy.read_text()
          needle = '            echo "## Automatic Vercel production deployment requested"\n            echo "- Branch: `main`"'
          replacement = '            echo "## Automatic Vercel production deployment requested"\n            echo\n            echo "- Branch: `main`"'
          if needle in text:
              deploy.write_text(text.replace(needle, replacement, 1))

          current = Path('docs/CURRENT_CHAT_HANDOFF.md')
          current_text = current.read_text()
          current_marker = '## 2026-10-01 — IIB registration finalization / PR #2664'
          if current_marker not in current_text:
              section = '''## 2026-10-01 — IIB registration finalization / PR #2664

- Branch: `fix/iib-registration-finalization`; PR #2664.
- Step 6 flow is **Prepare IIB Data → Prepare Portal Handoff → Complete IIB Registration → POSP/MISP Active**.
- Finalization is server-side and atomic through `complete_intermediary_iib_registration`; it rechecks training completed, exam passed, agreement signed, canonical handoff state, and zero missing IIB fields before activation.
- Review follow-up adds a dedicated production schema apply workflow plus `deploy-production.yml` gate, canonicalizes draft-backed handoffs with an upsert, and repairs the resolved registration record's `application_id` back-link before activation.
- Focused regression now covers the finalizer, recovery paths, and the migration deployment gate.
- **IMPLEMENTED; fresh PR verification pending. NOT MERGED, NOT DEPLOYED, migration NOT APPLIED to production.**
- Detailed handoff: `docs/IIB_REGISTRATION_FINALIZATION_HANDOFF_2026_10_01.md`.

---

'''
              current.write_text(section + current_text)

          agents = Path('AGENTS.md')
          agents_text = agents.read_text()
          ledger_marker = '### Latest implementation ledger\n\n'
          ledger_entry = '- **2026-10-01 — POSP/MISP IIB registration finalization:** branch `fix/iib-registration-finalization`, PR #2664. Step 6 adds reviewer-confirmed IIB completion and atomic POSP/MISP activation; review follow-up adds the dedicated production migration gate, canonical draft-handoff recovery and registration back-link repair. **IMPLEMENTED; fresh CI pending; NOT MERGED / NOT APPLIED / NOT DEPLOYED.** See `docs/IIB_REGISTRATION_FINALIZATION_HANDOFF_2026_10_01.md`.\n'
          if 'POSP/MISP IIB registration finalization:' not in agents_text:
              if ledger_marker not in agents_text:
                  raise SystemExit('Latest implementation ledger marker not found')
              agents.write_text(agents_text.replace(ledger_marker, ledger_marker + ledger_entry, 1))

          detailed = Path('docs/IIB_REGISTRATION_FINALIZATION_HANDOFF_2026_10_01.md')
          if detailed.exists():
              detailed_text = detailed.read_text()
              followup_marker = '## Review follow-up before merge'
              if followup_marker not in detailed_text:
                  detailed.write_text(detailed_text.rstrip() + '''\n\n## Review follow-up before merge\n\n- Canonical PR verification #5087 passed for the earlier head, but review then identified four merge blockers; that earlier green run is superseded by the follow-up commits.\n- Added `.github/workflows/apply-intermediary-iib-registration-finalizer.yml` and mapped migration `20261001170000` in `deploy-production.yml`, so Vercel release waits for the production schema apply/verification workflow.\n- `startIntermediaryIibHandoff()` now always upserts the canonical IIB packet, including draft-only recovery cases.\n- The finalizer now restores the resolved registration record's `application_id` before activation.\n- Continuity is recorded in `CURRENT_CHAT_HANDOFF.md` and the `AGENTS.md` implementation ledger.\n- Current evidence state: **IMPLEMENTED; fresh Verify web portal pending; NOT MERGED; NOT DEPLOYED; production migration NOT APPLIED.**\n''')
          PY

      - name: Commit patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-production.yml AGENTS.md docs/CURRENT_CHAT_HANDOFF.md docs/IIB_REGISTRATION_FINALIZATION_HANDOFF_2026_10_01.md
          git commit -m "Address IIB review continuity blockers"
          git push origin HEAD:fix/iib-registration-finalization
