name: Apply Accounts duplicate bill reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/202609280002_accounts_duplicate_bill_reconciliation.sql'
      - '.github/workflows/apply-accounts-duplicate-bill-reconciliation.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Verify Accounts duplicate bill schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/202609280002_accounts_duplicate_bill_reconciliation.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure migration is applied
        shell: bash
        run: |
          set -euo pipefail
          definition=$(supabase db query --linked --output-format json "select pg_get_functiondef('public.post_accounts_excel_reconciliation(uuid,jsonb,jsonb,jsonb)'::regprocedure) as definition;")
          indexes=$(supabase db query --linked --output-format json "select indexname from pg_indexes where schemaname='public' and tablename='accounts_invoices';")
          if echo "$definition" | grep -q 'already exists for this insurer'; then
            supabase db query --linked --file supabase/migrations/202609280002_accounts_duplicate_bill_reconciliation.sql
          fi
          if echo "$indexes" | grep -q 'accounts_invoices_invoice_no_uidx'; then
            supabase db query --linked --file supabase/migrations/202609280002_accounts_duplicate_bill_reconciliation.sql
          fi
          applied=$(supabase db query --linked --output-format json "select exists(select 1 from supabase_migrations.schema_migrations where version='202609280002') as applied;")
          if ! echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            supabase migration repair --linked --status applied 202609280002
          fi

      - name: Verify duplicate bill rule
        shell: bash
        run: |
          set -euo pipefail
          definition=$(supabase db query --linked --output-format json "select pg_get_functiondef('public.post_accounts_excel_reconciliation(uuid,jsonb,jsonb,jsonb)'::regprocedure) as definition;")
          indexes=$(supabase db query --linked --output-format json "select indexname,indexdef from pg_indexes where schemaname='public' and tablename='accounts_invoices' and indexname like 'accounts_invoices_invoice_no%';")
          echo "$definition" | grep -vq 'Bill % already exists for this insurer'
          echo "$indexes" | grep -q 'accounts_invoices_invoice_no_idx'
          echo "$indexes" | grep -vq 'accounts_invoices_invoice_no_uidx'
