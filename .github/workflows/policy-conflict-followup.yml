name: Policy conflict follow-up patch

on:
  push:
    branches:
      - feature/policy-onboarding-conflict-resolution
    paths:
      - .automation/policy_conflict_followup.py
      - .github/workflows/policy-conflict-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/policy-onboarding-conflict-resolution
          fetch-depth: 0

      - name: Apply follow-up patch
        run: python .automation/policy_conflict_followup.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/policies/policy-onboarding-actions.ts apps/web-portal/app/policies/policy-onboarding-conflicts.ts apps/web-portal/components/policy-unified-form.tsx
          git commit -m "Harden policy onboarding conflict resolutions"
          git push origin HEAD:feature/policy-onboarding-conflict-resolution
