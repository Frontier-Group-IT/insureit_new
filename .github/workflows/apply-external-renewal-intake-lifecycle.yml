name: Apply external renewal intake lifecycle migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260906234500_external_renewal_intake_lifecycle.sql'
      - '.github/workflows/apply-external-renewal-intake-lifecycle.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply external renewal intake lifecycle migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260906234500_external_renewal_intake_lifecycle.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply external renewal intake lifecycle migration
        run: supabase db query --linked --file supabase/migrations/20260906234500_external_renewal_intake_lifecycle.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260906234500

      - name: Verify lifecycle trigger
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.sync_external_renewal_from_policy_intake()') is not null as sync_function_ready,
              exists (
                select 1 from pg_trigger
                where tgname='sync_external_renewal_from_policy_intake_trigger'
                  and tgrelid='public.policy_intake_requests'::regclass
                  and not tgisinternal
              ) as sync_trigger_ready,
              not has_function_privilege('authenticated','public.sync_external_renewal_from_policy_intake()','EXECUTE') as no_authenticated_execute
          ")
          echo "$result"
          for key in sync_function_ready sync_trigger_ready no_authenticated_execute; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
