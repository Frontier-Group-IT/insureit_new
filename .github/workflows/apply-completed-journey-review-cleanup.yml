name: Apply completed journey review cleanup

on:
  push:
    branches:
      - feature/completed-journey-review-cleanup-v2-20260805

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/completed-journey-review-cleanup-v2-20260805
          fetch-depth: 0
      - name: Apply source changes
        run: python .github/scripts/apply-completed-journey-review-cleanup.py
      - name: Remove temporary patch files
        run: git rm .github/scripts/apply-completed-journey-review-cleanup.py .github/workflows/apply-completed-journey-review-cleanup.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/intermediaries/applications/'[id]'/workflow/page.tsx apps/web-portal/app/intermediaries/applications/'[id]'/page.tsx apps/web-portal/app/customers/applications/posp-misp-application-editor.tsx
          git commit -m "Refine completed onboarding journey UI"
          git push origin HEAD:feature/completed-journey-review-cleanup-v2-20260805
