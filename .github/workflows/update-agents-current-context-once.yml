name: Apply AGENTS current context once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply curated context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          agents = Path('AGENTS.md')
          text = agents.read_text()
          marker = '## Current INSUREIT implementation context — 2026-08-07'
          if marker in text:
              print('Context already present.')
              raise SystemExit(0)

          source = Path('.github/workflows/update-agents-current-context.yml').read_text()
          match = re.search(r"section = r'''(.*?)'''\n\n          path\.write_text", source, re.S)
          if not match:
              raise SystemExit('Could not extract curated context section.')
          section = match.group(1)
          agents.write_text(text.rstrip() + section + '\n')
          PY
      - name: Commit AGENTS update if needed
        run: |
          if git diff --quiet -- AGENTS.md; then
            echo "No AGENTS change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          git commit -m "Update AGENTS with current INSUREIT context"
          git push origin HEAD:main
