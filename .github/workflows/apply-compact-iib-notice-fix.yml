name: Apply compact IIB notice fix

on:
  push:
    branches: [fix/compact-iib-status-and-dismiss-notice]
    paths:
      - ".github/workflows/apply-compact-iib-notice-fix.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      PAN_VERIFICATION_WORKER_KEY: placeholder-worker-key
      NEXT_PUBLIC_INSUREIT_LAUNCH_SCOPE: intermediary
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-iib-status-and-dismiss-notice
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch application review success notice
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web-portal/app/intermediaries/applications/[id]/page.tsx')
          text = path.read_text()
          import_anchor = 'import { createLinkedIntermediaryAccount } from "./account-review-actions";\n'
          import_line = 'import { AutoDismissSuccessNotice } from "./auto-dismiss-success-notice";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          old = '{query.success && !modalSuccessEvents.has(query.success) ? <Notice tone="success" text={successMessage(query.success)} /> : null}'
          new = '{query.success && !modalSuccessEvents.has(query.success) ? <AutoDismissSuccessNotice text={successMessage(query.success)} /> : null}'
          if old not in text:
              raise SystemExit('Success notice anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run build:web
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/intermediaries/applications/[id]/page.tsx
          git commit -m "Auto-dismiss PAN recheck success notice"
          git push
