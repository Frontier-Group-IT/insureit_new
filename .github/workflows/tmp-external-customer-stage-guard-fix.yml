name: Temporary External Claim customer stage guard fix

on:
  push:
    branches:
      - fix/external-claim-customer-processing
    paths:
      - '.github/workflows/tmp-external-customer-stage-guard-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/external-claim-customer-processing
          fetch-depth: 0
      - name: Apply surgical External Claim stage guard patch
        shell: python
        run: |
          from pathlib import Path

          stage1 = Path('apps/mobile-app/app/customer/self-managed-claim.tsx')
          text = stage1.read_text()
          old = "if (!claim || claim.claim_service_mode !== 'self_managed' || !claim.external_policy_id) {"
          new = "if (!claim || !claim.external_policy_id) {"
          if old not in text and new not in text:
              raise SystemExit('Stage 1 External Claim mode guard not found')
          if old in text:
              stage1.write_text(text.replace(old, new, 1))

          spot = Path('apps/mobile-app/app/customer/self-managed-spot-status.tsx')
          text = spot.read_text()
          old = "if ((claimResult.data as any).claim_service_mode !== 'self_managed') {"
          new = "if (!(claimResult.data as any).external_policy_id) {"
          if old not in text and new not in text:
              raise SystemExit('Spot Status External Claim mode guard not found')
          if old in text:
              spot.write_text(text.replace(old, new, 1))

          regression = Path('apps/web-portal/scripts/external-claim-canonical-operations-regression.mjs')
          text = regression.read_text()
          marker = "const mobileClaimDetail = fs.readFileSync(path.join(root, '../mobile-app/app/customer/claim-detail.tsx'), 'utf8');\n"
          addition = marker + "const mobileExternalStageOne = fs.readFileSync(path.join(root, '../mobile-app/app/customer/self-managed-claim.tsx'), 'utf8');\nconst mobileExternalSpotStatus = fs.readFileSync(path.join(root, '../mobile-app/app/customer/self-managed-spot-status.tsx'), 'utf8');\n"
          if "const mobileExternalStageOne =" not in text:
              if marker not in text:
                  raise SystemExit('Regression mobile claim detail marker not found')
              text = text.replace(marker, addition, 1)

          anchor = "assert(mobileClaimDetail.includes(\"claim?.policy_service_source === 'external' || claim?.claim_service_mode === 'self_managed'\"), 'External-policy claims must keep the Customer self-tracked journey regardless of Operations ownership mode.');\n"
          assertions = """assert(mobileExternalStageOne.includes("if (!claim || !claim.external_policy_id)"), 'External Claim Stage 1 must remain editable for externally sourced claims regardless of Operations ownership mode.');\nassert(!mobileExternalStageOne.includes("claim.claim_service_mode !== 'self_managed'"), 'External Claim Stage 1 must not reject a claim only because Operations ownership is broker_managed.');\nassert(mobileExternalSpotStatus.includes("if (!(claimResult.data as any).external_policy_id)"), 'External Claim Spot Status must validate External policy identity rather than service mode.');\nassert(!mobileExternalSpotStatus.includes("claim_service_mode !== 'self_managed'"), 'External Claim Spot Status must not reject a claim only because Operations ownership is broker_managed.');\n"""
          if "External Claim Stage 1 must remain editable" not in text:
              if anchor not in text:
                  raise SystemExit('Regression external claim detail assertion anchor not found')
              text = text.replace(anchor, anchor + assertions, 1)
          regression.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile-app/app/customer/self-managed-claim.tsx apps/mobile-app/app/customer/self-managed-spot-status.tsx apps/web-portal/scripts/external-claim-canonical-operations-regression.mjs
          git commit -m 'Keep External Claim customer stages editable after Operations entry'
          git push origin HEAD:fix/external-claim-customer-processing
