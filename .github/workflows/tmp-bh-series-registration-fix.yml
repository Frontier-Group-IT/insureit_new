name: Temporary BH-series registration fix

on:
  push:
    branches:
      - fix/bh-series-registration-end-to-end
    paths:
      - .github/workflows/tmp-bh-series-registration-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/bh-series-registration-end-to-end
          fetch-depth: 0

      - name: Apply focused registration validation changes
        run: python3 .github/scripts/tmp_bh_series_registration_fix.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run focused registration regression
        working-directory: apps/web-portal
        run: npm run vehicle-registration:regression

      - name: Remove temporary helpers and commit source fix
        shell: bash
        run: |
          rm .github/workflows/tmp-bh-series-registration-fix.yml
          rm .github/scripts/tmp_bh_series_registration_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support BH-series vehicle registrations end to end"
          git push origin HEAD:fix/bh-series-registration-end-to-end
