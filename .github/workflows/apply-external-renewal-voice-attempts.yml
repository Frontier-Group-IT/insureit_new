name: Apply external renewal voice attempts migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260913220500_external_renewal_voice_attempts.sql'
      - 'supabase/migrations/20260913221500_external_renewal_voice_result_projection.sql'
      - 'supabase/migrations/20260913222500_external_renewal_voice_worklist_projection.sql'
      - '.github/workflows/apply-external-renewal-voice-attempts.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply external renewal voice attempts migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260913220500_external_renewal_voice_attempts.sql
          test -f supabase/migrations/20260913221500_external_renewal_voice_result_projection.sql
          test -f supabase/migrations/20260913222500_external_renewal_voice_worklist_projection.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply voice attempt migrations
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/migrations/20260913220500_external_renewal_voice_attempts.sql
          supabase migration repair --linked --status applied 20260913220500
          supabase db query --linked --file supabase/migrations/20260913221500_external_renewal_voice_result_projection.sql
          supabase migration repair --linked --status applied 20260913221500
          supabase db query --linked --file supabase/migrations/20260913222500_external_renewal_voice_worklist_projection.sql
          supabase migration repair --linked --status applied 20260913222500

      - name: Verify voice integration schema contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regclass('public.external_renewal_voice_attempts') is not null as attempt_table_ready,
              to_regclass('public.external_renewal_voice_attempt_events') is not null as event_table_ready,
              to_regprocedure('public.partner_app_start_external_renewal_voice_attempt(uuid)') is not null as start_rpc_ready,
              to_regprocedure('public.partner_app_external_renewal_voice_latest(uuid)') is not null as latest_rpc_ready,
              to_regprocedure('public.partner_app_external_renewal_voice_states(uuid[])') is not null as states_rpc_ready,
              to_regprocedure('public.apply_external_renewal_voice_submission(uuid,text,text,text)') is not null as submission_rpc_ready,
              to_regprocedure('public.fail_external_renewal_voice_submission(uuid,text)') is not null as failure_rpc_ready,
              to_regprocedure('public.apply_external_renewal_voice_result(uuid,text,text,text,text,text,text,text,text,integer,numeric,timestamp with time zone,timestamp with time zone,text,text,boolean,timestamp with time zone,text,text)') is not null as result_rpc_ready,
              has_function_privilege('authenticated','public.partner_app_start_external_renewal_voice_attempt(uuid)','EXECUTE') as partner_start_execute,
              has_function_privilege('authenticated','public.partner_app_external_renewal_voice_latest(uuid)','EXECUTE') as partner_latest_execute,
              has_function_privilege('authenticated','public.partner_app_external_renewal_voice_states(uuid[])','EXECUTE') as partner_states_execute,
              not has_table_privilege('authenticated','public.external_renewal_voice_attempts','SELECT') as no_direct_authenticated_read,
              not has_table_privilege('authenticated','public.external_renewal_voice_attempts','INSERT') as no_direct_authenticated_insert,
              not has_table_privilege('authenticated','public.external_renewal_voice_attempt_events','SELECT') as no_direct_event_read,
              not has_function_privilege('authenticated','public.apply_external_renewal_voice_result(uuid,text,text,text,text,text,text,text,text,integer,numeric,timestamp with time zone,timestamp with time zone,text,text,boolean,timestamp with time zone,text,text)','EXECUTE') as result_rpc_not_authenticated,
              (select count(*) from public.customers) >= 0 as verified_customer_table_untouched,
              (select count(*) from public.vehicles) >= 0 as verified_vehicle_table_untouched,
              (select count(*) from public.policies) >= 0 as verified_policy_table_untouched
          ")
          echo "$result"
          for key in attempt_table_ready event_table_ready start_rpc_ready latest_rpc_ready states_rpc_ready submission_rpc_ready failure_rpc_ready result_rpc_ready partner_start_execute partner_latest_execute partner_states_execute no_direct_authenticated_read no_direct_authenticated_insert no_direct_event_read result_rpc_not_authenticated verified_customer_table_untouched verified_vehicle_table_untouched verified_policy_table_untouched; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
