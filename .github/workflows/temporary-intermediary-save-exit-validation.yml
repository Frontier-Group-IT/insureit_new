name: Temporary intermediary Save and Exit validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'feature/intermediary-save-exit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_INSUREIT_LAUNCH_SCOPE: intermediary

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused Save and Exit changes
        run: python .github/scripts/apply-intermediary-save-exit.py

      - name: Install dependencies
        run: npm ci || (sleep 10 && npm ci)

      - name: Lint web portal
        run: npm run lint:web

      - name: Typecheck web portal
        run: npm run typecheck:web

      - name: Build web portal
        run: npm run build:web

      - name: Commit validated application changes
        run: |
          rm -f .github/workflows/temporary-intermediary-save-exit-validation.yml
          rm -f .github/scripts/apply-intermediary-save-exit.py
          rm -f .github/temporary-save-exit-pr-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web-portal/components/form-submit-button.tsx \
            apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx \
            apps/web-portal/app/customers/posp-misp/new/submit/route.ts \
            apps/web-portal/app/customers/posp-misp/new/legacy-submit/route.ts \
            apps/web-portal/app/customers/applications/posp-misp-application-editor.tsx \
            apps/web-portal/app/customers/applications/intermediary-edit-actions.ts
          git add -u .github
          git commit -m "Add validated Save and Exit actions"
          git push origin HEAD:${{ github.head_ref }}
