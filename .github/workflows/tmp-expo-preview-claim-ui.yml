name: Temporary Expo preview claim UI publish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-expo-preview-claim-ui.yml'

permissions:
  contents: read

jobs:
  publish:
    name: Publish preview EAS Update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo credential is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured"
            exit 1
          fi

      - name: Publish preview EAS Update
        working-directory: apps/mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@18 update --channel preview --environment preview --message "Unify self-managed claims with Sankalp claim UI 2026-08-14" --non-interactive
