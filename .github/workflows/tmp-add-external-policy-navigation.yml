name: Temporary External Policy Navigation Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-add-external-policy-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add external policy navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web-portal/components/claim-manager/app-navigation.tsx')
          s = p.read_text()
          old = '''   {href:"/policies",label:"Policy Register",icon:ShieldCheck,capability:"view_policies"},\n   {href:"/policies/new",label:"Add Policy",icon:Plus,capability:"view_policies",minimumAccess:"edit"}'''
          new = '''   {href:"/policies",label:"Policy Register",icon:ShieldCheck,capability:"view_policies"},\n   {href:"/policies/new",label:"Add Policy",icon:Plus,capability:"view_policies",minimumAccess:"edit"},\n   {href:"/policies/external",label:"External Policies",icon:ShieldCheck,capability:"view_policies"},\n   {href:"/policies/external/new",label:"Add External Policy",icon:Plus,capability:"view_policies",minimumAccess:"edit"}'''
          if old not in s:
              raise SystemExit('Policies navigation block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/claim-manager/app-navigation.tsx
          git commit -m "Add external policies to navigation"
          git push origin HEAD:main
