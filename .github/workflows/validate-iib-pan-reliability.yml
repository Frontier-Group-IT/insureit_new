name: Validate IIB PAN reliability

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/pan-verification-extension/**"
      - "apps/web-portal/app/api/internal/pan-verification/**"
      - "supabase/migrations/*pan_verification*"
      - ".github/workflows/validate-iib-pan-reliability.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      PAN_VERIFICATION_WORKER_KEY: placeholder-worker-key
      NEXT_PUBLIC_INSUREIT_LAUNCH_SCOPE: intermediary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('tools/pan-verification-extension/manifest.json','utf8'))"
      - name: Validate extension JavaScript
        run: |
          node --check tools/pan-verification-extension/service-worker.js
          node --check tools/pan-verification-extension/background.js
          node --check tools/pan-verification-extension/content.js
          node --check tools/pan-verification-extension/popup.js
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Build web portal
        run: npm run build:web
