name: Apply policy business report net premium v5

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260915163500_policy_business_report_net_premium_v5.sql'
      - '.github/workflows/apply-policy-business-report-net-v5.yml'

permissions:
  contents: read

concurrency:
  group: insureit-policy-business-report-net-v5-schema
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply policy business report net premium v5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260915163500_policy_business_report_net_premium_v5.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply report migration
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/migrations/20260915163500_policy_business_report_net_premium_v5.sql
          supabase migration repair --linked --status applied 20260915163500

      - name: Enforce RPC access contract
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked "
            revoke execute on function public.get_policy_business_report_v5(uuid[],date,date,uuid,uuid,text,text,text,integer,integer) from public;
            revoke execute on function public.get_policy_business_report_v5(uuid[],date,date,uuid,uuid,text,text,text,integer,integer) from anon;
            revoke execute on function public.get_policy_business_report_v5(uuid[],date,date,uuid,uuid,text,text,text,integer,integer) from authenticated;
            grant execute on function public.get_policy_business_report_v5(uuid[],date,date,uuid,uuid,text,text,text,integer,integer) to service_role;
          "

      - name: Verify RPC contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.get_policy_business_report_v5(uuid[],date,date,uuid,uuid,text,text,text,integer,integer)') is not null as rpc_ready,
              has_function_privilege('service_role', 'public.get_policy_business_report_v5(uuid[],date,date,uuid,uuid,text,text,text,integer,integer)', 'EXECUTE') as service_role_execute,
              not has_function_privilege('authenticated', 'public.get_policy_business_report_v5(uuid[],date,date,uuid,uuid,text,text,text,integer,integer)', 'EXECUTE') as authenticated_blocked
          ")
          echo "$result"
          echo "$result" | grep -Eq '"rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"service_role_execute"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"authenticated_blocked"[[:space:]]*:[[:space:]]*true'
