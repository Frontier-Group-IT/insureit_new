name: One-time organization dashboard scope fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch organization dashboard scope handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web-portal/lib/operations-dashboard.ts')
          text = path.read_text()
          needle = '      if (customerIds !== null) return getScopedOperationsDashboardData(customerIds);\n    }\n'
          replacement = '      if (customerIds !== null) return getScopedOperationsDashboardData(customerIds);\n\n      // `null` means the effective customer scope is organization-wide. Do not\n      // fall back to the caller\'s RLS session here: hierarchy roles can receive\n      // an organization override even when their base database role remains scoped.\n      const organizationRpcResult = await admin.rpc("get_operations_dashboard");\n      const organizationDashboard = normalizeRpcDashboard(organizationRpcResult.data);\n      if (!organizationRpcResult.error && organizationDashboard) return organizationDashboard;\n\n      const organizationWarning = organizationRpcResult.error && !isMissingDashboardRpc(organizationRpcResult.error)\n        ? "The optimized organization dashboard service is unavailable; live fallback data is shown."\n        : !organizationRpcResult.error\n          ? "The optimized organization dashboard service returned an invalid response; live fallback data is shown."\n          : null;\n      return getOperationsDashboardFallback(admin, organizationWarning);\n    }\n'
          if needle in text and 'organizationRpcResult' not in text:
              path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Install web dependencies
        working-directory: apps/web-portal
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web-portal
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web-portal
        run: npm run lint
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-portal/lib/operations-dashboard.ts
          if git diff --cached --quiet; then
            echo 'Dashboard scope fix already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'Fix organization-scoped dashboard totals'
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
