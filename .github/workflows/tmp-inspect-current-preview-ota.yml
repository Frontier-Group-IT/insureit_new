name: Inspect current preview OTA

on:
  push:
    branches:
      - release/mobile-v0.2-current

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect current preview OTA'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/mobile-v0.2-current
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: List preview updates
        working-directory: apps/mobile-app
        run: npx eas-cli update:list --branch preview --limit 10 --non-interactive
