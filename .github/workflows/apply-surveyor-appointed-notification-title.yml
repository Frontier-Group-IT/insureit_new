name: Apply surveyor appointed notification title

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260907200000_surveyor_appointed_notification_title.sql'
      - '.github/workflows/apply-surveyor-appointed-notification-title.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply surveyor appointed notification title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260907200000_surveyor_appointed_notification_title.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply notification title migration
        run: supabase db query --linked --file supabase/migrations/20260907200000_surveyor_appointed_notification_title.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260907200000

      - name: Verify surveyor notification title behavior
        shell: bash
        run: |
          set -euo pipefail
          function_result=$(supabase db query --linked --output-format json "
            select
              pg_get_functiondef('public.create_claim_status_notifications'::regproc) like '%Surveyor Appointed%' as appointed_ready,
              pg_get_functiondef('public.create_claim_status_notifications'::regproc) like '%Surveyor Updated%' as updated_ready
          ")
          echo "$function_result"
          echo "$function_result" | grep -Eq '"appointed_ready"[[:space:]]*:[[:space:]]*true'
          echo "$function_result" | grep -Eq '"updated_ready"[[:space:]]*:[[:space:]]*true'

          stale_result=$(supabase db query --linked --output-format json "
            select
              count(*) filter (
                where message ~* '^Surveyor details[[:space:]]*[—-]'
                  and title ~* 'Initial Documents Submitted[[:space:]]+to[[:space:]]+Final Documents Awaited$'
              )::int as stale_appointments,
              count(*) filter (
                where message ~* '^Spot surveyor details updated[[:space:]]*[—-]'
                  and title ~* 'Final Documents Awaited$'
              )::int as stale_updates
            from public.notifications
          ")
          echo "$stale_result"
          echo "$stale_result" | grep -Eq '"stale_appointments"[[:space:]]*:[[:space:]]*0'
          echo "$stale_result" | grep -Eq '"stale_updates"[[:space:]]*:[[:space:]]*0'
