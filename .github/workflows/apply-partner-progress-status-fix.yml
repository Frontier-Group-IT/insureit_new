name: Apply partner progress status fix
on:
  push:
    branches:
      - fix/partner-progress-status-logic-20260805
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-progress-status-logic-20260805
      - name: Apply focused changes
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx')
          text = workflow.read_text()
          text = text.replace(
              'import { resolveIibPanVerificationStatus, type IibPanVerificationJob } from "@/lib/iib-pan-verification-status";\n',
              'import { resolveIibPanVerificationStatus, type IibPanVerificationJob } from "@/lib/iib-pan-verification-status";\nimport { buildIntermediaryDocumentSlots, findDocumentForSlot } from "@/lib/intermediary-document-slots";\n',
          )
          text = text.replace(
              '  const docList = (documents ?? []).map((item) => ({ document_type: item.document_type, file_name: item.file_name }));\n',
              '  const docList = (documents ?? []).map((item) => ({ document_type: item.document_type, file_name: item.file_name }));\n  const primaryDetailsComplete = profile.workflow_stage !== "pre_iib";\n  const partnerDocumentsComplete = buildIntermediaryDocumentSlots({ legacy: false, hasGst: Boolean(profile.gst_number) })\n    .filter((slot) => slot.required)\n    .every((slot) => Boolean(findDocumentForSlot(slot, docList)));\n',
          )
          text = text.replace(
              '<PartnerTwoStepNavigation applicationId={id} viewStage={viewStage} documentsComplete={showDocuments} partnerActive={application.partner_status === "active_partner"} />',
              '<PartnerTwoStepNavigation applicationId={id} viewStage={viewStage} primaryDetailsComplete={primaryDetailsComplete} documentsComplete={partnerDocumentsComplete} partnerActive={application.partner_status === "active_partner"} />',
          )
          old = 'function PartnerTwoStepNavigation({ applicationId, viewStage, documentsComplete, partnerActive }: { applicationId: string; viewStage: ViewStage; documentsComplete: boolean; partnerActive: boolean }) {'
          new = 'function PartnerTwoStepNavigation({ applicationId, viewStage, primaryDetailsComplete, documentsComplete, partnerActive }: { applicationId: string; viewStage: ViewStage; primaryDetailsComplete: boolean; documentsComplete: boolean; partnerActive: boolean }) {'
          text = text.replace(old, new)
          text = text.replace(
              '          const completed = partnerActive || number < current || (number === 1 && current > 1) || (number === 2 && documentsComplete);\n          const active = number === current && !completed;',
              '          const completed = partnerActive || (number === 1 ? primaryDetailsComplete : documentsComplete);\n          const active = number === current && !completed;',
          )
          text = text.replace(
              '{completed ? "Completed" : active ? "Current" : "Upcoming"}',
              '{completed ? "Completed" : "Pending"}',
              1,
          )
          workflow.write_text(text)

          review = Path('apps/web-portal/app/intermediaries/applications/[id]/page.tsx')
          text = review.read_text()
          text = text.replace(
              'import { createSupabaseAdminClient } from "@/lib/supabase-admin";\n',
              'import { createSupabaseAdminClient } from "@/lib/supabase-admin";\nimport { buildIntermediaryDocumentSlots, findDocumentForSlot } from "@/lib/intermediary-document-slots";\n',
          )
          old = 'function partnerJourney(profile: Profile, docs: Document[], activePartner: boolean): JourneyItem[] { const primary = profile.workflow_stage !== "pre_iib" || Boolean(profile.partner_id); const types = new Set(docs.map((item) => item.document_type)); const complete = activePartner || ["aadhaar_front", "pan_copy", "cancelled_cheque"].every((type) => types.has(type)); return [{ label: "Primary details", done: primary, active: !primary }, { label: "Partner documents", done: complete, active: primary && !complete }]; }'
          new = 'function partnerJourney(profile: Profile, docs: Document[], activePartner: boolean): JourneyItem[] { const primary = profile.workflow_stage !== "pre_iib"; const complete = activePartner || buildIntermediaryDocumentSlots({ legacy: false, hasGst: Boolean(profile.gst_number) }).filter((slot) => slot.required).every((slot) => Boolean(findDocumentForSlot(slot, docs))); return [{ label: "Primary details", done: primary, active: !primary }, { label: "Partner documents", done: complete, active: primary && !complete }]; }'
          if old not in text:
              raise SystemExit('partnerJourney target not found')
          text = text.replace(old, new)
          text = text.replace('  const detailedStatus = journey.length === 6;', '  const detailedStatus = true;')
          review.write_text(text)
          PY
      - name: Verify focused assertions
        run: |
          grep -q 'primaryDetailsComplete={primaryDetailsComplete}' 'apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx'
          grep -q 'completed ? "Completed" : "Pending"' 'apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx'
          grep -q 'buildIntermediaryDocumentSlots({ legacy: false, hasGst: Boolean(profile.gst_number) })' 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
          grep -q 'const detailedStatus = true' 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
      - name: Commit focused fix
        run: |
          rm .github/workflows/apply-partner-progress-status-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx' 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx' .github/workflows/apply-partner-progress-status-fix.yml
          git commit -m 'Fix Partner progress completion status logic'
          git push
