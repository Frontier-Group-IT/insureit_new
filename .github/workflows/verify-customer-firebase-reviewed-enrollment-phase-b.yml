name: Verify Customer Firebase reviewed enrollment Phase B
on:
  push:
    branches:
      - feat/customer-firebase-reviewed-enrollment-phase-b-20261017
    paths:
      - 'supabase/functions/_shared/customer-firebase-reviewed-enrollment.mjs'
      - 'supabase/migrations/20261017120000_customer_firebase_operator_review_and_collisions.sql'
      - 'supabase/rollback/20261017120000_customer_firebase_operator_review_and_collisions_down.sql'
      - 'apps/mobile-app/scripts/customer-firebase-reviewed-enrollment*'
      - '.github/workflows/verify-customer-firebase-reviewed-enrollment-phase-b.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/customer-firebase-reviewed-enrollment.mjs'
      - 'supabase/migrations/20261017120000_customer_firebase_operator_review_and_collisions.sql'
      - 'supabase/rollback/20261017120000_customer_firebase_operator_review_and_collisions_down.sql'
      - 'apps/mobile-app/scripts/customer-firebase-reviewed-enrollment*'
      - '.github/workflows/verify-customer-firebase-reviewed-enrollment-phase-b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-review-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: review_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d review_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      REVIEW_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/review_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sandbox-only module and synthetic test syntax
        run: |
          node --check supabase/functions/_shared/customer-firebase-reviewed-enrollment.mjs
          node --check apps/mobile-app/scripts/customer-firebase-reviewed-enrollment.test.mjs
          bash -n apps/mobile-app/scripts/customer-firebase-reviewed-enrollment-sql-local.sh
      - name: Test verified operator session, revoked Firebase tokens, shared numbers and no writes
        run: |
          node --test apps/mobile-app/scripts/customer-firebase-reviewed-enrollment.test.mjs
          node --test apps/mobile-app/scripts/customer-firebase-general-rollout.test.mjs
          node --test apps/mobile-app/scripts/customer-firebase-enrollment-service.test.mjs
      - name: Rehearse restricted SQL, second reviewer and data-preserving rollback on local PostgreSQL
        run: bash apps/mobile-app/scripts/customer-firebase-reviewed-enrollment-sql-local.sh
      - name: Refuse credential changes, Deno endpoints or service writes in the reviewed resolver
        run: |
          if grep -Ei 'Deno\.serve\(|\.insert\(|\.update\(|\.upsert\(|updateUserById\(|createUser\(|\.rpc\(.customer_firebase_enroll_approved' \
            supabase/functions/_shared/customer-firebase-reviewed-enrollment.mjs; then
            echo 'Reviewed enrollment resolver must remain source-only and read-only.' >&2
            exit 1
          fi
