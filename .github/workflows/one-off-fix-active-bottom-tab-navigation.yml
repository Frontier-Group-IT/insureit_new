name: One-off fix active bottom tab navigation

on:
  push:
    branches:
      - fix/external-claim-all-stage-error-popups
    paths:
      - '.github/workflows/one-off-fix-active-bottom-tab-navigation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/external-claim-all-stage-error-popups
          fetch-depth: 0

      - name: Prevent navigation when already on the exact tab destination
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile-app/components/ui.tsx')
          text = path.read_text()
          old = '''            <Pressable key={`${tab.href}-${tab.label}`} accessibilityRole="button" onPress={() => router.push(tab.href as LinkProps['href'])} style={styles.bottomTab}>'''
          new = '''            <Pressable
              key={`${tab.href}-${tab.label}`}
              accessibilityRole="button"
              accessibilityState={{ selected: active }}
              onPress={() => {
                if (pathname === tab.href) return;
                router.push(tab.href as LinkProps['href']);
              }}
              style={styles.bottomTab}
            >'''
          if old not in text:
              raise SystemExit('Expected bottom-tab Pressable was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-off workflow from branch
        run: rm .github/workflows/one-off-fix-active-bottom-tab-navigation.yml

      - name: Commit navigation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/components/ui.tsx .github/workflows/one-off-fix-active-bottom-tab-navigation.yml
          git commit -m "Avoid reloading current bottom tab route"
          git push origin HEAD:fix/external-claim-all-stage-error-popups
