name: Temporary refine policy summary sidebar

on:
  push:
    paths:
      - scripts/temp_refine_policy_summary_sidebar.py
      - .github/workflows/temp-refine-policy-summary-sidebar.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply policy summary sidebar refinement
        run: python scripts/temp_refine_policy_summary_sidebar.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -Fq 'Policy status' apps/web-portal/components/policy-unified-form.tsx
          grep -Fq 'Onboarding summary' apps/web-portal/components/policy-unified-form.tsx
          grep -Fq 'function CompletionRing' apps/web-portal/components/policy-unified-form.tsx
          grep -Fq 'Financial summary' apps/web-portal/components/policy-unified-form.tsx
          ! grep -Fq 'Live summary' apps/web-portal/components/policy-unified-form.tsx
          ! grep -Fq 'Policy Financials' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Refine policy financial summary sidebar"
            git pull --rebase origin main
            git push origin main
          fi
