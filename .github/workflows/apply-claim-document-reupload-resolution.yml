name: Apply claim document reupload resolution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260908050000_resolve_claim_document_reupload_events.sql'
      - '.github/workflows/apply-claim-document-reupload-resolution.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply claim document reupload resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260908050000_resolve_claim_document_reupload_events.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply reupload resolution migration
        run: supabase db query --linked --file supabase/migrations/20260908050000_resolve_claim_document_reupload_events.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260908050000

      - name: Verify reupload resolution behavior
        shell: bash
        run: |
          set -euo pipefail
          function_result=$(supabase db query --linked --output-format json "
            select
              pg_get_functiondef('public.capture_claim_document_customer_activity'::regproc) like '%claim_document_reupload_resolved%' as capture_ready,
              pg_get_constraintdef(oid) like '%claim_document_reupload_resolved%' as constraint_ready
            from pg_constraint
            where conrelid = 'public.customer_activity_events'::regclass
              and conname = 'customer_activity_events_event_type_check'
          ")
          echo "$function_result"
          echo "$function_result" | grep -Eq '"capture_ready"[[:space:]]*:[[:space:]]*true'
          echo "$function_result" | grep -Eq '"constraint_ready"[[:space:]]*:[[:space:]]*true'

          stale_result=$(supabase db query --linked --output-format json "
            select count(*)::int as stale_replacement_events
            from public.customer_activity_events
            where event_type = 'claim_document_reuploaded'
              and (
                title = 'Replacement document received'
                or lower(coalesce(metadata ->> 'was_reupload', 'false')) = 'true'
              )
          ")
          echo "$stale_result"
          echo "$stale_result" | grep -Eq '"stale_replacement_events"[[:space:]]*:[[:space:]]*0'
