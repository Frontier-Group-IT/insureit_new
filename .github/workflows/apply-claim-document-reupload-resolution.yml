name: Apply claim document reupload resolution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260908050000_resolve_claim_document_reupload_events.sql'
      - '.github/workflows/apply-claim-document-reupload-resolution.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply claim document reupload resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260908050000_resolve_claim_document_reupload_events.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply reupload resolution migration
        run: supabase db query --linked --file supabase/migrations/20260908050000_resolve_claim_document_reupload_events.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260908050000

      - name: Verify reupload resolution behavior
        shell: bash
        run: |
          set -euo pipefail
          function_result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.resolve_claim_document_reupload_events()') is not null as function_ready,
              exists (
                select 1
                from pg_trigger
                where tgname = 'resolve_claim_document_reupload_events'
                  and not tgisinternal
              ) as trigger_ready
          ")
          echo "$function_result"
          echo "$function_result" | grep -Eq '"function_ready"[[:space:]]*:[[:space:]]*true'
          echo "$function_result" | grep -Eq '"trigger_ready"[[:space:]]*:[[:space:]]*true'
