name: Verify Customer Firebase OTP Readiness
on:
  push:
    branches:
      - feature/customer-firebase-otp-gateway-0-3-2-20261014
    paths:
      - 'apps/mobile-app/**'
      - 'supabase/functions/customer-firebase-*/**'
      - 'supabase/functions/_shared/customer-firebase-*.mjs'
      - 'package-lock.json'
      - '.github/workflows/verify-customer-firebase-otp.yml'
  pull_request:
    paths:
      - 'apps/mobile-app/lib/firebase-*'
      - 'apps/mobile-app/lib/customer-otp-provider.ts'
      - 'apps/mobile-app/app/firebase-otp-test.tsx'
      - 'pocs/customer-firebase-auth/**'
      - 'supabase/functions/customer-firebase-*/**'
      - 'supabase/functions/_shared/customer-firebase-session-policy.mjs'
      - 'apps/mobile-app/scripts/customer-firebase-session-bridge-policy.test.mjs'
      - 'apps/mobile-app/scripts/customer-firebase-bind-policy.test.mjs'
      - 'supabase/functions/_shared/customer-firebase-bind-policy.mjs'
      - 'supabase/migrations/20261014130000_customer_firebase_session_exchange_limit.sql'
      - 'apps/mobile-app/scripts/customer-firebase-session-exchange-regression.mjs'
      - 'apps/mobile-app/scripts/customer-firebase-session-challenge.test.mjs'
      - 'supabase/functions/_shared/customer-firebase-session-challenge.mjs'
      - 'apps/mobile-app/lib/customer-firebase-session-exchange.ts'
      - '.github/workflows/verify-customer-firebase-otp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Firebase OTP-only Supabase session gate (always runs)
        run: node --test apps/mobile-app/scripts/customer-firebase-session-bridge-policy.test.mjs apps/mobile-app/scripts/customer-firebase-session-exchange-regression.mjs apps/mobile-app/scripts/customer-firebase-session-challenge.test.mjs apps/mobile-app/scripts/customer-firebase-bind-policy.test.mjs apps/mobile-app/scripts/customer-firebase-session-provision.test.mjs
      - name: Verify Firebase test suite when feature branch is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f pocs/customer-firebase-auth/edge-binding-source.test.cjs ]]; then
            echo "Firebase-specific source tests are not yet on this branch."
            exit 0
          fi
          npm ci --ignore-scripts
          node --test             apps/mobile-app/lib/firebase-otp-readiness.test.cjs             apps/mobile-app/lib/firebase-native-phone-flow.test.cjs             apps/mobile-app/lib/firebase-data-client.test.cjs             pocs/customer-firebase-auth/sql-draft.test.cjs             pocs/customer-firebase-auth/server-identity-binding.test.cjs             pocs/customer-firebase-auth/firebase-admin-verifier.test.cjs             pocs/customer-firebase-auth/firebase-binding-backend.test.cjs             pocs/customer-firebase-auth/supabase-identity-store.test.cjs             pocs/customer-firebase-auth/android-config.test.cjs             pocs/customer-firebase-auth/edge-binding-source.test.cjs             pocs/customer-firebase-auth/auth-uid-compatibility.test.cjs             pocs/customer-firebase-auth/signup-edge-source.test.cjs             pocs/customer-firebase-auth/doc-read-edge-source.test.cjs             pocs/customer-firebase-auth/mobile-document-client-source.test.cjs             apps/mobile-app/lib/firebase-android-auth-adapter.test.cjs
          node --check pocs/customer-firebase-auth/staging-customer-isolation.mjs


  production-fail-closed-smoke:
    name: Production Edge fail-closed smoke (no credentials or writes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify disabled bridge and unauthenticated bind from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          base = 'https://ilzhsfqqjyppzzvfscmh.supabase.co/functions/v1/'
          checks = [
            ('customer-firebase-session-bridge', 503, 'session_bridge_disabled'),
            ('customer-firebase-bind', 401, 'invalid_token'),
          ]
          for name, expected_status, expected_code in checks:
              # No Authorization header, Firebase token, Supabase key, OTP,
              # customer identifier, or user payload is used. No DB writes.
              request = Request(base + name, data=b'{}', method='POST',
                                headers={'Content-Type': 'application/json'})
              try:
                  with urlopen(request, timeout=20) as response:
                      status = response.status
                      body = response.read(1024)
              except HTTPError as exc:
                  status = exc.code
                  body = exc.read(1024)
              try:
                  code = json.loads(body).get('code') or json.loads(body).get('error')
              except (ValueError, AttributeError):
                  code = '<invalid-json>'
              assert status == expected_status and code == expected_code, (
                  f'{name}: expected {expected_status}/{expected_code}, '
                  f'received {status}/{code}')
              print(f'{name}: expected fail-closed {status}/{code} verified')
          PY
