name: Apply Partner onboarding document staging migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20261114170000_partner_onboarding_document_staging.sql'
      - '.github/workflows/apply-partner-onboarding-document-staging.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Verify and record Partner onboarding document staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify main and configuration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply idempotent staging table and permissions
        run: supabase db query --remote --yes --file supabase/migrations/20261114170000_partner_onboarding_document_staging.sql
      - name: Record migration file version
        run: supabase migration repair --remote --yes --status applied 20261114170000
      - name: Verify staging table, row-level security and scope
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --remote --read-only --output-format json "
            select
              to_regclass('public.policy_intake_onboarding_documents') is not null as table_ready,
              (select relrowsecurity from pg_class where oid = 'public.policy_intake_onboarding_documents'::regclass) as rls_enabled,
              not has_table_privilege('authenticated','public.policy_intake_onboarding_documents','SELECT') as no_client_read,
              not has_table_privilege('authenticated','public.policy_intake_onboarding_documents','INSERT') as no_client_insert,
              has_table_privilege('service_role','public.policy_intake_onboarding_documents','INSERT') as service_role_insert
          ")
          echo "$result"
          for key in table_ready rls_enabled no_client_read no_client_insert service_role_insert; do
            grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true" <<<"$result"
          done
