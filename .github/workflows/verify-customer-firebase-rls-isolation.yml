name: Verify Firebase Customer A-B isolation in disposable PostgreSQL
on:
  push:
    branches:
      - feat/customer-firebase-rls-session-isolation-20261017
    paths:
      - 'supabase/migrations/20261017180000_customer_firebase_supabase_session_rls_helper.sql'
      - 'supabase/rollback/20261017180000_customer_firebase_supabase_session_rls_helper_down.sql'
      - 'apps/mobile-app/scripts/customer-firebase-rls-session-local.sh'
      - '.github/workflows/verify-customer-firebase-rls-isolation.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20261017180000_customer_firebase_supabase_session_rls_helper.sql'
      - 'supabase/rollback/20261017180000_customer_firebase_supabase_session_rls_helper_down.sql'
      - 'apps/mobile-app/scripts/customer-firebase-rls-session-local.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-rls-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rls_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rls_fixture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      RLS_TEST_DATABASE_URL: postgresql://postgres:disposable-only@127.0.0.1:5432/rls_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Assert source-only contract test uses loopback and has no app-deploy steps
        shell: bash
        run: |
          bash -n apps/mobile-app/scripts/customer-firebase-rls-session-local.sh
          grep -q 'Refusing non-loopback target' apps/mobile-app/scripts/customer-firebase-rls-session-local.sh
          if grep -Ei 'supabase db push|eas update|eas build|alter role .*superuser' \
             apps/mobile-app/scripts/customer-firebase-rls-session-local.sh; then
            echo 'Unexpected deployment or privilege modification in RLS fixture' >&2
            exit 1
          fi
      - name: Prove A-B scope and staff-denial with synthetic Customer RLS
        run: bash apps/mobile-app/scripts/customer-firebase-rls-session-local.sh
