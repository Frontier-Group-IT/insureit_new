name: Apply Motor FLAT partner payout migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260921103000_motor_flat_partner_payout.sql'
      - '.github/workflows/apply-motor-flat-partner-payout.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Motor FLAT partner payout migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260921103000_motor_flat_partner_payout.sql
          test -f supabase/rollbacks/20260921103000_motor_flat_partner_payout.sql
          test -f supabase/verification/20260921_motor_flat_partner_payout_verify.sql
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Ensure Motor FLAT payout migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260921103000'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already applied."
          else
            supabase db query --linked --file supabase/migrations/20260921103000_motor_flat_partner_payout.sql
            supabase migration repair --linked --status applied 20260921103000
          fi
      - name: Verify Motor FLAT payout support
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/verification/20260921_motor_flat_partner_payout_verify.sql
