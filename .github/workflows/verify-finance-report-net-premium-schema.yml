name: Verify Finance report net premium schema

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-finance-report-net-premium-schema.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Finance report net premium schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260912152000_finance_report_net_premium.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify recorded migration version
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select version, name
            from supabase_migrations.schema_migrations
            where version = '20260912152000'
              and name = 'finance_report_net_premium';
          ")
          echo "$result"
          echo "$result" | grep -q '20260912152000'
          echo "$result" | grep -q 'finance_report_net_premium'

      - name: Verify Finance report RPC contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.get_finance_report_v3(uuid[],date,date,uuid,uuid,text,text,text,text,integer,integer)') is not null as rpc_ready,
              position('ppd.net_premium' in pg_get_functiondef(to_regprocedure('public.get_finance_report_v3(uuid[],date,date,uuid,uuid,text,text,text,text,integer,integer)'))) > 0 as net_premium_source_ready,
              position('''net_premium''' in pg_get_functiondef(to_regprocedure('public.get_finance_report_v3(uuid[],date,date,uuid,uuid,text,text,text,text,integer,integer)'))) > 0 as net_premium_summary_ready;
          ")
          echo "$result"
          for key in rpc_ready net_premium_source_ready net_premium_summary_ready; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
