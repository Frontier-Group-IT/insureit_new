name: Apply external renewal interaction migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260906210000_external_renewal_interaction_tracking.sql'
      - '.github/workflows/apply-external-renewal-interactions.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply external renewal interaction migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260906210000_external_renewal_interaction_tracking.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply external renewal interaction migration
        run: supabase db query --linked --file supabase/migrations/20260906210000_external_renewal_interaction_tracking.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260906210000

      - name: Verify isolated interaction schema
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regclass('public.external_renewal_interactions') is not null as interaction_table_ready,
              to_regprocedure('public.partner_app_external_renewal_detail(uuid)') is not null as detail_rpc_ready,
              to_regprocedure('public.partner_app_record_external_renewal_interaction(uuid,text,text,text,timestamp with time zone)') is not null as record_rpc_ready,
              has_function_privilege('authenticated','public.partner_app_external_renewal_detail(uuid)','EXECUTE') as detail_execute,
              has_function_privilege('authenticated','public.partner_app_record_external_renewal_interaction(uuid,text,text,text,timestamp with time zone)','EXECUTE') as record_execute,
              not has_table_privilege('authenticated','public.external_renewal_interactions','SELECT') as no_direct_authenticated_read,
              (select count(*) from public.customers) >= 0 as verified_customer_table_untouched,
              (select count(*) from public.vehicles) >= 0 as verified_vehicle_table_untouched,
              (select count(*) from public.policies) >= 0 as verified_policy_table_untouched
          ")
          echo "$result"
          for key in interaction_table_ready detail_rpc_ready record_rpc_ready detail_execute record_execute no_direct_authenticated_read verified_customer_table_untouched verified_vehicle_table_untouched verified_policy_table_untouched; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
