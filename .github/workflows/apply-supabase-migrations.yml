name: Apply Supabase migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::Repository secret SUPABASE_DB_PASSWORD is not configured."
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "::error::Repository variable SUPABASE_PROJECT_REF is not configured."
            exit 1
          }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect migration history
        run: supabase migration list

      - name: Apply OCR training label foundation
        run: supabase db query --linked --file supabase/migrations/202608210001_policy_ocr_training_labels.sql

      - name: Record OCR training label foundation as applied
        run: supabase migration repair --linked --status applied 202608210001

      - name: Apply OCR queue and backlog migration
        run: supabase db query --linked --file supabase/migrations/20260821153000_premium_ocr_training_workflow.sql

      - name: Record OCR queue and backlog migration as applied
        run: supabase migration repair --linked --status applied 20260821153000

      - name: Apply canonical NEW vehicle identity migration
        run: supabase db query --linked --file supabase/migrations/20260821194052_canonical_new_vehicle_prefix.sql

      - name: Record canonical NEW vehicle identity migration as applied
        run: supabase migration repair --linked --status applied 20260821194052

      - name: Apply OCR backlog linking migration
        run: supabase db query --linked --file supabase/migrations/20260821220000_link_legacy_policy_copies_to_ocr.sql

      - name: Record OCR backlog linking migration as applied
        run: supabase migration repair --linked --status applied 20260821220000

      - name: Verify OCR training tables
        run: |
          result=$(supabase db query --linked --output-format json "select to_regclass('public.policy_ocr_training_labels') as table_name")
          echo "$result" | grep -q "policy_ocr_training_labels"
          legacy_result=$(supabase db query --linked --output-format json "select to_regclass('public.customer_documents') as table_name")
          echo "$legacy_result" | grep -q "customer_documents"

      - name: Report OCR queue counts
        run: |
          supabase db query --linked --output-format json "
            select
              (select count(*) from public.policy_documents where document_type = 'policy_copy') as policy_copy_documents,
              (select count(*) from public.policy_ocr_training_labels) as queue_labels,
              (select count(*) from public.policy_ocr_training_labels where processing_status = 'pending') as pending_jobs,
              (select count(*) from public.policy_ocr_training_labels where processing_status = 'ready') as ready_jobs,
              (select count(*) from public.policy_ocr_training_labels where processing_status = 'exhausted') as exhausted_jobs
          "

      - name: Verify canonical NEW vehicle identities
        run: |
          supabase db query --linked --output-format json "
            select
              count(*) filter (where registration_status = 'registration_pending') as registration_pending,
              count(*) filter (where registration_status = 'registration_pending' and vehicle_no like 'NEW-%') as canonical_new,
              count(*) filter (where vehicle_no like 'PENDING-%') as legacy_pending_prefix,
              count(*) filter (
                where registration_status = 'registration_pending'
                  and vehicle_no is distinct from 'NEW-' || regexp_replace(upper(chassis_no), '[^A-Z0-9]', '', 'g')
              ) as canonical_mismatch
            from public.vehicles
          " | tee new-vehicle-verification.json
          grep -Eq '"legacy_pending_prefix"[[:space:]]*:[[:space:]]*0' new-vehicle-verification.json
          grep -Eq '"canonical_mismatch"[[:space:]]*:[[:space:]]*0' new-vehicle-verification.json
