name: Validate compact intermediary registers

on:
  push:
    branches:
      - feature/compact-intermediary-registers

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-intermediary-registers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/redesign_compact_registers.py
      - run: python .github/scripts/fix_compact_register_typecheck.py
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/intermediaries/structured-account-register.tsx apps/web-portal/app/intermediaries/intermediary-register.tsx
          git commit -m "Redesign intermediary registers for compact operations"
          git push origin HEAD:feature/compact-intermediary-registers
