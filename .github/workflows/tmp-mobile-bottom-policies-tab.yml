name: Temporary Mobile Bottom Policies Tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mobile-bottom-policies-tab.yml'

permissions:
  contents: write

jobs:
  patch-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-public-anon-key' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Replace Claims tab with Policies
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/mobile-app/components/ui.tsx')
          s = p.read_text()
          old = "    { label: 'Claims', href: '/customer/claims', icon: 'file-document-check-outline', ...customerTone },"
          new = "    { label: 'Policies', href: '/customer/policies', icon: 'file-document-outline', ...customerTone },"
          if old not in s:
              raise SystemExit('individual customer Claims tab target not found')
          p.write_text(s.replace(old, new, 1))
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify mobile
        run: |
          npm run typecheck:mobile
          npm run lint:mobile
          npm run build:mobile:web
      - name: Commit tab change
        run: |
          git config user.name "antnish1"
          git config user.email "shahdolho@gmail.com"
          git add apps/mobile-app/components/ui.tsx
          git diff --cached --check
          git commit -m "Replace customer Claims tab with Policies"
          git push origin HEAD:main
      - name: Verify Expo credential
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@18 whoami --non-interactive
        working-directory: apps/mobile-app
      - name: Publish bottom navigation update to preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@18 update --channel preview --environment preview --message "Replace customer Claims tab with Policies 2026-08-14" --non-interactive
        working-directory: apps/mobile-app
