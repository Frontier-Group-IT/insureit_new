name: Temporary policy type placeholders

on:
  push:
    paths:
      - scripts/temp_policy_type_placeholders.py
      - .github/workflows/temp-policy-type-placeholders.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply policy type placeholder patch
        run: python scripts/temp_policy_type_placeholders.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -Fq 'const policyTypeOptions=["Motor","Health","Life","Travel","Personal Accident","Fire","Marine","Engineering","Liability","Cyber","Property","Agriculture / Crop","Other / Miscellaneous"]' apps/web-portal/components/policy-unified-form.tsx
          grep -Fq 'Onboarding page for this Policy type is still in development.' apps/web-portal/components/policy-unified-form.tsx
          grep -Fq 'options={policyTypeOptions}' apps/web-portal/components/policy-unified-form.tsx
          grep -Fq 'isMotorPolicy?<LiveSummary' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Add placeholder policy type onboarding states"
            git pull --rebase origin main
            git push origin main
          fi
