name: Temporary compact policy vehicle section

on:
  push:
    paths:
      - scripts/temp_compact_policy_vehicle_section.py
      - .github/workflows/temp-compact-policy-vehicle-section.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Section 02 layout patch
        run: python scripts/temp_compact_policy_vehicle_section.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'label="Capacity"' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'label="Classification"' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'Fetch RC' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'grid-cols-\[\.9fr_1\.1fr\]' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Compact policy vehicle identification section"
            git pull --rebase origin main
            git push origin main
          fi
