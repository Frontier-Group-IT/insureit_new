name: Temporary clean edit policy header

on:
  push:
    paths:
      - scripts/temp_clean_edit_policy_header.py
      - .github/workflows/temp-clean-edit-policy-header.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply edit policy header cleanup
        run: python scripts/temp_clean_edit_policy_header.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          ! grep -Fq 'Existing policy' apps/web-portal/components/policy-unified-form.tsx
          ! grep -Fq 'prototype_v1 calculations' apps/web-portal/components/policy-unified-form.tsx
          ! grep -Fq 'Update policy and financial details while preserving the linked customer and vehicle master records.' apps/web-portal/components/policy-unified-form.tsx
          grep -Fq 'const headerTitle=isEdit?"Edit Policy":"Policy Onboarding";' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Simplify edit policy header"
            git pull --rebase origin main
            git push origin main
          fi
