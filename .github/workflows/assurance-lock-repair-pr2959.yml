name: One-time dependency lock repair PR 2959

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'package.json'
      - 'apps/web-portal/package.json'
      - '.github/workflows/assurance-lock-repair-pr2959.yml'

permissions:
  contents: write

jobs:
  repair-lock:
    if: >-
      github.event.pull_request.number == 2959 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/assurance-critical-dependencies-2026-10-08'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: security/assurance-critical-dependencies-2026-10-08
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Deduplicate compatible packages in npm lockfile
        run: npm dedupe --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependency versions and reproducible install
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const p = require('./package-lock.json').packages;
          for (const [path, meta] of Object.entries(p)) {
            if (/(^|\/)node_modules\/next$/.test(path) && meta.version !== '15.5.27') throw new Error('Unpatched Next version: ' + path + ' ' + meta.version);
            if (/(^|\/)node_modules\/shell-quote$/.test(path) && meta.version !== '1.11.0') throw new Error('Unpatched shell-quote version: ' + path + ' ' + meta.version);
          }
          if (p['node_modules/next']?.version !== '15.5.27') throw new Error('Expected Next 15.5.27 at root');
          if (p['node_modules/shell-quote']?.version !== '1.11.0') throw new Error('Expected shell-quote 1.11.0 at root');
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all > /tmp/assurance-lock-tree.txt
      - name: Commit only package-lock.json on review branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'security: synchronize verified npm lockfile for critical patches' --only package-lock.json
          git push origin HEAD:refs/heads/security/assurance-critical-dependencies-2026-10-08
