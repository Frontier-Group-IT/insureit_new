name: Apply vehicle full customer transfer migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260924163000_vehicle_full_customer_transfer.sql'
      - '.github/workflows/apply-vehicle-full-customer-transfer.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply vehicle full customer transfer migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260924163000_vehicle_full_customer_transfer.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260924163000'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260924163000_vehicle_full_customer_transfer.sql
            supabase migration repair --linked --status applied 20260924163000
          fi

      - name: Verify transfer contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.transfer_vehicle_customer_v1(uuid,uuid,date,text,uuid)') is not null as rpc_ready,
              has_function_privilege('service_role','public.transfer_vehicle_customer_v1(uuid,uuid,date,text,uuid)','EXECUTE') as service_role_can_execute,
              not has_function_privilege('authenticated','public.transfer_vehicle_customer_v1(uuid,uuid,date,text,uuid)','EXECUTE') as authenticated_blocked,
              position('vehicle_ownership_history' in pg_get_functiondef('public.transfer_vehicle_customer_v1(uuid,uuid,date,text,uuid)'::regprocedure)) > 0 as ownership_history_guard,
              position('vehicle_customer_transferred' in pg_get_functiondef('public.transfer_vehicle_customer_v1(uuid,uuid,date,text,uuid)'::regprocedure)) > 0 as audit_guard;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"service_role_can_execute"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"authenticated_blocked"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"ownership_history_guard"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"audit_guard"[[:space:]]*:[[:space:]]*true'
