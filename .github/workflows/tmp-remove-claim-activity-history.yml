name: Temporary remove customer claim activity history

on:
  push:
    branches:
      - feat/self-managed-stage-navigation
    paths:
      - .github/workflows/tmp-remove-claim-activity-history.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/self-managed-stage-navigation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Remove Activity History from customer Claim Tracker
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/mobile-app/app/customer/claim-detail.tsx')
          text = path.read_text()

          replacements = [
              ("import type { Claim, ClaimDocument, ClaimHistory, InsuranceCompany, Policy, Vehicle } from '@/lib/types';", "import type { Claim, ClaimDocument, InsuranceCompany, Policy, Vehicle } from '@/lib/types';"),
              ("  const [history, setHistory] = useState<ClaimHistory[]>([]);\n", ""),
              ("  const [historyExpanded, setHistoryExpanded] = useState(false);\n", ""),
              ("      const [claimResult, historyResult, documentsResult, milestoneResult] = await Promise.all([\n        supabase.from('claims').select('*').eq('id', id).maybeSingle(),\n        supabase.from('claim_status_history').select('*').eq('claim_id', id).order('created_at', { ascending: false }),\n        supabase.from('claim_documents').select('*').eq('claim_id', id).order('created_at', { ascending: false }),\n        (supabase as any).from('claim_milestones').select('*').eq('claim_id', id),\n      ]);", "      const [claimResult, documentsResult, milestoneResult] = await Promise.all([\n        supabase.from('claims').select('*').eq('id', id).maybeSingle(),\n        supabase.from('claim_documents').select('*').eq('claim_id', id).order('created_at', { ascending: false }),\n        (supabase as any).from('claim_milestones').select('*').eq('claim_id', id),\n      ]);"),
              ("      setHistory(historyResult.data ?? []);\n", ""),
              ("\n      <SectionHeader title=\"Activity History\" subtitle={`${history.length} movement record${history.length === 1 ? '' : 's'}`} expanded={historyExpanded} onPress={() => setHistoryExpanded((value) => !value)} />\n      {historyExpanded ? <View style={styles.sectionBody}>{history.length ? history.map((item) => <View key={item.id} style={styles.historyRow}><View style={styles.historyDot} /><View style={{ flex: 1 }}><Text style={styles.historyStatus}>{item.to_status}</Text><Text style={styles.documentMeta}>{formatDateTime(item.created_at)}</Text>{item.notes ? <Text style={styles.emptyText}>{item.notes}</Text> : null}</View></View>) : <Text style={styles.emptyText}>No timeline updates yet.</Text>}</View> : null}", ""),
              (",historyRow:{flexDirection:'row',gap:9,paddingVertical:7},historyDot:{width:10,height:10,borderRadius:5,backgroundColor:'#0A43A3',marginTop:4,borderWidth:2,borderColor:'#D7E6F8'},historyStatus:{color:palette.navy,fontSize:10.5,fontWeight:'900'}", ""),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source block not found: {old[:120]}')
              text = text.replace(old, new, 1)

          if 'Activity History' in text or "claim_status_history" in text or 'ClaimHistory' in text or 'historyExpanded' in text:
              raise SystemExit('Activity History cleanup was incomplete')

          path.write_text(text)

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/claim-detail.tsx
          git rm .github/workflows/tmp-remove-claim-activity-history.yml
          git commit -m "Remove Activity History from customer Claim Tracker"
          git push origin HEAD:feat/self-managed-stage-navigation
