name: Apply voice Quick Add queue source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260919114500_voice_quick_add_queue_source.sql'
      - '.github/workflows/apply-voice-quick-add-queue-source.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply voice Quick Add queue source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260919114500_voice_quick_add_queue_source.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Quick Add queue-source migration
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/migrations/20260919114500_voice_quick_add_queue_source.sql
          supabase migration repair --linked --status applied 20260919114500

      - name: Verify schema contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              exists (
                select 1 from information_schema.columns
                where table_schema='public'
                  and table_name='external_renewal_opportunities'
                  and column_name='voice_queue_source'
              ) as queue_source_ready,
              exists (
                select 1 from information_schema.columns
                where table_schema='public'
                  and table_name='external_renewal_opportunities'
                  and column_name='quick_add_by_auth_user_id'
              ) as quick_add_actor_ready,
              exists (
                select 1 from pg_indexes
                where schemaname='public'
                  and indexname='external_renewal_it_quick_add_idx'
              ) as quick_add_index_ready,
              not has_table_privilege('authenticated','public.external_renewal_opportunities','UPDATE') as no_authenticated_direct_update
          ")
          echo "$result"
          for key in queue_source_ready quick_add_actor_ready quick_add_index_ready no_authenticated_direct_update; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
