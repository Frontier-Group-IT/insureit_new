name: Temporary review uploaded documents only

on:
  push:
    paths:
      - scripts/temp_review_uploaded_documents_only.py
      - .github/workflows/temp-review-uploaded-documents-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        run: python scripts/temp_review_uploaded_documents_only.py
      - name: Validate focused change
        run: |
          git diff --check
          grep -q 'if (!document) return null;' 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
      - name: Commit focused patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
          git commit -m "Show only uploaded documents on application review"
          git push
