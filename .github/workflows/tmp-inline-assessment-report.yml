name: Temporary inline Assessment Report editor

on:
  push:
    branches:
      - ui/delivery-order-assessment-documents

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/delivery-order-assessment-documents
      - name: Inline Assessment Report upload row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile-app/app/customer/self-managed-milestone.tsx')
          s = p.read_text()

          old = '''        <ClaimFinancialSummary rows={[\n          ...(bill !== null ? [{ label: 'Bill Amount', value: currency(bill) }] : []),\n          ...(currentDo !== null ? [{ label: 'DO Amount', value: currency(currentDo) }] : []),\n          ...(contribution !== null ? [{ label: 'Customer Contribution', value: currency(contribution), emphasis: true }] : []),\n        ]} />\n      </ClaimFormSection>\n      {claimId && customerId ? <DeliveryOrderDocuments claimId={claimId} customerId={customerId} /> : null}\n'''
          new = '''        <ClaimFinancialSummary rows={[\n          ...(bill !== null ? [{ label: 'Bill Amount', value: currency(bill) }] : []),\n          ...(currentDo !== null ? [{ label: 'DO Amount', value: currency(currentDo) }] : []),\n          ...(contribution !== null ? [{ label: 'Customer Contribution', value: currency(contribution), emphasis: true }] : []),\n        ]} />\n        {claimId && customerId ? <><Gap /><DeliveryOrderDocuments claimId={claimId} customerId={customerId} /></> : null}\n      </ClaimFormSection>\n'''
          if old not in s:
              raise SystemExit('Delivery Order placement block not found')
          s = s.replace(old, new, 1)

          start = s.index('  return <View style={styles.approvalDocumentsCard}>', s.index('function DeliveryOrderDocuments'))
          end_marker = '\n}\n\nfunction WorkApprovalPdfUpload'
          end = s.index(end_marker, start)
          replacement = '''  return <>\n    <View style={[styles.deliveryReportRow, assessmentReport && styles.deliveryReportRowSaved]}>\n      <View style={styles.deliveryReportLeading}>\n        <View style={styles.deliveryReportIcon}><MaterialCommunityIcons name="file-document-outline" size={17} color="#0A43A3" /></View>\n        <View style={styles.deliveryReportCopy}>\n          <Text style={styles.deliveryReportLabel}>Assessment Report <Text style={styles.deliveryReportOptional}>(Optional)</Text></Text>\n          {assessmentReport ? <Text style={styles.deliveryReportFile} numberOfLines={1}>{assessmentReport.file_name}</Text> : null}\n        </View>\n      </View>\n      <Pressable accessibilityRole="button" disabled={loading || uploading || removing} onPress={() => void choose('assessment_report')} style={styles.deliveryReportUploadButton}>\n        <MaterialCommunityIcons name={assessmentReport ? 'refresh' : 'upload-outline'} size={13} color="#FFFFFF" />\n        <Text style={styles.deliveryReportUploadText}>{loading ? 'Checking' : uploading ? 'Uploading' : assessmentReport ? 'Replace' : 'Upload'}</Text>\n      </Pressable>\n      {assessmentReport ? <Pressable accessibilityRole="button" accessibilityLabel="Remove Assessment Report" disabled={uploading || removing} onPress={() => setDeleteTarget('assessment_report')} style={styles.deliveryReportRemove}><MaterialCommunityIcons name="close" size={12} color="#C43232" /></Pressable> : null}\n    </View>\n    {success ? <View style={styles.approvalFeedbackSuccess}><MaterialCommunityIcons name="check-circle-outline" size={14} color="#168161" /><Text style={styles.approvalFeedbackSuccessText}>{success}</Text></View> : null}\n    {error ? <View style={styles.approvalFeedbackError}><MaterialCommunityIcons name="alert-circle-outline" size={14} color="#B42318" /><Text style={styles.approvalFeedbackErrorText}>{error}</Text></View> : null}\n    <Modal visible={Boolean(deleteTarget)} transparent animationType="fade" onRequestClose={() => setDeleteTarget(null)}>\n      <View style={styles.approvalModalBackdrop}><View accessibilityRole="alert" style={styles.approvalModalCard}>\n        <View style={styles.approvalModalIcon}><MaterialCommunityIcons name="trash-can-outline" size={20} color="#C43232" /></View>\n        <Text style={styles.approvalModalTitle}>Delete document?</Text><Text style={styles.approvalModalBody}>Are you sure you want to remove the Assessment Report from the claim?</Text>\n        <View style={styles.approvalModalActions}><Pressable accessibilityRole="button" onPress={() => setDeleteTarget(null)} style={styles.approvalModalCancel}><Text style={styles.approvalModalCancelText}>Cancel</Text></Pressable><Pressable accessibilityRole="button" disabled={removing} onPress={() => void confirmDelete()} style={styles.approvalModalDelete}><Text style={styles.approvalModalDeleteText}>{removing ? 'Deleting...' : 'Delete'}</Text></Pressable></View>\n      </View></View>\n    </Modal>\n  </>;'''
          s = s[:start] + replacement + s[end:]

          style_anchor = "  billUploadLabel: { color: palette.navy, fontSize: 11, fontWeight: '800', marginBottom: 5 },\n"
          styles = """  deliveryReportRow: { minHeight: 44, borderRadius: 10, borderWidth: 1, borderColor: '#DDE5EF', backgroundColor: '#FFFFFF', paddingLeft: 8, paddingRight: 7, flexDirection: 'row', alignItems: 'center', gap: 7 },\n  deliveryReportRowSaved: { borderColor: '#B9DCC9', backgroundColor: '#FBFFFD' },\n  deliveryReportLeading: { flex: 1, minWidth: 0, flexDirection: 'row', alignItems: 'center', gap: 7 },\n  deliveryReportIcon: { width: 25, height: 25, borderRadius: 7, backgroundColor: '#EEF4FF', alignItems: 'center', justifyContent: 'center' },\n  deliveryReportCopy: { flex: 1, minWidth: 0 },\n  deliveryReportLabel: { color: palette.navy, fontSize: 9.5, lineHeight: 12, fontWeight: '800' },\n  deliveryReportOptional: { color: '#718198', fontWeight: '600' },\n  deliveryReportFile: { color: '#65758A', fontSize: 7.8, lineHeight: 10, fontWeight: '600', marginTop: 1 },\n  deliveryReportUploadButton: { minHeight: 28, borderRadius: 7, backgroundColor: '#073C91', paddingHorizontal: 10, flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 4 },\n  deliveryReportUploadText: { color: '#FFFFFF', fontSize: 8.3, fontWeight: '900' },\n  deliveryReportRemove: { width: 22, height: 22, borderRadius: 11, backgroundColor: '#FFF5F5', borderWidth: 1, borderColor: '#F1B5B5', alignItems: 'center', justifyContent: 'center' },\n"""
          if style_anchor not in s:
              raise SystemExit('Style anchor not found')
          s = s.replace(style_anchor, styles + style_anchor, 1)
          p.write_text(s)
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/self-managed-milestone.tsx
          git commit -m "Show Assessment Report as inline upload row"
          git push origin HEAD:ui/delivery-order-assessment-documents
