name: Restore Life Health handoff v2

on:
  push:
    branches:
      - feature/life-health-document-actions-2026-10-01
    paths:
      - '.github/workflows/restore-life-health-handoff-v2.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/life-health-document-actions-2026-10-01
          fetch-depth: 0
      - name: Restore complete handoff from pre-trigger snapshot
        shell: bash
        run: |
          set -euo pipefail
          git checkout 66c4d1e1f25a5ca096b7b1ef06939daf9f5b6b23 -- docs/CURRENT_CHAT_HANDOFF.md
          rm .github/workflows/restore-life-health-handoff-v2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore full Life Health handoff snapshot"
          git push origin HEAD:feature/life-health-document-actions-2026-10-01
