name: Apply Partner registration document visibility migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260918115500_partner_registration_document_visibility.sql'
      - 'supabase/migrations/20260918122500_partner_registration_document_storage_access.sql'
      - 'supabase/verification/20260918122500_partner_registration_document_visibility.sql'
      - '.github/workflows/apply-partner-registration-document-visibility.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner registration document visibility migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260918115500_partner_registration_document_visibility.sql
          test -f supabase/migrations/20260918122500_partner_registration_document_storage_access.sql
          test -f supabase/verification/20260918122500_partner_registration_document_visibility.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Partner registration document visibility migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/migrations/20260918115500_partner_registration_document_visibility.sql
          supabase migration repair --linked --status applied 20260918115500
          supabase db query --linked --file supabase/migrations/20260918122500_partner_registration_document_storage_access.sql
          supabase migration repair --linked --status applied 20260918122500

      - name: Verify Partner registration document visibility
        run: supabase db query --linked --file supabase/verification/20260918122500_partner_registration_document_visibility.sql
