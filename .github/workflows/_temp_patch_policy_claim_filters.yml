name: Temporary patch Partner Policy and Claims filters

on:
  push:
    branches:
      - partner-policy-claims-fullwidth-filters
    paths:
      - '.github/workflows/_temp_patch_policy_claim_filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: partner-policy-claims-fullwidth-filters
          fetch-depth: 0

      - name: Patch Policies and Claims layouts
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          policy_paths = [
              Path('apps/partner-app/app/(tabs)/policies.tsx'),
              Path('scripts/partner/compat/partner-policies-reference-0-1.tsx'),
          ]
          claim_paths = [
              Path('apps/partner-app/app/(tabs)/claims.tsx'),
              Path('scripts/partner/compat/partner-claims-reference-0-1.tsx'),
          ]

          for path in policy_paths:
              text = path.read_text()

              # Remove KPI summary model and visual cards while preserving summary fetch for cache/offline refresh handling.
              text = re.sub(
                  r"\n  const summaryItems = useMemo\(\(\) => \[.*?\n  \], \[summary\.data\]\);\n",
                  "\n",
                  text,
                  flags=re.S,
              )
              text = re.sub(
                  r"\n      \{summary\.loading && !summary\.data \? \(.*?\n      \)\}\n\n      <Pressable\n        accessibilityRole=\"button\"\n        accessibilityLabel=\"Open Policy Intake\"",
                  "\n      <Pressable\n        accessibilityRole=\"button\"\n        accessibilityLabel=\"Open Policy Intake\"",
                  text,
                  count=1,
                  flags=re.S,
              )
              text = re.sub(
                  r"\n          <View style=\{styles\.sortAffordance\}>.*?</View>\n        </View>",
                  "\n        </View>",
                  text,
                  count=1,
                  flags=re.S,
              )
              text = re.sub(
                  r"\nfunction SummaryCard\(\{.*?\n\}\n\nfunction PolicyCard",
                  "\nfunction PolicyCard",
                  text,
                  count=1,
                  flags=re.S,
              )
              text = text.replace("import { useCallback, useEffect, useMemo, useState } from 'react';", "import { useCallback, useEffect, useState } from 'react';")

              # Full-width, larger lifecycle tabs.
              text = re.sub(
                  r"  tabsRow: \{.*?\n  sortText: \{[^\n]*\},",
                  """  tabsRow: {
    minHeight: 46,
    marginHorizontal: 12,
    marginTop: 8,
    flexDirection: 'row',
    alignItems: 'stretch',
    borderRadius: 10,
    overflow: 'hidden',
    backgroundColor: '#FFFFFF',
    borderWidth: 1,
    borderColor: '#DCE5F0',
  },
  tabsScroller: { flex: 1, flexDirection: 'row', alignItems: 'stretch' },
  tabButton: {
    flex: 1,
    minWidth: 0,
    minHeight: 44,
    alignItems: 'center',
    justifyContent: 'center',
    paddingHorizontal: 3,
    borderBottomWidth: 3,
    borderBottomColor: 'transparent',
  },
  tabButtonActive: { backgroundColor: '#EEF4FF', borderBottomColor: '#3156B8' },
  tabText: { color: '#708099', textAlign: 'center', fontSize: 8.2, lineHeight: 11, fontWeight: '700' },
  tabTextActive: { color: '#183E87', fontWeight: '800' },""",
                  text,
                  count=1,
                  flags=re.S,
              )
              path.write_text(text)

          for path in claim_paths:
              text = path.read_text()
              text = text.replace("import type { ComponentProps } from 'react';\n", "")
              text = text.replace("import { useCallback, useEffect, useMemo, useState } from 'react';", "import { useCallback, useEffect, useState } from 'react';")
              text = text.replace("type SortOrder = 'newest' | 'oldest';\n", "")
              text = re.sub(r"\n  const \[sortOrder, setSortOrder\] = useState<SortOrder>\('newest'\);", "", text)
              text = re.sub(r"\n  const \[sortOpen, setSortOpen\] = useState\(false\);", "", text)
              text = re.sub(
                  r"\n  const rows = useMemo\(\(\) => \{.*?\n  \}, \[collection\.rows, sortOrder\]\);",
                  "\n  const rows = collection.rows;",
                  text,
                  count=1,
                  flags=re.S,
              )

              # Remove KPI cards.
              text = re.sub(
                  r"\n        \{summary\.loading && !summary\.data \? \(.*?\n        \)\}\n\n        <View style=\{styles\.controls\}>",
                  "\n        <View style={styles.controls}>",
                  text,
                  count=1,
                  flags=re.S,
              )
              # Remove Sort By control.
              text = re.sub(
                  r"\n          <Pressable\n            accessibilityRole=\"button\"\n            accessibilityLabel=\"Sort claims\".*?</Pressable>",
                  "",
                  text,
                  count=1,
                  flags=re.S,
              )
              # Remove sorting modal only; keep filter modal.
              text = re.sub(
                  r"\n      <ChoiceModal\n        visible=\{sortOpen\}.*?\n      />",
                  "",
                  text,
                  count=1,
                  flags=re.S,
              )
              # Remove now-unused MetricCard.
              text = re.sub(
                  r"\nfunction MetricCard\(\{.*?\n\}\n\nfunction ClaimCard",
                  "\nfunction ClaimCard",
                  text,
                  count=1,
                  flags=re.S,
              )

              # Make the visible claim-state tabs large and full width.
              text = re.sub(
                  r"  controls: \{.*?\n  sortText: \{[^\n]*\},",
                  """  controls: {
    marginTop: 8,
    minHeight: 46,
    flexDirection: 'row',
    alignItems: 'stretch',
    borderRadius: 10,
    overflow: 'hidden',
    backgroundColor: '#FFFFFF',
    borderWidth: 1,
    borderColor: '#DCE5F0',
  },
  tabs: { flex: 1, flexDirection: 'row', alignItems: 'stretch' },
  tab: {
    flex: 1,
    minWidth: 0,
    minHeight: 44,
    paddingHorizontal: 6,
    alignItems: 'center',
    justifyContent: 'center',
    borderBottomWidth: 3,
    borderBottomColor: 'transparent',
  },
  tabActive: { backgroundColor: '#EEF4FF', borderBottomColor: '#1738D5' },
  tabText: { color: '#5E6C8C', textAlign: 'center', fontSize: 9, lineHeight: 12, fontWeight: '700' },
  tabTextActive: { color: '#1738D5', fontWeight: '800' },""",
                  text,
                  count=1,
                  flags=re.S,
              )
              path.write_text(text)

          # Remove this temporary workflow from the final branch diff.
          Path('.github/workflows/_temp_patch_policy_claim_filters.yml').unlink()
          PY

      - name: Verify requested UI cleanup
        shell: bash
        run: |
          set -euo pipefail
          for f in 'apps/partner-app/app/(tabs)/policies.tsx' 'scripts/partner/compat/partner-policies-reference-0-1.tsx'; do
            ! grep -q 'summaryGrid' "$f"
            ! grep -q 'SummaryCard' "$f"
            ! grep -q 'sortAffordance' "$f"
            grep -q "flex: 1," "$f"
            grep -q "minHeight: 44" "$f"
          done
          for f in 'apps/partner-app/app/(tabs)/claims.tsx' 'scripts/partner/compat/partner-claims-reference-0-1.tsx'; do
            ! grep -q 'MetricCard' "$f"
            ! grep -q 'Sort claims' "$f"
            ! grep -q 'sortOpen' "$f"
            ! grep -q 'sortOrder' "$f"
            grep -q "minHeight: 44" "$f"
          done

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify Partner policy and claim filters'
          git push origin HEAD:partner-policy-claims-fullwidth-filters
