name: Apply Partner business date range migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner business date range migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "::error::Refusing migration: checkout is not current origin/main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::Repository secret SUPABASE_DB_PASSWORD is not configured."
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "::error::Repository variable SUPABASE_PROJECT_REF is not configured."
            exit 1
          }
          test -f supabase/migrations/20260831104500_partner_app_business_date_range.sql
          test -f supabase/verification/20260831104500_partner_app_business_date_range_verify.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect migration history
        run: supabase migration list

      - name: Apply only Partner business date range migration
        run: supabase db query --linked --file supabase/migrations/20260831104500_partner_app_business_date_range.sql

      - name: Record Partner business date range migration as applied
        run: supabase migration repair --linked --status applied 20260831104500

      - name: Verify Partner business date range migration
        run: supabase db query --linked --file supabase/verification/20260831104500_partner_app_business_date_range_verify.sql

      - name: Confirm function and grants
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.partner_app_business_range(date,date)') is not null as function_exists,
              has_function_privilege('authenticated', 'public.partner_app_business_range(date,date)', 'EXECUTE') as authenticated_can_execute,
              has_function_privilege('anon', 'public.partner_app_business_range(date,date)', 'EXECUTE') as anon_can_execute
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_exists"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"authenticated_can_execute"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"anon_can_execute"[[:space:]]*:[[:space:]]*false'

      - name: Migration summary
        if: always()
        shell: bash
        run: |
          {
            echo "## INSUREIT Partner business date range migration"
            echo
            echo "- Source: exact current `main` only"
            echo "- Migration: `20260831104500_partner_app_business_date_range.sql` only"
            echo "- Historical migration replay: blocked by workflow design"
            echo "- Verification: dedicated SQL + function/grant assertions"
          } >> "$GITHUB_STEP_SUMMARY"
