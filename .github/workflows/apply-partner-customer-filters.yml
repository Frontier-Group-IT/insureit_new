name: Apply Partner customer filters migration

# Operational trigger note: keep this workflow path-scoped so an approved main update can safely re-trigger the already-merged migration when schema parity blocks production.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260916154500_partner_web_customer_filters.sql'
      - '.github/workflows/apply-partner-customer-filters.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner customer filters migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260916154500_partner_web_customer_filters.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Partner customer filters migration
        run: supabase db query --linked --file supabase/migrations/20260916154500_partner_web_customer_filters.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260916154500

      - name: Verify Partner customer filters RPC
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.partner_app_list_customers_filtered(integer,integer,text,text,text)') is not null as customer_filter_rpc_ready,
              has_function_privilege('authenticated', 'public.partner_app_list_customers_filtered(integer,integer,text,text,text)', 'EXECUTE') as authenticated_execute_ready;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"customer_filter_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"authenticated_execute_ready"[[:space:]]*:[[:space:]]*true'
