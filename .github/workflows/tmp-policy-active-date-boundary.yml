name: One-time active policy date-boundary fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-policy-active-date-boundary.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix mobile date-only active checks
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/mobile-app/app/customer/add-policy.tsx')
          t = p.read_text(encoding='utf-8')
          old = "function isPolicyCurrentlyActive(startDate: string, endDate: string) { const now = Date.now(); return new Date(startDate).getTime() <= now && new Date(endDate).getTime() >= now; }"
          new = "function isPolicyCurrentlyActive(startDate: string, endDate: string) { const currentDate = today(); return startDate <= currentDate && endDate >= currentDate; }"
          if old not in t: raise SystemExit('add-policy active helper not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          p = Path('apps/mobile-app/app/customer/vehicles.tsx')
          t = p.read_text(encoding='utf-8')
          old = "function isPolicyActive(policy: Pick<VehiclePolicyDisplay, 'start_date' | 'end_date'>) {\n  const now = Date.now();\n  return new Date(policy.start_date).getTime() <= now && new Date(policy.end_date).getTime() >= now;\n}"
          new = "function isPolicyActive(policy: Pick<VehiclePolicyDisplay, 'start_date' | 'end_date'>) {\n  const now = new Date();\n  const currentDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;\n  return policy.start_date <= currentDate && policy.end_date >= currentDate;\n}"
          if old not in t: raise SystemExit('vehicles active helper not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
      - name: Add India-date database refinement migration
        run: |
          cat > supabase/migrations/20260814115500_single_active_policy_india_date_boundary.sql <<'SQL'
          create or replace function public.enforce_single_active_policy_per_vehicle()
          returns trigger
          language plpgsql
          security definer
          set search_path = public
          as $$
          declare
            has_current_active boolean;
            has_date_overlap boolean;
            policy_today date := (now() at time zone 'Asia/Kolkata')::date;
          begin
            if new.vehicle_id is null or new.start_date is null or new.end_date is null then
              return new;
            end if;

            select exists (
              select 1 from public.policies p
              where p.vehicle_id = new.vehicle_id
                and lower(coalesce(p.status, 'active')) = 'active'
                and p.start_date <= policy_today and p.end_date >= policy_today
                and (tg_table_name <> 'policies' or p.id <> new.id)
              union all
              select 1 from public.external_policies ep
              where ep.vehicle_id = new.vehicle_id
                and ep.start_date <= policy_today and ep.end_date >= policy_today
                and (tg_table_name <> 'external_policies' or ep.id <> new.id)
            ) into has_current_active;

            if has_current_active then
              raise exception 'This vehicle already has an active policy. A second policy cannot be added until the current policy expires.' using errcode = '23505';
            end if;

            select exists (
              select 1 from public.policies p
              where p.vehicle_id = new.vehicle_id
                and lower(coalesce(p.status, 'active')) = 'active'
                and new.start_date <= p.end_date and new.end_date >= p.start_date
                and (tg_table_name <> 'policies' or p.id <> new.id)
              union all
              select 1 from public.external_policies ep
              where ep.vehicle_id = new.vehicle_id
                and new.start_date <= ep.end_date and new.end_date >= ep.start_date
                and (tg_table_name <> 'external_policies' or ep.id <> new.id)
            ) into has_date_overlap;

            if has_date_overlap then
              raise exception 'This vehicle already has a policy covering part of the selected policy period.' using errcode = '23505';
            end if;
            return new;
          end;
          $$;
          SQL
      - run: npm ci
      - run: npm run typecheck:mobile
      - run: npm run lint:mobile
      - run: npm run build:mobile:web
      - name: Commit fix safely
        run: |
          rm .github/workflows/tmp-policy-active-date-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/add-policy.tsx apps/mobile-app/app/customer/vehicles.tsx supabase/migrations/20260814115500_single_active_policy_india_date_boundary.sql .github/workflows/tmp-policy-active-date-boundary.yml
          git commit -m "Fix active policy date boundary"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
