name: Validate partner edit submit fix

on:
  push:
    branches:
      - fix/partner-edit-submit-hang

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-edit-submit-hang
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix_partner_edit_submit_hang.py
      - run: npm ci
      - run: npm run typecheck:web
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/customers/applications/posp-misp-application-editor.tsx
          git commit -m "Fix portalled partner edit form submission"
          git push origin HEAD:fix/partner-edit-submit-hang
