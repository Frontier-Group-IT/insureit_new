name: Fix partner edit submit hang

on:
  push:
    branches:
      - fix/partner-edit-submit-hang

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-edit-submit-hang
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply submit timing fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web-portal/app/customers/applications/posp-misp-application-editor.tsx')
          text = path.read_text()
          text = text.replace(' forcePending={submittingIntent === "exit"} onSubmitStart={() => setSubmittingIntent("exit")}', ' forcePending={submittingIntent === "exit"}', 1)
          text = text.replace(' forcePending={submittingIntent === "documents"} onSubmitStart={() => setSubmittingIntent("documents")}', ' forcePending={submittingIntent === "documents"}', 1)
          marker = '''  useEffect(() => {
    setActionTarget(actionTargetId ? document.getElementById(actionTargetId) : null);
  }, [actionTargetId]);
'''
          addition = marker + '''
  useEffect(() => {
    if (!submittingIntent) return;
    const timeout = window.setTimeout(() => setSubmittingIntent(null), 30000);
    return () => window.clearTimeout(timeout);
  }, [submittingIntent]);
'''
          if marker not in text:
              raise SystemExit('Action target effect not found')
          text = text.replace(marker, addition, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run typecheck:web
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/web-portal/app/customers/applications/posp-misp-application-editor.tsx'
          git commit -m "Fix portalled partner edit form submission"
          git push origin HEAD:fix/partner-edit-submit-hang
