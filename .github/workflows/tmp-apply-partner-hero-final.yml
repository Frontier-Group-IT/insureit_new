name: Temporary apply final Partner hero layout patch

on:
  push:
    branches:
      - ui/partner-hero-final-banner
    paths:
      - '.github/workflows/tmp-apply-partner-hero-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ui/partner-hero-final-banner
          fetch-depth: 0

      - name: Apply exact compact hero layout changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/partner-app/app/(tabs)/index.tsx')
          text = path.read_text()

          replacements = [
              ("  useWindowDimensions,\n", ""),
              ("  const { width: screenWidth } = useWindowDimensions();\n  const heroHeight = Math.min(116, Math.max(104, screenWidth * 0.29));\n", "  const heroHeight = 90;\n"),
              ("  body: { marginTop: -10, paddingHorizontal: 14 },", "  body: { marginTop: -18, paddingHorizontal: 14 },"),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- apps/partner-app/app/'(tabs)'/index.tsx

      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/partner-app/app/(tabs)/index.tsx'
          git diff --cached --quiet && { echo '::error::No source change produced.'; exit 1; }
          git commit -m 'Match Partner hero to compact agreed layout'
          git push origin HEAD:ui/partner-hero-final-banner
