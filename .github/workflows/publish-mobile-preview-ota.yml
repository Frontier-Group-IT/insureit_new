name: Publish mobile preview OTA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          ref: cb3a5aa1de9c134f62f5fa5ff5f035af21e0c183

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Expo preview OTA
        working-directory: apps/mobile-app
        run: npx eas-cli update --branch preview --environment preview --message "Refine mobile Start Claim screen" --non-interactive --json
