name: Publish mobile preview OTA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify OTA source is exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_head="$(git rev-parse HEAD)"
          remote_main="$(git rev-parse origin/main)"
          if [ "$current_head" != "$remote_main" ]; then
            echo "Refusing Expo preview OTA: checked-out source is not current origin/main." >&2
            echo "HEAD=$current_head" >&2
            echo "origin/main=$remote_main" >&2
            exit 1
          fi

      - name: Verify current mobile OTA runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/mobile-app/app.json').expo;
          if (app.version !== '0.3.0') {
            console.error(`Refusing preview OTA: expected current production runtime 0.3.0, found ${app.version ?? 'missing'}.`);
            process.exit(1);
          }
          if (app.android?.versionCode !== 9) {
            console.error(`Refusing preview OTA: expected Android production versionCode 9, found ${app.android?.versionCode ?? 'missing'}.`);
            process.exit(1);
          }
          console.log('Verified Expo preview runtime target: 0.3.0 / versionCode 9.');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Expo preview OTA
        id: publish
        working-directory: apps/mobile-app
        shell: bash
        run: |
          set +e
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Expo preview 0.3.0 from main ${GITHUB_SHA}" \
            --non-interactive \
            --json \
            > expo-update.json \
            2> expo-update.stderr.log
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

          if [ -s expo-update.json ]; then
            echo "Expo publish JSON:"
            cat expo-update.json
          fi

          if [ -s expo-update.stderr.log ]; then
            echo "Expo CLI messages:" >&2
            cat expo-update.stderr.log >&2
          fi

      - name: Inspect preview channel mapping
        if: steps.publish.outputs.result == 'success'
        working-directory: apps/mobile-app
        shell: bash
        run: |
          npx eas-cli channel:view preview \
            --json \
            --non-interactive \
            > expo-channel-preview.json
          echo "Preview channel mapping JSON:"
          cat expo-channel-preview.json

      - name: Write OTA publication summary
        if: always()
        working-directory: apps/mobile-app
        env:
          PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
          PUBLISH_EXIT_CODE: ${{ steps.publish.outputs.exit_code }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const result = process.env.PUBLISH_RESULT || 'unknown';
          const exitCode = process.env.PUBLISH_EXIT_CODE || 'unknown';
          const icon = result === 'success' ? '✅' : result === 'failed' ? '❌' : '⚠️';
          const lines = [
            '## Expo preview OTA publication', '',
            '| Field | Value |', '| --- | --- |',
            `| Publish result | ${icon} ${result} |`,
            '| Expo channel | `preview` |',
            '| Runtime | `0.3.0` |',
            '| Android versionCode | `9` |',
            `| CLI exit code | \`${exitCode}\` |`,
            `| Source commit | \`${process.env.GITHUB_SHA || 'unknown'}\` |`, '',
            'Preview publication is manual-only. Production app changes are published by the dedicated production OTA workflow.', ''
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Fail workflow when Expo publication fails
        if: always() && steps.publish.outputs.result != 'success'
        shell: bash
        run: |
          echo "Expo preview OTA publication failed with exit code ${{ steps.publish.outputs.exit_code }}." >&2
          exit 1
