name: Publish mobile preview OTA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile-app/**'
      - '.github/workflows/publish-mobile-preview-ota.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile-app/**'
      - '.github/workflows/publish-mobile-preview-ota.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'ui/mobile-claim-tracker-progress-ring') || contains(github.event.head_commit.message, '#547')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out OTA source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Expo preview OTA
        id: publish
        working-directory: apps/mobile-app
        shell: bash
        run: |
          set +e
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Compact Claim Tracker progress into header ring" \
            --non-interactive \
            --json \
            > expo-update.json \
            2> expo-update.stderr.log
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

          if [ -s expo-update.json ]; then
            echo "Expo publish JSON:"
            cat expo-update.json
          fi

          if [ -s expo-update.stderr.log ]; then
            echo "Expo CLI messages:" >&2
            cat expo-update.stderr.log >&2
          fi

      - name: Inspect preview channel mapping
        if: steps.publish.outputs.result == 'success'
        working-directory: apps/mobile-app
        shell: bash
        run: |
          npx eas-cli channel:view preview \
            --json \
            --non-interactive \
            > expo-channel-preview.json
          echo "Preview channel mapping JSON:"
          cat expo-channel-preview.json

      - name: Write OTA publication summary
        if: always()
        working-directory: apps/mobile-app
        env:
          PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
          PUBLISH_EXIT_CODE: ${{ steps.publish.outputs.exit_code }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const readJson = (path) => {
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch {
              return null;
            }
          };

          const collectObjects = (value, output = []) => {
            if (!value || typeof value !== 'object') return output;
            if (Array.isArray(value)) {
              for (const item of value) collectObjects(item, output);
              return output;
            }
            output.push(value);
            for (const item of Object.values(value)) collectObjects(item, output);
            return output;
          };

          const firstValue = (objects, keys) => {
            for (const object of objects) {
              for (const key of keys) {
                const value = object?.[key];
                if (value !== undefined && value !== null && value !== '') return String(value);
              }
            }
            return null;
          };

          const uniqueValues = (objects, keys) => {
            const values = [];
            for (const object of objects) {
              for (const key of keys) {
                const value = object?.[key];
                if (value !== undefined && value !== null && value !== '') values.push(String(value));
              }
            }
            return [...new Set(values)];
          };

          const publish = readJson('expo-update.json');
          const channel = readJson('expo-channel-preview.json');
          const objects = [
            ...collectObjects(channel),
            ...collectObjects(publish),
          ];

          const groupId = firstValue(objects, ['group', 'groupId', 'updateGroupId']);
          const runtimeVersion = firstValue(objects, ['runtimeVersion']);
          const updateIds = uniqueValues(objects, ['id', 'updateId'])
            .filter((value) => value !== groupId)
            .slice(0, 4);
          const branch = firstValue(objects, ['branchName', 'branch']);
          const result = process.env.PUBLISH_RESULT || 'unknown';
          const exitCode = process.env.PUBLISH_EXIT_CODE || 'unknown';
          const icon = result === 'success' ? '✅' : result === 'failed' ? '❌' : '⚠️';

          const lines = [
            '## Expo preview OTA publication',
            '',
            `| Field | Value |`,
            `| --- | --- |`,
            `| Publish result | ${icon} ${result} |`,
            '| Expo channel | `preview` |',
            `| Channel mapped branch | ${branch ? `\`${branch}\`` : 'Not returned by Expo'} |`,
            `| Runtime version | ${runtimeVersion ? `\`${runtimeVersion}\`` : 'Not returned by Expo'} |`,
            `| Update group ID | ${groupId ? `\`${groupId}\`` : 'Not returned by Expo'} |`,
            `| Update ID(s) | ${updateIds.length ? updateIds.map((id) => `\`${id}\``).join('<br>') : 'Not returned by Expo'} |`,
            `| CLI exit code | \`${exitCode}\` |`,
            `| Source commit | \`${process.env.GITHUB_SHA || 'unknown'}\` |`,
            '',
            'This publishes only JavaScript/assets to the existing `preview` channel. No APK is built.',
            '',
          ];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);

          if (result === 'success') {
            const comment = [
              '### Expo preview OTA published ✅',
              '',
              '- Channel: `preview`',
              `- Runtime version: ${runtimeVersion ? `\`${runtimeVersion}\`` : 'Not returned by Expo'}`,
              `- Update group ID: ${groupId ? `\`${groupId}\`` : 'Not returned by Expo'}`,
              `- Update ID(s): ${updateIds.length ? updateIds.map((id) => `\`${id}\``).join(', ') : 'Not returned by Expo'}`,
              `- Source commit: \`${process.env.GITHUB_EVENT_NAME === 'pull_request' ? process.env.PR_HEAD_SHA : process.env.GITHUB_SHA || 'unknown'}\``,
              '- Build type: OTA JavaScript/assets only — no APK/AAB built',
            ];
            fs.writeFileSync('expo-pr-comment.md', `${comment.join('\n')}\n`);
          }
          NODE

      - name: Record successful OTA on PR 588
        if: steps.publish.outputs.result == 'success'
        working-directory: apps/mobile-app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment 588 --body-file expo-pr-comment.md

      - name: Fail workflow when Expo publication fails
        if: always() && steps.publish.outputs.result != 'success'
        shell: bash
        run: |
          echo "Expo preview OTA publication failed with exit code ${{ steps.publish.outputs.exit_code }}." >&2
          exit 1
