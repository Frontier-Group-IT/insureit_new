name: Publish mobile preview OTA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile-app/**'
      - '.github/workflows/publish-mobile-preview-ota.yml'

permissions:
  contents: read

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'preview/pr595-cumulative-ota'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out preview composition
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Expo preview OTA
        id: publish
        working-directory: apps/mobile-app
        shell: bash
        run: |
          set +e
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Preview My Claims self-tracked status colors" \
            --non-interactive \
            --json \
            > expo-update.json \
            2> expo-update.stderr.log
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
          cat expo-update.json 2>/dev/null || true
          cat expo-update.stderr.log >&2 2>/dev/null || true

      - name: Inspect preview channel mapping
        if: steps.publish.outputs.result == 'success'
        working-directory: apps/mobile-app
        run: npx eas-cli channel:view preview --json --non-interactive > expo-channel-preview.json && cat expo-channel-preview.json

      - name: Write OTA publication summary
        if: always()
        working-directory: apps/mobile-app
        env:
          PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
          PUBLISH_EXIT_CODE: ${{ steps.publish.outputs.exit_code }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const readJson = (path) => { try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch { return null; } };
          const walk = (value, out = []) => { if (!value || typeof value !== 'object') return out; if (Array.isArray(value)) { for (const item of value) walk(item, out); return out; } out.push(value); for (const item of Object.values(value)) walk(item, out); return out; };
          const objects = [...walk(readJson('expo-channel-preview.json')), ...walk(readJson('expo-update.json'))];
          const first = (keys) => { for (const o of objects) for (const k of keys) if (o?.[k] !== undefined && o?.[k] !== null && o?.[k] !== '') return String(o[k]); return null; };
          const unique = (keys) => [...new Set(objects.flatMap((o) => keys.map((k) => o?.[k]).filter((v) => v !== undefined && v !== null && v !== '').map(String)))];
          const groupId = first(['group','groupId','updateGroupId']);
          const runtimeVersion = first(['runtimeVersion']);
          const branch = first(['branchName','branch']);
          const updateIds = unique(['id','updateId']).filter((v) => v !== groupId).slice(0,4);
          const result = process.env.PUBLISH_RESULT || 'unknown';
          const icon = result === 'success' ? '✅' : result === 'failed' ? '❌' : '⚠️';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Expo preview OTA publication','',
            '| Field | Value |','| --- | --- |',
            `| Publish result | ${icon} ${result} |`,
            '| Expo channel | `preview` |',
            `| Channel mapped branch | ${branch ? `\`${branch}\`` : 'Not returned by Expo'} |`,
            `| Runtime version | ${runtimeVersion ? `\`${runtimeVersion}\`` : 'Not returned by Expo'} |`,
            `| Update group ID | ${groupId ? `\`${groupId}\`` : 'Not returned by Expo'} |`,
            `| Update ID(s) | ${updateIds.length ? updateIds.map((id) => `\`${id}\``).join('<br>') : 'Not returned by Expo'} |`,
            `| CLI exit code | \`${process.env.PUBLISH_EXIT_CODE || 'unknown'}\` |`,
            `| Source commit | \`${process.env.GITHUB_SHA || 'unknown'}\` |`,
            '', 'This publishes only JavaScript/assets to the existing `preview` channel. No APK is built.', ''
          ].join('\n'));
          NODE

      - name: Fail workflow when Expo publication fails
        if: always() && steps.publish.outputs.result != 'success'
        run: exit 1
