name: Publish mobile preview OTA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify OTA source is exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_head="$(git rev-parse HEAD)"
          remote_main="$(git rev-parse origin/main)"
          if [ "$current_head" != "$remote_main" ]; then
            echo "Refusing Expo preview OTA: checked-out source is not current origin/main." >&2
            exit 1
          fi

      - name: Verify current mobile OTA runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/mobile-app/app.json').expo;
          if (app.version !== '0.3.0') throw new Error(`Expected runtime 0.3.0, found ${app.version}`);
          if (app.android?.versionCode !== 9) throw new Error(`Expected Android versionCode 9, found ${app.android?.versionCode}`);
          console.log('Verified preview runtime target: 0.3.0 / versionCode 9.');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Expo preview OTA
        working-directory: apps/mobile-app
        run: |
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Expo preview 0.3.0 from main ${GITHUB_SHA}" \
            --non-interactive

      - name: Inspect preview channel mapping
        working-directory: apps/mobile-app
        run: npx eas-cli channel:view preview --json --non-interactive
