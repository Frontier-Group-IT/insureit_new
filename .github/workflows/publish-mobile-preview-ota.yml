name: Publish mobile preview OTA

on:
  push:
    branches:
      - tmp/external-claim-preview-ota-20260820

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RELEASE_SHA: 13cfcaaa2660fc8ba9f416d3e5eb4b1d37a9eb25
    steps:
      - name: Check out approved release candidate
        uses: actions/checkout@v4
        with:
          ref: 13cfcaaa2660fc8ba9f416d3e5eb4b1d37a9eb25

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Expo preview OTA
        id: publish
        working-directory: apps/mobile-app
        shell: bash
        run: |
          set +e
          npx eas-cli update \
            --branch preview \
            --environment preview \
            --message "External claim mockup redesign preview" \
            --non-interactive \
            --json \
            > expo-update.json \
            2> expo-update.stderr.log
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

          if [ -s expo-update.json ]; then
            echo "Expo publish JSON:"
            cat expo-update.json
          fi

          if [ -s expo-update.stderr.log ]; then
            echo "Expo CLI messages:" >&2
            cat expo-update.stderr.log >&2
          fi

      - name: Verify latest preview update
        if: steps.publish.outputs.result == 'success'
        working-directory: apps/mobile-app
        shell: bash
        run: |
          npx eas-cli update:list \
            --branch preview \
            --limit 1 \
            --json \
            --non-interactive \
            > expo-update-latest.json
          echo "Latest preview update JSON:"
          cat expo-update-latest.json

      - name: Write OTA publication summary
        if: always()
        working-directory: apps/mobile-app
        env:
          PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
          PUBLISH_EXIT_CODE: ${{ steps.publish.outputs.exit_code }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const readJson = (path) => { try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch { return null; } };
          const collect = (value, out = []) => {
            if (!value || typeof value !== 'object') return out;
            if (Array.isArray(value)) { for (const item of value) collect(item, out); return out; }
            out.push(value); for (const item of Object.values(value)) collect(item, out); return out;
          };
          const first = (objects, keys) => {
            for (const object of objects) for (const key of keys) {
              const value = object?.[key];
              if (value !== undefined && value !== null && value !== '') return String(value);
            }
            return null;
          };
          const unique = (objects, keys) => [...new Set(objects.flatMap((object) => keys.map((key) => object?.[key]).filter((value) => value !== undefined && value !== null && value !== '').map(String)))];
          const publish = readJson('expo-update.json');
          const latest = readJson('expo-update-latest.json');
          const objects = [...collect(latest), ...collect(publish)];
          const groupId = first(objects, ['group', 'groupId', 'updateGroupId']);
          const runtimeVersion = first(objects, ['runtimeVersion']);
          const updateIds = unique(objects, ['id', 'updateId']).filter((value) => value !== groupId).slice(0, 4);
          const branch = first(objects, ['branchName', 'branch']) || 'preview';
          const lines = [
            '## Expo preview OTA publication', '',
            '| Field | Value |', '| --- | --- |',
            `| Publish result | ${process.env.PUBLISH_RESULT === 'success' ? '✅ success' : '❌ failed'} |`,
            `| Expo branch | \`${branch}\` |`,
            `| Runtime version | ${runtimeVersion ? `\`${runtimeVersion}\`` : 'Not returned by Expo'} |`,
            `| Update group ID | ${groupId ? `\`${groupId}\`` : 'Not returned by Expo'} |`,
            `| Update ID(s) | ${updateIds.length ? updateIds.map((id) => `\`${id}\``).join('<br>') : 'Not returned by Expo'} |`,
            `| CLI exit code | \`${process.env.PUBLISH_EXIT_CODE || 'unknown'}\` |`,
            `| Approved source SHA | \`${process.env.RELEASE_SHA}\` |`, '',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Fail workflow when Expo publication fails
        if: always() && steps.publish.outputs.result != 'success'
        run: exit 1
