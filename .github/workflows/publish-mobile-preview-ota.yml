name: Publish mobile preview OTA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile-app/**'
      - '.github/workflows/publish-mobile-preview-ota.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish Expo preview OTA
        id: publish
        working-directory: apps/mobile-app
        shell: bash
        run: |
          set +e
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "Preview PR603 move document stage dots to top" \
            --non-interactive \
            --json \
            > expo-update.json \
            2> expo-update.stderr.log
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
          if [ -s expo-update.json ]; then cat expo-update.json; fi
          if [ -s expo-update.stderr.log ]; then cat expo-update.stderr.log >&2; fi

      - name: Inspect preview channel mapping
        if: steps.publish.outputs.result == 'success'
        working-directory: apps/mobile-app
        shell: bash
        run: |
          npx eas-cli channel:view preview --json --non-interactive > expo-channel-preview.json
          cat expo-channel-preview.json

      - name: Fail workflow when Expo publication fails
        if: always() && steps.publish.outputs.result != 'success'
        shell: bash
        run: exit 1
