name: Temporary redesign Add POSP page

on:
  push:
    paths:
      - scripts/temp_redesign_add_posp_page.py
      - .github/workflows/temp-redesign-add-posp-page.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply Add POSP redesign
        run: python scripts/temp_redesign_add_posp_page.py
      - name: Validate patch syntax
        run: git diff --check
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Redesign Add POSP onboarding layout"
            git pull --rebase origin main
            git push origin main
          fi
