name: Audit and repair customer RC PNG assets

on:
  push:
    branches:
      - feat/customer-native-release-readiness

permissions:
  contents: write

jobs:
  audit_repair:
    if: contains(github.event.head_commit.message, '[run-png-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release branch head
        uses: actions/checkout@v4
        with:
          ref: feat/customer-native-release-readiness
          fetch-depth: 0

      - name: Install PNG validators
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngcheck
          python -m pip install --quiet pillow

      - name: Recover corrupt PNGs from history or valid duplicate basename
        run: |
          set -euo pipefail
          validate_png() {
            pngcheck -q "$1" >/dev/null 2>&1 && python -c "from PIL import Image; import sys; im=Image.open(sys.argv[1]); im.verify()" "$1" >/dev/null 2>&1
          }
          total=0
          repaired=0
          unrecovered=0
          : > png-recovery-report.txt
          while IFS= read -r -d '' p; do
            total=$((total+1))
            if validate_png "$p"; then
              continue
            fi
            echo "INVALID: $p" | tee -a png-recovery-report.txt
            recovered=0

            while read -r commit; do
              [ -n "$commit" ] || continue
              tmp="$RUNNER_TEMP/recover.png"
              if git show "$commit:$p" > "$tmp" 2>/dev/null && validate_png "$tmp"; then
                cp "$tmp" "$p"
                echo "RECOVERED_HISTORY: $p from $commit" | tee -a png-recovery-report.txt
                repaired=$((repaired+1))
                recovered=1
                break
              fi
            done < <(git rev-list --all -- "$p")

            if [ "$recovered" -eq 0 ]; then
              base=$(basename "$p")
              while IFS= read -r -d '' candidate; do
                [ "$candidate" != "$p" ] || continue
                if validate_png "$candidate"; then
                  cp "$candidate" "$p"
                  echo "RECOVERED_DUPLICATE: $p from $candidate" | tee -a png-recovery-report.txt
                  repaired=$((repaired+1))
                  recovered=1
                  break
                fi
              done < <(find . -type f -iname "$base" -print0)
            fi

            if [ "$recovered" -eq 0 ]; then
              echo "UNRECOVERED: $p" | tee -a png-recovery-report.txt
              echo "RELATED_CANDIDATES for $p:" | tee -a png-recovery-report.txt
              stem=$(basename "$p" .png)
              find . -type f \( -iname "*${stem}*.png" -o -iname "*settlement*.png" -o -iname "*video*icon*.png" \) -print | head -80 | tee -a png-recovery-report.txt || true
              unrecovered=$((unrecovered+1))
            fi
          done < <(find apps/mobile-app -type f -iname '*.png' -print0 | sort -z)
          echo "TOTAL_PNG=$total" | tee -a png-recovery-report.txt
          echo "RECOVERED_PNG=$repaired" | tee -a png-recovery-report.txt
          echo "UNRECOVERED_PNG=$unrecovered" | tee -a png-recovery-report.txt
          cat png-recovery-report.txt
          echo "unrecovered=$unrecovered" >> "$GITHUB_OUTPUT"
        id: recover

      - name: Full PNG structural and decode audit
        run: |
          set -euo pipefail
          total=0
          failed=0
          over10=0
          : > png-audit-report.txt
          while IFS= read -r -d '' p; do
            total=$((total+1))
            bytes=$(stat -c%s "$p")
            if [ "$bytes" -gt 10485760 ]; then
              over10=$((over10+1))
              echo "LARGE_GT_10MB: $p bytes=$bytes" >> png-audit-report.txt
            fi
            if ! pngcheck -q "$p" >/dev/null 2>&1; then
              failed=$((failed+1))
              echo "PNGCHK_FAIL: $p" >> png-audit-report.txt
              continue
            fi
            if ! python -c "from PIL import Image; import sys; im=Image.open(sys.argv[1]); im.verify()" "$p" >/dev/null 2>&1; then
              failed=$((failed+1))
              echo "PIL_DECODE_FAIL: $p" >> png-audit-report.txt
            fi
          done < <(find apps/mobile-app -type f -iname '*.png' -print0 | sort -z)
          echo "TOTAL_PNG=$total" | tee -a png-audit-report.txt
          echo "FAILED_PNG=$failed" | tee -a png-audit-report.txt
          echo "OVER_10MB=$over10" | tee -a png-audit-report.txt
          cat png-audit-report.txt
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
        id: audit

      - name: Commit recovered PNGs only
        run: |
          set -euo pipefail
          git fetch origin feat/customer-native-release-readiness
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/customer-native-release-readiness)" ] || exit 1
          mapfile -t changed < <(git diff --name-only -- ':(glob)apps/mobile-app/**/*.png')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'No PNG binaries required recovery.'
            exit 0
          fi
          printf '%s\n' "${changed[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ':(glob)apps/mobile-app/**/*.png'
          git commit -m 'Recover corrupt customer PNG assets [png-audit-repair]'
          git push origin HEAD:feat/customer-native-release-readiness

      - name: Fail if any PNG remains invalid
        if: always()
        run: |
          test "${{ steps.audit.outputs.failed }}" = "0"
