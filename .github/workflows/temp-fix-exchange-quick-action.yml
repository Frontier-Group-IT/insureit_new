name: Temporary Exchange quick action patch

on:
  push:
    branches:
      - mobile/exchange-icon-coming-soon
    paths:
      - '.github/workflows/temp-fix-exchange-quick-action.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile/exchange-icon-coming-soon
          fetch-depth: 0

      - name: Patch Exchange icon and route
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/mobile-app/app/customer/home.tsx')
          text = path.read_text()
          old_route = "        onExchange={() => undefined}"
          new_route = "        onExchange={() => router.push('/customer/exchange')}"
          old_action = "        <QuickAction icon=\"swap-horizontal\" image={require('../../assets/brand/dashboard/dashboard-exchange.png')} label=\"Exchange\" tone=\"#EAF3FF\" color=\"#174EA6\" onPress={onExchange} />"
          new_action = "        <QuickAction icon=\"swap-horizontal-bold\" label=\"Exchange\" tone=\"#EAF3FF\" color=\"#174EA6\" onPress={onExchange} />"
          if old_route not in text:
              raise SystemExit('Expected Exchange route placeholder not found')
          if old_action not in text:
              raise SystemExit('Expected Exchange image action not found')
          text = text.replace(old_route, new_route, 1).replace(old_action, new_action, 1)
          path.write_text(text)

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile-app/app/customer/home.tsx
          git commit -m 'Fix Exchange icon and open coming soon screen'
          git push origin HEAD:mobile/exchange-icon-coming-soon
