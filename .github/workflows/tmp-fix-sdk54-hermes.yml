name: Temporary SDK54 Hermes Compatibility Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-sdk54-hermes.yml'

permissions:
  contents: write

jobs:
  verify-and-commit-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install aligned dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Inspect effective Expo dependency versions
        run: |
          npm ls babel-preset-expo react-native-safe-area-context react-native-svg --workspace apps/mobile-app || true
          node - <<'NODE'
          const fs = require('fs');
          const p = require('./apps/mobile-app/package.json');
          const resolveFromRoot = (name) => {
            const file = require.resolve(`${name}/package.json`, { paths: [process.cwd(), `${process.cwd()}/apps/mobile-app`] });
            return JSON.parse(fs.readFileSync(file, 'utf8')).version;
          };
          console.log('declared babel-preset-expo:', p.devDependencies['babel-preset-expo']);
          console.log('installed babel-preset-expo:', resolveFromRoot('babel-preset-expo'));
          console.log('declared safe-area:', p.dependencies['react-native-safe-area-context']);
          console.log('installed safe-area:', resolveFromRoot('react-native-safe-area-context'));
          console.log('declared svg:', p.dependencies['react-native-svg']);
          console.log('installed svg:', resolveFromRoot('react-native-svg'));
          NODE

      - name: Expo compatibility advisory
        working-directory: apps/mobile-app
        run: npx expo install --check || true

      - name: Verify TypeScript and lint
        run: |
          npm run typecheck:mobile
          npm run lint:mobile

      - name: Reproduce Android release bundle and compile with Hermes
        env:
          NODE_ENV: production
        working-directory: apps/mobile-app
        run: |
          rm -f /tmp/index.android.bundle /tmp/index.android.hbc /tmp/index.android.map /tmp/hermes.err
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output /tmp/index.android.bundle \
            --sourcemap-output /tmp/index.android.map
          set +e
          ../../node_modules/react-native/sdks/hermesc/linux64-bin/hermesc \
            -O \
            -emit-binary \
            -out /tmp/index.android.hbc \
            /tmp/index.android.bundle 2>/tmp/hermes.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '--- Hermes compiler errors ---'
            cat /tmp/hermes.err
            first_line=$(grep -oE 'index\.android\.bundle:[0-9]+' /tmp/hermes.err | head -1 | cut -d: -f2 || true)
            if [ -n "$first_line" ]; then
              start=$(( first_line > 60 ? first_line - 60 : 1 ))
              end=$(( first_line + 120 ))
              echo "--- Bundle context lines ${start}-${end} ---"
              sed -n "${start},${end}p" /tmp/index.android.bundle
            fi
            echo '--- Candidate source files containing private geometry fields ---'
            grep -R -n -E '#(x|y|width|height);' ../../node_modules 2>/dev/null | head -40 || true
            exit "$rc"
          fi
          test -s /tmp/index.android.hbc
          echo "Hermes release compilation passed."

      - name: Verify Expo web export
        run: npm run build:mobile:web

      - name: Commit refreshed lockfile
        run: |
          git config user.name "antnish1"
          git config user.email "shahdolho@gmail.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already aligned."
            exit 0
          fi
          git commit -m "Refresh lockfile for Expo SDK 54 dependency alignment"
          git pull --rebase origin main
          git push origin HEAD:main
