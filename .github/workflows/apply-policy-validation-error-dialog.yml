name: Temporary policy validation dialog patch

on:
  push:
    paths:
      - scripts/temp_policy_validation_error_dialog.py
      - .github/workflows/apply-policy-validation-error-dialog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply validation dialog change
        run: python scripts/temp_policy_validation_error_dialog.py
      - name: Validate and commit focused application change
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          grep -q 'ValidationErrorDialog message={submitError}' apps/web-portal/components/policy-form-authbridge.tsx
          grep -q 'role="alertdialog"' apps/web-portal/components/policy-form-authbridge.tsx
          ! grep -q 'submitError ? <div className="mb-4 rounded-xl border border-red-200' apps/web-portal/components/policy-form-authbridge.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show policy validation errors in dialog"
          git push
