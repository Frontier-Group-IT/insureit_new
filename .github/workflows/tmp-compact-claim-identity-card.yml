name: Temporary compact claim identity card

on:
  push:
    branches:
      - ui/compact-claim-identity-card
    paths:
      - '.github/workflows/tmp-compact-claim-identity-card.yml'

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/compact-claim-identity-card
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply compact shared identity card
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('apps/mobile-app/components/external-claim-ui.tsx')
          s = ui.read_text()
          anchor = "export function ClaimStageSummaryCard({ title, body, label = 'CLAIM UPDATE', note = 'This claim is being tracked by you. Sankalp is not processing this claim unless you request assistance.', icon = 'shield-check-outline' }: { title: string; body: string; label?: string; note?: string; icon?: keyof typeof MaterialCommunityIcons.glyphMap }) {"
          component = '''export function ClaimIdentityCard({\n  claimNo,\n  insurerName,\n  vehicleNo,\n  policyNo,\n  vehicleMeta,\n}: {\n  claimNo?: string | null;\n  insurerName?: string | null;\n  vehicleNo?: string | null;\n  policyNo?: string | null;\n  vehicleMeta?: string | null;\n}) {\n  return (\n    <View style={styles.claimIdentityCard}>\n      <View style={styles.claimIdentityGlow} />\n      <View style={styles.claimIdentitySection}>\n        <View style={styles.claimIdentityPrimaryIcon}>\n          <MaterialCommunityIcons name="file-document-outline" size={23} color="#083B9B" />\n        </View>\n        <View style={styles.claimIdentityCopy}>\n          <Text style={styles.claimIdentityLabel}>CLAIM DETAILS</Text>\n          <Text style={styles.claimIdentityValue} numberOfLines={1}>{claimNo || 'New claim'}</Text>\n          <Text style={styles.claimIdentityMeta} numberOfLines={1}>{insurerName || 'Insurance company'}</Text>\n        </View>\n      </View>\n      <View style={styles.claimIdentityDivider} />\n      <View style={styles.claimIdentitySection}>\n        <View style={styles.claimIdentityVehicleIcon}>\n          <MaterialCommunityIcons name="car-outline" size={21} color="#FFFFFF" />\n        </View>\n        <View style={styles.claimIdentityCopy}>\n          <Text style={styles.claimIdentityLabel}>CLAIM VEHICLE</Text>\n          <Text style={styles.claimIdentityValue} numberOfLines={1}>{vehicleNo || 'Vehicle'}</Text>\n          <Text style={styles.claimIdentityMeta} numberOfLines={1}>\n            {[policyNo ? `Policy: ${policyNo}` : '', vehicleMeta || ''].filter(Boolean).join('  •  ')}\n          </Text>\n        </View>\n        <View style={styles.claimIdentityFocus}>\n          <MaterialCommunityIcons name="crosshairs-gps" size={18} color="#AFCBFF" />\n        </View>\n      </View>\n    </View>\n  );\n}\n\n'''
          if component.strip() not in s:
              if anchor not in s: raise SystemExit('summary anchor missing')
              s = s.replace(anchor, component + anchor)
          style_anchor = "  summaryCard: { position: 'relative', borderRadius: 20, backgroundColor: '#07327B', padding: 16, marginBottom: 13, overflow: 'hidden', shadowColor: '#072C69', shadowOpacity: 0.16, shadowRadius: 10, shadowOffset: { width: 0, height: 5 }, elevation: 3 },"
          styles = """  claimIdentityCard: { position: 'relative', minHeight: 92, borderRadius: 18, backgroundColor: '#07327B', paddingHorizontal: 12, paddingVertical: 11, marginBottom: 13, overflow: 'hidden', flexDirection: 'row', alignItems: 'center', shadowColor: '#072C69', shadowOpacity: 0.14, shadowRadius: 9, shadowOffset: { width: 0, height: 4 }, elevation: 3 },\n  claimIdentityGlow: { position: 'absolute', width: 150, height: 150, borderRadius: 75, borderWidth: 1, borderColor: 'rgba(72,139,255,0.22)', right: -62, top: -78 },\n  claimIdentitySection: { flex: 1, minWidth: 0, flexDirection: 'row', alignItems: 'center', gap: 9 },\n  claimIdentityPrimaryIcon: { width: 44, height: 44, borderRadius: 13, backgroundColor: '#FFFFFF', alignItems: 'center', justifyContent: 'center' },\n  claimIdentityVehicleIcon: { width: 40, height: 40, borderRadius: 12, backgroundColor: 'rgba(255,255,255,0.12)', alignItems: 'center', justifyContent: 'center' },\n  claimIdentityCopy: { flex: 1, minWidth: 0 },\n  claimIdentityLabel: { color: '#BBD1F6', fontSize: 7.8, lineHeight: 10, fontWeight: '900', letterSpacing: 0.55 },\n  claimIdentityValue: { color: '#FFFFFF', fontSize: 14.5, lineHeight: 19, fontWeight: '900', marginTop: 2 },\n  claimIdentityMeta: { color: '#D8E4F4', fontSize: 8.2, lineHeight: 11, fontWeight: '700', marginTop: 2 },\n  claimIdentityDivider: { width: 1, alignSelf: 'stretch', backgroundColor: 'rgba(255,255,255,0.22)', marginHorizontal: 11 },\n  claimIdentityFocus: { width: 26, height: 26, borderRadius: 13, alignItems: 'center', justifyContent: 'center' },\n"""
          if 'claimIdentityCard:' not in s:
              if style_anchor not in s: raise SystemExit('style anchor missing')
              s = s.replace(style_anchor, styles + style_anchor)
          ui.write_text(s)

          p = Path('apps/mobile-app/app/customer/self-managed-claim.tsx')
          s = p.read_text()
          s = s.replace("import { ClaimActionBar, ClaimFormSection, ExternalClaimStageHeader } from '@/components/external-claim-ui';", "import { ClaimActionBar, ClaimFormSection, ClaimIdentityCard, ExternalClaimStageHeader } from '@/components/external-claim-ui';")
          s = s.replace("  const [insurerName, setInsurerName] = useState('Insurance company');", "  const [insurerName, setInsurerName] = useState('Insurance company');\n  const [claimNo, setClaimNo] = useState('');")
          s = s.replace("select('id,customer_id,vehicle_id,external_policy_id,accident_at,accident_location,claim_service_mode')", "select('id,claim_no,customer_id,vehicle_id,external_policy_id,accident_at,accident_location,claim_service_mode')")
          s = s.replace("        const claim = claimResult.data as any;", "        const claim = claimResult.data as any;\n        setClaimNo(claim?.claim_no ?? '');")
          old = """        claimNo={editing ? 'Existing claim' : undefined}\n        onBack={() => router.back()}\n      />\n\n      {policy ? <PolicyIdentityCard policyNo={policy.policy_no} insurerName={insurerName} vehicleNo={vehicle?.vehicle_no ?? 'Vehicle'} vehicleMake={vehicle?.make ?? ''} vehicleModel={vehicle?.model ?? ''} /> : null}"""
          new = """        vehicleNo={vehicle?.vehicle_no ?? undefined}\n        claimNo={claimNo || undefined}\n        onBack={() => router.back()}\n      />\n\n      {policy ? <ClaimIdentityCard claimNo={claimNo || (editing ? 'Claim' : 'New claim')} insurerName={insurerName} vehicleNo={vehicle?.vehicle_no ?? 'Vehicle'} policyNo={policy.policy_no} vehicleMeta={[vehicle?.make, vehicle?.model].filter(Boolean).join(' · ')} /> : null}"""
          if old not in s: raise SystemExit('stage1 identity usage missing')
          s = s.replace(old, new)
          start = s.find("function PolicyIdentityCard(")
          if start != -1:
              end = s.find("\nfunction DocumentReadyTile", start)
              if end == -1: raise SystemExit('policy card end missing')
              s = s[:start] + s[end+1:]
          for line in [
            "  policyIdentityCard: { position: 'relative', minHeight: 132, borderRadius: 20, backgroundColor: '#07327B', padding: 14, marginBottom: 13, overflow: 'hidden', shadowColor: '#072C69', shadowOpacity: 0.16, shadowRadius: 10, shadowOffset: { width: 0, height: 5 }, elevation: 3 },\n",
            "  policyIdentityGlow: { position: 'absolute', width: 210, height: 210, borderRadius: 105, borderWidth: 1, borderColor: 'rgba(72,139,255,0.24)', right: -98, top: -118 },\n",
            "  policyIdentityTop: { flexDirection: 'row', alignItems: 'center', gap: 11 },\n",
            "  policyIdentityIcon: { width: 52, height: 52, borderRadius: 15, backgroundColor: '#FFFFFF', alignItems: 'center', justifyContent: 'center' },\n",
            "  policyIdentityCopy: { flex: 1, minWidth: 0 },\n",
            "  policyIdentityEyebrow: { color: '#CFDDF5', fontSize: 8.5, fontWeight: '900', letterSpacing: 0.5 },\n",
            "  policyIdentityNo: { color: '#FFFFFF', fontSize: 17, fontWeight: '900', marginTop: 3 },\n",
            "  policyIdentityInsurer: { color: '#DCE8F7', fontSize: 10, lineHeight: 14, fontWeight: '700', marginTop: 4 },\n",
            "  policyVehicleDivider: { height: 1, backgroundColor: 'rgba(255,255,255,0.18)', marginVertical: 11 },\n",
            "  vehicleIdentityRow: { minHeight: 55, paddingHorizontal: 2, paddingVertical: 5, flexDirection: 'row', alignItems: 'center', gap: 10 },\n",
            "  vehicleIdentityIcon: { width: 36, height: 36, borderRadius: 11, backgroundColor: 'rgba(255,255,255,0.12)', alignItems: 'center', justifyContent: 'center' },\n",
            "  vehicleIdentityCopy: { flex: 1, minWidth: 0 },\n",
            "  vehicleIdentityLabel: { color: '#AFCBFF', fontSize: 8, fontWeight: '900', letterSpacing: 0.65 },\n",
            "  vehicleIdentityNo: { color: '#FFFFFF', fontSize: 19, lineHeight: 23, fontWeight: '900', letterSpacing: 0.25, marginTop: 1 },\n",
            "  vehicleIdentityMeta: { color: '#CBDCF2', fontSize: 9, lineHeight: 12, fontWeight: '700', marginTop: 1 },\n",
            "  vehicleIdentityFocus: { width: 34, height: 34, borderRadius: 17, alignItems: 'center', justifyContent: 'center' },\n",
          ]:
              s = s.replace(line, '')
          p.write_text(s)

          p = Path('apps/mobile-app/app/customer/self-managed-spot-status.tsx')
          s = p.read_text()
          s = s.replace("import { ClaimActionBar, ClaimFormSection, ClaimStageSummaryCard, ExternalClaimStageHeader } from '@/components/external-claim-ui';", "import { ClaimActionBar, ClaimFormSection, ClaimIdentityCard, ExternalClaimStageHeader } from '@/components/external-claim-ui';")
          s = s.replace("  const [vehicleNo, setVehicleNo] = useState('');", "  const [vehicleNo, setVehicleNo] = useState('');\n  const [vehicleMeta, setVehicleMeta] = useState('');\n  const [policyNo, setPolicyNo] = useState('');\n  const [insurerName, setInsurerName] = useState('Insurance company');")
          s = s.replace("select('id, claim_no, claim_service_mode, vehicle_id')", "select('id, claim_no, claim_service_mode, vehicle_id, external_policy_id')")
          old = """      const vehicleId = (claimResult.data as any).vehicle_id as string | undefined;\n      if (vehicleId) {\n        const vehicleResult = await supabase.from('vehicles').select('vehicle_no').eq('id', vehicleId).maybeSingle();\n        if (active && vehicleResult.data) setVehicleNo((vehicleResult.data as any).vehicle_no ?? '');\n      }"""
          new = """      const vehicleId = (claimResult.data as any).vehicle_id as string | undefined;\n      if (vehicleId) {\n        const vehicleResult = await supabase.from('vehicles').select('vehicle_no,make,model').eq('id', vehicleId).maybeSingle();\n        if (active && vehicleResult.data) {\n          setVehicleNo((vehicleResult.data as any).vehicle_no ?? '');\n          setVehicleMeta([(vehicleResult.data as any).make, (vehicleResult.data as any).model].filter(Boolean).join(' · '));\n        }\n      }\n      const externalPolicyId = (claimResult.data as any).external_policy_id as string | undefined;\n      if (externalPolicyId) {\n        const policyResult = await (supabase as any).from('external_policies').select('policy_no,insurance_company_id').eq('id', externalPolicyId).maybeSingle();\n        if (active && policyResult.data) {\n          setPolicyNo(policyResult.data.policy_no ?? '');\n          if (policyResult.data.insurance_company_id) {\n            const insurerResult = await supabase.from('insurance_companies').select('name').eq('id', policyResult.data.insurance_company_id).maybeSingle();\n            if (active && insurerResult.data?.name) setInsurerName(insurerResult.data.name);\n          }\n        }\n      }"""
          if old not in s: raise SystemExit('spot vehicle loader missing')
          s = s.replace(old, new)
          old = """      <ClaimStageSummaryCard\n        title="Spot Status"\n        body="Record the survey completion details you received for this external claim."\n        icon="shield-check-outline"\n      />"""
          new = """      <ClaimIdentityCard\n        claimNo={claimNo}\n        insurerName={insurerName}\n        vehicleNo={vehicleNo}\n        policyNo={policyNo}\n        vehicleMeta={vehicleMeta}\n      />"""
          if old not in s: raise SystemExit('spot summary card missing')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('apps/mobile-app/app/customer/self-managed-milestone.tsx')
          s = p.read_text()
          s = s.replace("import { ClaimActionBar, ClaimChoice, ClaimFinancialSummary, ClaimFormSection, ClaimInlineNote, ClaimStageSummaryCard, ExternalClaimStageHeader } from '@/components/external-claim-ui';", "import { ClaimActionBar, ClaimChoice, ClaimFinancialSummary, ClaimFormSection, ClaimIdentityCard, ClaimInlineNote, ExternalClaimStageHeader } from '@/components/external-claim-ui';")
          s = s.replace("type ClaimIdentity = { claim_no?: string | null; vehicle_id?: string | null; customer_id?: string | null };", "type ClaimIdentity = { claim_no?: string | null; vehicle_id?: string | null; customer_id?: string | null; external_policy_id?: string | null };")
          s = s.replace("  const [customerId, setCustomerId] = useState('');", "  const [customerId, setCustomerId] = useState('');\n  const [vehicleMeta, setVehicleMeta] = useState('');\n  const [policyNo, setPolicyNo] = useState('');\n  const [insurerName, setInsurerName] = useState('Insurance company');")
          s = s.replace("select('claim_no, vehicle_id, customer_id')", "select('claim_no, vehicle_id, customer_id, external_policy_id')")
          old = """      if (identity.vehicle_id) {\n        const vehicleResult = await supabase.from('vehicles').select('vehicle_no').eq('id', identity.vehicle_id).maybeSingle();\n        if (active && vehicleResult.data) setVehicleNo((vehicleResult.data as any).vehicle_no ?? '');\n      }"""
          new = """      if (identity.vehicle_id) {\n        const vehicleResult = await supabase.from('vehicles').select('vehicle_no,make,model').eq('id', identity.vehicle_id).maybeSingle();\n        if (active && vehicleResult.data) {\n          setVehicleNo((vehicleResult.data as any).vehicle_no ?? '');\n          setVehicleMeta([(vehicleResult.data as any).make, (vehicleResult.data as any).model].filter(Boolean).join(' · '));\n        }\n      }\n      if (identity.external_policy_id) {\n        const policyResult = await (supabase as any).from('external_policies').select('policy_no,insurance_company_id').eq('id', identity.external_policy_id).maybeSingle();\n        if (active && policyResult.data) {\n          setPolicyNo(policyResult.data.policy_no ?? '');\n          if (policyResult.data.insurance_company_id) {\n            const insurerResult = await supabase.from('insurance_companies').select('name').eq('id', policyResult.data.insurance_company_id).maybeSingle();\n            if (active && insurerResult.data?.name) setInsurerName(insurerResult.data.name);\n          }\n        }\n      }"""
          if old not in s: raise SystemExit('milestone vehicle loader missing')
          s = s.replace(old, new)
          old = """      <ClaimStageSummaryCard\n        title={definition.label}\n        body={summaryBodyFor(key)}\n        label={key === 'vehicle_delivery' ? 'CLAIM STATUS' : 'CLAIM UPDATE'}\n        icon={summaryIconFor(key)}\n      />"""
          new = """      <ClaimIdentityCard\n        claimNo={claimNo}\n        insurerName={insurerName}\n        vehicleNo={vehicleNo}\n        policyNo={policyNo}\n        vehicleMeta={vehicleMeta}\n      />"""
          if old not in s: raise SystemExit('milestone summary card missing')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify mobile
        run: |
          npm run typecheck:mobile
          npm run lint:mobile
      - name: Commit verified changes and remove workflow
        run: |
          git config user.name "antnish1"
          git config user.email "shahdolho@gmail.com"
          git add apps/mobile-app/components/external-claim-ui.tsx apps/mobile-app/app/customer/self-managed-claim.tsx apps/mobile-app/app/customer/self-managed-spot-status.tsx apps/mobile-app/app/customer/self-managed-milestone.tsx
          git commit -m "Standardize compact claim identity card across stages"
          git rm .github/workflows/tmp-compact-claim-identity-card.yml
          git commit -m "chore: remove temporary claim identity workflow"
          git push origin HEAD:ui/compact-claim-identity-card
