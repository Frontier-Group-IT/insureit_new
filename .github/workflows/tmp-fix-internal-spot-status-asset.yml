name: Temporary fix internal Spot Status asset

on:
  push:
    branches:
      - flow/internal-stage1-direct-stage2
    paths:
      - .github/workflows/tmp-fix-internal-spot-status-asset.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flow/internal-stage1-direct-stage2
          fetch-depth: 0
      - name: Fix Spot Status asset reference
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile-app/app/customer/internal-spot-status.tsx')
          text = path.read_text()
          text = text.replace("import { palette } from '@/lib/theme';\n", '')
          text = text.replace("../../assets/claims/insurance.png", "../../assets/claims/claim-approval.png")
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/internal-spot-status.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix internal Spot Status asset reference"
          git push origin HEAD:flow/internal-stage1-direct-stage2
