name: Temp account review parent partner link

on:
  push:
    paths:
      - scripts/temp_account_review_parent_partner_link.py
      - .github/workflows/temp-account-review-parent-partner-link.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused patch
        run: python scripts/temp_account_review_parent_partner_link.py
      - name: Validate focused change
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('apps/web-portal/app/intermediaries/applications/[id]/page.tsx').read_text()
          assert 'const parentApplication = !isPartner' in text
          assert 'href: parentApplication ? `/intermediaries/applications/${parentApplication.id}` : undefined' in text
          assert 'function HeaderStat({ icon, label, value, href }' in text
          PY
      - name: Commit app change and remove temporary files
        run: |
          rm scripts/temp_account_review_parent_partner_link.py
          rm .github/workflows/temp-account-review-parent-partner-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/intermediaries/applications/'[id]'/page.tsx scripts/temp_account_review_parent_partner_link.py .github/workflows/temp-account-review-parent-partner-link.yml
          git commit -m "Link parent Partner from account review header"
          git push
