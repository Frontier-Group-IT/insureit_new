name: Fix final bill Linking import

on:
  push:
    branches:
      - feature/mobile-billing-bill-upload-v3
    paths:
      - '.github/workflows/tmp-fix-final-bill-linking.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-billing-bill-upload-v3
          fetch-depth: 0
      - name: Add Linking import
        run: |
          python .github/tmp/fix-final-bill-linking.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "antnish1"
          git config user.email "shahdolho@gmail.com"
          git rm .github/workflows/tmp-fix-final-bill-linking.yml
          git rm .github/tmp/fix-final-bill-linking.py
          git add apps/mobile-app/app/customer/self-managed-milestone.tsx
          git diff --cached --check
          git commit -m "Fix final bill view import"
          git push origin HEAD:feature/mobile-billing-bill-upload-v3
