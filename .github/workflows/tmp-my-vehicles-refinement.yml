name: Temporary My Vehicles refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-my-vehicles-refinement.yml'

permissions:
  contents: write

jobs:
  refine-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply requested My Vehicles refinements
        run: |
          python -m pip install --quiet pillow
          python tools/tmp_my_vehicles_refinement.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Mobile typecheck
        run: npm --workspace apps/mobile-app run typecheck

      - name: Focused mobile lint
        working-directory: apps/mobile-app
        run: npx eslint app/customer/vehicles.tsx app/customer/add-vehicle.tsx --quiet

      - name: Android Expo export
        working-directory: apps/mobile-app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-public-anon-key' }}
          NODE_ENV: production
        run: npx expo export --platform android --output-dir /tmp/my-vehicles-refinement

      - name: Commit verified refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile-app/app/customer/vehicles.tsx apps/mobile-app/app/customer/add-vehicle.tsx apps/mobile-app/assets/vehicles/'bus sketch.png' apps/mobile-app/assets/vehicles/'bike sketch.png' apps/mobile-app/assets/vehicles/'jcb sketch.png'
          git commit -m 'Refine My Vehicles and Add Vehicle experience'
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "PUBLISHED_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish Expo preview OTA
        working-directory: apps/mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@18 update --channel preview --environment preview --message "Refine My Vehicles and Add Vehicle 2026-08-16" --non-interactive
