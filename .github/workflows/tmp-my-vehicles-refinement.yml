              "  inlineAddPolicy: { alignSelf: 'flex-end', minHeight: 24, borderRadius: 8, borderWidth: 1, borderColor: '#B8D4F7', backgroundColor: '#F2F7FF', paddingHorizontal: 7, flexDirection: 'row', alignItems: 'center', gap: 4, marginTop: 6 },\n  inlineAddPolicyText: { color: '#0A43A3', fontSize: 9.4, lineHeight: 12, fontWeight: '900' },",
              "  policyEmptyState: { flex: 1, minHeight: 144, borderRadius: 14, backgroundColor: '#F5F9FF', borderWidth: 1, borderColor: '#CFE0F5', alignItems: 'center', justifyContent: 'center', paddingHorizontal: 10, paddingVertical: 10 },\n  policyEmptyStatePressed: { backgroundColor: '#EAF3FF', transform: [{ scale: 0.985 }] },\n  policyEmptyIcon: { width: 50, height: 50, borderRadius: 18, backgroundColor: '#E4F0FF', alignItems: 'center', justifyContent: 'center', marginBottom: 5 },\n  policyEmptyTitle: { color: palette.navy, fontSize: 13.5, lineHeight: 17, fontWeight: '900' },\n  policyEmptyText: { color: '#718096', fontSize: 9.5, lineHeight: 12, fontWeight: '700', textAlign: 'center', marginTop: 2 },\n  policyEmptyButton: { minHeight: 29, borderRadius: 9, backgroundColor: '#0A43A3', paddingHorizontal: 11, flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 4, marginTop: 7 },\n  policyEmptyButtonText: { color: '#FFFFFF', fontSize: 10, lineHeight: 13, fontWeight: '900' },"
            )
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected vehicles fragment not found: {old[:160]}')
            text = text.replace(old, new, 1)

          if 'inlineAddPolicy' in text:
            raise SystemExit('Old inline Add Policy row is still present')
          if "vehicleSketchFor(vehicle)" not in text:
            raise SystemExit('Vehicle class sketch selector missing')
          vehicles_path.write_text(text)

          add_path = Path('apps/mobile-app/app/customer/add-vehicle.tsx')
          add = add_path.read_text()
          replacements = [
            (
              "import { ActivityIndicator, Modal, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';",
              "import { ActivityIndicator, Modal, Pressable, ScrollView, StyleSheet, Text, TextInput, View } from 'react-native';"
            ),
            (
              "  const selectedContext = contexts.find((context) => context.customer_id === selectedCustomerId) ?? null;\n",
              ""
            ),
            (
              "    if (!vehicleNo.trim()) return setMessage('Enter the RC number.');\n    if (!make.trim()) return setMessage('Select the vehicle manufacturer.');",
              "    if (!vehicleNo.trim()) return setMessage('Enter the RC number.');\n    if (!vehicleType) return setMessage('Select the vehicle class.');\n    if (!make.trim()) return setMessage('Select the vehicle manufacturer.');"
            ),
            (
              "      <View style={styles.modalHeader}><View><Text style={styles.modalEyebrow}>VEHICLE ONBOARDING</Text><Text style={styles.compactTitle}>Add Vehicle</Text><Text style={styles.modalSub}>Add the vehicle now; optional details can be completed later.</Text></View><Pressable accessibilityRole=\"button\" onPress={() => router.back()} style={styles.modalClose}><MaterialCommunityIcons name=\"close\" size={20} color={palette.navy} /></Pressable></View>",
              "      <View style={styles.modalHeader}><View><Text style={styles.modalEyebrow}>VEHICLE ONBOARDING</Text><Text style={styles.compactTitle}>Add Vehicle</Text></View><Pressable accessibilityRole=\"button\" onPress={() => router.back()} style={styles.modalClose}><MaterialCommunityIcons name=\"close\" size={20} color={palette.navy} /></Pressable></View>"
