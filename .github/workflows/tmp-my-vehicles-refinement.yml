            ),
            (
              "        const vehicleImage = isPrivateVehicle(vehicle) ? carSketch : truckSketch;",
              "        const vehicleImage = vehicleSketchFor(vehicle);"
            ),
            (
'''              <View style={styles.rightPane}>
                <InfoBlock
