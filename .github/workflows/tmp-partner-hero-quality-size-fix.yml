name: Temporary Partner hero quality and size patch

on:
  push:
    branches:
      - ui/partner-hero-quality-size-fix
    paths:
      - '.github/workflows/tmp-partner-hero-quality-size-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/partner-hero-quality-size-fix
          fetch-depth: 0

      - name: Rebuild and verify high-quality mobile hero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/partner-app/assets/figma-dashboard
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = sorted(Path('.tmp/partner-hero').glob('part*.txt'))
          expected_lengths = [15500, 15500, 15500, 13916]
          if len(parts) != 4:
              raise SystemExit(f'Expected 4 hero chunks, found {len(parts)}')
          encoded = ''
          for path, expected in zip(parts, expected_lengths):
              text = path.read_text()
              print(f'{path}: {len(text)} chars')
              if len(text) != expected:
                  raise SystemExit(f'Unexpected chunk length for {path}: {len(text)}')
              encoded += text
          print(f'combined base64 chars={len(encoded)}')
          data = base64.b64decode(encoded, validate=True)
          print(f'decoded hero bytes={len(data)}')
          digest = hashlib.sha256(data).hexdigest()
          print(f'sha256={digest}')
          if len(data) != 45312:
              raise SystemExit(f'Unexpected hero asset size: {len(data)}')
          if digest != '38653cc36ed69567f106bfc6870175eb7ecc29f0812e32e353022b38c6df1707':
              raise SystemExit('Unexpected hero asset digest')
          Path('apps/partner-app/assets/figma-dashboard/hero-banner.webp').write_bytes(data)
          PY
          python - <<'PY'
          from PIL import Image
          path='apps/partner-app/assets/figma-dashboard/hero-banner.webp'
          with Image.open(path) as image:
              print(f'hero dimensions={image.size}, format={image.format}')
              if image.size != (900, 300):
                  raise SystemExit(f'Expected 900x300 hero, got {image.size}')
              if image.format != 'WEBP':
                  raise SystemExit(f'Expected WEBP hero, got {image.format}')
          PY

      - name: Apply agreed header geometry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/partner-app/app/(tabs)/index.tsx')
          s = p.read_text()
          replacements = {
              "homeHeader: require('../../assets/figma-dashboard/hero-banner.jpg'),": "homeHeader: require('../../assets/figma-dashboard/hero-banner.webp'),",
              'const heroHeight = 90;': 'const heroHeight = 120;',
              "heroGreeting: { zIndex: 2, position: 'absolute', left: 14, right: 92, bottom: 8 },": "heroGreeting: { zIndex: 2, position: 'absolute', left: 14, right: 92, bottom: 26 },",
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -F "homeHeader: require('../../assets/figma-dashboard/hero-banner.webp')," 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F 'const heroHeight = 120;' 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "heroGreeting: { zIndex: 2, position: 'absolute', left: 14, right: 92, bottom: 26 }," 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "body: { marginTop: -18, paddingHorizontal: 14 }," 'apps/partner-app/app/(tabs)/index.tsx'

      - name: Clean staging files and commit final patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f apps/partner-app/assets/figma-dashboard/hero-banner.jpg
          rm -rf .tmp/partner-hero
          rm -f .github/workflows/tmp-partner-hero-quality-size-fix.yml
          git config user.name 'insureit-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          echo 'Final staged diff:'
          git diff --cached --stat
          git diff --cached --name-status
          git commit -m 'Improve Partner hero size and image quality'
          git push origin HEAD:ui/partner-hero-quality-size-fix
