name: Temporary Customer partner type-only patch

on:
  push:
    branches:
      - feature/customer-partner-type-only

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-partner-type-only
          fetch-depth: 0
      - name: Apply scoped UI patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web-portal/app/customers/customer-workspace.tsx')
          s = p.read_text()
          old = '''                <th className="w-[190px] px-2.5 py-2.5">Type / location</th>'''
          new = '''                <th className="w-[190px] px-2.5 py-2.5">Partner type</th>'''
          if old not in s:
              raise SystemExit('Expected table header not found')
          s = s.replace(old, new, 1)
          old2 = '''                    <p className="truncate font-semibold text-[#334155]">{customer.partner_type ? partnerLabels[customer.partner_type] ?? customer.partner_type : "Not classified"}</p>\n                    <p className="mt-0.5 truncate text-[9.5px] text-[#64748B]">{customer.city ?? "Location not set"}</p>'''
          new2 = '''                    <p className="truncate font-semibold text-[#334155]">{customer.partner_type ? partnerLabels[customer.partner_type] ?? customer.partner_type : "Not classified"}</p>'''
          if old2 not in s:
              raise SystemExit('Expected partner/location cells not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-customer-partner-type-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/customers/customer-workspace.tsx .github/workflows/tmp-customer-partner-type-only.yml
          git commit -m "Show only partner type in customer register"
          git push origin HEAD:feature/customer-partner-type-only
