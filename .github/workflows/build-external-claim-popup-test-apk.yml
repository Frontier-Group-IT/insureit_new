name: Build external claim popup test APK

on:
  push:
    branches:
      - fix/external-claim-all-stage-error-popups
    paths:
      - apps/mobile-app/**
      - .github/workflows/build-external-claim-popup-test-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/external-claim-all-stage-error-popups

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Android test APK
        id: build
        working-directory: apps/mobile-app
        shell: bash
        run: |
          set +e
          npx eas-cli build \
            --platform android \
            --profile externalClaimPopupTest \
            --non-interactive \
            --wait \
            --json \
            > eas-build.json \
            2> eas-build.stderr.log
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

          if [ -s eas-build.json ]; then
            echo "EAS build JSON:"
            cat eas-build.json
          fi

          if [ -s eas-build.stderr.log ]; then
            echo "EAS CLI messages:" >&2
            cat eas-build.stderr.log >&2
          fi

      - name: Write APK build summary
        if: always()
        working-directory: apps/mobile-app
        env:
          BUILD_RESULT: ${{ steps.build.outputs.result }}
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          let build = null;
          try { build = JSON.parse(fs.readFileSync('eas-build.json', 'utf8')); } catch {}
          const items = Array.isArray(build) ? build : build ? [build] : [];
          const first = items[0] || {};
          const buildId = first.id || first.build?.id || null;
          const status = first.status || first.build?.status || null;
          const artifactUrl = first.artifacts?.buildUrl || first.artifactUrl || first.buildUrl || first.build?.artifacts?.buildUrl || null;
          const result = process.env.BUILD_RESULT || 'unknown';
          const icon = result === 'success' ? '✅' : result === 'failed' ? '❌' : '⚠️';
          const lines = [
            '## External claim popup test APK',
            '',
            '| Field | Value |',
            '| --- | --- |',
            `| Build result | ${icon} ${result} |`,
            '| EAS profile | `externalClaimPopupTest` |',
            '| Expo channel | `external-claim-popup-test` |',
            `| EAS build status | ${status ? `\`${status}\`` : 'Not returned by EAS'} |`,
            `| Build ID | ${buildId ? `\`${buildId}\`` : 'Not returned by EAS'} |`,
            `| APK URL | ${artifactUrl || 'Not returned by EAS'} |`,
            `| CLI exit code | \`${process.env.BUILD_EXIT_CODE || 'unknown'}\` |`,
            `| Source commit | \`${process.env.GITHUB_SHA || 'unknown'}\` |`,
            '',
            'This is a feature-branch test build. It does not publish or merge `main`.',
            '',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Fail workflow when EAS build fails
        if: always() && steps.build.outputs.result != 'success'
        shell: bash
        run: |
          echo "External claim popup test APK build failed with exit code ${{ steps.build.outputs.exit_code }}." >&2
          exit 1
