name: Apply Partner associate address fields migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260919123000_partner_associate_address_fields.sql'
      - '.github/workflows/apply-partner-associate-address-fields.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner associate address fields migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260919123000_partner_associate_address_fields.sql
          test -f supabase/rollbacks/20260919123000_partner_associate_address_fields.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Partner associate address migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260919123000'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260919123000_partner_associate_address_fields.sql
            supabase migration repair --linked --status applied 20260919123000
          fi

      - name: Verify Partner associate address columns
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              count(*) filter (where column_name = 'address') as address_ready,
              count(*) filter (where column_name = 'city') as city_ready,
              count(*) filter (where column_name = 'state') as state_ready,
              count(*) filter (where column_name = 'postal_code') as postal_code_ready
            from information_schema.columns
            where table_schema='public'
              and table_name='partner_portal_associate_accounts';
          ")
          echo "$result"
          echo "$result" | grep -Eq '"address_ready"[[:space:]]*:[[:space:]]*1'
          echo "$result" | grep -Eq '"city_ready"[[:space:]]*:[[:space:]]*1'
          echo "$result" | grep -Eq '"state_ready"[[:space:]]*:[[:space:]]*1'
          echo "$result" | grep -Eq '"postal_code_ready"[[:space:]]*:[[:space:]]*1'
