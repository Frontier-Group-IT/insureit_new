name: Apply external renewal Policy Intake link migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260906233000_external_renewal_policy_intake_link.sql'
      - '.github/workflows/apply-external-renewal-policy-intake-link.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply external renewal Policy Intake link migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260906233000_external_renewal_policy_intake_link.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply external renewal Policy Intake link migration
        run: supabase db query --linked --file supabase/migrations/20260906233000_external_renewal_policy_intake_link.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260906233000

      - name: Verify scoped conversion link schema
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regclass('public.external_renewal_policy_intake_links') is not null as link_table_ready,
              to_regprocedure('public.partner_app_link_external_renewal_policy_intake(uuid,uuid)') is not null as link_rpc_ready,
              to_regprocedure('public.partner_app_external_renewal_intake_link(uuid)') is not null as lookup_rpc_ready,
              has_function_privilege('authenticated','public.partner_app_link_external_renewal_policy_intake(uuid,uuid)','EXECUTE') as link_execute,
              has_function_privilege('authenticated','public.partner_app_external_renewal_intake_link(uuid)','EXECUTE') as lookup_execute,
              not has_table_privilege('authenticated','public.external_renewal_policy_intake_links','SELECT') as no_direct_link_read,
              not has_table_privilege('authenticated','public.external_renewal_policy_intake_links','INSERT') as no_direct_link_insert
          ")
          echo "$result"
          for key in link_table_ready link_rpc_ready lookup_rpc_ready link_execute lookup_execute no_direct_link_read no_direct_link_insert; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
