name: Publish claims filter navigation preview OTA

on:
  push:
    branches:
      - feat/self-managed-stage-navigation
    paths:
      - .github/workflows/tmp-publish-claims-filter-preview-ota.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/self-managed-stage-navigation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish Expo preview OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli update --channel preview --environment preview --message "Fix Home Claims card filter navigation" --non-interactive

      - name: Remove temporary workflow after successful publish
        if: success()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-publish-claims-filter-preview-ota.yml
          git commit -m "Remove temporary Claims filter preview OTA workflow"
          git push origin HEAD:feat/self-managed-stage-navigation
