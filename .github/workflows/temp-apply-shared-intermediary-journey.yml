name: Temporary shared intermediary journey patch

on:
  push:
    branches:
      - feature/shared-compact-intermediary-journey-20260807
    paths:
      - '.github/workflows/temp-apply-shared-intermediary-journey.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-compact-intermediary-journey-20260807
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused UI patch
        run: python .tmp/apply-shared-intermediary-journey.py
      - name: Validate focused diff
        run: |
          git diff --check
          grep -q 'IntermediaryJourneyStep' 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
          grep -q 'IntermediaryJourneyStep' 'apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx'
          grep -q 'h-\[18px\] w-\[18px\]' 'apps/web-portal/app/intermediaries/applications/intermediary-journey-step.tsx'
          ! grep -q 'inline-flex items-center justify-center gap-2 bg-\[#F8FAFC\] px-2' 'apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx'
      - name: Remove temporary patch helpers
        run: |
          rm -f .tmp/apply-shared-intermediary-journey.py
          rm -f .github/workflows/temp-apply-shared-intermediary-journey.yml
      - name: Commit focused change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: unify intermediary journey presentation'
          git push origin HEAD:feature/shared-compact-intermediary-journey-20260807
