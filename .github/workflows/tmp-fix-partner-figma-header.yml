name: Partner header fix
on:
  push:
    branches: [partner/preview-0.1.0-dashboard-refresh]
    paths: [.github/workflows/tmp-fix-partner-figma-header.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: partner/preview-0.1.0-dashboard-refresh
          fetch-depth: 0
      - run: |
          python scripts/tmp_fix_partner_header.py
          sed -i '/pointerEvents="none"/d' 'apps/partner-app/app/(tabs)/index.tsx'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --workspace apps/partner-app run verify:routes
      - run: npm --workspace apps/partner-app run verify:phase5
      - run: npm --workspace apps/partner-app run verify:visual
      - run: node apps/partner-app/scripts/verify-policy-intake-source-contract.mjs
      - run: npm --workspace apps/partner-app run verify:pre-apk
      - run: npm --workspace apps/partner-app run verify:uat
      - run: npm run typecheck:partner
      - run: npm run lint:partner
      - run: npm run build:partner:web
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add 'apps/partner-app/app/(tabs)/index.tsx'
          git diff --cached --quiet || git commit -m 'Align Partner dashboard header with Figma'
          git push origin HEAD:partner/preview-0.1.0-dashboard-refresh
