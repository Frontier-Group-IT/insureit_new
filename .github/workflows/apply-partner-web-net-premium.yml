name: Apply Partner web net premium migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260911221000_partner_web_net_premium.sql'
      - '.github/workflows/apply-partner-web-net-premium.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner web net premium migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260911221000_partner_web_net_premium.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Partner web net premium migration
        run: supabase db query --linked --file supabase/migrations/20260911221000_partner_web_net_premium.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260911221000

      - name: Verify Partner web net premium RPC
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.partner_web_net_premium_this_month()') is not null as rpc_ready,
              has_function_privilege('authenticated','public.partner_web_net_premium_this_month()','EXECUTE') as authenticated_execute,
              has_function_privilege('service_role','public.partner_web_net_premium_this_month()','EXECUTE') as service_role_execute,
              not has_function_privilege('anon','public.partner_web_net_premium_this_month()','EXECUTE') as anon_blocked
          ")
          echo "$result"
          for key in rpc_ready authenticated_execute service_role_execute anon_blocked; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
