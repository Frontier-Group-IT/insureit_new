name: Apply reports Overview business filter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20261003123000_reports_overview_business_filter.sql'
      - '.github/workflows/apply-reports-overview-business-filter.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply reports Overview business filter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20261003123000_reports_overview_business_filter.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Overview business-filter migration is applied
        shell: bash
        run: |
          set -euo pipefail
          state=$(supabase db query --linked --output-format json "
            select exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '20261003123000'
            ) as applied;
          ")
          echo "$state"
          if echo "$state" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration 20261003123000 is already recorded as applied; skipping re-application."
          else
            supabase db query --linked --file supabase/migrations/20261003123000_reports_overview_business_filter.sql
            supabase migration repair --linked --status applied 20261003123000
          fi

      - name: Verify Overview reporting RPC contracts
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.get_claims_report_v2(uuid[],date,date,uuid,text,text,text,text,integer,integer)') is not null as claims_present,
              to_regprocedure('public.get_operations_compliance_report_v2(uuid[],integer,text,text,text,integer,integer)') is not null as operations_present,
              has_function_privilege('service_role','public.get_claims_report_v2(uuid[],date,date,uuid,text,text,text,text,integer,integer)','EXECUTE') as claims_service_role,
              has_function_privilege('service_role','public.get_operations_compliance_report_v2(uuid[],integer,text,text,text,integer,integer)','EXECUTE') as operations_service_role,
              not has_function_privilege('authenticated','public.get_claims_report_v2(uuid[],date,date,uuid,text,text,text,text,integer,integer)','EXECUTE') as claims_authenticated_blocked,
              not has_function_privilege('authenticated','public.get_operations_compliance_report_v2(uuid[],integer,text,text,text,integer,integer)','EXECUTE') as operations_authenticated_blocked;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"claims_present"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"operations_present"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"claims_service_role"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"operations_service_role"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"claims_authenticated_blocked"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"operations_authenticated_blocked"[[:space:]]*:[[:space:]]*true'
