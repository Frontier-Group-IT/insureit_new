name: INSUREIT PostgreSQL R2 v2 isolated restore verification (manual only)

on:
  workflow_dispatch:
    inputs:
      expected_db_snapshot:
        description: 'Optional exact authenticated R2 v2 UTC snapshot YYYYMMDDTHHMMSSZ (abort if latest pointer changed)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: insureit-postgres-restore-rehearsal
  cancel-in-progress: false

jobs:
  restore_v2:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: insureit-production-backup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned read-only R2 verification dependencies
        run: python -m pip install boto3==1.35.99 cryptography==44.0.2
      - name: Verify and stage encrypted v2 archive from private R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DB_BACKUP_ENCRYPTION_KEY: ${{ secrets.DB_BACKUP_ENCRYPTION_KEY }}
          RECOVERY_EXPECTED_DB_SNAPSHOT: ${{ inputs.expected_db_snapshot }}
          R2_BUCKET: insureit-production-backups
          RESTORE_DIR: ${{ runner.temp }}/insureit-db-v2-restore
        run: python -u scripts/backup/verify_postgres_v2_r2.py
      - name: Restore the complete snapshot into disposable offline database
        run: |
          set -euo pipefail
          # A pristine template0 database avoids seeded managed Auth/Storage
          # table version conflicts in the Supabase image's default database.
          docker run -d --name insureit-v2-restore-check --network none \
            --env POSTGRES_PASSWORD=ephemeral-v2-recovery-only \
            --env POSTGRES_DB=postgres \
            supabase/postgres:17.6.1.136 >/dev/null
          ready=0
          for i in $(seq 1 60); do
            if docker exec insureit-v2-restore-check pg_isready -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "V2 OFFLINE RESTORE FAILED: PostgreSQL startup"
            exit 1
          fi
          # Validate the authenticated complete-dump TOC before executing
          # any restored customer SQL in the isolated container.
          docker cp "$RUNNER_TEMP/insureit-db-v2-restore/database.dump" \
            insureit-v2-restore-check:/tmp/database.dump
          if ! docker exec -u postgres insureit-v2-restore-check \
            pg_restore --list /tmp/database.dump \
            > "$RUNNER_TEMP/insureit-db-v2-restore/private-toc.txt" 2>/dev/null; then
            echo "V2 CUSTOM DUMP REJECTED: could not inspect TOC"
            exit 1
          fi
          python scripts/backup/audit_postgres_v2_toc.py \
            "$RUNNER_TEMP/insureit-db-v2-restore/private-toc.txt"
          docker cp scripts/backup/fixtures/isolated_supabase_roles.sql \
            insureit-v2-restore-check:/tmp/offline-roles.sql
          docker cp "$RUNNER_TEMP/insureit-db-v2-restore/roles.sql" \
            insureit-v2-restore-check:/tmp/roles.sql
          if ! docker exec -u postgres insureit-v2-restore-check \
            psql -X -v ON_ERROR_STOP=1 -d postgres -f /tmp/offline-roles.sql \
            > "$RUNNER_TEMP/v2-fixture.log" 2>&1; then
            python scripts/backup/classify_pg_restore_error.py fixture "$RUNNER_TEMP/v2-fixture.log"
            exit 1
          fi
          if ! docker exec -u postgres insureit-v2-restore-check \
            psql -X -v ON_ERROR_STOP=1 -d postgres -f /tmp/roles.sql \
            > "$RUNNER_TEMP/v2-roles.log" 2>&1; then
            python scripts/backup/classify_pg_restore_error.py roles "$RUNNER_TEMP/v2-roles.log"
            exit 1
          fi
          # Validate before executing archive SQL: only this temporary,
          # network-disabled PostgreSQL container's supabase_admin role may
          # perform the privileged restore. No production credentials are
          # ever supplied. Image postgres is explicitly not a superuser and
          # cannot CREATE untrusted-language functions in raw managed dumps.
          offline_admin="$(docker exec -u postgres \
            --env PGPASSWORD=ephemeral-v2-recovery-only \
            insureit-v2-restore-check \
            psql -h 127.0.0.1 -U supabase_admin -XAt \
              -v ON_ERROR_STOP=1 -d postgres -c \
              "select rolsuper::integer from pg_roles where rolname=current_user" \
            2>/dev/null || true)"
          if [ "$offline_admin" != 1 ]; then
            echo "V2 OFFLINE ADMIN PRECHECK FAILED: no verified disposable local superuser"
            exit 1
          fi
          echo "V2 OFFLINE ADMIN PRECHECK PASSED: isolated, authenticated local superuser"
          # A filtered Supabase CLI roles.sql does not necessarily define
          # all roles referenced by a raw pg_dump of platform-managed schemas.
          # Seed ONLY role names confirmed in a read-only INSUREIT source role
          # catalog. Newly created placeholders have NOLOGIN, no inheritance
          # grants, no superuser powers, and no service credentials. They are
          # used only in this throwaway --network none DB, never production.
          known_roles_before="$(docker exec -u postgres insureit-v2-restore-check \
            psql -XAt -v ON_ERROR_STOP=1 -d postgres -c \
            "select count(*) from pg_roles
              where rolname in ('anon','authenticated','authenticator',
                'cli_login_postgres','dashboard_user','postgres','service_role',
                'supabase_admin','supabase_auth_admin','supabase_etl_admin',
                'supabase_privileged_role','supabase_read_only_user',
                'supabase_realtime_admin','supabase_replication_admin',
                'supabase_storage_admin');")"
          if ! [[ "$known_roles_before" =~ ^[0-9]+$ ]] || [ "$known_roles_before" -gt 15 ]; then
            echo "V2 OFFLINE ROLE INVENTORY FAILED"
            exit 1
          fi
          docker cp scripts/backup/fixtures/isolated_source_role_names.sql \
            insureit-v2-restore-check:/tmp/isolated-source-role-names.sql
          if ! docker exec -u postgres \
            --env PGPASSWORD=ephemeral-v2-recovery-only \
            insureit-v2-restore-check \
            psql -h 127.0.0.1 -U supabase_admin -X -q \
              -v ON_ERROR_STOP=1 -d postgres \
              -f /tmp/isolated-source-role-names.sql \
            > "$RUNNER_TEMP/v2-offline-role-bootstrap.log" 2>&1; then
            python scripts/backup/classify_pg_restore_error.py roles \
              "$RUNNER_TEMP/v2-offline-role-bootstrap.log"
            echo "V2 OFFLINE ROLE BOOTSTRAP FAILED"
            exit 1
          fi
          known_roles_after="$(docker exec -u postgres insureit-v2-restore-check \
            psql -XAt -v ON_ERROR_STOP=1 -d postgres -c \
            "select count(*) from pg_roles
              where rolname in ('anon','authenticated','authenticator',
                'cli_login_postgres','dashboard_user','postgres','service_role',
                'supabase_admin','supabase_auth_admin','supabase_etl_admin',
                'supabase_privileged_role','supabase_read_only_user',
                'supabase_realtime_admin','supabase_replication_admin',
                'supabase_storage_admin');")"
          if [ "$known_roles_after" != 15 ]; then
            echo "V2 OFFLINE ROLE BOOTSTRAP INCOMPLETE"
            exit 1
          fi
          source_role_placeholders=$((15 - known_roles_before))
          echo "V2 OFFLINE SOURCE ROLE NAMES VERIFIED: expected=15 added_placeholders=$source_role_placeholders"
          # Placeholder roles make object/ACL import mechanically testable,
          # but they do not prove original role attributes, logins or grants.
          # template0 is clean. Do not perform this action on the live DB.
          docker exec -u postgres insureit-v2-restore-check \
            createdb -T template0 -O postgres insureit_verify \
            > "$RUNNER_TEMP/v2-createdb.log" 2>&1
          # Offline 'postgres' cannot SET ROLE to the container-local
          # superuser. Connect directly as the verified local supabase_admin
          # role to reconstruct trusted source FUNCTIONS requiring superuser,
          # keeping --network none, a single transaction and all archive
          # schema, data and ACL entries. This account is NOT production.
          acl_mode=complete
          if ! timeout 900 docker exec -u postgres \
            --env PGPASSWORD=ephemeral-v2-recovery-only \
            insureit-v2-restore-check \
            pg_restore --host=127.0.0.1 --username=supabase_admin \
              --verbose --single-transaction --exit-on-error --no-owner \
              --dbname=insureit_verify /tmp/database.dump \
            > "$RUNNER_TEMP/v2-restore.log" 2>&1; then
            python scripts/backup/classify_pg_restore_error.py data "$RUNNER_TEMP/v2-restore.log"
            if ! python scripts/backup/allow_no_acl_restore_fallback.py \
                "$RUNNER_TEMP/v2-restore.log"; then
              echo "V2 PRIVILEGED STRICT RESTORE INCOMPLETE: not eligible for ACL-only trial"
              exit 1
            fi
            # Retain only the existing, explicitly reduced-assurance option:
            # skip grants, NEVER table definitions, data, or constraints.
            # Still strict and atomic; no new user-facing recovery claim.
            if ! timeout 900 docker exec -u postgres \
              --env PGPASSWORD=ephemeral-v2-recovery-only \
              insureit-v2-restore-check \
              pg_restore --host=127.0.0.1 --username=supabase_admin \
                --verbose --single-transaction --exit-on-error \
                --no-owner --no-acl --dbname=insureit_verify /tmp/database.dump \
              > "$RUNNER_TEMP/v2-restore-no-acl.log" 2>&1; then
              python scripts/backup/classify_pg_restore_error.py data "$RUNNER_TEMP/v2-restore-no-acl.log"
              echo "V2 RESTORE INCOMPLETE: privileged no-ACL trial also failed"
              exit 1
            fi
            acl_mode=omitted
            echo "V2 RESTORE MODE: schema/data strict import passed with --no-acl (grants NOT verified)"
          else
            echo "V2 STRICT RESTORE PASSED: schema, data and archive privileges imported by isolated local superuser"
          fi
          # Private COPY SQL remains temporary on isolated runner only.
          if ! docker exec -u postgres insureit-v2-restore-check \
            pg_restore --data-only --file=/tmp/v2-data.sql /tmp/database.dump \
            > "$RUNNER_TEMP/v2-data-extract.log" 2>&1; then
            echo "V2 ROW AUDIT FAILED: could not extract offline COPY inventory"
            exit 1
          fi
          docker cp insureit-v2-restore-check:/tmp/v2-data.sql \
            "$RUNNER_TEMP/insureit-db-v2-restore/data-only.sql"
          python scripts/backup/verify_postgres_v2_rows.py \
            "$RUNNER_TEMP/insureit-db-v2-restore/data-only.sql"
          if [ "$acl_mode" = "omitted" ]; then
            echo "V2 SCHEMA_DATA_ONLY_CHECK PASSED: all COPY tables reconciled; ACL restore FAILED and was omitted"
            echo "V2 FULL RECOVERY NOT CERTIFIED: role grants/default privileges must be restored and validated separately"
          elif [ "$source_role_placeholders" -gt 0 ]; then
            echo "V2 ISOLATED DATA_AND_ACL_REPLAY PASSED: all COPY tables reconciled with $source_role_placeholders offline role-name placeholders"
            echo "V2 ROLE SEMANTICS NOT VERIFIED: original login attributes, membership and owner permissions were not reconstructed"
            echo "V2 FULL RECOVERY NOT CERTIFIED: service and source role parity remain unverified"
          else
            echo "V2 ISOLATED RECOVERY CHECK PASSED: one snapshot restored and all COPY tables reconciled"
          fi
          echo "CAVEAT: Supabase service config, Auth providers, production ownership and R2 file binaries require separate DR validation"
      - name: Destroy restored database, decrypted files and private logs
        if: always()
        run: |
          docker rm -f -v insureit-v2-restore-check >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/insureit-db-v2-restore"
          rm -f "$RUNNER_TEMP"/v2-*.log
