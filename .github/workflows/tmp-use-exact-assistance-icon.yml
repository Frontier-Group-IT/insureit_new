name: Temporary use exact assistance icon

on:
  push:
    branches:
      - recovery/mobile-today-cumulative
    paths:
      - '.github/workflows/tmp-use-exact-assistance-icon.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/mobile-today-cumulative
          fetch-depth: 0
      - name: Apply exact icon asset
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p = Path('apps/mobile-app/app/customer/claim-detail.tsx')
          s = p.read_text()
          s = s.replace("import { Linking, Pressable, StyleSheet, Text, View } from 'react-native';", "import { Image, Linking, Pressable, StyleSheet, Text, View } from 'react-native';")
          old = '<MaterialCommunityIcons name="account-voice" size={24} color="#0A43A3" />'
          new = '<Image source={require(\'../../assets/get-assistance-icon.png\')} style={styles.assistanceIconImage} resizeMode="contain" />'
          if old not in s:
              raise SystemExit('Assistance icon anchor not found')
          s = s.replace(old, new, 1)
          style_anchor = "assistanceIconButton:{width:38,height:38,borderRadius:12,alignItems:'center',justifyContent:'center',backgroundColor:'#F4F8FE',borderWidth:1,borderColor:'#D7E5F7'},assistanceIconButtonPressed:{backgroundColor:'#E8F1FD',transform:[{scale:.97}]},"
          style_replacement = "assistanceIconButton:{width:38,height:38,borderRadius:12,alignItems:'center',justifyContent:'center',backgroundColor:'#F4F8FE',borderWidth:1,borderColor:'#D7E5F7',overflow:'hidden'},assistanceIconButtonPressed:{backgroundColor:'#E8F1FD',transform:[{scale:.97}]},assistanceIconImage:{width:28,height:28},"
          if style_anchor not in s:
              raise SystemExit('Assistance style anchor not found')
          s = s.replace(style_anchor, style_replacement, 1)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify mobile
        run: |
          npm run typecheck:mobile
          npm run lint:mobile
          npm run build:mobile:web
      - name: Commit and clean temporary workflow
        run: |
          set -euo pipefail
          git config user.name "antnish1"
          git config user.email "shahdolho@gmail.com"
          git add apps/mobile-app/app/customer/claim-detail.tsx apps/mobile-app/assets/get-assistance-icon.png
          git commit -m "Use requested Get Assistance icon in Claim Tracker"
          git rm .github/workflows/tmp-use-exact-assistance-icon.yml
          git commit -m "chore: remove temporary assistance icon workflow"
          git push origin HEAD:recovery/mobile-today-cumulative
