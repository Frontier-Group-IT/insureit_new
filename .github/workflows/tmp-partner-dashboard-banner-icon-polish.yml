name: Temporary Partner dashboard banner and icon polish

on:
  push:
    branches:
      - partner/dashboard-banner-icon-polish
    paths:
      - .github/workflows/tmp-partner-dashboard-banner-icon-polish.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: partner/dashboard-banner-icon-polish
          fetch-depth: 0

      - name: Apply dashboard visual corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/partner-app/app/(tabs)/index.tsx')
          text = path.read_text()

          replacements = [
            (
              "  pendingDocument: require('../../assets/generated-dashboard/pending-document-alert.png'),\n} as const;",
              "  pendingDocument: require('../../assets/generated-dashboard/pending-document-alert.png'),\n  customerAction: require('../../assets/partner/actions/customer-register.png'),\n} as const;"
            ),
            (
              "                    <QuickAction icon=\"file-plus\" label=\"Policy Intake\" onPress={() => router.push('/policy-intake-new')} />\n                    <QuickAction icon=\"refresh-cw\" label=\"Renewals\" onPress={() => router.push('/renewals')} />\n                    <QuickAction icon=\"shield\" label=\"Claims\" onPress={() => router.push('/(tabs)/claims')} />\n                    <QuickAction icon=\"users\" label=\"Customers\" onPress={() => router.push('/customers')} />",
              "                    <QuickAction asset={GeneratedDashboardAssets.policyAdd} label=\"Policy Intake\" onPress={() => router.push('/policy-intake-new')} />\n                    <QuickAction asset={GeneratedDashboardAssets.renewalAdd} label=\"Renewals\" onPress={() => router.push('/renewals')} />\n                    <QuickAction asset={GeneratedDashboardAssets.policyVerified} label=\"Claims\" onPress={() => router.push('/(tabs)/claims')} />\n                    <QuickAction asset={GeneratedDashboardAssets.customerAction} label=\"Customers\" onPress={() => router.push('/customers')} />"
            ),
            (
              "  hero: { height: 112, overflow: 'hidden', backgroundColor: '#062D5F', paddingHorizontal: 20, paddingTop: 7 },\n  heroBackdrop: { ...StyleSheet.absoluteFillObject, width: '100%', height: '100%', opacity: 0.82 },\n  heroBackdropShade: { ...StyleSheet.absoluteFillObject, backgroundColor: 'rgba(3,34,75,0.34)' },",
              "  hero: { height: 152, overflow: 'hidden', backgroundColor: '#062D5F', paddingHorizontal: 20, paddingTop: 10 },\n  heroBackdrop: { ...StyleSheet.absoluteFillObject, width: '100%', height: '100%', opacity: 0.94 },\n  heroBackdropShade: { ...StyleSheet.absoluteFillObject, backgroundColor: 'rgba(3,34,75,0.22)' },"
            ),
            (
              "  pendingCard: { marginTop: 11, minHeight: 142, paddingHorizontal: 14, paddingTop: 11, paddingBottom: 8, borderRadius: 18, overflow: 'hidden', backgroundColor: '#EAF5FF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#D3E7FA' },\n  pendingBackdrop: { position: 'absolute', right: 4, bottom: 4, width: 132, height: 132, opacity: 0.9 },\n  pendingHeaderSpacer: { width: 122, height: 1 },\n  pendingList: { marginTop: 2, paddingRight: 118 },",
              "  pendingCard: { marginTop: 11, minHeight: 154, paddingHorizontal: 14, paddingTop: 11, paddingBottom: 10, borderRadius: 18, overflow: 'hidden', backgroundColor: '#EAF5FF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#D3E7FA' },\n  pendingBackdrop: { position: 'absolute', right: -8, top: 0, width: 190, height: 154, opacity: 1 },\n  pendingHeaderSpacer: { width: 154, height: 1 },\n  pendingList: { marginTop: 4, paddingRight: 150 },"
            ),
            (
              "  quickImageAsset: { width: 42, height: 42 },",
              "  quickImageAsset: { width: 46, height: 46 },"
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected source block not found:\n{old}')
            text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F "hero: { height: 152" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "width: 190, height: 154, opacity: 1" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "asset={GeneratedDashboardAssets.policyAdd}" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "asset={GeneratedDashboardAssets.renewalAdd}" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "asset={GeneratedDashboardAssets.policyVerified}" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "asset={GeneratedDashboardAssets.customerAction}" 'apps/partner-app/app/(tabs)/index.tsx'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Partner source
        run: |
          npm --workspace apps/partner-app run verify:routes
          npm --workspace apps/partner-app run verify:phase5
          npm --workspace apps/partner-app run verify:visual
          node apps/partner-app/scripts/verify-policy-intake-source-contract.mjs
          npm --workspace apps/partner-app run verify:pre-apk
          npm --workspace apps/partner-app run verify:uat
          npm run typecheck:partner
          npm run lint:partner
          npm run build:partner:web

      - name: Commit verified dashboard correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/partner-app/app/(tabs)/index.tsx'
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 1; }
          git commit -m "Polish Partner dashboard banners and quick actions"
          git push origin HEAD:partner/dashboard-banner-icon-polish
