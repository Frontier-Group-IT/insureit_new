name: Apply Partner claim workflow actor migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260919112000_partner_claim_workflow_actor.sql'
      - '.github/workflows/apply-partner-claim-workflow-actor.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner claim workflow actor migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260919112000_partner_claim_workflow_actor.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply Partner claim workflow actor migration
        run: supabase db query --linked --file supabase/migrations/20260919112000_partner_claim_workflow_actor.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260919112000

      - name: Verify Partner claim workflow RPC and trigger contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.partner_app_insert_claim_stage_detail(uuid,public.claim_status,jsonb)') is not null as insert_rpc_ready,
              has_function_privilege(
                'authenticated',
                'public.partner_app_insert_claim_stage_detail(uuid,public.claim_status,jsonb)',
                'EXECUTE'
              ) as authenticated_execute,
              position(
                'partner_app_claim_in_scope'
                in pg_get_functiondef('public.persist_initial_document_submission_from_stage_details()'::regprocedure)
              ) > 0 as initial_trigger_partner_scope_ready,
              position(
                'partner_app_claim_in_scope'
                in pg_get_functiondef('public.persist_managed_claim_stage_transition_from_details()'::regprocedure)
              ) > 0 as managed_trigger_partner_scope_ready
          ")
          echo "$result"
          echo "$result" | grep -Eq '"insert_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"authenticated_execute"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"initial_trigger_partner_scope_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"managed_trigger_partner_scope_ready"[[:space:]]*:[[:space:]]*true'
