name: Republish mobile preview rollback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out mobile project configuration
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Republish target update group to preview
        working-directory: apps/mobile-app
        run: npx eas-cli update:republish --group 5bbeb570-afd9-4b4d-91b8-ba1c61bcb99c --destination-branch preview --message "Restore preview update 5bbeb570" --json
