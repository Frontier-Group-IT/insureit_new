name: Temporary dashboard single-screen refinement

on:
  push:
    branches:
      - mobile/dashboard-single-screen-refinement

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: mobile/dashboard-single-screen-refinement
          fetch-depth: 0

      - name: Apply compact dashboard refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile-app/app/customer/home.tsx')
          text = path.read_text()

          replacements = {
            "const radius = 30;\n  const strokeWidth = 7;": "const radius = 26;\n  const strokeWidth = 6;",
            '<Svg width={72} height={72} viewBox="0 0 72 72">': '<Svg width={64} height={64} viewBox="0 0 64 64">',
            '<Circle cx="36" cy="36" r={radius} stroke={palette.navy} strokeWidth={1.5} fill="#FFFFFF" />': '<Circle cx="32" cy="32" r={radius} stroke={palette.navy} strokeWidth={1.5} fill="#FFFFFF" />',
            '          cx="36"\n          cy="36"': '          cx="32"\n          cy="32"',
            '          originX="36"\n          originY="36"': '          originX="32"\n          originY="32"',
            "  header: { height: 66, paddingHorizontal: 4, flexDirection: 'row', alignItems: 'center', gap: 8, backgroundColor: 'rgba(255,255,255,0.98)', borderBottomWidth: 1, borderBottomColor: '#E1E7F0' },": "  header: { height: 60, paddingHorizontal: 4, flexDirection: 'row', alignItems: 'center', gap: 8, backgroundColor: 'rgba(255,255,255,0.98)', borderBottomWidth: 1, borderBottomColor: '#E1E7F0' },",
            "  body: { flexGrow: 1, paddingHorizontal: 14, paddingTop: 11, paddingBottom: 120, gap: 11 },": "  body: { flexGrow: 1, paddingHorizontal: 12, paddingTop: 7, paddingBottom: 92, gap: 7 },",
            "  greeting: { color: palette.navy, fontSize: 22, lineHeight: 28, fontWeight: '900' },": "  greeting: { color: palette.navy, fontSize: 21, lineHeight: 26, fontWeight: '900' },",
            "  greetingMetaRow: { marginTop: 5, flexDirection: 'row', alignItems: 'center', flexWrap: 'wrap', gap: 7 },": "  greetingMetaRow: { marginTop: 3, flexDirection: 'row', alignItems: 'center', flexWrap: 'wrap', gap: 7 },",
            "  fleetCard: { minHeight: 158, borderRadius: 18, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#D8E7F7', padding: 12, overflow: 'hidden', shadowColor: '#122544', shadowOpacity: 0.07, shadowRadius: 12, elevation: 3 },": "  fleetCard: { minHeight: 132, borderRadius: 16, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#D8E7F7', padding: 9, overflow: 'hidden', shadowColor: '#122544', shadowOpacity: 0.06, shadowRadius: 10, elevation: 2 },",
            "  fleetMainRow: { minHeight: 86, flexDirection: 'row', alignItems: 'center', gap: 8, marginTop: 5 },": "  fleetMainRow: { minHeight: 70, flexDirection: 'row', alignItems: 'center', gap: 7, marginTop: 2 },",
            "  fleetCountBlock: { width: 92, minWidth: 92, alignItems: 'center', justifyContent: 'center', paddingLeft: 4 },": "  fleetCountBlock: { width: 78, minWidth: 78, alignItems: 'center', justifyContent: 'center', paddingLeft: 2 },",
            "  fleetCount: { color: palette.navy, fontSize: 40, lineHeight: 44, fontWeight: '900' },": "  fleetCount: { color: palette.navy, fontSize: 34, lineHeight: 38, fontWeight: '900' },",
            "  scoreRing: { width: 72, height: 72, borderRadius: 36, alignItems: 'center', justifyContent: 'center', position: 'relative' },": "  scoreRing: { width: 64, height: 64, borderRadius: 32, alignItems: 'center', justifyContent: 'center', position: 'relative' },",
            "  scoreCore: { position: 'absolute', width: 52, height: 52, borderRadius: 26, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#E0EAF5', alignItems: 'center', justifyContent: 'center' },": "  scoreCore: { position: 'absolute', width: 46, height: 46, borderRadius: 23, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#E0EAF5', alignItems: 'center', justifyContent: 'center' },",
            "  scoreValue: { color: palette.navy, fontSize: 15, lineHeight: 18, fontWeight: '900' },": "  scoreValue: { color: palette.navy, fontSize: 13.5, lineHeight: 16, fontWeight: '900' },",
            "  fleetImageHero: { flex: 1, height: 92, marginLeft: -12, marginRight: -7, opacity: 0.95 },": "  fleetImageHero: { flex: 1, height: 74, marginLeft: -10, marginRight: -6, opacity: 0.95 },",
            "  fleetTicker: { minHeight: 37, marginTop: 8, borderRadius: 14, backgroundColor: '#F8FBFF', borderWidth: 1, borderColor: '#E0EAF5', paddingHorizontal: 10, flexDirection: 'row', alignItems: 'center', gap: 8 },": "  fleetTicker: { minHeight: 24, marginTop: 3, paddingHorizontal: 1, flexDirection: 'row', alignItems: 'center', gap: 6 },",
            "  quickDock: { borderRadius: 20, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#D8E7F7', padding: 12, shadowColor: '#122544', shadowOpacity: 0.04, shadowRadius: 9, elevation: 2 },": "  quickDock: { borderRadius: 18, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#D8E7F7', padding: 9, shadowColor: '#122544', shadowOpacity: 0.04, shadowRadius: 8, elevation: 2 },",
            "  sectionHeader: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginBottom: 10 },": "  sectionHeader: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginBottom: 6 },",
            "  quickAction: { flex: 1, minHeight: 78, borderRadius: 16, backgroundColor: '#F8FBFF', borderWidth: 1, borderColor: '#E0EAF5', alignItems: 'center', justifyContent: 'center', paddingHorizontal: 4, position: 'relative' },": "  quickAction: { flex: 1, minHeight: 66, borderRadius: 15, backgroundColor: '#F8FBFF', borderWidth: 1, borderColor: '#E0EAF5', alignItems: 'center', justifyContent: 'center', paddingHorizontal: 4, position: 'relative' },",
            "  quickIcon: { width: 36, height: 36, borderRadius: 13, alignItems: 'center', justifyContent: 'center' },": "  quickIcon: { width: 34, height: 34, borderRadius: 12, alignItems: 'center', justifyContent: 'center' },",
            "  quickIconArtwork: { width: 32, height: 32 },": "  quickIconArtwork: { width: 30, height: 30 },",
            "  quickLabel: { color: palette.navy, fontSize: 10.5, lineHeight: 13, fontWeight: '900', textAlign: 'center', marginTop: 6 },": "  quickLabel: { color: palette.navy, fontSize: 10.5, lineHeight: 13, fontWeight: '900', textAlign: 'center', marginTop: 4 },",
            "  claimSummaryCard: { borderRadius: 20, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#D8E7F7', overflow: 'hidden', shadowColor: '#071D49', shadowOpacity: 0.1, shadowRadius: 13, elevation: 3 },": "  claimSummaryCard: { borderRadius: 18, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#D8E7F7', overflow: 'hidden', shadowColor: '#071D49', shadowOpacity: 0.08, shadowRadius: 10, elevation: 2 },",
            "  claimSummaryTop: { backgroundColor: palette.navy, padding: 13 },": "  claimSummaryTop: { backgroundColor: palette.navy, paddingHorizontal: 11, paddingVertical: 9 },",
            "  claimMetric: { flex: 1, minHeight: 77, alignItems: 'center', justifyContent: 'center', paddingHorizontal: 6 },": "  claimMetric: { flex: 1, minHeight: 58, alignItems: 'center', justifyContent: 'center', paddingHorizontal: 6 },",
            "  claimMetricValue: { fontSize: 24, lineHeight: 28, fontWeight: '900' },": "  claimMetricValue: { fontSize: 21, lineHeight: 24, fontWeight: '900' },",
            "  claimMetricLabel: { color: '#AAB9D6', fontSize: 10.5, fontWeight: '900', marginTop: 1 },": "  claimMetricLabel: { color: '#AAB9D6', fontSize: 10, fontWeight: '900', marginTop: 0 },",
            "  claimMetricAmount: { color: '#7C8FB0', fontSize: 9.5, fontWeight: '800', marginTop: 3 },": "  claimMetricAmount: { color: '#7C8FB0', fontSize: 9, fontWeight: '800', marginTop: 1 },",
            "  claimTicker: { minHeight: 39, margin: 10, marginTop: 9, borderRadius: 14, backgroundColor: '#F8FBFF', borderWidth: 1, borderColor: '#E0EAF5', paddingHorizontal: 10, flexDirection: 'row', alignItems: 'center', gap: 7 },": "  claimTicker: { minHeight: 25, marginHorizontal: 10, marginTop: 3, marginBottom: 4, paddingHorizontal: 1, flexDirection: 'row', alignItems: 'center', gap: 7 },",
            "  claimTickerHot: { backgroundColor: '#FFF8EA', borderColor: '#F1D59D' },": "  claimTickerHot: { borderRadius: 10, backgroundColor: '#FFF8EA', paddingHorizontal: 8 },",
            "  supportCard: { borderRadius: 18, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#D8E7F7', padding: 11, shadowColor: '#122544', shadowOpacity: 0.04, shadowRadius: 9, elevation: 2 },": "  supportCard: { paddingHorizontal: 2, paddingTop: 3, paddingBottom: 1 },",
            "  supportTop: { marginBottom: 9 },": "  supportTop: { marginBottom: 13, paddingHorizontal: 2 },",
            "  supportActions: { flexDirection: 'row', gap: 8 },": "  supportActions: { flexDirection: 'row', gap: 12 },",
            "  supportButton: { flex: 1, minHeight: 58, alignItems: 'center', justifyContent: 'center', gap: 5 },": "  supportButton: { flex: 1, minHeight: 48, alignItems: 'center', justifyContent: 'center', gap: 4 },",
            "  supportButtonIcon: { width: 33, height: 33, borderRadius: 13, alignItems: 'center', justifyContent: 'center', shadowColor: '#122544', shadowOpacity: 0.13, shadowRadius: 6, elevation: 3 },": "  supportButtonIcon: { width: 32, height: 32, borderRadius: 12, alignItems: 'center', justifyContent: 'center', shadowColor: '#122544', shadowOpacity: 0.1, shadowRadius: 5, elevation: 2 },",
            "  appVersion: { color: '#A6B3C6', fontSize: 10.5, fontWeight: '700', textAlign: 'center', marginTop: 4 },": "  appVersion: { color: '#A6B3C6', fontSize: 9.5, fontWeight: '700', textAlign: 'center', marginTop: 0 },",
          }

          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Missing expected snippet: {old[:90]}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit dashboard refinement and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/app/customer/home.tsx
          git rm .github/workflows/tmp-dashboard-single-screen-refinement.yml
          git commit -m "Compact customer dashboard layout"
          git push origin HEAD:mobile/dashboard-single-screen-refinement
