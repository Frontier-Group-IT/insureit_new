name: Audit permission enforcement

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web-portal/**"
      - "scripts/audit-permission-enforcement.mjs"
      - ".github/workflows/audit-permission-enforcement.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-permission-enforcement.mjs
