name: Temporary patch Partner Claims New status

on:
  push:
    branches:
      - partner-claims-new-status-dark-blue
    paths:
      - '.github/workflows/_temp_patch_partner_claims_new_status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: partner-claims-new-status-dark-blue
          fetch-depth: 0

      - name: Apply surgical New-status dark-blue patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          claim_files = [
              Path('apps/partner-app/app/(tabs)/claims.tsx'),
              Path('scripts/partner/compat/partner-claims-reference-0-1.tsx'),
          ]

          for path in claim_files:
              text = path.read_text()
              original = text

              old = "  const rejected = /reject/i.test(row.current_status || '');\n"
              new = old + "  const isNew = /^new$/i.test((row.current_status || '').trim());\n"
              if old not in text:
                  raise SystemExit(f'Missing rejected marker in {path}')
              text = text.replace(old, new, 1)

              replacements = {
                  "rejected ? styles.statusRejected : completed ? styles.statusSuccess : styles.statusWarning":
                      "rejected ? styles.statusRejected : completed ? styles.statusSuccess : isNew ? styles.statusNew : styles.statusWarning",
                  "rejected ? styles.statusDotRejected : completed ? styles.statusDotSuccess : styles.statusDotWarning":
                      "rejected ? styles.statusDotRejected : completed ? styles.statusDotSuccess : isNew ? styles.statusDotNew : styles.statusDotWarning",
                  "rejected ? styles.statusTextRejected : completed ? styles.statusTextSuccess : styles.statusTextWarning":
                      "rejected ? styles.statusTextRejected : completed ? styles.statusTextSuccess : isNew ? styles.statusTextNew : styles.statusTextWarning",
                  "  statusRejected: { backgroundColor: '#FDEBEC' },\n":
                      "  statusRejected: { backgroundColor: '#FDEBEC' },\n  statusNew: { backgroundColor: '#0B2E63' },\n",
                  "  statusDotRejected: { backgroundColor: '#E04F5F' },\n":
                      "  statusDotRejected: { backgroundColor: '#E04F5F' },\n  statusDotNew: { backgroundColor: '#FFFFFF' },\n",
                  "  statusTextRejected: { color: '#C43F50' },\n":
                      "  statusTextRejected: { color: '#C43F50' },\n  statusTextNew: { color: '#FFFFFF' },\n",
              }

              for before, after in replacements.items():
                  if before not in text:
                      raise SystemExit(f'Missing expected pattern in {path}: {before}')
                  text = text.replace(before, after, 1)

              if text == original:
                  raise SystemExit(f'No changes made to {path}')
              path.write_text(text)
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const isNew = /\^new\$/i" 'apps/partner-app/app/(tabs)/claims.tsx'
          grep -q "statusNew: { backgroundColor: '#0B2E63' }" 'apps/partner-app/app/(tabs)/claims.tsx'
          grep -q "statusTextNew: { color: '#FFFFFF' }" 'apps/partner-app/app/(tabs)/claims.tsx'
          grep -q "const isNew = /\^new\$/i" 'scripts/partner/compat/partner-claims-reference-0-1.tsx'

      - name: Commit patched source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/partner-app/app/(tabs)/claims.tsx' 'scripts/partner/compat/partner-claims-reference-0-1.tsx'
          git commit -m 'Update Partner Claims New status to dark blue'
          git push origin HEAD:partner-claims-new-status-dark-blue
