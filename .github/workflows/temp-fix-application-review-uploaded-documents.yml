name: Temporary uploaded-only application review documents

on:
  push:
    paths:
      - scripts/temp_fix_application_review_uploaded_documents.py
      - .github/workflows/temp-fix-application-review-uploaded-documents.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused patch
        run: python scripts/temp_fix_application_review_uploaded_documents.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- apps/web-portal/app/intermediaries/applications/'[id]'/layout.tsx apps/web-portal/app/intermediaries/applications/'[id]'/page.tsx
      - name: Commit application changes and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show only uploaded documents on application review"
          git push
