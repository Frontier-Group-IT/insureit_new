name: Verify Firebase bridge POC
on:
  pull_request:
    paths:
      - 'pocs/firebase-supabase-bridge/**'
      - '.github/workflows/verify-firebase-bridge-poc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run isolated contract tests
        run: node --test pocs/firebase-supabase-bridge/identity-contract.test.cjs
      - name: Typecheck POC without writes
        run: npx tsc --noEmit --skipLibCheck --target ES2020 --module commonjs pocs/firebase-supabase-bridge/identity-contract.ts
