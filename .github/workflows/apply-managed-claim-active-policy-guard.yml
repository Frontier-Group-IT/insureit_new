name: Apply managed claim active policy guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260905195000_prevent_duplicate_active_managed_claims.sql'
      - '.github/workflows/apply-managed-claim-active-policy-guard.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Prevent duplicate active managed claims
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260905195000_prevent_duplicate_active_managed_claims.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply active-claim guard migration
        run: supabase db query --linked --file supabase/migrations/20260905195000_prevent_duplicate_active_managed_claims.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260905195000

      - name: Verify active-claim guard
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              exists (
                select 1
                from pg_proc
                where proname = 'prevent_duplicate_active_managed_claim_insert'
              ) as function_ready,
              exists (
                select 1
                from pg_trigger
                where tgname = 'prevent_duplicate_active_managed_claim_insert'
                  and not tgisinternal
              ) as trigger_ready
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"trigger_ready"[[:space:]]*:[[:space:]]*true'
