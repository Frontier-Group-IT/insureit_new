name: Validate IT permission center

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web-portal/app/system/access-control/**"
      - "apps/web-portal/lib/permission-management.ts"
      - "apps/web-portal/lib/effective-permissions.ts"
      - "apps/web-portal/lib/master-data-server.ts"
      - "apps/web-portal/lib/employee-access-scope.ts"
      - "apps/web-portal/app/settings/page.tsx"
      - "supabase/migrations/20260804194500_add_permission_management_foundation.sql"
      - ".github/workflows/validate-it-permission-center.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      PAN_VERIFICATION_WORKER_KEY: placeholder-worker-key
      NEXT_PUBLIC_INSUREIT_LAUNCH_SCOPE: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run build:web
