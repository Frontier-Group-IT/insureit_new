name: Temporary apply Partner home logo header

on:
  push:
    branches:
      - partner/home-official-logo-header
    paths:
      - '.github/workflows/tmp-apply-partner-home-logo-header.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: partner/home-official-logo-header
          fetch-depth: 0

      - name: Apply guarded Home header changes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          index = Path('apps/partner-app/app/(tabs)/index.tsx')
          text = index.read_text()

          replacements = [
              (
                  '          <Image source={PartnerAssets.banners.businessGrowth01} style={styles.heroArtwork} resizeMode="cover" />\n          <View style={styles.heroShade} />',
                  '          <Image source={require(\'../../assets/insureit-partner-official.png\')} style={styles.heroWatermark} resizeMode="contain" />'
              ),
              (
                  '''            <View>\n              <Text style={styles.heroBrand}>insureit</Text>\n              <Text style={styles.heroPartner}>PARTNER</Text>\n            </View>''',
                  '''            <View style={styles.heroBrandLockup}>\n              <Image\n                source={require('../../assets/insureit-partner-official.png')}\n                style={styles.heroLogo}\n                resizeMode="contain"\n              />\n              <View style={styles.heroBrandText}>\n                <Text style={styles.heroBrand}>insureit</Text>\n                <Text style={styles.heroPartner}>PARTNER</Text>\n              </View>\n            </View>'''
              ),
              (
                  '''          <View style={styles.heroGreeting}>\n            <Text style={styles.heroGreetingSmall}>{dayGreeting()},</Text>\n            <Text style={styles.heroGreetingName}>{displayName}</Text>\n          </View>''',
                  '''          <View style={styles.heroGreeting}>\n            <Text numberOfLines={1} style={styles.heroGreetingText}>{dayGreeting()} {displayName}</Text>\n          </View>'''
              ),
              (
                  '''  hero: { height: 142, overflow: 'hidden', backgroundColor: '#073A78', paddingHorizontal: 20, paddingTop: 10 },\n  heroArtwork: { position: 'absolute', right: -24, bottom: -28, width: 248, height: 156, opacity: 0.34 },\n  heroShade: { ...StyleSheet.absoluteFillObject, backgroundColor: 'rgba(5, 49, 105, 0.42)' },\n  heroTopRow: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' },\n  heroBrand: { color: '#FFFFFF', fontSize: 23, lineHeight: 26, fontWeight: '800', letterSpacing: -0.5 },\n  heroPartner: { marginTop: 1, color: '#D8E8FF', fontSize: 9, lineHeight: 11, fontWeight: '700', letterSpacing: 3.0 },''',
                  '''  hero: { height: 128, overflow: 'hidden', backgroundColor: '#073A78', paddingHorizontal: 20, paddingTop: 8 },\n  heroWatermark: { position: 'absolute', right: -46, top: -34, width: 286, height: 188, opacity: 0.11 },\n  heroTopRow: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' },\n  heroBrandLockup: { flexDirection: 'row', alignItems: 'center', gap: 7, minHeight: 38 },\n  heroLogo: { width: 31, height: 31 },\n  heroBrandText: { justifyContent: 'center' },\n  heroBrand: { color: '#FFFFFF', fontSize: 21, lineHeight: 23, fontWeight: '800', letterSpacing: -0.45 },\n  heroPartner: { marginTop: 0, color: '#D8E8FF', fontSize: 8.5, lineHeight: 10, fontWeight: '700', letterSpacing: 2.6 },'''
              ),
              (
                  '''  heroGreeting: { marginTop: 11, maxWidth: '64%' },\n  heroGreetingSmall: { color: '#EDF4FF', fontSize: 12.5, lineHeight: 16, fontWeight: '500' },\n  heroGreetingName: { marginTop: 0, color: '#FFFFFF', fontSize: 22, lineHeight: 27, fontWeight: '800' },''',
                  '''  heroGreeting: { marginTop: 12, maxWidth: '72%' },\n  heroGreetingText: { color: '#FFFFFF', fontSize: 18.5, lineHeight: 24, fontWeight: '700', letterSpacing: -0.15 },'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected Home header source block not found:\n{old[:180]}')
              text = text.replace(old, new, 1)

          logo = Path('apps/partner-app/assets/insureit-partner-official.png')
          if not logo.exists():
              raise SystemExit('Official Partner logo asset is missing.')

          index.write_text(text)
          PY

      - name: Validate exact intended source delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          [ "$changed" = 'apps/partner-app/app/(tabs)/index.tsx' ]
          grep -q "heroGreetingText" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -q "insureit-partner-official.png" 'apps/partner-app/app/(tabs)/index.tsx'

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'apps/partner-app/app/(tabs)/index.tsx'
          git commit -m 'Use official Partner logo in compact Home header'
          git push origin HEAD:partner/home-official-logo-header
