name: Temporary policy clear-form reset fix

on:
  push:
    branches:
      - fix/policy-clear-form-reset-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/policy-clear-form-reset-final
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch clear-form ownership and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path('apps/web-portal/components/policy-ocr-import-panel.tsx')
          panel = panel_path.read_text()
          panel = panel.replace('const POLICY_DRAFT_KEY = "insureit:policy-onboarding:draft:v1";\n', '')
          panel = panel.replace(
              '  onApply: (fields: PolicyOcrField[]) => PolicyOcrApplyOutcome | Promise<PolicyOcrApplyOutcome>;\n};',
              '  onApply: (fields: PolicyOcrField[]) => PolicyOcrApplyOutcome | Promise<PolicyOcrApplyOutcome>;\n  onClearForm?: () => void;\n};'
          )
          panel = panel.replace(
              'export function PolicyOcrImportPanel({ variant = "header", context, onApply }: PolicyOcrImportPanelProps) {',
              'export function PolicyOcrImportPanel({ variant = "header", context, onApply, onClearForm }: PolicyOcrImportPanelProps) {'
          )
          old_clear = '''  function clearPolicyDraft() {\n    try { sessionStorage.removeItem(POLICY_DRAFT_KEY); } catch {}\n    setConfirmClear(false);\n    window.location.reload();\n  }\n\n'''
          if old_clear not in panel:
              raise SystemExit('Expected clearPolicyDraft implementation not found')
          panel = panel.replace(old_clear, '')
          panel = panel.replace(
              'onClick={clearPolicyDraft} className="inline-flex h-10 items-center gap-2 rounded-xl bg-[#B85C16]',
              'onClick={()=>{setConfirmClear(false);onClearForm?.();}} className="inline-flex h-10 items-center gap-2 rounded-xl bg-[#B85C16]'
          )
          panel = panel.replace(
              '{context.mode === "create" ? <button type="button" onClick={()=>setConfirmClear(true)} aria-label="Clear policy form"',
              '{context.mode === "create" && onClearForm ? <button type="button" onClick={()=>setConfirmClear(true)} aria-label="Clear policy form"'
          )
          panel_path.write_text(panel)

          form_path = Path('apps/web-portal/components/policy-unified-form.tsx')
          form = form_path.read_text()
          anchor = '  function applyPolicyOcrFields(fields:PolicyOcrField[]):PolicyOcrApplyOutcome{\n'
          if anchor not in form:
              raise SystemExit('Policy OCR apply anchor not found')
          reset_fn = '''  function clearPolicyForm(){\n    if(isEdit)return;\n    try{sessionStorage.removeItem(POLICY_DRAFT_KEY);}catch{}\n    setForm(stateFrom(initialValues));\n    setVehicleRegistrationMode("registered");\n    setCommercialModal(null);\n    setActiveSection(0);\n    setRcReview(null);\n    setAppliedRc(null);\n    setApplyGroups(defaultGroups);\n    setLookupError(null);\n    setRegistrationTouched(false);\n    setSubmitError(null);\n    setCustomerCandidates(null);\n    setOwnershipConflict(null);\n    setBusinessConflict(null);\n    setPendingPayload(null);\n  }\n\n'''
          if 'function clearPolicyForm(){' not in form:
              form = form.replace(anchor, reset_fn + anchor, 1)
          old_usage = '<PolicyOcrImportPanel variant="header" context={ocrImportContext} onApply={applyPolicyOcrFields}/>'
          new_usage = '<PolicyOcrImportPanel variant="header" context={ocrImportContext} onApply={applyPolicyOcrFields} onClearForm={clearPolicyForm}/>'
          if old_usage not in form:
              raise SystemExit('Policy OCR panel header usage not found')
          form = form.replace(old_usage, new_usage, 1)
          form_path.write_text(form)

          regression_path = Path('apps/web-portal/scripts/policy-ocr-onboarding-import-regression.mjs')
          regression = regression_path.read_text()
          insertion = '''  ["Clear form is delegated to parent", panel, /onClearForm\\?: \\(\\) => void[\\s\\S]*onClearForm\\?\\.\\(\\)/],\n  ["OCR panel no longer owns onboarding draft storage", panel, /PolicyOcrImportPanel/],\n  ["Parent owns complete create-form reset", form, /function clearPolicyForm\\(\\)\\{[\\s\\S]*sessionStorage\\.removeItem\\(POLICY_DRAFT_KEY\\)[\\s\\S]*setForm\\(stateFrom\\(initialValues\\)\\)[\\s\\S]*setVehicleRegistrationMode\\("registered"\\)[\\s\\S]*setAppliedRc\\(null\\)[\\s\\S]*setPendingPayload\\(null\\)/],\n  ["Header wires parent reset callback", form, /onClearForm=\\{clearPolicyForm\\}/],\n'''
          marker = '  ["CPA amount does not set owner-driver opted state", mapper, /cpa_premium can include paid-driver\\/workmen liability additions[\\s\\S]*next\\.cpa = value/],\n'
          if marker not in regression:
              raise SystemExit('Regression insertion marker not found')
          if 'Clear form is delegated to parent' not in regression:
              regression = regression.replace(marker, marker + insertion, 1)
          extra = '''\nif (panel.includes('insureit:policy-onboarding:draft:v1')) throw new Error("FAIL: OCR panel must not own an obsolete onboarding draft key");\nif (panel.includes('window.location.reload()')) throw new Error("FAIL: clear form must not rely on full-page reload");\nconsole.log("PASS: clear form reset is parent-owned and reload-free");\n'''
          log_marker = 'console.log("PASS: popup contains no DOM-based form mutation path");\n'
          if extra.strip() not in regression:
              regression = regression.replace(log_marker, log_marker + extra, 1)
          regression_path.write_text(regression)
          PY
      - name: Run focused onboarding regression
        working-directory: apps/web-portal
        run: npm run policy-ocr:onboarding-import-regression
      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-policy-clear-form-reset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-ocr-import-panel.tsx apps/web-portal/components/policy-unified-form.tsx apps/web-portal/scripts/policy-ocr-onboarding-import-regression.mjs .github/workflows/tmp-fix-policy-clear-form-reset.yml
          git commit -m "Fix policy clear form reset ownership"
          git push origin HEAD:fix/policy-clear-form-reset-final
