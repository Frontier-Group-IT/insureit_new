name: One-off remove OD NET basis field

on:
  push:
    paths:
      - '.github/workflows/one-off-remove-od-net-basis.yml'

permissions:
  contents: write

jobs:
  update-policy-form:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove OD NET basis field from section 4
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-portal/components/policy-form.tsx')
          source = path.read_text()
          target = '            <Select label="OD / NET basis" value={form.payoutBasis} onChange={(e) => update("payoutBasis", e.target.value)} options={["OD", "NET"]} placeholder="Select basis" required />\n'

          if target not in source:
              raise SystemExit('OD / NET basis field was not found in section 4')

          path.write_text(source.replace(target, '', 1))
          PY

      - name: Commit focused UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-form.tsx
          git commit -m "Remove OD NET basis field from insurer pay-in"
          git push origin main
