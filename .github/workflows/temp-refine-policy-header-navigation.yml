name: Temporary refine policy header navigation

on:
  push:
    paths:
      - scripts/temp_refine_policy_header_navigation.py
      - .github/workflows/temp-refine-policy-header-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply policy header refinement
        run: python scripts/temp_refine_policy_header_navigation.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'const sections = \["Source", "Customer & Vehicle", "Policy & Premium", "Insurer Pay-in", "Partner Payout"\]' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'sticky top-\[72px\]' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'goToSection' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'sectionProgress' apps/web-portal/components/policy-unified-form.tsx
          grep -q 'policy-section-' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q 'Who brought the business and how the policy should be classified.' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q '"Partner Payout", "Review"' apps/web-portal/components/policy-unified-form.tsx
          ! grep -q '>Book Active Policy<' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Refine policy section navigation and headers"
            git pull --rebase origin main
            git push origin main
          fi
