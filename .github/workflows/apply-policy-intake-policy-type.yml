name: Apply Policy Intake policy type

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20261005113000_add_policy_type_to_policy_intakes.sql'
      - '.github/workflows/apply-policy-intake-policy-type.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Policy Intake policy type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20261005113000_add_policy_type_to_policy_intakes.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Policy Intake policy-type migration is applied
        shell: bash
        run: |
          set -euo pipefail
          state=$(supabase db query --linked --output-format json "
            select exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '20261005113000'
            ) as applied;
          ")
          echo "$state"
          if echo "$state" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration 20261005113000 is already recorded as applied; skipping re-application."
          else
            supabase db query --linked --file supabase/migrations/20261005113000_add_policy_type_to_policy_intakes.sql
            supabase migration repair --linked --status applied 20261005113000
          fi

      - name: Verify Policy Intake policy-type schema
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              exists (
                select 1
                from information_schema.columns
                where table_schema = 'public'
                  and table_name = 'policy_intake_requests'
                  and column_name = 'policy_type'
                  and data_type = 'text'
              ) as column_present,
              exists (
                select 1
                from pg_constraint c
                join pg_class t on t.oid = c.conrelid
                join pg_namespace n on n.oid = t.relnamespace
                where n.nspname = 'public'
                  and t.relname = 'policy_intake_requests'
                  and c.conname = 'policy_intake_requests_policy_type_check'
              ) as constraint_present;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"column_present"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"constraint_present"[[:space:]]*:[[:space:]]*true'
