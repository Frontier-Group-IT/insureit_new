name: Temporary internal stage 2 route patch

on:
  push:
    branches:
      - flow/internal-stage1-direct-stage2
    paths:
      - .github/workflows/tmp-internal-stage2-route.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flow/internal-stage1-direct-stage2
          fetch-depth: 0
      - name: Route internal Stage 1 directly to Stage 2
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile-app/components/internal-claim-stage-one.tsx')
          text = path.read_text()
          old = "router.replace({ pathname: '/customer/upload-documents', params: { claimId: target.id } });"
          new = "router.replace({ pathname: '/customer/internal-spot-status', params: { id: target.id } });"
          if old not in text:
              raise SystemExit('Expected Upload Documents redirect not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit route change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile-app/components/internal-claim-stage-one.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Route internal Stage 1 directly to Spot Status"
          git push origin HEAD:flow/internal-stage1-direct-stage2
