name: temp disable posp workflow tracker navigation

on:
  push:
    paths:
      - scripts/temp_disable_posp_workflow_tracker_navigation.py
      - .github/workflows/temp-disable-posp-workflow-tracker-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/temp_disable_posp_workflow_tracker_navigation.py
      - run: git diff --check
      - run: |
          rm scripts/temp_disable_posp_workflow_tracker_navigation.py
          rm .github/workflows/temp-disable-posp-workflow-tracker-navigation.yml
          git config user.name "antnish1"
          git config user.email "shahdolho@gmail.com"
          git add apps/web-portal/app/intermediaries/applications/'[id]'/workflow/page.tsx scripts/temp_disable_posp_workflow_tracker_navigation.py .github/workflows/temp-disable-posp-workflow-tracker-navigation.yml
          git commit -m "Make POSP workflow progress tracker display-only"
          git push
