name: Temporary workflow header binding

on:
  push:
    branches: [main]
    paths:
      - 'scripts/temp_bind_workflow_header_nav.py'
      - '.github/workflows/temp-bind-workflow-header-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply header and progress binding
        run: python scripts/temp_bind_workflow_header_nav.py
      - name: Validate patch
        run: |
          git diff --check
          grep -F '<div>' apps/web-portal/app/intermediaries/applications/'[id]'/workflow/page.tsx
          ! grep -F 'top-[66px] z-30 mb-4 grid grid-cols-2' apps/web-portal/app/intermediaries/applications/'[id]'/workflow/page.tsx
          ! grep -F 'top-[66px] z-30 mb-4 overflow-x-auto' apps/web-portal/app/intermediaries/applications/'[id]'/workflow/page.tsx
      - name: Commit application change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-portal/app/intermediaries/applications/'[id]'/workflow/page.tsx
          git commit -m 'Bind onboarding header and progress bar'
          git push
