name: Temporary customer type label patch

on:
  push:
    branches:
      - feature/customer-type-header-label
    paths:
      - .github/workflows/tmp-customer-type-header-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/customer-type-header-label
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename Partner Type label to Customer Type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web-portal/app/customers/[id]/edit/customer-profile-editor.tsx')
          text = path.read_text()
          old = '<HeaderMetric icon={UserRound} label="Partner Type" value={partnerTypeLabel(customer.partner_type)} />'
          new = '<HeaderMetric icon={UserRound} label="Customer Type" value={partnerTypeLabel(customer.partner_type)} />'
          if old not in text:
              raise SystemExit('Expected Partner Type header metric not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-customer-type-header-label.yml
      - name: Commit final UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/customers/'[id]'/edit/customer-profile-editor.tsx .github/workflows/tmp-customer-type-header-label.yml
          git commit -m "Rename customer header metric to Customer Type"
          git push origin HEAD:feature/customer-type-header-label
