name: INSUREIT R2 Storage all-file recovery verification (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insureit-r2-storage-full-recovery-audit
  cancel-in-progress: false

jobs:
  verify_storage_files:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: insureit-production-backup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned R2 read-only verification dependencies
        run: python -m pip install boto3==1.35.99 cryptography==44.0.2
      - name: Decrypt and SHA256-verify EVERY referenced Storage blob in memory
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_BUCKET: insureit-production-backups
          VERIFY_STORAGE_SCOPE: all
        run: python -u scripts/backup/verify_r2_restore.py
