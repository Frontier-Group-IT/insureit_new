name: Prepare Exchange custom artwork

on:
  push:
    branches:
      - mobile/exchange-custom-artwork
    paths:
      - '.github/workflows/temp-prepare-exchange-artwork.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile/exchange-custom-artwork
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Optimize Exchange PNG and restore custom artwork with fallback
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          asset = Path('apps/mobile-app/assets/brand/dashboard/dashboard-exchange.png')
          img = Image.open(asset).convert('RGBA')
          alpha = img.getchannel('A')
          bbox = alpha.getbbox()
          if not bbox:
              raise SystemExit('Exchange artwork contains no visible pixels')

          visible = img.crop(bbox)
          target = 256
          safe = 24
          max_dim = target - safe * 2
          scale = min(max_dim / visible.width, max_dim / visible.height)
          resized = visible.resize((max(1, round(visible.width * scale)), max(1, round(visible.height * scale))), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (target, target), (0, 0, 0, 0))
          x = (target - resized.width) // 2
          y = (target - resized.height) // 2
          canvas.alpha_composite(resized, (x, y))
          canvas.save(asset, format='PNG', optimize=True)

          home = Path('apps/mobile-app/app/customer/home.tsx')
          text = home.read_text()
          old = '<QuickAction icon="swap-horizontal-bold" label="Exchange" tone="#EAF3FF" color="#174EA6" onPress={onExchange} />'
          new = '<QuickAction icon="swap-horizontal-bold" image={require(\'../../assets/brand/dashboard/dashboard-exchange.png\')} label="Exchange" tone="#EAF3FF" color="#174EA6" onPress={onExchange} />'
          if old not in text:
              raise SystemExit('Expected current Exchange action not found')
          text = text.replace(old, new, 1)

          old_sig = 'function QuickAction({ icon, image, label, badge, animateBadge, tone, color, onPress }: { icon: keyof typeof MaterialCommunityIcons.glyphMap; image?: ImageSourcePropType; label: string; badge?: number; animateBadge?: boolean; tone: string; color: string; onPress: () => void }) {\n  return ('
          new_sig = 'function QuickAction({ icon, image, label, badge, animateBadge, tone, color, onPress }: { icon: keyof typeof MaterialCommunityIcons.glyphMap; image?: ImageSourcePropType; label: string; badge?: number; animateBadge?: boolean; tone: string; color: string; onPress: () => void }) {\n  const [imageFailed, setImageFailed] = useState(false);\n  useEffect(() => { setImageFailed(false); }, [image]);\n  return ('
          if old_sig not in text:
              raise SystemExit('Expected QuickAction signature not found')
          text = text.replace(old_sig, new_sig, 1)

          old_render = '{image ? <Image source={image} style={styles.quickIconArtwork} resizeMode="contain" /> : <MaterialCommunityIcons name={icon} size={22} color={color} />}'
          new_render = '{image && !imageFailed ? <Image source={image} style={styles.quickIconArtwork} resizeMode="contain" onError={() => setImageFailed(true)} /> : <MaterialCommunityIcons name={icon} size={22} color={color} />}'
          if old_render not in text:
              raise SystemExit('Expected QuickAction image render not found')
          text = text.replace(old_render, new_render, 1)
          home.write_text(text)

      - name: Validate prepared asset
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          p = Path('apps/mobile-app/assets/brand/dashboard/dashboard-exchange.png')
          img = Image.open(p).convert('RGBA')
          assert img.size == (256, 256), img.size
          alpha = img.getchannel('A')
          bbox = alpha.getbbox()
          assert bbox is not None
          assert alpha.getextrema()[0] == 0, 'No transparent pixels remain'
          visible_area = (bbox[2]-bbox[0]) * (bbox[3]-bbox[1])
          assert visible_area > 20000, f'Artwork too small: {bbox}'
          print({'size': img.size, 'bbox': bbox, 'alpha_extrema': alpha.getextrema()})

      - name: Commit prepared artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile-app/assets/brand/dashboard/dashboard-exchange.png apps/mobile-app/app/customer/home.tsx
          git commit -m 'Use optimized custom Exchange artwork with fallback'
          git push origin HEAD:mobile/exchange-custom-artwork
