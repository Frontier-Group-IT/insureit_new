name: Temporary dashboard custom artwork integration

on:
  push:
    branches:
      - mobile/dashboard-custom-artwork
    paths:
      - '.github/workflows/tmp-dashboard-custom-artwork.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/dashboard-custom-artwork
          fetch-depth: 0

      - name: Wire dashboard artwork
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('apps/mobile-app/app/customer/home.tsx')
          s = p.read_text()

          s = s.replace(
              "import { Animated, Image, Linking, Modal, Pressable, RefreshControl, ScrollView, StyleSheet, Text, View } from 'react-native';",
              "import { Animated, Image, Linking, Modal, Pressable, RefreshControl, ScrollView, StyleSheet, Text, View, type ImageSourcePropType } from 'react-native';",
          )

          s = s.replace(
              "const fleetSketch = require('../../assets/brand/customer-fleet-sketch.png');",
              "const fleetSketch = require('../../assets/brand/dashboard/dashboard-fleet-hero.png');",
          )

          replacements = {
              '<QuickAction icon="calendar-month-outline" label="Renewal" badge={renewalDue} animateBadge tone="#FFF6E8" color="#C98918" onPress={onRenewals} />':
              '<QuickAction icon="calendar-month-outline" image={require(\'../../assets/brand/dashboard/dashboard-renewal.png\')} label="Renewal" badge={renewalDue} animateBadge tone="#FFF6E8" color="#C98918" onPress={onRenewals} />',
              '<QuickAction icon="shield-plus-outline" label="Start claim" badge={claimTasks} tone="#E8F8F0" color="#10A66F" onPress={onClaim} />':
              '<QuickAction icon="shield-plus-outline" image={require(\'../../assets/brand/dashboard/dashboard-start-claim.png\')} label="Start claim" badge={claimTasks} tone="#E8F8F0" color="#10A66F" onPress={onClaim} />',
              '<QuickAction icon="file-document-outline" label="Get quote" tone="#EAF3FF" color="#174EA6" onPress={onQuote} />':
              '<QuickAction icon="file-document-outline" image={require(\'../../assets/brand/dashboard/dashboard-get-quote.png\')} label="Get quote" tone="#EAF3FF" color="#174EA6" onPress={onQuote} />',
              '<QuickAction icon="ticket-confirmation-outline" label="E-Challan" tone="#E6FAFD" color="#0EAFC8" onPress={onChallan} />':
              '<QuickAction icon="ticket-confirmation-outline" image={require(\'../../assets/brand/dashboard/dashboard-echallan.png\')} label="E-Challan" tone="#E6FAFD" color="#0EAFC8" onPress={onChallan} />',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Quick action marker not found: {old}')
              s = s.replace(old, new, 1)

          old_fn = '''function QuickAction({ icon, label, badge, animateBadge, tone, color, onPress }: { icon: keyof typeof MaterialCommunityIcons.glyphMap; label: string; badge?: number; animateBadge?: boolean; tone: string; color: string; onPress: () => void }) {\n  return (\n    <Pressable onPress={onPress} style={({ pressed }) => [styles.quickAction, pressed && styles.cardPressed]}>\n      {badge ? <ActionBadge value={badge} animated={Boolean(animateBadge)} /> : null}\n      <View style={[styles.quickIcon, { backgroundColor: tone }]}><MaterialCommunityIcons name={icon} size={22} color={color} /></View>\n      <Text style={styles.quickLabel} numberOfLines={2}>{label}</Text>\n    </Pressable>\n  );\n}'''
          new_fn = '''function QuickAction({ icon, image, label, badge, animateBadge, tone, color, onPress }: { icon: keyof typeof MaterialCommunityIcons.glyphMap; image?: ImageSourcePropType; label: string; badge?: number; animateBadge?: boolean; tone: string; color: string; onPress: () => void }) {\n  return (\n    <Pressable onPress={onPress} style={({ pressed }) => [styles.quickAction, pressed && styles.cardPressed]}>\n      {badge ? <ActionBadge value={badge} animated={Boolean(animateBadge)} /> : null}\n      <View style={[styles.quickIcon, { backgroundColor: tone }]}>\n        {image ? <Image source={image} style={styles.quickIconArtwork} resizeMode="contain" /> : <MaterialCommunityIcons name={icon} size={22} color={color} />}\n      </View>\n      <Text style={styles.quickLabel} numberOfLines={2}>{label}</Text>\n    </Pressable>\n  );\n}'''
          if old_fn not in s:
              raise SystemExit('QuickAction function marker not found')
          s = s.replace(old_fn, new_fn, 1)

          style_marker = "  quickIcon: { width: 36, height: 36, borderRadius: 13, alignItems: 'center', justifyContent: 'center' },"
          if style_marker not in s:
              raise SystemExit('quickIcon style marker not found')
          s = s.replace(style_marker, style_marker + "\n  quickIconArtwork: { width: 32, height: 32 },", 1)

          p.write_text(s)
          PY

      - name: Commit dashboard integration and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-dashboard-custom-artwork.yml
          git add -- apps/mobile-app/app/customer/home.tsx
          git diff --cached --check
          git commit -m 'Use custom dashboard artwork'
          git push origin HEAD:mobile/dashboard-custom-artwork
