name: One-time Node transitive lock repair PR 2974

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'package.json'
      - '.github/workflows/assurance-node-transitive-lock-pr2974.yml'

permissions:
  contents: write

jobs:
  lock:
    if: >-
      github.event.pull_request.number == 2974 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/stage2-mobile-node-transitives-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/stage2-mobile-node-transitives-20261008
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate and deduplicate dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm dedupe --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate compatible dependency tree
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const lock=require('./package-lock.json').packages;
          const found={undici:0,compression:0};
          for (const [key,meta] of Object.entries(lock)) {
            if (/(^|\/)node_modules\/undici$/.test(key)) {
              found.undici++;
              if(meta.version!=='6.28.1') throw Error('Unexpected undici '+key+' '+meta.version);
            }
            if (/(^|\/)node_modules\/compression$/.test(key)) {
              found.compression++;
              if(meta.version!=='1.8.2') throw Error('Unexpected compression '+key+' '+meta.version);
            }
          }
          if(!found.undici||!found.compression)throw Error('Expected package absent');
          console.log(found);
          NODE
          npm ci --no-audit --no-fund
          npm ls --all > /tmp/assurance-tree.txt
          node <<'NODE'
          const undici=require('undici'); const compression=require('compression');
          if(typeof undici.fetch!=='function'||typeof compression!=='function')throw Error('Missing HTTP/middleware contract');
          console.log('PASS undici fetch and compression middleware import');
          NODE
      - name: Commit exact npm-generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'security: lock patched undici and compression versions' --only package-lock.json
          git push origin HEAD:refs/heads/security/stage2-mobile-node-transitives-20261008
