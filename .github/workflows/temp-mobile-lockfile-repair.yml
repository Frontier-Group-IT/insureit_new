name: Temporary mobile lockfile repair

on:
  push:
    branches:
      - mobile/customer-exchange-quick-action
    paths:
      - '.github/workflows/temp-mobile-lockfile-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Exchange quick action branch
        uses: actions/checkout@v4
        with:
          ref: mobile/customer-exchange-quick-action
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate synchronized lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Synchronize dependency lockfile for mobile verification'
          git push origin HEAD:mobile/customer-exchange-quick-action
