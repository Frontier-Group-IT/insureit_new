name: Sync Customer Firebase Native Lockfile
on:
  push:
    branches:
      - feature/customer-firebase-otp-direct-2026-10-08
    paths:
      - apps/mobile-app/package.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-lockfile:
    if: github.repository == 'Frontier-Group-IT/insureit_new' && github.ref == 'refs/heads/feature/customer-firebase-otp-direct-2026-10-08'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update npm workspace lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile on feature branch only
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package manifests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(customer): sync Firebase native npm lockfile"
          git push origin HEAD:feature/customer-firebase-otp-direct-2026-10-08
