name: Temporary reconcile External Claim hotfix

on:
  push:
    branches:
      - fix/external-claim-customer-processing
    paths:
      - '.github/workflows/tmp-reconcile-external-customer-hotfix.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/external-claim-customer-processing
          fetch-depth: 0
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/external-claim-customer-processing
