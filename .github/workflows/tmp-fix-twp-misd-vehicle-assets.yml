name: Temporary TWP MISD vehicle asset compatibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-twp-misd-vehicle-assets.yml'

permissions:
  contents: write

jobs:
  fix-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Switch TWP and MISD to PNG assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct

          def validate_png(path: Path):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path} is not a PNG')
              if len(data) < 33:
                  raise SystemExit(f'{path} is unexpectedly small')
              width, height = struct.unpack('>II', data[16:24])
              if width < 148 or height < 78:
                  raise SystemExit(f'{path} dimensions are too small: {width}x{height}')
              print(f'{path}: {width}x{height}, {len(data)} bytes')

          for asset in [
              Path('apps/mobile-app/assets/vehicles/twp-bike.png'),
              Path('apps/mobile-app/assets/vehicles/misd-cpm-jcb.png'),
          ]:
              validate_png(asset)

          path = Path('apps/mobile-app/app/customer/vehicles.tsx')
          text = path.read_text()
          changes = {
              "const bikeSketch = require('../../assets/vehicles/twp-bike.webp');": "const bikeSketch = require('../../assets/vehicles/twp-bike.png');",
              "const jcbSketch = require('../../assets/vehicles/misd-cpm-jcb.webp');": "const jcbSketch = require('../../assets/vehicles/misd-cpm-jcb.png');",
          }
          for old, new in changes.items():
              if old not in text:
                  raise SystemExit(f'Expected source line missing: {old}')
              text = text.replace(old, new, 1)
          if 'twp-bike.webp' in text or 'misd-cpm-jcb.webp' in text:
              raise SystemExit('Problematic WebP references still remain in vehicles.tsx')
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Mobile typecheck
        run: npm --workspace apps/mobile-app run typecheck

      - name: Focused mobile lint
        working-directory: apps/mobile-app
        run: npx eslint app/customer/vehicles.tsx --quiet

      - name: Android Expo export
        working-directory: apps/mobile-app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-public-anon-key' }}
          NODE_ENV: production
        run: |
          rm -rf /tmp/twp-misd-asset-fix
          npx expo export --platform android --output-dir /tmp/twp-misd-asset-fix 2>&1 | tee /tmp/expo-export.log
          grep -q 'assets/vehicles/twp-bike.png' /tmp/expo-export.log
          grep -q 'assets/vehicles/misd-cpm-jcb.png' /tmp/expo-export.log

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile-app/app/customer/vehicles.tsx
          git commit -m 'Fix TWP and MISD vehicle illustrations'
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "PUBLISHED_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish Expo preview OTA
        working-directory: apps/mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@18 update --channel preview --environment preview --message "Fix TWP and MISD vehicle illustrations 2026-08-16" --non-interactive
