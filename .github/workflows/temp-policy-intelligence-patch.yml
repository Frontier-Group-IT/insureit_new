name: Temporary policy intelligence patch

on:
  push:
    paths:
      - scripts/temp_patch_policy_intelligence.py
      - .github/workflows/temp-policy-intelligence-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python scripts/temp_patch_policy_intelligence.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-form-authbridge.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Build policy onboarding intelligence panel"
            git push
          fi
