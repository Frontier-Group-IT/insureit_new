name: Validate compact register header counts

on:
  push:
    branches:
      - fix/compact-register-header-counts

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-register-header-counts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/fix_compact_register_header_counts.py
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/app/intermediaries/structured-account-register.tsx
          git commit -m "Refine POSP and MISP register header layout"
          git push origin HEAD:fix/compact-register-header-counts
