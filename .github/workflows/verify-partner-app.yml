name: Verify Partner app

on:
  pull_request:
    paths:
      - 'apps/partner-app/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-partner-app.yml'
      - '.github/workflows/build-partner-preview.yml'
      - '.github/workflows/publish-partner-preview-ota.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-partner-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-public-anon-key' }}

jobs:
  verify:
    name: resilience contracts, typecheck, lint and Expo web review build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Require synchronized dependency lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json."
            git diff -- package-lock.json
            exit 1
          fi

      - name: Verify Partner release identity
        shell: bash
        run: |
          node <<'NODE'
          const app = require('./apps/partner-app/app.json');
          const customer = require('./apps/mobile-app/app.json');
          const eas = require('./apps/partner-app/eas.json');
          const expo = app.expo || {};
          if (expo.name !== 'INSUREIT Partner' || expo.slug !== 'insureit') throw new Error('Unexpected Partner Expo name/slug.');
          if (expo.android?.package !== 'com.insureit.partner' || expo.ios?.bundleIdentifier !== 'com.insureit.partner') throw new Error('Unexpected Partner native package identity.');
          if (expo.android?.package === customer?.expo?.android?.package || expo.ios?.bundleIdentifier === customer?.expo?.ios?.bundleIdentifier) throw new Error('Partner native identity overlaps the Customer app.');
          if (expo.scheme === customer?.expo?.scheme) throw new Error('Partner URL scheme overlaps Customer app.');
          if (expo.runtimeVersion?.policy !== 'appVersion') throw new Error('Partner runtimeVersion must use appVersion policy.');
          if (eas?.build?.preview?.distribution !== 'internal' || eas?.build?.preview?.android?.buildType !== 'apk') throw new Error('Partner preview profile must produce an internal APK.');
          if (eas?.build?.preview?.channel !== 'preview' || eas?.build?.production?.channel !== 'production') throw new Error('Partner EAS channels are misconfigured.');
          const projectId = expo?.extra?.eas?.projectId;
          if (projectId && projectId === customer?.expo?.extra?.eas?.projectId) throw new Error('Partner EAS project ID must never equal the Customer project ID.');
          NODE

      - name: Verify Partner route integrity
        run: npm --workspace apps/partner-app run verify:routes

      - name: Verify Phase 5 resilience and accessibility contracts
        run: npm --workspace apps/partner-app run verify:phase5

      - name: Verify pre-APK OTA freeze
        run: npm --workspace apps/partner-app run verify:pre-apk

      - name: Verify pre-APK UAT and security contracts
        run: npm --workspace apps/partner-app run verify:uat

      - name: Partner app typecheck
        run: npm run typecheck:partner

      - name: Partner app lint
        run: npm run lint:partner

      - name: Build Expo web review export
        run: npm run build:partner:web

      - name: Upload browser review build
        uses: actions/upload-artifact@v4
        with:
          name: partner-app-web-review-${{ github.sha }}
          path: apps/partner-app/dist-web
          if-no-files-found: error
          retention-days: 14

      - name: Verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## INSUREIT Partner app review gate"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Dependency lockfile: synchronized"
            echo "- Route/deep-link integrity: verified"
            echo "- Phase 5 resilience/accessibility contracts: verified"
            echo "- Pre-APK OTA runtime freeze: verified"
            echo "- Pre-APK UAT/security contracts: verified"
            echo "- Static checks: TypeScript typecheck and Expo lint"
            echo "- Review build: Expo web export"
            echo "- Production deployment: not triggered by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
