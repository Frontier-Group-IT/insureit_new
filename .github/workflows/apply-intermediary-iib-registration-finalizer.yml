name: Apply intermediary IIB registration finalizer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20261001170000_complete_intermediary_iib_registration.sql'
      - '.github/workflows/apply-intermediary-iib-registration-finalizer.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply intermediary IIB registration finalizer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20261001170000_complete_intermediary_iib_registration.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure IIB registration finalizer migration is applied
        shell: bash
        run: |
          set -euo pipefail
          state=$(supabase db query --linked --output-format json "
            select exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '20261001170000'
            ) as applied;
          ")
          echo "$state"
          if echo "$state" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration 20261001170000 is already recorded as applied; skipping re-application."
          else
            supabase db query --linked --file supabase/migrations/20261001170000_complete_intermediary_iib_registration.sql
            supabase migration repair --linked --status applied 20261001170000
          fi

      - name: Verify IIB registration finalizer contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.complete_intermediary_iib_registration(uuid,uuid,text,date)') is not null as function_present,
              has_function_privilege(
                'service_role',
                'public.complete_intermediary_iib_registration(uuid,uuid,text,date)',
                'EXECUTE'
              ) as service_role_can_execute,
              not has_function_privilege(
                'authenticated',
                'public.complete_intermediary_iib_registration(uuid,uuid,text,date)',
                'EXECUTE'
              ) as authenticated_blocked;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_present"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"service_role_can_execute"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"authenticated_blocked"[[:space:]]*:[[:space:]]*true'
