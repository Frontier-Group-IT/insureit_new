name: Publish customer 0.3.0 production OTA

on:
  push:
    branches:
      - feat/customer-native-release-readiness
    paths:
      - 'apps/mobile-app/**'
      - '.github/workflows/publish-customer-release-production-ota.yml'

permissions:
  contents: read

concurrency:
  group: customer-0-3-0-production-ota
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Verify release runtime and native baseline
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/mobile-app/app.json').expo;
          const audioPlugin = (app.plugins || []).find((plugin) => Array.isArray(plugin) && plugin[0] === 'expo-audio');
          if (app.version !== '0.3.0') throw new Error(`Expected app version 0.3.0, found ${app.version}`);
          if (app.android?.versionCode !== 9) throw new Error(`Expected Play baseline versionCode 9, found ${app.android?.versionCode}`);
          if (!audioPlugin || audioPlugin[1]?.enableBackgroundPlayback !== false) throw new Error('Background playback must remain disabled.');
          if (!app.android?.permissions?.includes('android.permission.RECORD_AUDIO')) throw new Error('RECORD_AUDIO must remain enabled.');
          console.log('Verified runtime 0.3.0 / Play baseline 9 / production OTA compatibility.');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish production OTA
        working-directory: apps/mobile-app
        run: |
          npx eas-cli update \
            --channel production \
            --environment production \
            --message "Customer 0.3.0 startup blank-screen safeguard ${GITHUB_SHA}" \
            --non-interactive

      - name: Verify production channel
        working-directory: apps/mobile-app
        run: npx eas-cli channel:view production --json --non-interactive
