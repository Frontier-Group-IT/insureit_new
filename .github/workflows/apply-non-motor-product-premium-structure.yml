name: Apply Non-Motor product premium structure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20261005171000_add_non_motor_product_premium_structure.sql'
      - '.github/workflows/apply-non-motor-product-premium-structure.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Non-Motor product premium structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20261005171000_add_non_motor_product_premium_structure.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Non-Motor product premium structure migration is applied
        shell: bash
        run: |
          set -euo pipefail
          state=$(supabase db query --linked --output-format json "
            select exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '20261005171000'
            ) as applied;
          ")
          echo "$state"
          if echo "$state" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration 20261005171000 is already recorded as applied; skipping re-application."
          else
            supabase db query --linked --file supabase/migrations/20261005171000_add_non_motor_product_premium_structure.sql
            supabase migration repair --linked --status applied 20261005171000
          fi

      - name: Verify Non-Motor product premium structure schema
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regclass('public.non_motor_product_configurations') is not null as table_present,
              exists (
                select 1
                from information_schema.columns
                where table_schema = 'public'
                  and table_name = 'non_motor_product_configurations'
                  and column_name = 'premium_structure'
                  and data_type = 'text'
              ) as premium_structure_present,
              exists (
                select 1
                from pg_constraint c
                join pg_class t on t.oid = c.conrelid
                join pg_namespace n on n.oid = t.relnamespace
                where n.nspname = 'public'
                  and t.relname = 'non_motor_product_configurations'
                  and c.conname = 'non_motor_product_configurations_premium_structure_check'
              ) as structure_constraint_present;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"table_present"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"premium_structure_present"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"structure_constraint_present"[[:space:]]*:[[:space:]]*true'
