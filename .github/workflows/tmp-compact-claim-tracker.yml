name: Temporary compact Claim Tracker refinement

on:
  push:
    branches:
      - recovery/mobile-today-cumulative
    paths:
      - '.github/workflows/tmp-compact-claim-tracker.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/mobile-today-cumulative
          fetch-depth: 0

      - name: Apply compact Claim Tracker UI
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          p = Path('apps/mobile-app/app/customer/claim-detail.tsx')
          s = p.read_text()

          s = s.replace(
            "import { ClaimActionBar, ClaimFinancialSummary, ClaimPrimaryAction, ClaimProgressStrip } from '@/components/external-claim-ui';",
            "import { ClaimFinancialSummary, ClaimPrimaryAction } from '@/components/external-claim-ui';"
          )
          s = s.replace(
            "import { formatJourneyAmount, formatJourneyDate, stageMainAmount, STAGE_DATE_LABELS } from '@/lib/self-managed-claim-timeline';",
            "import { formatJourneyAmount, formatJourneyDate, stageMainAmount } from '@/lib/self-managed-claim-timeline';"
          )

          old_heading = '''      <View style={styles.pageHeading}>\n        <View style={styles.pageHeadingCopy}>\n          <Text style={styles.pageEyebrow}>{selfManaged ? 'EXTERNAL CLAIM' : 'CLAIMS'}</Text>\n          <Text style={styles.pageTitle}>{selfManaged ? 'Claim Tracker' : 'Claim Detail'}</Text>\n          <Text style={styles.pageSubtitle}>{selfManaged ? 'Follow the complete claim journey and continue from the current stage.' : customerStageCopy(claim.current_status)}</Text>\n        </View>\n        {selfManaged ? <AppBadge label="Self Tracked" tone="info" /> : null}\n      </View>\n      {message ? <Message type="error">{message}</Message> : null}\n\n      {selfManaged && !settled ? <ClaimProgressStrip step={Math.min(9, currentStageIndex + 1)} /> : null}\n'''
          new_heading = '''      <View style={styles.pageHeading}>\n        <View style={styles.pageHeadingCopy}>\n          <Text style={styles.pageEyebrow}>{selfManaged ? 'EXTERNAL CLAIM' : 'CLAIMS'}</Text>\n          <Text style={styles.pageTitle}>{selfManaged ? 'Claim Tracker' : 'Claim Detail'}</Text>\n          {!selfManaged ? <Text style={styles.pageSubtitle}>{customerStageCopy(claim.current_status)}</Text> : null}\n        </View>\n        {selfManaged ? <View style={styles.headingActions}>\n          <AppBadge label="Self Tracked" tone="info" />\n          <Pressable\n            accessibilityRole="button"\n            accessibilityLabel="Get Assistance"\n            hitSlop={8}\n            onPress={() => router.push({ pathname: '/customer/request-claim-assistance', params: { id: claim.id } })}\n            style={({ pressed }) => [styles.assistanceIconButton, pressed && styles.assistanceIconButtonPressed]}\n          >\n            <MaterialCommunityIcons name="account-voice" size={24} color="#0A43A3" />\n          </Pressable>\n        </View> : null}\n      </View>\n      {message ? <Message type="error">{message}</Message> : null}\n'''
          if old_heading not in s:
              raise SystemExit('Claim Tracker heading anchor not found')
          s = s.replace(old_heading, new_heading, 1)

          old_current = '''      {!settled ? <View style={[styles.currentCard, { borderColor: tone.border, backgroundColor: tone.background }]}>\n        <View style={[styles.currentAccent, { backgroundColor: tone.accent }]} />\n        <View style={[styles.currentIcon, { backgroundColor: tone.soft }]}><MaterialCommunityIcons name="arrow-right-circle-outline" size={23} color={tone.accent} /></View>\n        <View style={styles.currentCopy}>\n          <Text style={[styles.currentEyebrow, { color: tone.accent }]}>{selfManaged ? 'CURRENT MILESTONE' : 'NEXT ACTION'}</Text>\n          <Text style={styles.currentTitle}>{currentStage?.label ?? claim.current_status}</Text>\n          <Text style={styles.currentBody}>{selfManaged ? currentStageHint(currentStage?.key) : customerStageCopy(claim.current_status)}</Text>\n        </View>\n      </View> : null}\n\n      {selfManaged && !settled ? <ClaimActionBar\n        primaryLabel="Proceed to Next Step"\n        primaryIcon="arrow-right"\n        onPrimary={openCurrentSelfStage}\n        onAssistance={() => router.push({ pathname: '/customer/request-claim-assistance', params: { id: claim.id } })}\n      /> : null}\n'''
          new_current = '''      {!settled ? <Pressable\n        accessibilityRole={selfManaged ? 'button' : undefined}\n        accessibilityLabel={selfManaged ? `Continue to ${currentStage?.label ?? 'current milestone'}` : undefined}\n        disabled={!selfManaged}\n        onPress={openCurrentSelfStage}\n        style={({ pressed }) => [styles.currentCard, { borderColor: tone.border, backgroundColor: tone.background }, selfManaged && pressed && styles.currentCardPressed]}\n      >\n        <View style={[styles.currentAccent, { backgroundColor: tone.accent }]} />\n        <View style={[styles.currentIcon, { backgroundColor: tone.soft }]}><MaterialCommunityIcons name="arrow-right-circle-outline" size={21} color={tone.accent} /></View>\n        <View style={styles.currentCopy}>\n          <Text style={[styles.currentEyebrow, { color: tone.accent }]}>{selfManaged ? 'CURRENT MILESTONE' : 'NEXT ACTION'}</Text>\n          <Text style={styles.currentTitle}>{currentStage?.label ?? claim.current_status}</Text>\n          <Text numberOfLines={2} style={styles.currentBody}>{selfManaged ? currentStageHint(currentStage?.key) : customerStageCopy(claim.current_status)}</Text>\n        </View>\n        {selfManaged ? <View style={styles.currentContinue}>\n          <Text style={styles.currentContinueText}>Continue</Text>\n          <MaterialCommunityIcons name="chevron-right" size={20} color={tone.accent} />\n        </View> : null}\n      </Pressable> : null}\n'''
          if old_current not in s:
              raise SystemExit('Current milestone/action anchor not found')
          s = s.replace(old_current, new_current, 1)

          s = s.replace(
            "            {selfManaged && (done || current) ? <Text style={styles.stageEventLabel}>{STAGE_DATE_LABELS[stage.key]}</Text> : null}\n",
            ""
          )

          old_styles = """  pageHeading:{marginBottom:12,flexDirection:'row',alignItems:'flex-start',justifyContent:'space-between',gap:10},pageHeadingCopy:{flex:1,minWidth:0},pageEyebrow:{color:'#145ED7',fontSize:10,fontWeight:'900',letterSpacing:1},pageTitle:{color:palette.navy,fontSize:24,fontWeight:'900',marginTop:2},pageSubtitle:{color:'#6A7789',fontSize:10.5,lineHeight:15,fontWeight:'600',marginTop:3},\n"""
          new_styles = """  pageHeading:{marginBottom:8,flexDirection:'row',alignItems:'center',justifyContent:'space-between',gap:10},pageHeadingCopy:{flex:1,minWidth:0},pageEyebrow:{color:'#145ED7',fontSize:10,fontWeight:'900',letterSpacing:1},pageTitle:{color:palette.navy,fontSize:24,fontWeight:'900',marginTop:2},pageSubtitle:{color:'#6A7789',fontSize:10.5,lineHeight:15,fontWeight:'600',marginTop:3},headingActions:{flexDirection:'row',alignItems:'center',gap:7,flexShrink:0},assistanceIconButton:{width:38,height:38,borderRadius:12,alignItems:'center',justifyContent:'center',backgroundColor:'#F4F8FE',borderWidth:1,borderColor:'#D7E5F7'},assistanceIconButtonPressed:{backgroundColor:'#E8F1FD',transform:[{scale:.97}]},\n"""
          if old_styles not in s:
              raise SystemExit('Heading styles anchor not found')
          s = s.replace(old_styles, new_styles, 1)

          old_current_styles = """  currentCard:{position:'relative',borderWidth:1,borderRadius:18,padding:12,paddingLeft:15,flexDirection:'row',alignItems:'center',gap:10,marginBottom:10,overflow:'hidden'},currentAccent:{position:'absolute',left:0,top:0,bottom:0,width:4},currentIcon:{width:42,height:42,borderRadius:13,alignItems:'center',justifyContent:'center'},currentCopy:{flex:1,minWidth:0},currentEyebrow:{fontSize:8.5,fontWeight:'900',letterSpacing:.5},currentTitle:{color:palette.navy,fontSize:14.5,fontWeight:'900',marginTop:2},currentBody:{color:'#5F7086',fontSize:10.8,lineHeight:15,fontWeight:'700',marginTop:3},\n"""
          new_current_styles = """  currentCard:{position:'relative',borderWidth:1,borderRadius:16,paddingVertical:9,paddingHorizontal:10,paddingLeft:14,flexDirection:'row',alignItems:'center',gap:9,marginBottom:7,overflow:'hidden'},currentCardPressed:{opacity:.84,transform:[{scale:.995}]},currentAccent:{position:'absolute',left:0,top:0,bottom:0,width:4},currentIcon:{width:36,height:36,borderRadius:11,alignItems:'center',justifyContent:'center'},currentCopy:{flex:1,minWidth:0},currentEyebrow:{fontSize:8,fontWeight:'900',letterSpacing:.5},currentTitle:{color:palette.navy,fontSize:13.5,fontWeight:'900',marginTop:1},currentBody:{color:'#5F7086',fontSize:10,lineHeight:13.5,fontWeight:'700',marginTop:2},currentContinue:{flexDirection:'row',alignItems:'center',gap:1,marginLeft:3},currentContinueText:{color:'#0A43A3',fontSize:9.5,fontWeight:'900'},\n"""
          if old_current_styles not in s:
              raise SystemExit('Current card styles anchor not found')
          s = s.replace(old_current_styles, new_current_styles, 1)

          old_journey_styles = """  sectionHeader:{minHeight:62,borderRadius:17,borderWidth:1,borderColor:'#D6E2EE',backgroundColor:'#F7FAFF',padding:11,marginTop:10,flexDirection:'row',alignItems:'center',gap:10},sectionHeaderIcon:{width:38,height:38,borderRadius:12,backgroundColor:'#E7F0FC',borderWidth:1,borderColor:'#D4E2F2',alignItems:'center',justifyContent:'center'},sectionHeaderCopy:{flex:1,minWidth:0},sectionTitle:{color:palette.navy,fontSize:14,fontWeight:'900'},sectionSub:{color:'#718198',fontSize:10,fontWeight:'700',marginTop:2},sectionBody:{borderWidth:1,borderTopWidth:0,borderColor:'#D6E2EE',backgroundColor:'#FFFFFF',borderBottomLeftRadius:17,borderBottomRightRadius:17,padding:10,gap:8},journeyBody:{padding:8,gap:0},\n  stageRow:{minHeight:72,paddingHorizontal:8,paddingVertical:9,flexDirection:'row',alignItems:'stretch',gap:9,borderBottomWidth:1,borderBottomColor:'#EEF2F6'},stageRowCurrent:{backgroundColor:'#EDF5FF',borderRadius:14,borderWidth:1,borderColor:'#C8DCF3',marginVertical:4,paddingHorizontal:10},stageRail:{width:30,alignItems:'center'},stageNode:{width:30,height:30,borderRadius:15,backgroundColor:'#EEF2F6',borderWidth:1,borderColor:'#E0E6ED',alignItems:'center',justifyContent:'center'},stageDone:{backgroundColor:'#168161',borderColor:'#168161'},stageCurrent:{backgroundColor:'#0A43A3',borderColor:'#0A43A3'},stageLine:{width:2,flex:1,minHeight:20,marginTop:4,backgroundColor:'#E4EAF1'},stageLineDone:{backgroundColor:'#A9D8C7'},stageCopy:{flex:1,minWidth:0,justifyContent:'center'},stageTitle:{color:palette.navy,fontSize:11.5,fontWeight:'900'},stageMeta:{color:'#7A8799',fontSize:9.5,fontWeight:'700',marginTop:2},stageMetaCurrent:{color:'#0A43A3',fontWeight:'900'},stageEventLabel:{color:'#8B9AAD',fontSize:8.5,fontWeight:'700',marginTop:3},stageRight:{width:112,alignItems:'flex-end',justifyContent:'center',gap:3},stageDate:{color:'#344054',fontSize:9.5,lineHeight:13,fontWeight:'800',textAlign:'right'},stageDateMuted:{color:'#98A2B3'},stageAmount:{color:'#10365F',fontSize:10.8,fontWeight:'900',backgroundColor:'#EEF4FB',paddingHorizontal:7,paddingVertical:3,borderRadius:999},\n"""
          new_journey_styles = """  sectionHeader:{minHeight:50,borderRadius:15,borderWidth:1,borderColor:'#D6E2EE',backgroundColor:'#F7FAFF',paddingVertical:7,paddingHorizontal:9,marginTop:7,flexDirection:'row',alignItems:'center',gap:8},sectionHeaderIcon:{width:32,height:32,borderRadius:10,backgroundColor:'#E7F0FC',borderWidth:1,borderColor:'#D4E2F2',alignItems:'center',justifyContent:'center'},sectionHeaderCopy:{flex:1,minWidth:0},sectionTitle:{color:palette.navy,fontSize:13,fontWeight:'900'},sectionSub:{color:'#718198',fontSize:9.5,fontWeight:'700',marginTop:1},sectionBody:{borderWidth:1,borderTopWidth:0,borderColor:'#D6E2EE',backgroundColor:'#FFFFFF',borderBottomLeftRadius:15,borderBottomRightRadius:15,padding:8,gap:6},journeyBody:{paddingVertical:4,paddingHorizontal:6,gap:0},\n  stageRow:{minHeight:54,paddingHorizontal:6,paddingVertical:6,flexDirection:'row',alignItems:'stretch',gap:7,borderBottomWidth:1,borderBottomColor:'#EEF2F6'},stageRowCurrent:{backgroundColor:'#EDF5FF',borderRadius:12,borderWidth:1,borderColor:'#C8DCF3',marginVertical:2,paddingHorizontal:7},stageRail:{width:25,alignItems:'center'},stageNode:{width:24,height:24,borderRadius:12,backgroundColor:'#EEF2F6',borderWidth:1,borderColor:'#E0E6ED',alignItems:'center',justifyContent:'center'},stageDone:{backgroundColor:'#168161',borderColor:'#168161'},stageCurrent:{backgroundColor:'#0A43A3',borderColor:'#0A43A3'},stageLine:{width:2,flex:1,minHeight:15,marginTop:3,backgroundColor:'#E4EAF1'},stageLineDone:{backgroundColor:'#A9D8C7'},stageCopy:{flex:1,minWidth:0,justifyContent:'center'},stageTitle:{color:palette.navy,fontSize:10.8,fontWeight:'900'},stageMeta:{color:'#7A8799',fontSize:9,fontWeight:'700',marginTop:1},stageMetaCurrent:{color:'#0A43A3',fontWeight:'900'},stageRight:{width:104,alignItems:'flex-end',justifyContent:'center',gap:2},stageDate:{color:'#344054',fontSize:9,lineHeight:12,fontWeight:'800',textAlign:'right'},stageDateMuted:{color:'#98A2B3'},stageAmount:{color:'#10365F',fontSize:10,fontWeight:'900',backgroundColor:'#EEF4FB',paddingHorizontal:6,paddingVertical:2,borderRadius:999},\n"""
          if old_journey_styles not in s:
              raise SystemExit('Journey styles anchor not found')
          s = s.replace(old_journey_styles, new_journey_styles, 1)

          p.write_text(s)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify mobile
        run: |
          npm run typecheck:mobile
          npm run lint:mobile
          npm run build:mobile:web

      - name: Commit verified refinement and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "antnish1"
          git config user.email "shahdolho@gmail.com"
          git add apps/mobile-app/app/customer/claim-detail.tsx
          git commit -m "Compact Claim Tracker and make milestone actionable"
          git rm .github/workflows/tmp-compact-claim-tracker.yml
          git commit -m "chore: remove temporary Claim Tracker workflow"
          git push origin HEAD:recovery/mobile-today-cumulative
