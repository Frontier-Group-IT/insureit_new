name: Temporary application review eye action

on:
  push:
    paths:
      - scripts/temp_application_review_eye_action.py
      - .github/workflows/temp-application-review-eye-action.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused patch
        run: python scripts/temp_application_review_eye_action.py
      - name: Verify diff
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path("apps/web-portal/app/intermediaries/applications/[id]/page.tsx").read_text()
          assert '>Open</a>' not in text
          assert 'aria-label={`View ${label}`}' in text
          assert '<EyeIcon />' in text
          assert 'secondaryActionClassName' not in text
          PY
      - name: Commit application change and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/temp_application_review_eye_action.py .github/workflows/temp-application-review-eye-action.yml
          git add -A
          git commit -m "Use compact eye action on application review documents"
          git push
