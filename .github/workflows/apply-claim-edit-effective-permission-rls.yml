name: Apply claim edit effective permission RLS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260907060000_align_claim_update_rls_with_effective_permissions.sql'
      - '.github/workflows/apply-claim-edit-effective-permission-rls.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply claim edit effective permission RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260907060000_align_claim_update_rls_with_effective_permissions.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply claim edit RLS migration
        run: supabase db query --linked --file supabase/migrations/20260907060000_align_claim_update_rls_with_effective_permissions.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260907060000

      - name: Verify claim edit permission gate
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.can_update_claim_status()') is not null as update_gate_ready,
              to_regprocedure('public.can_manage_claims_organization()') is not null as organization_gate_ready,
              exists (
                select 1
                from pg_policies
                where schemaname = 'public'
                  and tablename = 'claims'
                  and policyname = 'claims effective manage claims organization update'
                  and cmd = 'UPDATE'
              ) as policy_ready
          ")
          echo "$result"
          echo "$result" | grep -Eq '"update_gate_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"organization_gate_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"policy_ready"[[:space:]]*:[[:space:]]*true'
