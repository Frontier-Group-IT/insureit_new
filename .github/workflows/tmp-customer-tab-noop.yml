name: Temporary customer tab no-op navigation fix

on:
  push:
    branches:
      - feat/self-managed-stage-navigation
    paths:
      - .github/workflows/tmp-customer-tab-noop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/self-managed-stage-navigation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prevent duplicate customer root-tab navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile-app/components/ui.tsx')
          text = path.read_text()
          old = '''        {tabs.map((tab) => {
          const active = isTabActive(tab.href, pathname, customerContext);
          return (
            <Pressable key={`${tab.href}-${tab.label}`} accessibilityRole="button" onPress={() => router.push(tab.href as LinkProps['href'])} style={styles.bottomTab}>
'''
          new = '''        {tabs.map((tab) => {
          const active = isTabActive(tab.href, pathname, customerContext);
          const isCustomerRootTab = role === 'customer'
            && !isPortfolioCustomerContext(customerContext)
            && ['Home', 'Policies', 'Vehicles', 'Support', 'Profile'].includes(tab.label);
          const isAlreadyOnCustomerRootTab = isCustomerRootTab && pathname === tab.href;
          return (
            <Pressable
              key={`${tab.href}-${tab.label}`}
              accessibilityRole="button"
              onPress={() => {
                if (isAlreadyOnCustomerRootTab) return;
                router.push(tab.href as LinkProps['href']);
              }}
              style={styles.bottomTab}
            >
'''
          if old not in text:
              raise SystemExit('UniversalBottomTabs target not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install mobile dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: Typecheck mobile app
        working-directory: apps/mobile-app
        run: npm run typecheck

      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-customer-tab-noop.yml
          git add apps/mobile-app/components/ui.tsx
          git commit -m "Avoid repeat customer root-tab navigation"
          git push origin HEAD:feat/self-managed-stage-navigation
