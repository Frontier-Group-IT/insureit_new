name: Temporary policy header icon actions patch

on:
  push:
    branches:
      - ui/policy-header-icon-actions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/policy-header-icon-actions
      - name: Convert policy header actions to icon-only controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web-portal/components/policy-ocr-import-panel.tsx')
          source = path.read_text()
          old = '''<div className="flex flex-wrap items-center justify-end gap-2"><button type="button" onClick={()=>setOpen(true)} className="group inline-flex h-10 items-center gap-2 rounded-xl border border-white/30 bg-white/10 px-3.5 text-[10px] font-bold text-white shadow-sm transition hover:border-white/45 hover:bg-white/18 focus:outline-none focus:ring-2 focus:ring-white/25"><span className="grid h-7 w-7 place-items-center rounded-lg bg-[#0F466D]/55 text-[#7CE7E0] ring-1 ring-white/10 transition group-hover:bg-[#12547F]"><FileUp className="h-4 w-4" strokeWidth={2}/></span><span>Import Policy Details</span></button>{context.mode === "create" ? <button type="button" onClick={()=>setConfirmClear(true)} className="group inline-flex h-10 items-center gap-2 rounded-xl border border-white/22 bg-[#071D49]/24 px-3.5 text-[10px] font-semibold text-white/90 shadow-sm transition hover:border-[#FFC66D]/60 hover:bg-[#5B3514]/22 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#FFC66D]/20"><span className="grid h-7 w-7 place-items-center rounded-lg bg-[#5A3A17]/45 text-[#FFC66D] ring-1 ring-[#FFC66D]/20 transition group-hover:bg-[#6A4319]/60"><Eraser className="h-4 w-4" strokeWidth={2}/></span><span>Clear Form</span></button> : null}</div>'''
          new = '''<div className="flex items-center justify-end gap-2.5"><button type="button" onClick={()=>setOpen(true)} aria-label="Import policy details" title="Import policy details" className="group grid h-11 w-11 place-items-center rounded-xl border border-[#77E8E1]/35 bg-[#0E456E]/70 text-[#7CE7E0] shadow-[0_7px_18px_rgba(4,26,56,.18)] transition hover:-translate-y-0.5 hover:border-[#8CF2EB]/65 hover:bg-[#12547F] hover:text-[#A1FFF8] focus:outline-none focus:ring-2 focus:ring-[#7CE7E0]/35"><FileUp className="h-[19px] w-[19px] transition-transform group-hover:-translate-y-0.5" strokeWidth={2.1}/></button>{context.mode === "create" ? <button type="button" onClick={()=>setConfirmClear(true)} aria-label="Clear policy form" title="Clear policy form" className="group grid h-11 w-11 place-items-center rounded-xl border border-[#FFC66D]/30 bg-[#6A4319]/45 text-[#FFC66D] shadow-[0_7px_18px_rgba(4,26,56,.18)] transition hover:-translate-y-0.5 hover:border-[#FFD58F]/65 hover:bg-[#7B4D1C]/65 hover:text-[#FFE0A6] focus:outline-none focus:ring-2 focus:ring-[#FFC66D]/30"><Eraser className="h-[19px] w-[19px] transition-transform group-hover:-rotate-6" strokeWidth={2.1}/></button> : null}</div>'''
          if old not in source:
              raise SystemExit('Expected header action block not found; refusing to patch')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Verify typecheck
        working-directory: apps/web-portal
        run: npm ci && npm run typecheck
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-policy-header-icon-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-ocr-import-panel.tsx .github/workflows/tmp-policy-header-icon-actions.yml
          git commit -m "Use icon-only policy header actions"
          git push origin HEAD:ui/policy-header-icon-actions
