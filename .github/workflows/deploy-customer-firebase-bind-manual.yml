name: Deploy Customer Firebase Binding (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'Frontier-Group-IT/insureit_new' && github.ref == 'refs/heads/feature/customer-firebase-otp-direct-2026-10-08'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check required secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
      - name: Check security invariants
        run: |
          npm ci --ignore-scripts
          node --test pocs/customer-firebase-auth/edge-binding-source.test.cjs
      - name: Deploy only the customer Firebase binding Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase functions deploy customer-firebase-bind --project-ref ilzhsfqqjyppzzvfscmh --no-verify-jwt
