name: Prove atomic Firebase UID enrollment on disposable Supabase

on:
  pull_request:
    branches:
      - feature/customer-firebase-otp-gateway-0-3-2-20261014
    paths:
      - 'apps/mobile-app/scripts/customer-firebase-enrollment-local-integration.mjs'
      - 'supabase/migrations/20261016150000_customer_firebase_migration_audit.sql'
      - 'supabase/migrations/20261016162000_customer_firebase_enrollment_atomic.sql'
      - '.github/workflows/verify-customer-firebase-enrollment-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Install package lock dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start ONLY an ephemeral local Supabase auth stack (NEVER production)
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          supabase init
          supabase start --exclude studio,mail,analytics,realtime,storage,functions,pooler
          eval "$(supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_DB_URL)"
          test "${SUPABASE_URL:-}" = "http://127.0.0.1:54321"
          test -n "${SUPABASE_ANON_KEY:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          [[ "${SUPABASE_DB_URL:-}" == *"@127.0.0.1:54322/"* || "${SUPABASE_DB_URL:-}" == *"@localhost:54322/"* ]]
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$SUPABASE_DB_URL"
          } >> "$GITHUB_ENV"
      - name: Create isolated Customer and Firebase link fixture schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create table public.profiles(id uuid primary key, role text not null, is_active boolean not null, phone text);
          create table public.customer_firebase_identity_links(
            firebase_project_id text not null,
            firebase_uid text not null,
            profile_id uuid not null references public.profiles(id),
            verified_phone_at_approval text not null,
            is_approved boolean not null,
            is_active boolean not null,
            primary key(firebase_project_id,firebase_uid),
            unique(profile_id)
          );
          grant usage on schema public to service_role, anon, authenticated;
          grant select on public.profiles to service_role;
          grant select,insert on public.customer_firebase_identity_links to service_role;
          SQL
      - name: Apply prepared audit and enrollment migrations ONLY to disposable database
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261016150000_customer_firebase_migration_audit.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261016162000_customer_firebase_enrollment_atomic.sql
      - name: Prove atomic enrollment, idempotency, audit and unauthorized rejection
        run: node apps/mobile-app/scripts/customer-firebase-enrollment-local-integration.mjs
      - name: Verify reversible RPC rollback on disposable DB
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/rollback/20261016162000_customer_firebase_enrollment_atomic_down.sql
          test "$(psql "$SUPABASE_DB_URL" -Atqc "select count(*) from pg_proc where proname='customer_firebase_enroll_approved'")" = "0"
