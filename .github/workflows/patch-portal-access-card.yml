name: Patch portal access card

on:
  push:
    branches:
      - feature/portal-access-card-actions-20260810-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portal-access-card-actions-20260810-v2
          fetch-depth: 0
      - name: Apply patch
        run: python .github/tmp/patch-portal-access-card.py
      - name: Commit focused application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-portal-access-card.yml .github/tmp/patch-portal-access-card.py
          git add 'apps/web-portal/app/intermediaries/applications/[id]/page.tsx'
          git commit -m "feat: make portal access summary actionable"
          git push origin HEAD:feature/portal-access-card-actions-20260810-v2
