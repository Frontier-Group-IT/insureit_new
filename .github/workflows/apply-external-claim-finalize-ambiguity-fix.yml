name: Apply External Claim finalize ambiguity fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260918154500_fix_external_claim_finalize_claim_id_ambiguity.sql'
      - 'supabase/verification/20260918154500_fix_external_claim_finalize_claim_id_ambiguity.sql'
      - '.github/workflows/apply-external-claim-finalize-ambiguity-fix.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply External Claim finalize ambiguity fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260918154500_fix_external_claim_finalize_claim_id_ambiguity.sql
          test -f supabase/verification/20260918154500_fix_external_claim_finalize_claim_id_ambiguity.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply External Claim finalize ambiguity fix
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/migrations/20260918154500_fix_external_claim_finalize_claim_id_ambiguity.sql

      - name: Record migration as applied
        shell: bash
        run: |
          set -euo pipefail
          supabase migration repair --linked --status applied 20260918154500

      - name: Verify External Claim finalize contract
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/verification/20260918154500_fix_external_claim_finalize_claim_id_ambiguity.sql
          result=$(supabase db query --linked --output-format json "
            select
              position(
                'on conflict on constraint claim_milestones_claim_key_unique'
                in lower(pg_get_functiondef('public.finalize_self_managed_external_claim_draft(uuid,timestamptz,timestamptz,text,text,text)'::regprocedure))
              ) > 0 as named_constraint_ready,
              position(
                'on conflict (claim_id, milestone_key)'
                in lower(pg_get_functiondef('public.finalize_self_managed_external_claim_draft(uuid,timestamptz,timestamptz,text,text,text)'::regprocedure))
              ) = 0 as ambiguity_removed,
              exists (
                select 1
                from supabase_migrations.schema_migrations
                where version = '20260918154500'
              ) as migration_recorded
          ")
          echo "$result"
          echo "$result" | grep -Eq '"named_constraint_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"ambiguity_removed"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"migration_recorded"[[:space:]]*:[[:space:]]*true'
