name: Apply PR 2262 rollback migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260923110000_revert_multi_customer_vehicle_links.sql'
      - '.github/workflows/apply-revert-multi-customer-vehicle-links.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply PR 2262 rollback migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260923110000_revert_multi_customer_vehicle_links.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure rollback migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260923110000'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Rollback migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260923110000_revert_multi_customer_vehicle_links.sql
            supabase migration repair --linked --status applied 20260923110000
          fi

      - name: Verify single-customer vehicle contract restored
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.can_access_linked_vehicle(uuid)') is null as linked_helper_removed,
              not exists (
                select 1 from pg_policies
                where schemaname='public'
                  and tablename='vehicles'
                  and policyname='vehicles linked customer read'
              ) as linked_vehicle_policy_removed,
              not exists (
                select 1 from pg_policies
                where schemaname='public'
                  and tablename='vehicle_customer_links'
                  and policyname='vehicle customer links read accessible customer'
              ) as link_read_policy_removed,
              position('vehicle_customer_links' in pg_get_functiondef(
                'public.create_customer_vehicle_v2(uuid,text,text,text,text,integer,text,text,text,numeric,date,date,date,date,date,date,text,numeric,integer)'::regprocedure
              )) = 0 as vehicle_rpc_single_customer,
              position('vehicle_customer_links' in pg_get_functiondef(
                'public.create_customer_external_policy(uuid,uuid,uuid,text,text,date,date,numeric,numeric)'::regprocedure
              )) = 0 as policy_rpc_single_customer;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"linked_helper_removed"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"linked_vehicle_policy_removed"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"link_read_policy_removed"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"vehicle_rpc_single_customer"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"policy_rpc_single_customer"[[:space:]]*:[[:space:]]*true'
