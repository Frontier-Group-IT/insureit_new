name: Apply Partner multi-login access migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260918114500_partner_multi_login_access.sql'
      - '.github/workflows/apply-partner-multi-login-access.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Partner multi-login access migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260918114500_partner_multi_login_access.sql
          test -f supabase/rollbacks/20260918114500_partner_multi_login_access.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure Partner multi-login migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260918114500'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260918114500_partner_multi_login_access.sql
            supabase migration repair --linked --status applied 20260918114500
          fi

      - name: Verify Partner multi-login contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regclass('public.partner_portal_additional_users') is not null as additional_users_ready,
              to_regclass('public.partner_portal_additional_user_audit') is not null as audit_ready,
              to_regprocedure('public.partner_portal_additional_user_identity()') is not null as identity_helper_ready,
              to_regprocedure('public.service_partner_portal_refresh_access_status(uuid)') is not null as refresh_helper_ready,
              has_function_privilege('authenticated', 'public.partner_app_current_identity()', 'EXECUTE') as current_identity_exec,
              has_function_privilege('authenticated', 'public.partner_app_activate_current_account()', 'EXECUTE') as activate_exec,
              position('partner_portal_additional_user_identity' in pg_get_functiondef('public.partner_app_current_identity()'::regprocedure)) > 0 as current_identity_wrapped,
              position('partner_portal_additional_users' in pg_get_functiondef('public.partner_app_activate_current_account()'::regprocedure)) > 0 as activation_wrapped,
              exists (
                select 1 from pg_constraint
                where conrelid='public.intermediary_portal_accounts'::regclass
                  and conname='intermediary_portal_accounts_intermediary_id_key'
              ) as legacy_primary_constraint_preserved;
          ")
          echo "$result"
          for key in additional_users_ready audit_ready identity_helper_ready refresh_helper_ready current_identity_exec activate_exec current_identity_wrapped activation_wrapped legacy_primary_constraint_preserved; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
