name: Apply external renewal reporting migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260907010000_external_renewal_reporting.sql'
      - '.github/workflows/apply-external-renewal-reporting.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply external renewal reporting migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260907010000_external_renewal_reporting.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply external renewal reporting migration
        run: supabase db query --linked --file supabase/migrations/20260907010000_external_renewal_reporting.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260907010000

      - name: Verify reporting contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.partner_app_external_renewal_reporting()') is not null as reporting_rpc_ready,
              has_function_privilege('authenticated','public.partner_app_external_renewal_reporting()','EXECUTE') as authenticated_execute_ready,
              not has_table_privilege('authenticated','public.external_renewal_interactions','SELECT') as interactions_table_still_private,
              not has_table_privilege('authenticated','public.external_renewal_policy_intake_links','SELECT') as links_table_still_private
          ")
          echo "$result"
          for key in reporting_rpc_ready authenticated_execute_ready interactions_table_still_private links_table_still_private; do
            echo "$result" | grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*true"
          done
