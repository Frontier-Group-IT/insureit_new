name: Temporary wire Partner generated banners

on:
  push:
    branches:
      - partner/dashboard-banners-distinct-icons
    paths:
      - '.github/workflows/tmp-wire-partner-generated-banners.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: partner/dashboard-banners-distinct-icons
          fetch-depth: 0

      - name: Wire generated banners and distinct task icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/partner-app/app/(tabs)/index.tsx')
          s = p.read_text()

          replacements = [
            (
              "  renewalDue: require('../../assets/generated-dashboard/renewal-due.png'),\n} as const;",
              "  renewalDue: require('../../assets/generated-dashboard/renewal-due.png'),\n  homeHeader: require('../../assets/generated-dashboard/home-header-insurance.jpg'),\n  pendingTasks: require('../../assets/generated-dashboard/pending-tasks-illustration.jpg'),\n  pendingDocument: require('../../assets/generated-dashboard/pending-document-alert.png'),\n} as const;"
            ),
            (
              "          <Image\n            source={require('../../assets/partner-home-banner.png')}\n            style={styles.heroBackdrop}\n            resizeMode=\"cover\"\n          />",
              "          <Image\n            source={GeneratedDashboardAssets.homeHeader}\n            style={styles.heroBackdrop}\n            resizeMode=\"contain\"\n          />"
            ),
            (
              "                  <View style={styles.pendingCard}>\n                    <View style={styles.sectionHeaderRow}>",
              "                  <View style={styles.pendingCard}>\n                    <Image\n                      source={GeneratedDashboardAssets.pendingTasks}\n                      style={styles.pendingBackdrop}\n                      resizeMode=\"contain\"\n                    />\n                    <View style={styles.sectionHeaderRow}>"
            ),
            (
              "                      <Image\n                        source={GeneratedDashboardAssets.policyVerified}\n                        style={styles.pendingHeroAsset}\n                        resizeMode=\"contain\"\n                      />",
              "                      <Image\n                        source={GeneratedDashboardAssets.pendingDocument}\n                        style={styles.pendingHeroAsset}\n                        resizeMode=\"contain\"\n                      />"
            ),
            (
              "  if (kind === 'intake_attention') return GeneratedDashboardAssets.policyAdd;",
              "  if (kind === 'intake_attention') return GeneratedDashboardAssets.pendingDocument;"
            ),
            (
              "  heroBackdrop: { position: 'absolute', top: 0, right: 0, bottom: 0, left: 0, width: '100%', height: '100%', opacity: 0.28 },",
              "  heroBackdrop: { position: 'absolute', top: -3, right: -18, width: 330, height: 110, opacity: 0.42 },"
            ),
            (
              "  pendingCard: { marginTop: 11, paddingHorizontal: 14, paddingTop: 11, paddingBottom: 8, borderRadius: 18, backgroundColor: '#EAF5FF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#D3E7FA' },",
              "  pendingCard: { marginTop: 11, paddingHorizontal: 14, paddingTop: 11, paddingBottom: 8, borderRadius: 18, overflow: 'hidden', backgroundColor: '#EAF5FF', borderWidth: StyleSheet.hairlineWidth, borderColor: '#D3E7FA' },\n  pendingBackdrop: { position: 'absolute', top: -2, right: -38, width: 235, height: 112, opacity: 0.42 },"
            ),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected source block not found:\n{old}')
            s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Verify intended source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F "home-header-insurance.jpg" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "pending-tasks-illustration.jpg" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "pending-document-alert.png" 'apps/partner-app/app/(tabs)/index.tsx'
          grep -F "return GeneratedDashboardAssets.pendingDocument" 'apps/partner-app/app/(tabs)/index.tsx'

      - name: Commit app source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/partner-app/app/(tabs)/index.tsx'
          git diff --cached --check
          git commit -m 'Wire generated Partner banners and distinct task icon'
          git push origin HEAD:partner/dashboard-banners-distinct-icons
