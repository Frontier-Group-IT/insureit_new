name: Temporary Expo Preview Mobile UI Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-expo-preview-mobile-ui-release.yml'

permissions:
  contents: read

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo credential
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@18 whoami --non-interactive
        working-directory: apps/mobile-app
      - name: Publish functional Add Vehicle and mobile UI refinement to preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@18 update --channel preview --message "Functional Add Vehicle and mobile UI refinement 2026-08-14" --non-interactive
        working-directory: apps/mobile-app
