name: Temporary policy derived layout test

on:
  push:
    paths:
      - scripts/temp_policy_derived_layout_test.py
      - .github/workflows/temp-policy-derived-layout-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply derived layout patch
        run: |
          python scripts/temp_policy_derived_layout_test.py
          sed -i 's/[[:space:]]\+$//' apps/web-portal/components/policy-form-authbridge.tsx
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'PremiumCalculationBand' apps/web-portal/components/policy-form-authbridge.tsx
          grep -q 'SourceDerivedStrip' apps/web-portal/components/policy-form-authbridge.tsx
          grep -q 'PayinCalculationBand' apps/web-portal/components/policy-form-authbridge.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-form-authbridge.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Refine policy derived and calculated field layout"
            git push
          fi
