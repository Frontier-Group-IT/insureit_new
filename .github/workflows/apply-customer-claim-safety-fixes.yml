name: Apply Customer claim safety fixes

on:
  push:
    branches:
      - customer/canonical-0-3-0-production-baseline
    paths:
      - '.github/workflows/apply-customer-claim-safety-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer/canonical-0-3-0-production-baseline
          fetch-depth: 0
      - name: Apply scoped fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1))

          # Draft claims created by immediate document upload resume back into Stage 1.
          p = 'apps/mobile-app/app/customer/start-claim.tsx'
          rep(p,
          """      const existingClaim = await findActiveManagedClaim(selectedPolicy.id);
      if (existingClaim) {
        setExistingActiveClaimId(existingClaim.id);
        return;
      }
""",
          """      const existingClaim = await findActiveManagedClaim(selectedPolicy.id);
      if (existingClaim) {
        if (existingClaim.current_status === 'Draft') {
          router.push({ pathname: '/customer/report-accident', params: { vehicleId: selectedVehicle.id, policyId: selectedPolicy.id, draftClaimId: existingClaim.id } } as any);
          return;
        }
        setExistingActiveClaimId(existingClaim.id);
        return;
      }
""")

          p = 'apps/mobile-app/components/internal-claim-stage-one.tsx'
          rep(p,
          "const { vehicleId, policyId } = useLocalSearchParams<{ vehicleId?: string; policyId?: string }>();",
          "const { vehicleId, policyId, draftClaimId } = useLocalSearchParams<{ vehicleId?: string; policyId?: string; draftClaimId?: string }>();")
          rep(p,
          "  const [draftClaim, setDraftClaim] = useState<DraftClaim | null>(null);\n",
          "  const [draftClaim, setDraftClaim] = useState<DraftClaim | null>(null);\n  const [expiryWarningOpen, setExpiryWarningOpen] = useState(false);\n  const [expiryWarningAcknowledged, setExpiryWarningAcknowledged] = useState(false);\n")
          rep(p,
          """    void (async () => {
      const session = await getCurrentSession();
""",
          """    void (async () => {
      if (!vehicleId && !policyId && !draftClaimId) { router.replace('/customer/start-claim'); return; }
      const session = await getCurrentSession();
""")
          rep(p,
          """      setInsurers(insurerResult.data ?? []);

      const routedPolicy = policyId ? nextPolicies.find((item) => item.id === policyId) : null;
""",
          """      setInsurers(insurerResult.data ?? []);

      if (draftClaimId) {
        const draftResult = await supabase.from('claims').select('id,customer_id,claim_no,vehicle_id,policy_id,current_status').eq('id', draftClaimId).eq('current_status', 'Draft').maybeSingle();
        const row = draftResult.data as any;
        if (row && ids.includes(row.customer_id)) {
          const draftVehicle = nextVehicles.find((item) => item.id === row.vehicle_id) ?? null;
          const draftPolicy = nextPolicies.find((item) => item.id === row.policy_id) ?? null;
          if (draftVehicle && draftPolicy && draftPolicy.vehicle_id === draftVehicle.id) {
            setDraftClaim({ id: row.id, customerId: row.customer_id, controlNo: row.claim_no });
            setSelectedCustomerId(row.customer_id);
            setSelectedVehicleId(row.vehicle_id);
            const docResult = await supabase.from('claim_documents').select('id,document_type,file_name,storage_bucket,storage_path,mime_type,file_size').eq('claim_id', row.id).order('created_at', { ascending: true });
            const restored: Record<DocumentKey, UploadedDocument[]> = { rc: [], insurance: [], licence: [], gr: [], accident_photo: [], accident_video: [], bulk: [] };
            for (const raw of (docResult.data ?? []) as any[]) {
              const key = raw.document_type === BULK_DOCUMENT_TYPE ? 'bulk' : (Object.entries(DOCUMENT_TYPE_BY_KEY).find(([, value]) => value === raw.document_type)?.[0] as DocumentKey | undefined);
              if (!key) continue;
              restored[key].push({ name: raw.file_name ?? 'Document', uri: '', mimeType: raw.mime_type, size: raw.file_size, documentId: raw.id, storageBucket: raw.storage_bucket || 'claim-documents', storagePath: raw.storage_path });
            }
            setDocuments(restored);
            setLoading(false);
            return;
          }
        }
      }

      const routedPolicy = policyId ? nextPolicies.find((item) => item.id === policyId) : null;
""")
          rep(p,
          "  }, [policyId, router, vehicleId]);",
          "  }, [draftClaimId, policyId, router, vehicleId]);")
          rep(p,
          "  const selectedContext = useMemo(() => contexts.find((context) => context.customer_id === selectedCustomerId) ?? null, [contexts, selectedCustomerId]);\n",
          "  const selectedContext = useMemo(() => contexts.find((context) => context.customer_id === selectedCustomerId) ?? null, [contexts, selectedCustomerId]);\n\n  useEffect(() => { setExpiryWarningAcknowledged(false); }, [incidentDate, selectedPolicy?.id]);\n")
          rep(p, "  async function submit() {", "  async function submit(options?: { allowExpiredPolicy?: boolean }) {")
          rep(p,
          """    if (spotIntimationAt.getTime() < incidentAt.getTime()) return setValidationMessage('Spot Intimation Date / Time cannot be earlier than Accident Date / Time.');

    setSaving(true);
""",
          """    if (spotIntimationAt.getTime() < incidentAt.getTime()) return setValidationMessage('Spot Intimation Date / Time cannot be earlier than Accident Date / Time.');
    const policyExpiredBeforeIncident = isIncidentAfterPolicyExpiry(selectedPolicy, incidentAt);
    if (policyExpiredBeforeIncident && !options?.allowExpiredPolicy && !expiryWarningAcknowledged) { setExpiryWarningOpen(true); return; }

    setSaving(true);
""")
          rep(p,
          "        accident_description: [driver.trim() ? `Driver: ${driver.trim()}` : '', phone.trim() ? `Driver phone: ${phone.trim()}` : ''].filter(Boolean).join('\\n') || null,",
          "        accident_description: [driver.trim() ? `Driver: ${driver.trim()}` : '', phone.trim() ? `Driver phone: ${phone.trim()}` : '', policyExpiredBeforeIncident ? `Policy expiry warning: Policy expired on ${formatDate(selectedPolicy.end_date)} before incident date ${formatDate(incidentAt.toISOString())}.` : ''].filter(Boolean).join('\\n') || null,")
          rep(p,
          "      <Modal visible={Boolean(deleteTarget)} transparent animationType=\"fade\" onRequestClose={() => setDeleteTarget(null)}>",
          "      <Modal visible={expiryWarningOpen} transparent animationType=\"fade\" onRequestClose={() => setExpiryWarningOpen(false)}><View style={styles.validationBackdrop}><View accessibilityRole=\"alert\" style={styles.validationCard}><View style={styles.deleteConfirmIcon}><MaterialCommunityIcons name=\"shield-alert-outline\" size={20} color=\"#B42318\" /></View><Text style={styles.validationTitle}>Policy expired before incident date</Text><Text style={styles.validationBody}>The selected policy expired on {formatDate(selectedPolicy?.end_date)}. You can still continue, but this claim may need extra insurer review.</Text><View style={styles.deleteConfirmActions}><Pressable accessibilityRole=\"button\" onPress={() => setExpiryWarningOpen(false)} style={styles.deleteCancelButton}><Text style={styles.deleteCancelText}>Review Date</Text></Pressable><Pressable accessibilityRole=\"button\" onPress={() => { setExpiryWarningOpen(false); setExpiryWarningAcknowledged(true); void submit({ allowExpiredPolicy: true }); }} style={styles.deleteConfirmButton}><Text style={styles.deleteConfirmText}>Continue</Text></Pressable></View></View></View></Modal>\n      <Modal visible={Boolean(deleteTarget)} transparent animationType=\"fade\" onRequestClose={() => setDeleteTarget(null)}>")
          rep(p,
          "function todayIsoDate() { const value = new Date(); return `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, '0')}-${String(value.getDate()).padStart(2, '0')}`; }\nfunction formatTime(value: string)",
          "function todayIsoDate() { const value = new Date(); return `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, '0')}-${String(value.getDate()).padStart(2, '0')}`; }\nfunction isIncidentAfterPolicyExpiry(policy: Policy | null, incidentAt: Date | null) { if (!policy?.end_date || !incidentAt) return false; const expiry = new Date(`${policy.end_date.slice(0, 10)}T23:59:59`); return !Number.isNaN(expiry.getTime()) && incidentAt.getTime() > expiry.getTime(); }\nfunction formatDate(value?: string | null) { if (!value) return '-'; const date = new Date(value); if (Number.isNaN(date.getTime())) return value; return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }\nfunction formatTime(value: string)")

          # Claims Desk verified evidence stays locked.
          p = 'apps/mobile-app/components/internal-claim-stage-one-tracker.tsx'
          rep(p,
          "  const savedTypes = useMemo(() => new Set(documents.filter((item) => item.verification_status !== 'rejected').map((item) => item.document_type)), [documents]);\n",
          "  const savedTypes = useMemo(() => new Set(documents.filter((item) => item.verification_status !== 'rejected').map((item) => item.document_type)), [documents]);\n  const verifiedTypes = useMemo(() => new Set(documents.filter((item) => item.verification_status === 'verified').map((item) => item.document_type)), [documents]);\n")
          rep(p,
          """  async function pickDocument(key: DocumentKey) {
    if (!claim || uploadingKey) return;
""",
          """  async function pickDocument(key: DocumentKey) {
    if (!claim || uploadingKey) return;
    if (verifiedTypes.has(DOCUMENT_TYPE_BY_KEY[key])) { setMessage('This document is verified by Claims Desk and can no longer be replaced.'); return; }
""")
          for key, title in [('rc','RC Copy'),('insurance','Insurance Copy'),('licence','Driver Licence'),('gr','GR / Load Bill'),('accident_photo','Accident Photo')]:
              rep(p, f'<DocumentTile title="{title}" ', f'<DocumentTile title="{title}" locked={{verifiedTypes.has(DOCUMENT_TYPE_BY_KEY.{key})}} ')
          rep(p, '<DocumentTile title="Accident Video" icon="video" ', '<DocumentTile title="Accident Video" icon="video" locked={verifiedTypes.has(DOCUMENT_TYPE_BY_KEY.accident_video)} ')
          rep(p,
          "function DocumentTile({ title, source, icon, saved, busy, status, onPress, onRemove }: { title: string; source?: any; icon?: keyof typeof MaterialCommunityIcons.glyphMap; saved: boolean; busy: boolean; status?: string; onPress: () => void; onRemove: () => void }) {",
          "function DocumentTile({ title, source, icon, saved, locked, busy, status, onPress, onRemove }: { title: string; source?: any; icon?: keyof typeof MaterialCommunityIcons.glyphMap; saved: boolean; locked: boolean; busy: boolean; status?: string; onPress: () => void; onRemove: () => void }) {")
          rep(p,
          "  return <Pressable disabled={busy} onPress={onPress} style={[styles.tile, saved && styles.tileSaved]}>{saved ? <View style={styles.check}><MaterialCommunityIcons name=\"check\" size={15} color=\"#18864B\" /></View> : null}{saved ? <Pressable onPress={(event) => { event.stopPropagation(); onRemove(); }} style={styles.remove}><MaterialCommunityIcons name=\"close\" size={13} color=\"#C43232\" /></Pressable> : null}",
          "  return <Pressable disabled={busy || locked} onPress={onPress} style={[styles.tile, saved && styles.tileSaved]}>{locked ? <View style={styles.check}><MaterialCommunityIcons name=\"lock-check-outline\" size={15} color=\"#18864B\" /></View> : saved ? <View style={styles.check}><MaterialCommunityIcons name=\"check\" size={15} color=\"#18864B\" /></View> : null}{saved && !locked ? <Pressable onPress={(event) => { event.stopPropagation(); onRemove(); }} style={styles.remove}><MaterialCommunityIcons name=\"close\" size={13} color=\"#C43232\" /></Pressable> : null}")
          rep(p,
          "{busy ? (status || 'Uploading…') : saved ? 'Saved' : 'Tap to upload'}",
          "{busy ? (status || 'Uploading…') : locked ? 'Verified · Locked' : saved ? 'Saved' : 'Tap to upload'}")

          # Managed Stage 2 reads Operations-owned stage details and never writes self-managed milestones.
          p = 'apps/mobile-app/app/customer/internal-spot-status.tsx'
          rep(p,
          """      const [claimResult, milestoneResult] = await Promise.all([
        supabase.from('claims').select('id,claim_no,claim_service_mode,vehicle_id,policy_id').eq('id', id).maybeSingle(),
        (supabase as any).from('claim_milestones').select('*').eq('claim_id', id).eq('milestone_key', 'spot_status').maybeSingle(),
      ]);
""",
          """      const [claimResult, stageDetailResult] = await Promise.all([
        supabase.from('claims').select('id,claim_no,claim_service_mode,vehicle_id,policy_id').eq('id', id).maybeSingle(),
        (supabase as any).from('claim_stage_details').select('stage,details,created_at').eq('claim_id', id).order('created_at', { ascending: false }),
      ]);
""")
          rep(p,
          "      const details = (milestoneResult.data as any)?.details;",
          "      const stageRow = ((stageDetailResult.data ?? []) as any[]).find((row) => row?.details?.milestone_key === 'spot_status' || row?.stage === 'Surveyor Appointed');\n      const details = stageRow?.details;")
          start = "    setSubmitting(true);\n    try {\n      const session = await getCurrentSession();\n      if (!session?.user) return router.replace('/login');\n      const { error } = await (supabase as any).from('claim_milestones').upsert({"
          i = Path(p).read_text().find(start)
          if i < 0: raise SystemExit('Stage 2 write block start not found')
          text = Path(p).read_text()
          end_marker = "    } finally {\n      setSubmitting(false);\n    }"
          j = text.find(end_marker, i)
          if j < 0: raise SystemExit('Stage 2 write block end not found')
          j += len(end_marker)
          replacement = """    setSubmitting(true);
    try {
      const session = await getCurrentSession();
      if (!session?.user) return router.replace('/login');
      router.replace({ pathname: '/customer/internal-claim-stage', params: { id, key: 'claim_intimation' } });
    } finally {
      setSubmitting(false);
    }"""
          Path(p).write_text(text[:i] + replacement + text[j:])
          rep(p, '<AppDatePicker label="Spot Survey Done Date *" value={surveyDate} onChange={setSurveyDate} maxDate={todayIsoDate()} formatDisplay={formatDisplayDate} />', '<TextField label="Spot Survey Done Date *" value={surveyDate ? formatDisplayDate(surveyDate) : \'Awaiting Claims Desk\'} editable={false} />')
          rep(p, '<TextField label="Surveyor Name (Optional)" value={surveyorName} onChangeText={setSurveyorName} />', '<TextField label="Surveyor Name (Optional)" value={surveyorName || \'Awaiting Claims Desk\'} editable={false} />')
          rep(p, '<TextField label="Surveyor Email (Optional)" value={surveyorEmail} onChangeText={setSurveyorEmail} keyboardType="email-address" autoCapitalize="none" />', '<TextField label="Surveyor Email (Optional)" value={surveyorEmail || \'Awaiting Claims Desk\'} editable={false} />')
          rep(p, '<TextField label="Surveyor Number (Optional)" value={surveyorPhone} onChangeText={setSurveyorPhone} keyboardType="phone-pad" />', '<TextField label="Surveyor Number (Optional)" value={surveyorPhone || \'Awaiting Claims Desk\'} editable={false} />')
          rep(p, 'disabled={submitting} onPress={() => void submit()} style={[styles.footerPrimary, submitting && styles.footerDisabled]}', 'disabled={submitting || !surveyDate} onPress={() => void submit()} style={[styles.footerPrimary, (submitting || !surveyDate) && styles.footerDisabled]}')
          rep(p, "{submitting ? 'Saving...' : 'Save & Continue'}", "{submitting ? 'Opening...' : surveyDate ? 'Continue' : 'Awaiting Claims Desk'}")
          PY
      - name: Validate patch
        run: |
          git diff --check
          grep -R "claim_milestones.*upsert" apps/mobile-app/app/customer/internal-spot-status.tsx && exit 1 || true
      - name: Commit scoped Customer fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile-app/app/customer/start-claim.tsx apps/mobile-app/components/internal-claim-stage-one.tsx apps/mobile-app/components/internal-claim-stage-one-tracker.tsx apps/mobile-app/app/customer/internal-spot-status.tsx
          git commit -m 'Fix canonical Customer claim regressions'
          git push origin HEAD:customer/canonical-0-3-0-production-baseline
