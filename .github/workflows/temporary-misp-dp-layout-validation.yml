name: Temporary MISP DP layout validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix/misp-dp-field-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_INSUREIT_LAUNCH_SCOPE: intermediary

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused DP layout change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx')
          text = path.read_text()
          old = '''<Field label="DP Email" name="dp_email" required type="email" defaultValue={initialValues.dp_email} {...inputValidationHandlers} /><PanInput label="DP PAN No" name="dp_pan_number" defaultValue={initialValues.dp_pan_number} {...inputValidationHandlers} /><IndianDateField label="DP Date of Birth" name="date_of_birth" required defaultValue={initialValues.date_of_birth} inputClassName={dateInputClass} {...dateValidationHandlers} /><Field label="DP Aadhaar Number" name="aadhaar_number" required inputMode="numeric" pattern="[0-9]{12}" maxLength={12} minLength={12} defaultValue={initialValues.aadhaar_number} {...inputValidationHandlers} />'''
          new = '''<div className="grid min-w-0 gap-4 md:col-span-2 md:grid-cols-2 lg:grid-cols-[minmax(0,1.35fr)_minmax(140px,0.75fr)_minmax(170px,0.9fr)_minmax(0,1.1fr)] xl:col-span-4"><Field label="DP Email" name="dp_email" required type="email" defaultValue={initialValues.dp_email} {...inputValidationHandlers} /><PanInput label="DP PAN No" name="dp_pan_number" compact defaultValue={initialValues.dp_pan_number} {...inputValidationHandlers} /><IndianDateField label="DP Date of Birth" name="date_of_birth" required defaultValue={initialValues.date_of_birth} inputClassName={dateInputClass} {...dateValidationHandlers} /><Field label="DP Aadhaar Number" name="aadhaar_number" required inputMode="numeric" pattern="[0-9]{12}" maxLength={12} minLength={12} defaultValue={initialValues.aadhaar_number} {...inputValidationHandlers} /></div>'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one DP row match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          updated = path.read_text()
          required = [
              'md:col-span-2',
              'lg:grid-cols-[minmax(0,1.35fr)_minmax(140px,0.75fr)_minmax(170px,0.9fr)_minmax(0,1.1fr)]',
              '<PanInput label="DP PAN No" name="dp_pan_number" compact',
          ]
          for marker in required:
              if marker not in updated:
                  raise SystemExit(f'Missing expected layout marker: {marker}')
          print('MISP DP field row updated successfully.')
          PY

      - name: Install dependencies
        run: npm ci || (sleep 10 && npm ci)

      - name: Lint web portal
        run: npm run lint:web

      - name: Typecheck web portal
        run: npm run typecheck:web

      - name: Build web portal
        run: npm run build:web

      - name: Commit validated application change
        run: |
          rm .github/workflows/temporary-misp-dp-layout-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web-portal/app/customers/posp-misp/posp-misp-onboarding-form.tsx \
            .github/workflows/temporary-misp-dp-layout-validation.yml
          git commit -m "Fix MISP designated-person field layout"
          git push origin HEAD:${{ github.head_ref }}
