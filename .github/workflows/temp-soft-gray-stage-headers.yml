name: Temporary soft gray onboarding stage headers

on:
  push:
    paths:
      - scripts/temp_soft_gray_stage_headers.py
      - .github/workflows/temp-soft-gray-stage-headers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused UI patch
        run: python scripts/temp_soft_gray_stage_headers.py
      - name: Validate diff
        run: git diff --check
      - name: Commit app changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/temp_soft_gray_stage_headers.py
          rm .github/workflows/temp-soft-gray-stage-headers.yml
          git add apps/web-portal/app/customers/applications/posp-misp-application-editor.tsx
          git add apps/web-portal/app/intermediaries/applications/training-exam-stage.tsx
          git add apps/web-portal/app/intermediaries/applications/iib-submission-stage.tsx
          git add -u scripts/temp_soft_gray_stage_headers.py .github/workflows/temp-soft-gray-stage-headers.yml
          git commit -m "style: soften onboarding stage headers"
          git push
