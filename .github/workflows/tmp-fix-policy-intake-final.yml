name: Temporary final policy intake fixes

on:
  push:
    branches:
      - feat/policy-intake-sales-operations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/policy-intake-sales-operations
      - name: Apply final patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # V2 SQL parity: policy create/view remain legacy runtime permissions for Operations Head.
          p=Path('apps/web-portal/lib/access-control-role-matrix-v2.ts'); s=p.read_text()
          start=s.index('    code: "sales_operations_head"'); end=s.index('    code: "backoffice_executive"', start)
          chunk=s[start:end]
          chunk=chunk.replace('      grant("policies.view", "view", "organization"),\n      grant("policies.create", "edit", "organization"),\n','')
          s=s[:start]+chunk+s[end:]; p.write_text(s)

          # Keep Fleet & Policies highlighted while working in intake routes.
          p=Path('apps/web-portal/components/claim-manager/app-navigation.tsx'); s=p.read_text()
          old='if(pathname==="/vehicles"||pathname.startsWith("/vehicles/")||pathname==="/policies"||pathname.startsWith("/policies/"))return"fleet";'
          new='if(pathname==="/vehicles"||pathname.startsWith("/vehicles/")||pathname==="/policies"||pathname.startsWith("/policies/")||pathname==="/policy-intakes"||pathname.startsWith("/policy-intakes/"))return"fleet";'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          # Handoff drafts already contain the lead-source code/name; hydrate its assigned RM automatically.
          p=Path('apps/web-portal/components/policy-unified-form.tsx'); s=p.read_text()
          old='  const selectedSourceId=useMemo(()=>availableSources.find(item=>item.code===form.intermediaryCode&&item.label.trim().toLowerCase()===form.leadSource.trim().toLowerCase())?.value??"",[availableSources,form.intermediaryCode,form.leadSource]);\n  function changeIntermediaryType'
          new='  const selectedSourceId=useMemo(()=>availableSources.find(item=>item.code===form.intermediaryCode&&item.label.trim().toLowerCase()===form.leadSource.trim().toLowerCase())?.value??"",[availableSources,form.intermediaryCode,form.leadSource]);\n  useEffect(()=>{if(form.rmName||!selectedSourceId)return;const selected=availableSources.find(item=>item.value===selectedSourceId);if(selected?.rmName)setForm(current=>current.rmName?current:{...current,rmName:selected.rmName});},[availableSources,form.rmName,selectedSourceId]);\n  function changeIntermediaryType'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)

          # Completion must belong to the reviewer who claimed an in-review intake.
          p=Path('apps/web-portal/app/policy-intakes/actions.ts'); s=p.read_text()
          old='  const { error } = await admin.from("policy_intake_requests").update({\n    status:"completed",\n    final_policy_id:policy.id,\n    finalized_by_profile_id:profile.id,\n    finalized_at:new Date().toISOString(),\n    assigned_to_profile_id:profile.id,\n    attention_reason:null,\n  }).eq("id", id).neq("status", "rejected");\n  if (error) return { ok:false as const, error:"Policy was booked but the intake could not be closed automatically." };'
          new='  const { data:completed, error } = await admin.from("policy_intake_requests").update({\n    status:"completed",\n    final_policy_id:policy.id,\n    finalized_by_profile_id:profile.id,\n    finalized_at:new Date().toISOString(),\n    attention_reason:null,\n  }).eq("id", id).eq("status", "in_review").eq("assigned_to_profile_id", profile.id).select("id").maybeSingle<{id:string}>();\n  if (error || !completed) return { ok:false as const, error:"Policy was booked but the intake could not be closed automatically." };'
          if old not in s: raise SystemExit('completion marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web-portal/lib/access-control-role-matrix-v2.ts apps/web-portal/components/claim-manager/app-navigation.tsx apps/web-portal/components/policy-unified-form.tsx apps/web-portal/app/policy-intakes/actions.ts
          git commit -m "Harden policy intake handoff and review flow"
          git push origin HEAD:feat/policy-intake-sales-operations
