name: Apply customer signup direct master KYC submit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260925103000_customer_signup_direct_master_kyc_submit.sql'
      - '.github/workflows/apply-customer-signup-direct-master-kyc-submit.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply customer signup/KYC workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260925103000_customer_signup_direct_master_kyc_submit.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Ensure customer signup/KYC migration is applied
        shell: bash
        run: |
          set -euo pipefail
          applied=$(supabase db query --linked --output-format json "
            select exists(
              select 1 from supabase_migrations.schema_migrations
              where version='20260925103000'
            ) as applied;
          ")
          if echo "$applied" | grep -Eq '"applied"[[:space:]]*:[[:space:]]*true'; then
            echo "Migration already recorded as applied; skipping execution."
          else
            supabase db query --linked --file supabase/migrations/20260925103000_customer_signup_direct_master_kyc_submit.sql
            supabase migration repair --linked --status applied 20260925103000
          fi

      - name: Verify signup master and no-review KYC contract
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              to_regprocedure('public.ensure_customer_signup_profile(text,text,text)') is not null as signup_rpc_ready,
              to_regprocedure('public.finalize_standalone_customer_app_kyc()') is not null as kyc_finalizer_ready,
              exists(
                select 1
                from pg_trigger
                where tgname = 'finalize_standalone_customer_app_kyc'
                  and not tgisinternal
              ) as kyc_trigger_ready,
              not exists(
                select 1
                from public.customer_onboarding_applications coa
                where coa.source='customer_app'
                  and coa.group_customer_id is null
                  and coa.status='submitted'
                  and coa.profile_id is not null
              ) as no_standalone_mobile_review_queue,
              not exists(
                select 1
                from public.profiles p
                where p.role='customer'
                  and p.is_active=true
                  and exists(
                    select 1
                    from public.customer_onboarding_applications coa
                    where coa.profile_id=p.id
                      and coa.source='customer_app'
                      and coa.group_customer_id is null
                      and coa.status not in ('approved','rejected','cancelled')
                  )
                  and not exists(select 1 from public.customers c where c.profile_id=p.id)
                  and not exists(
                    select 1 from public.customer_memberships cm
                    where cm.profile_id=p.id and cm.status='active'
                  )
              ) as no_profile_only_mobile_customers;
          ")
          echo "$result"
          echo "$result" | grep -Eq '"signup_rpc_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"kyc_finalizer_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"kyc_trigger_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"no_standalone_mobile_review_queue"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"no_profile_only_mobile_customers"[[:space:]]*:[[:space:]]*true'
