name: Temporary compact workflow stage stepper

on:
  push:
    branches:
      - feature/compact-workflow-stage-stepper-20260807
    paths:
      - '.github/scripts/apply-compact-workflow-stage-stepper.py'
      - '.github/workflows/temp-compact-workflow-stage-stepper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused UI patch
        run: python .github/scripts/apply-compact-workflow-stage-stepper.py
      - name: Validate diff
        run: |
          git diff --check
          grep -q 'min-w-\[900px\]' 'apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx'
          grep -q 'inline-flex items-center justify-center gap-2' 'apps/web-portal/app/intermediaries/applications/[id]/workflow/page.tsx'
      - name: Remove temporary files
        run: |
          rm .github/scripts/apply-compact-workflow-stage-stepper.py
          rm .github/workflows/temp-compact-workflow-stage-stepper.yml
      - name: Commit focused change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: compact workflow stage stepper'
          git push
