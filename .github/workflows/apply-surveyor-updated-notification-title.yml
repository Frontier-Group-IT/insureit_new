name: Apply surveyor updated notification title

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260907203000_surveyor_updated_notification_title.sql'
      - '.github/workflows/apply-surveyor-updated-notification-title.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Apply surveyor updated notification title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260907203000_surveyor_updated_notification_title.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply notification title migration
        run: supabase db query --linked --file supabase/migrations/20260907203000_surveyor_updated_notification_title.sql

      - name: Record migration as applied
        run: supabase migration repair --linked --status applied 20260907203000

      - name: Verify surveyor update notification title behavior
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              pg_get_functiondef('public.create_claim_status_notifications()'::regprocedure) like '%Surveyor Updated%' as function_ready,
              not exists (
                select 1
                from public.notifications
                where message ~* '^Spot surveyor details updated[[:space:]]*[—-]'
                  and title ~* 'Final Documents Awaited$'
              ) as existing_rows_aligned
          ")
          echo "$result"
          echo "$result" | grep -Eq '"function_ready"[[:space:]]*:[[:space:]]*true'
          echo "$result" | grep -Eq '"existing_rows_aligned"[[:space:]]*:[[:space:]]*true'
