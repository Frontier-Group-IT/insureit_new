name: Temp apply External Claim canonical workflow patch

on:
  push:
    branches:
      - feat/external-claims-canonical-operations-workflow
    paths:
      - '.github/workflows/temp-apply-external-canonical-ops-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/external-claims-canonical-operations-workflow
          fetch-depth: 0
      - name: Apply exact integration patch
        run: node scripts/apply-external-canonical-ops-patch.mjs
      - name: Remove temporary patch machinery
        run: rm scripts/apply-external-canonical-ops-patch.mjs .github/workflows/temp-apply-external-canonical-ops-patch.yml
      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "insureit-automation"
          git config user.email "it@insureit.in"
          git add -A
          git commit -m "Integrate External Claims with canonical Operations workflow"
          git push origin HEAD:feat/external-claims-canonical-operations-workflow
