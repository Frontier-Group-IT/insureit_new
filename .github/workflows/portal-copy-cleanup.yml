name: Portal copy cleanup

on:
  push:
    branches:
      - work/portal-copy-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/portal-copy-cleanup
          fetch-depth: 0

      - name: Remove requested portal copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('apps/web-portal')
          removals = [
              'Business overview',
              'Portfolio health, pending work and recent operational movement.',
              'People operations',
              'Create the authoritative employee record and optionally issue portal access.',
              'Review submitted onboarding applications, document readiness and queue age.',
              'Track every onboarding file from submission through IIB, training, verification and final activation.',
              'Operations workspace',
              'The POSP and MISP sheets are parsed into a review batch before applications are submitted.',
              'POSP / MISP onboarding register',
              'Attach the documents available before the IIB portal process. Education status is calculated from the selected marksheets.',
          ]

          for path in root.rglob('*'):
              if path.suffix not in {'.ts', '.tsx', '.js', '.jsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for value in removals:
                  updated = updated.replace(value, '')
              updated = updated.replace('label="Parse Workbook" pendingLabel="Parsing"', 'label="Review & Submit" pendingLabel="Reviewing workbook"')
              updated = updated.replace('label="Parse Workbook"', 'label="Review & Submit"')
              updated = updated.replace('>Parse Workbook<', '>Review & Submit<')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          reports = Path('apps/web-portal/app/reports/page.tsx')
          reports.write_text('''import { AppShell } from "@/components/shell";\n\nexport default function ReportsPage() {\n  return <AppShell title="Reports"><div aria-label="Reports workspace" /></AppShell>;\n}\n''', encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/portal-copy-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal
          git commit -m "Remove unnecessary portal copy and clear reports page"
          git push origin HEAD:work/portal-copy-cleanup
