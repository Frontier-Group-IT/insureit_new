name: Temporary sync policy clear-form fix

on:
  push:
    branches:
      - fix/policy-clear-form-reset-final

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/policy-clear-form-reset-final
          fetch-depth: 0
      - name: Merge latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/web-portal
        run: npm ci
      - name: Run focused onboarding regression
        working-directory: apps/web-portal
        run: npm run policy-ocr:onboarding-import-regression
      - name: Remove temporary workflow and push
        shell: bash
        run: |
          rm .github/workflows/tmp-sync-policy-clear-form-reset.yml
          git add .github/workflows/tmp-sync-policy-clear-form-reset.yml
          git commit -m "Remove temporary clear-form sync workflow"
          git push origin HEAD:fix/policy-clear-form-reset-final
