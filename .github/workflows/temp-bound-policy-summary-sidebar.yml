name: Temporary bound policy summary sidebar

on:
  push:
    paths:
      - scripts/temp_bound_policy_summary_sidebar.py
      - .github/workflows/temp-bound-policy-summary-sidebar.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply policy sidebar boundary patch
        run: python scripts/temp_bound_policy_summary_sidebar.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web portal
        run: npm run typecheck:web
      - name: Validate patch
        run: |
          git diff --check
          grep -Fq 'const boundaryRef=useRef<HTMLElement>(null)' apps/web-portal/components/policy-unified-form.tsx
          grep -Fq 'boundaryRect.bottom-cardHeight' apps/web-portal/components/policy-unified-form.tsx
          grep -Fq 'id="policy-summary-fixed-card"' apps/web-portal/components/policy-unified-form.tsx
      - name: Commit application change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-portal/components/policy-unified-form.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Bound policy summary sidebar to form"
            git pull --rebase origin main
            git push origin main
          fi
