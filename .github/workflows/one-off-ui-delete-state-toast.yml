name: One-off UI delete state and toast

on:
  push:
    branches:
      - fix/claim-document-delete-confirmation
    paths:
      - '.github/workflows/one-off-ui-delete-state-toast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/claim-document-delete-confirmation
          fetch-depth: 0

      - name: Apply UI-only delete state and toast fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile-app/app/customer/self-managed-claim.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'Expected block not found: {label}')
              text = text.replace(old, new, 1)

          state_anchor = "  const [timeTarget, setTimeTarget] = useState<TimeTarget>(null);\n\n  useEffect(() => {"
          state_replacement = "  const [timeTarget, setTimeTarget] = useState<TimeTarget>(null);\n\n  useEffect(() => {\n    if (!successMessage) return;\n    const timer = setTimeout(() => setSuccessMessage(''), 2800);\n    return () => clearTimeout(timer);\n  }, [successMessage]);\n\n  useEffect(() => {"
          replace_once(state_anchor, state_replacement, 'auto dismiss success toast')

          old_single_state = "    setSavedDocuments((current) => {\n      const next = current.filter((item) => item.id !== savedDocument.id);\n      setSavedDocumentTypes([...new Set(next.map((item) => item.document_type).filter(Boolean))]);\n      return next;\n    });\n    setSuccessMessage(`${savedDocument.file_name || type} deleted successfully.`);"
          new_single_state = "    setSavedDocuments((current) => current.filter((item) => item.document_type !== type));\n    setSavedDocumentTypes((current) => current.filter((item) => item !== type));\n    setDocuments((current) => ({ ...current, [key]: [] }));\n    setSuccessMessage('Document deleted successfully');"
          replace_once(old_single_state, new_single_state, 'immediate single document UI removal')

          old_pending_state = "      setDocuments((current) => ({ ...current, [key]: [] }));\n      setSuccessMessage(`${type} removed successfully.`);\n      return;"
          new_pending_state = "      setDocuments((current) => ({ ...current, [key]: [] }));\n      setSavedDocumentTypes((current) => current.filter((item) => item !== type));\n      setSuccessMessage('Document deleted successfully');\n      return;"
          replace_once(old_pending_state, new_pending_state, 'pending document UI removal')

          old_inline = "      {message ? <Message type=\"error\">{message}</Message> : null}\n      {successMessage ? <Message type=\"success\">{successMessage}</Message> : null}"
          new_inline = "      {message ? <Message type=\"error\">{message}</Message> : null}\n      {successMessage ? <View pointerEvents=\"none\" style={styles.deleteSuccessToast}><View style={styles.deleteSuccessToastIcon}><MaterialCommunityIcons name=\"check\" size={16} color=\"#FFFFFF\" /></View><Text style={styles.deleteSuccessToastText}>{successMessage}</Text></View> : null}"
          replace_once(old_inline, new_inline, 'floating success toast')

          style_anchor = "  deleteConfirmIcon: { width: 38, height: 38, borderRadius: 19, backgroundColor: '#FFF0F0', alignItems: 'center', justifyContent: 'center', marginBottom: 8 },"
          style_replacement = "  deleteSuccessToast: { position: 'absolute', top: 10, left: 14, right: 14, zIndex: 30, elevation: 14, minHeight: 48, borderRadius: 14, backgroundColor: '#FFFFFF', borderWidth: 1, borderColor: '#B7E4CC', paddingHorizontal: 12, paddingVertical: 10, flexDirection: 'row', alignItems: 'center', gap: 9, shadowColor: '#0E5C3D', shadowOpacity: 0.16, shadowRadius: 12, shadowOffset: { width: 0, height: 5 } },\n  deleteSuccessToastIcon: { width: 28, height: 28, borderRadius: 14, backgroundColor: '#168161', alignItems: 'center', justifyContent: 'center' },\n  deleteSuccessToastText: { flex: 1, color: '#145E43', fontSize: 11.5, lineHeight: 16, fontWeight: '900' },\n" + style_anchor
          replace_once(style_anchor, style_replacement, 'toast styles')

          path.write_text(text)
          PY

      - name: Commit UI-only fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-off-ui-delete-state-toast.yml
          git add apps/mobile-app/app/customer/self-managed-claim.tsx
          git commit -m "Fix document delete UI state and success toast"
          git push origin HEAD:fix/claim-document-delete-confirmation
