name: Build Customer release-candidate APK

on:
  push:
    branches:
      - feat/customer-native-release-readiness
    paths:
      - '.github/workflows/build-mobile-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ilzhsfqqjyppzzvfscmh.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_78HNnIK6q-eBQuoRMGJlkA_oJYe9Ynj' }}
      EXPO_PUBLIC_PORTAL_URL: https://portal.insureit.in
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: feat/customer-native-release-readiness
          fetch-depth: 0

      - name: Require exact release branch head and current main baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/customer-native-release-readiness
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/customer-native-release-readiness)" ] || {
            echo "Refusing RC build: checkout is not current release branch head." >&2
            exit 1
          }
          git merge-base --is-ancestor origin/main HEAD || {
            echo "Refusing RC build: release branch is not based on current main." >&2
            exit 1
          }

      - name: Validate customer native release identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./apps/mobile-app/app.json');
          const pkg = require('./apps/mobile-app/package.json');
          const expo = app.expo || {};
          if (expo.version !== '0.3.0' || pkg.version !== '0.3.0') {
            console.error(`Refusing RC build: expected app/package version 0.3.0, found ${expo.version}/${pkg.version}.`);
            process.exit(1);
          }
          if (expo.android?.package !== 'com.insureit.mobile') {
            console.error('Refusing RC build: unexpected Android package identity.');
            process.exit(1);
          }
          if (!expo.android?.permissions?.includes('android.permission.RECORD_AUDIO')) {
            console.error('Refusing RC build: RECORD_AUDIO permission is missing.');
            process.exit(1);
          }
          const plugins = expo.plugins || [];
          const hasAudio = plugins.some((plugin) => plugin === 'expo-audio' || (Array.isArray(plugin) && plugin[0] === 'expo-audio'));
          if (!hasAudio) {
            console.error('Refusing RC build: expo-audio plugin is missing.');
            process.exit(1);
          }
          console.log(`Customer release candidate runtime: ${expo.version}`);
          NODE

      - name: Require Expo token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EXPO_TOKEN:-}" ] || { echo "EXPO_TOKEN is missing." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify customer mobile app
        run: |
          npm run typecheck:mobile
          npm run lint:mobile

      - name: Verify Expo project access
        working-directory: apps/mobile-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli whoami
          npx eas-cli project:info --non-interactive

      - name: Build Android release-candidate APK
        id: eas_build
        working-directory: apps/mobile-app
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli build --platform android --profile preview --non-interactive --wait --json > customer-rc-build.json
          cat customer-rc-build.json

      - name: Upload EAS build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-release-candidate-build-metadata
          path: apps/mobile-app/customer-rc-build.json
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## INSUREIT Customer 0.3.0 release candidate"
            echo
            echo "- Source branch: \`feat/customer-native-release-readiness\`"
            echo "- Android package: \`com.insureit.mobile\`"
            echo "- Runtime/app version: \`0.3.0\`"
            echo "- EAS profile: \`preview\`"
            echo "- Distribution: internal APK"
            echo "- Purpose: physical-device microphone and video-compression QA"
            echo "- Production Play AAB: not built by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
