name: Apply Group Branch Portal Access Hardening

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260915170000_group_branch_portal_access_hardening.sql'
      - 'supabase/verification/20260915170000_group_branch_portal_access_hardening_verify.sql'
      - '.github/workflows/apply-group-branch-portal-access-hardening.yml'

permissions:
  contents: read

concurrency:
  group: apply-group-branch-portal-access-hardening-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Group/Branch portal access hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Checkout is not the exact current main."
            exit 1
          }

      - name: Verify migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          test -f supabase/migrations/20260915170000_group_branch_portal_access_hardening.sql
          test -f supabase/verification/20260915170000_group_branch_portal_access_hardening_verify.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Capture pre-migration invariants
        shell: bash
        run: |
          set -euo pipefail
          result=$(supabase db query --linked --output-format json "
            select
              (select count(*) from public.partners) as partner_count,
              (select count(*) from public.intermediary_groups) as group_count,
              (select count(*) from public.intermediary_group_memberships) as membership_count,
              (select count(*) from public.portal_access_identities) as access_count,
              (select count(*) from public.intermediary_portal_accounts) as partner_portal_account_count;
          ")
          echo "$result"
          echo "PRE_PARTNER_COUNT=$(jq -r '.[0].partner_count' <<<"$result")" >> "$GITHUB_ENV"
          echo "PRE_GROUP_COUNT=$(jq -r '.[0].group_count' <<<"$result")" >> "$GITHUB_ENV"
          echo "PRE_MEMBERSHIP_COUNT=$(jq -r '.[0].membership_count' <<<"$result")" >> "$GITHUB_ENV"
          echo "PRE_ACCESS_COUNT=$(jq -r '.[0].access_count' <<<"$result")" >> "$GITHUB_ENV"
          echo "PRE_PARTNER_PORTAL_COUNT=$(jq -r '.[0].partner_portal_account_count' <<<"$result")" >> "$GITHUB_ENV"

      - name: Apply hardening migration
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/migrations/20260915170000_group_branch_portal_access_hardening.sql
          supabase migration repair --linked --status applied 20260915170000

      - name: Verify hardening and no business backfill
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked --file supabase/verification/20260915170000_group_branch_portal_access_hardening_verify.sql
          result=$(supabase db query --linked --output-format json "
            select
              (select count(*) from public.partners) as partner_count,
              (select count(*) from public.intermediary_groups) as group_count,
              (select count(*) from public.intermediary_group_memberships) as membership_count,
              (select count(*) from public.portal_access_identities) as access_count,
              (select count(*) from public.intermediary_portal_accounts) as partner_portal_account_count;
          ")
          echo "$result"
          test "$(jq -r '.[0].partner_count' <<<"$result")" = "$PRE_PARTNER_COUNT"
          test "$(jq -r '.[0].group_count' <<<"$result")" = "$PRE_GROUP_COUNT"
          test "$(jq -r '.[0].membership_count' <<<"$result")" = "$PRE_MEMBERSHIP_COUNT"
          test "$(jq -r '.[0].access_count' <<<"$result")" = "$PRE_ACCESS_COUNT"
          test "$(jq -r '.[0].partner_portal_account_count' <<<"$result")" = "$PRE_PARTNER_PORTAL_COUNT"

      - name: Verify migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee /tmp/migration-list.txt
          grep -q '20260915170000' /tmp/migration-list.txt || {
            echo "::error::Hardening migration is missing from production history."
            exit 1
          }
